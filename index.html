 offense is strong, they will act as if it were.'","ref":"因为行为由信念驱动：国家若相信攻势占优，就会照攻势占优行事——急于扩张、担心被征服、抢时间窗口、争先动员，那十种效应全部照常启动，哪怕军事现实恰恰相反。Van Evera因此把攻防理论分成'真实'与'感知'两个平行变体，并强调历史证据显示感知变体的影响甚至更大：1890-1918年正是感知攻势崇拜的历史顶点（法国Plan XVII、俄国Plan 20），而真实军事平衡其实有利于防御。感知与现实脱节时，战争风险跟着感知走。","wrong":"学生常答'因为错觉会导致误判'，过于笼统。导师追问：误判的具体内容是什么？攻势信念通过哪几条机制（先发制人、窗口、动员竞赛）一步步把危机推向战争？请把'错觉'还原为具体的因果链。","followup":"既然感知比现实更危险，政策上应该优先纠正什么？Van Evera开出的药方（防御性学说、防御同盟）针对的是哪一端？","src":"Van Evera, 1998.pdf","kw":["真实","战争风险","攻势占优","理论","历史","窗口","感知","十种"]},{"q":"一个正在崛起的国家承诺：'我强大之后绝不利用优势欺负你。'衰落中的对手为什么不敢把这句话当真？这类困境叫什么？它如何解释'预防性战争'——趁自己还强先动手？","level":3,"hint":"设想协议签了之后：对方变强了，谁来保证他履约？他届时有什么动机重新要价？精读卡里那句'衰落国家攻击不是因为害怕将来挨打，而是害怕将来不得不接受的和平'是理解的钥匙。","ref":"这叫承诺问题：无政府状态下没有权威强制履约，崛起国一旦更强，就有动机利用新增筹码重新要价——它今天做出的任何克制承诺都不可信。Fearon的动态模型表明：若衰落国的预期实力降幅相对其战争成本过大，预防性攻击就是理性的。注意两点修正：①预防性战争的根源不是权力转移本身，而是无法承诺；②衰落国怕的不是未来'被攻击'，而是未来'被迫接受的苛刻和平'——如海湾战争意在阻止伊拉克成为能要挟油价的石油霸权。1914年德国担忧俄国军力增长后在巴尔干更强硬，正是这种逻辑。","wrong":"学生常答'因为崛起国将来一定会翻脸打人'。导师追问：原文讲得很细——衰落国怕的是对方将来'以更强势地位谈判'，而非必然入侵；如果崛起国能可信地自缚手脚（如古典均势政治中的'补偿'安排），战争还必要吗？这反过来证明根源在承诺而非意图。","followup":"原文提到'补偿'惯例可以瓦解这一承诺问题——它是怎么起作用的？","src":"Fearon, 1995.pdf","kw":["无政府状态","预防性战争","承诺问题","权力","理性","任何","动机","俄国"]},{"q":"Skocpol说，研究革命只看国内阶级矛盾注定不够，必须引入'国际与世界历史背景'。结合精读卡：旧政权的崩溃往往发生在什么样的国际处境下？她批评的'现代化'范式错在哪里？","level":3,"hint":"回想法、俄、中革命前的国际处境：法国君主制的财政危机与争霸战争、俄国在一战中的崩溃、中国面对西方入侵。再读精读卡framework里'国际国家体系作为军事竞争的跨国结构'这一提法。","ref":"Skocpol指出，所有现代社会革命都发生在国际竞技场中处于不利地位的国家：军事落后或政治依附是关键背景，战争失败与入侵威胁直接促成了几乎所有革命危机的爆发——它们瓦解旧政权的权威与控制，为结构变迁开路；列强间的相互牵制又为革命巩固提供'空间'。她批评的现代化范式把发展设想成每个国家内部自主重演英国经验的过程（马克思：'工业较发达的国家向较不发达的国家所显示的，只是后者未来的景象'），忽视了跨国经济流动与国际军事竞争对各国国家与阶级结构的塑造；而且跨国影响首先传导给'必须在国际竞技场中行动的国家统治者'，而非直接作用于'人民'。","wrong":"学生常答'因为革命会输出到国外'（示范效应）。导师追问：那是革命'之后'的国际影响；Skocpol强调的是革命'之前'国际结构对危机成因的塑造——两者方向相反，她的论证重心在哪一边？","followup":"她把国家形容为'双面神'（Janus-faced）——一面朝国内阶级结构、一面朝国际体系。这个比喻如何整合她的三大原则？","src":"Skocpol, 1979.pdf","kw":["社会革命","内部","国际","战争","结构","行动","必须","危机"]},{"q":"Van Evera列出攻势占优引发战争的十种效应（A-J）。请任选其中四种，用'因为……所以更可能打仗'的句式讲清各自的机制逻辑，并说明为什么防御占优时这些危险会消退。","level":3,"hint":"按三组来记：动机端——征服容易诱惑扩张（A）、自卫困难逼迫扩张（B）、也让人更拼命抵抗别人扩张（C）；时间端——先发优势放大（D）、窗口放大（E）；过程端——既成事实外交（F）、谈判减少（G）、保密（H）、军备竞赛（I）、攻势自我强化（J）。","ref":"示例：A机会主义扩张——征服容易时侵略成本低、成功率高，连温和国家也受诱惑；D先发优势——攻势占优时先动手回报更大，国家变得'手痒'，危机中更易先发制人；E窗口——力量对比的短暂变化被放大，'再不打以后打不赢'驱动预防性战争；I军备竞赛——攻势占优时军力更值钱、军控协议更难签，竞赛更快更失控。防御占优时全部逆转：征服难使侵略无利可图，国家安全感上升，窗口与先发优势缩小，竞赛放缓。要点：十种效应共享同一根源——攻势占优时资源更可累积（小胜能滚成大胜），故攻防平衡一变，战争风险整体变动。","wrong":"学生常把十条背成清单却讲不出机制。导师追问其中一条的因果链：'先发优势为什么让危机谈判更脆弱？国家怕什么、因此提前做什么？'让学生把标签还原为行为逻辑。","followup":"这十种效应若放进Fearon的框架，分别更接近'信息问题'还是'承诺问题'？","src":"Van Evera, 1998.pdf","kw":["预防性战争","攻防平衡","先发制人","战争风险","攻势占优","先发优势","军备竞赛","主义"]},{"q":"Fearon（1995）明确说：攻势优势、先发制人压力本身不构成战争的理论上自洽的解释；Van Evera（1998）却主张攻势优势（尤其被感知的）通过十种机制大幅提高战争风险。两人真的矛盾吗？如何把两篇文献'对接'起来？","level":4,"hint":"注意Fearon原文的精细处：他把先发制人解释为'枪手困境'式承诺问题，并论证1914年先发优势更多是'加剧'而非根本导致战争——它缩小议价区间，使信息与承诺问题更难解。再想想Van Evera的十种效应各落在哪类机制上。","ref":"不矛盾，二者是抽象机制与经验载体的关系。Fearon的论点是逻辑性的：'攻势占优'本身回答不了'是什么阻止了战前协议'——它必须落实为承诺问题（先发优势使互不攻击的协议无法自我执行，如枪手困境）或信息问题（保密、误报）；他还指出1914年先发优势出现得晚、且与先动手的政治代价并存，其作用主要是缩小议价区间、加剧其他机制。Van Evera恰好提供了经验填充：先发优势（D）、窗口（E）落实承诺/预防逻辑，保密（H）、虚假乐观落实信息逻辑，军备竞赛（I）横跨两者。换言之，攻防平衡是调节Fearon两大机制作用强度的结构性变量。","wrong":"学生常简单站队（'一个对一个错'）。导师追问：两者各自把什么当作待解释项、把什么当作假设？Fearon要求'机制上自洽'，Van Evera提供'机制的经验条件'——这是竞争关系还是分工关系？","followup":"用同样的思路，Skocpol笔下的'国际军事竞争'在Fearon框架里会落在哪个环节？","src":"Fearon, 1995.pdf","kw":["攻防平衡","议价区间","承诺问题","强度","攻势占优","先发优势","军备竞赛","机制"]},{"q":"综合全章：'非暴力抗争为什么在有的国家升级为内战、在有的国家没有？'如果让你设计一项研究来回答它，本章四种研究风格（博弈论形式化、比较历史分析、机制-过程分析、中层理论案例检验）各自会怎么做？盲区各是什么？","level":4,"hint":"回想四篇的方法论标签：Fearon先建模再评估；Skocpol求同求异；Tarrow & Tilly拆机制、追过程；Van Evera提出中层变量做案例检验。每种风格的盲区，正是其假设的代价。","ref":"Fearon式：把升级写成抗争者与政府在私人信息与承诺问题下的动态博弈，推导可检验含义；盲区是国内多元行为体与情绪因素被假设排除。Skocpol式：选升级与未升级的最相似案例做求同求异，锁定结构条件（国家镇压能力、国际处境）；盲区是案例少、机制黑箱。Tarrow & Tilly式：直接拆解镇压、抬价、联盟、极化等机制在事件序列中的组合；盲区是机制的因果识别常依赖叙事。Van Evera式：构造中层变量（类似攻防平衡之于战争）做跨案例检验；盲区是变量操作化与感知测量困难。理想设计应以机制为共同语言：结构条件（Skocpol）→博弈逻辑（Fearon）→过程追踪（Tarrow & Tilly），中层变量（Van Evera）负责联通。","wrong":"学生常罗列方法名称而不谈研究设计。导师追问其中一种：'如果用比较历史法研究升级，你会选哪几个案例？求异法要求的最相似对照怎么找？'让学生暴露对方法操作层面的理解缺口。","followup":"用你选择的组合解释一个当代案例：为什么有的起义升级为内战、有的和平收场？","src":"Tarrow and Tilly, 2009.pdf","kw":["攻防平衡","承诺问题","政府","抬价","私人信息","国际","战争","机制"]}],"quiz":[{"type":"mc","q":"按照Tarrow与Tilly的定义，下列哪一项不属于'抗争政治'？","options":["A. 要求总统下台的街头示威","B. 席卷多个行业的罢工潮","C. 按日程定期举行的议会选举投票","D. 争夺主权的内战"],"answer":2,"explain":"定义强调'间歇的'（episodic）集体互动：投票、议会选举、协会例会这类按日程例行的事件被明确排除——尽管它们可能成为抗争政治的'跳板'。示威、罢工、内战都符合'间歇、公开、涉及政府'的定义。","src":"Tarrow and Tilly, 2009.pdf"},{"type":"mc","q":"Tarrow与Tilly所说的WUNC展示中，'N'代表什么？其典型表现形式是？","options":["A. Nationalism，挥舞国旗","B. Networks，展示组织网络","C. Numbers，清点人头、征集签名、挤满街道","D. Nonviolence，坚持非暴力抗议"],"answer":2,"explain":"WUNC=worthiness（价值）、unity（团结）、numbers（数量）、commitment（决心）。数量通过人头统计、请愿签名、选民来信、挤满街道等方式公开展示，用来证明'我们人多'。","src":"Tarrow and Tilly, 2009.pdf"},{"type":"mc","q":"Skocpol定义的'社会革命'区别于叛乱（rebellion）的关键在于：","options":["A. 暴力规模更大","B. 有外国军队介入","C. 伴随国家结构与阶级结构的根本变迁","D. 由职业革命家领导"],"answer":2,"explain":"Skocpol明确指出：叛乱即使成功也不导致结构变迁，而社会革命是社会结构变迁与政治结构变迁相互强化地同时发生。领导意图恰恰不是她的判准——她持非意志论立场。","src":"Skocpol, 1979.pdf"},{"type":"tf","q":"Skocpol认为，历史上成功的社会革命都是由自觉的、动员了大众的革命运动'制造'出来的。","answer":false,"explain":"恰恰相反。她引用Wendell Phillips：'Revolutions are not made; they come.'革命先锋利用了由国家与阶级统治危机造成的革命局势，但从未制造这些危机——革命组织的作用是凝聚先锋、巩固新政权。","src":"Skocpol, 1979.pdf"},{"type":"tf","q":"Fearon证明：只要战争有成本与风险，且国家风险中性或风险厌恶、议题可分，就总存在一组双方都优于开战的谈判解。","answer":true,"explain":"这就是议价区间（p−cA, p+cB）。分100美元的例子：开战成本20、胜率各半，期望收益仅30，故31:69至69:31的任何和平分法都优于开战。战争的成本与风险撬开了谈判解的'楔子'。","src":"Fearon, 1995.pdf"},{"type":"tf","q":"Fearon证明，在议价博弈中加入'廉价磋商'（cheap talk）沟通阶段后，国家间的战争风险可以显著降低。","answer":false,"explain":"错误。其形式化命题表明：加入廉价磋商后，均衡要价与事前战争风险与无磋商博弈完全相同——因为有动机误报的一方说什么都不可信，沟通不传递任何新信息。","src":"Fearon, 1995.pdf"},{"type":"mc","q":"Van Evera所说的'攻防平衡'（offense-defense balance）是指：","options":["A. 核武器与常规武器的数量对比","B. 征服他国与抵御侵略的相对难易程度","C. 进攻方与防守方的军费开支之比","D. 同盟体系之间的力量分布"],"answer":1,"explain":"攻防平衡指侵略与防御侵略的相对难易，由军事技术与学说、地理、社会结构、外交安排共同决定；且有'真实'与'感知'两个平行变体。","src":"Van Evera, 1998.pdf"},{"type":"tf","q":"Van Evera认为，即使真实的军事平衡偏向防御，只要决策者'感知'到攻势优势，战争风险同样会上升。","answer":true,"explain":"正确。攻防理论有真实与感知两个平行变体：'If states think the offense is strong, they will act as if it were.'1914年前的攻势崇拜就是感知脱离现实却引发灾难的例证。","src":"Van Evera, 1998.pdf"},{"type":"sa","q":"用自己的话解释Tarrow与Tilly所说的'机制'（mechanism）与'过程'（process）有什么区别，并各举一个例子（可以是生活例子）。","ref":"机制是在多种情境中以相似方式改变要素间关系的限定事件，分环境、性情（认知）、关系三类——例如'居间联络'：中间人把原本互不往来的两个群体联结起来。过程是机制按常规序列串成的链条，如动员、政治身份形成、联盟形成、极化。生活例子：两个互不相识的社团经学生会牵线组成联盟（居间联络机制）；随后联合招新、统一口号、与校方谈判的连续展开就是一次小型'动员'过程。","explain":"评分要点：机制须点出'以相似方式反复出现'并可归类（环境/性情/关系）；过程须体现'机制的序列组合'；例子合理即可，不苛求政治性。原文例：美国内战起源=人口西移（环境）+零和认知（性情）+共和党居间（关系）三者组合。","src":"Tarrow and Tilly, 2009.pdf"},{"type":"sa","q":"用自己的话解释Fearon所说的'承诺问题'，并举一个例子（历史的或日常生活的）说明它如何让本可避免的冲突爆发。","ref":"没有权威保证履约时，一方预期对方将来（尤其变强后）会违约或利用更大筹码重新要价，互利的协议于是签不成——宁可现在开战。Fearon证明预防性战争的根源正在于此：衰落国怕的不是将来'挨打'，而是将来'被迫接受的苛刻和平'。历史例：1914年德国担心俄国军力增长后在巴尔干更强硬；芬兰1939年不敢割让芬兰湾小岛，因为不信斯大林会信守承诺。生活例（类比）：不敢把全款预付给可能跑路的商家——不是没有双赢价格，而是没人保证对方履约。","explain":"评分要点：点出'无法可信履约'与'权力/地位变化'两要素；说清'怕的是未来的和平条件而非未来的攻击'更佳；例子可用原文（1914、苏芬冬季战争、海湾战争）或合理日常类比。","src":"Fearon, 1995.pdf"}],"flashcards":[{"front":"抗争政治（contentious politics）","back":"诉求者与对象之间间歇、公开、涉及政府的集体互动；示威、罢工、革命、内战都算，定期投票、协会例会不算。","src":"Tarrow and Tilly, 2009.pdf"},{"front":"社会运动（Tarrow & Tilly定义）","back":"以某人群名义，靠公开展示价值、团结、数量、决心（WUNC），对掌权者发起的持续性挑战；18-19世纪西欧北美首创。","src":"Tarrow and Tilly, 2009.pdf"},{"front":"WUNC","back":"运动公开自我展示的四件事：价值（衣着体面、名流到场）、团结（统一标识口号）、数量（清点人头、征集签名）、决心（冒雨坚持、抗住镇压）。","src":"Tarrow and Tilly, 2009.pdf"},{"front":"抗争剧目（repertoire）","back":"特定时代里'大家都会'的抗议套路合集，像爵士乐手的保留曲目：过去是羞辱仪式、抢粮，今天是示威、罢工、联署。","src":"Tarrow and Tilly, 2009.pdf"},{"front":"政治机会结构","back":"政体中利于或抑制集体行动的六特征：权力中心多寡、开放度、联盟稳定性、盟友可得性、镇压强度，及其决定性变化。","src":"Tarrow and Tilly, 2009.pdf"},{"front":"机制与过程（mechanism vs. process）","back":"机制=反复出现的小因果齿轮，分环境、性情、关系三类（如居间联络）；过程=齿轮串成的链条（如动员、极化）。","src":"Tarrow and Tilly, 2009.pdf"},{"front":"居间联络（brokerage）","back":"关系机制：中间人把原本互不往来的群体牵线联成联盟。例：共和党把西部自由土农民与北方废奴派联结起来。","src":"Tarrow and Tilly, 2009.pdf"},{"front":"抬价（outbidding）","back":"运动内部比谁更激进的竞争：你静坐我堵路、你堵路我扔瓶；与国家镇压、群众支持衰落一起，曾把意大利运动推向红色旅式武装斗争。","src":"Tarrow and Tilly, 2009.pdf"},{"front":"社会革命（Skocpol定义）","back":"国家结构与阶级结构的快速根本变迁+自下而上的阶级反叛；只换统治者的政变、无结构变迁的叛乱都不算。","src":"Skocpol, 1979.pdf"},{"front":"结构视角","back":"不问革命者'想干什么'，而看群体间、国家间的关系格局如何使危机到来——'革命不是被制造的，是到来的'。","src":"Skocpol, 1979.pdf"},{"front":"国家自主性","back":"国家不是支配阶级的简单工具：作为行政-强制组织，它有自身利益（收税、秩序、应对国际竞争），处在国内外结构的交汇处。","src":"Skocpol, 1979.pdf"},{"front":"比较历史分析","back":"'变量太多、案例太少'时的多变量分析：用密尔求同法+求异法比较少数历史案例，建立并检验因果假设。","src":"Skocpol, 1979.pdf"},{"front":"议价区间（bargaining range）","back":"战争有成本风险，故总有一段'怎么分都比打强'的谈判空间（p−cA到p+cB）；战争之谜是：双方为何落不进去？","src":"Fearon, 1995.pdf"},{"front":"私人信息与误报动机","back":"我知你不知+我有动机吹牛：谈判中实力弱也喊硬话，故'把话说开'不可信，光靠沟通消除不了战争风险。","src":"Fearon, 1995.pdf"},{"front":"承诺问题","back":"没人保证履约：你变强后必会重新要价，我宁可现在开战——衰落国怕的不是将来挨打，而是将来被迫接受的和平。","src":"Fearon, 1995.pdf"},{"front":"议题不可分割性","back":"有些议题看似没法分（如谁当国王），可能让议价区间消失；但'不能分'多因国内政治，而非议题本性。","src":"Fearon, 1995.pdf"},{"front":"攻防平衡","back":"征服与抵御侵略哪个更容易？由军事技术学说、地理、社会结构、同盟外交共同决定；分'真实'与'感知'两变体。","src":"Van Evera, 1998.pdf"},{"front":"先发制人战争 vs 预防性战争","back":"先发制人=信先动手占优、抢在对方攻击前开枪；预防性=趁己方衰落前动手'关窗'，本质属承诺问题。","src":"Van Evera, 1998.pdf"},{"front":"机会/脆弱性窗口","back":"力量对比短暂有利或不利的时段；'再不打以后更打不赢'的念头在攻势占优时被放大，诱发预防性战争。","src":"Van Evera, 1998.pdf"},{"front":"攻势崇拜（cult of the offensive）","back":"1914年前欧洲军界普遍高估攻势（'先动员者胜'）；感知脱离现实仍照真行事，催生七月危机的动员竞赛与灾难。","src":"Van Evera, 1998.pdf"}]},{"id":"ch07","folder":"9. Ethnic Politics","title":"族群政治","subtitle":"Ethnic Politics","overview":{"theme":"为什么素不相识的人会为同一面国旗流泪、为同一场球赛呐喊？为什么一场全球疫情的防线最终落在一条一条国界上？本章围绕民族（nation）与民族主义（nationalism）的概念基础、理论论争与经验研究展开，追问民族这一现代政治共同体的性质、起源及其持久的政治力量。民族并非自然给定的实体，而是被想象、被建构、被再生产的文化—政治人工物，但它却能激发最真实的牺牲与忠诚。","coreQuestions":["什么是民族？它与国家（state）、族群共同体（ethnie）有何概念区别？","民族是现代的建构物还是古老族群的延续？现代主义与永存主义之争如何解决？","为什么被\"想象\"出来的共同体能让数百万人甘愿为之赴死？","民族主义对民主、战争与公共物品的供给究竟是有利还是有害？","全球化时代民族国家与民族主义会消亡吗？"],"thread":"本章三篇文献构成\"概念奠基—经典理论—学科前沿\"的递进结构。先读史密斯（Smith）第一章，掌握民族主义研究的整套概念工具：民族主义的五种用法、民族与族群共同体（ethnie）的理想类型区分、民族国家与\"national state\"的辨析；再读安德森（Anderson）的经典导言，理解\"想象的共同体\"这一影响深远的定义及其对马克思主义与自由主义理论失语的诊断；最后读米洛纳斯与都铎（Mylonas & Tudor）的学科综述，看这些经典论争如何沉淀为\"民族是历史偶然的、社会建构的\"共识，并分化为宏观历史、行为实验与日常民族志三大研究前沿。史密斯第六章则把讨论推向规范层面：在全球化时代评估\"民族主义终结论\"。","path":["第一步：读 Smith 第一章，画出 nationalism / nation / ethnie / national state / national identity 的概念地图（可从\"联合国其实是国家的联合\"这一日常误用切入）。","第二步：读 Anderson 导言，对照史密斯的定义，理解\"想象的共同体\"四要素（想象、有限、主权、共同体）及其三个悖论。","第三步：比较安德森与史密斯在\"民族是否有族群根源\"上的分歧，即现代主义与族群象征主义之争。","第四步：读 Mylonas & Tudor 综述，把经典论争放回当代政治科学，关注建构故事、国族建设政策与排斥性民族主义的经验研究。","第五步：回到 Smith 第六章，用\"神圣属性\"框架评估全球化时代民族主义的前景，并尝试分析一个当代案例。"],"dialogue":"三篇文献处于同一场大辩论的不同位置。安德森以人类学姿态定义民族为\"想象的政治共同体\"，强调其现代性与可移植的\"模块性\"，并批评盖尔纳把\"发明\"等同于\"虚假\"；史密斯承认民族的现代转型，却坚持民族必须建立在先存族群（ethnie）的神话、记忆与象征之上，这正是综述中所说的盖尔纳—史密斯\"华威辩论\"的两极。米洛纳斯与都铎站在四十年后的学科高点裁决：经验积累总体支持现代主义的建构论共识，但史密斯的\"建构故事\"（constitutive story）概念被吸收为因果研究的核心变量；同时他们把安德森式的宏观命题推进到行为与日常实践层面，追问民族主义何时是解放性的、何时是排斥性的。三者合起来展示了政治学概念如何被定义、论争、检验并转化为研究纲领。"},"readings":[{"file":"Smith, 2010 (Chapter 1 & 6).pdf","title":"Nationalism: Theory, Ideology, History（Chapter 1 \"Concepts\" & Chapter 6 \"Prospects\"）《民族主义：理论、意识形态与历史》","authors":"Anthony D. Smith（安东尼·D·史密斯）","year":"2010","venue":"Polity Press（教材第二版，课程选章）","thesis":"第一章为民族主义研究建立概念秩序：民族主义应被界定为\"为一个被其部分成员视为现实或潜在'民族'的人口争取并维持自主、统一与认同的意识形态运动\"，自主、统一、认同三大总目标缺一不可；民族既非国家也非族群共同体，而是\"居住在被认知的家乡、拥有共同神话与共享历史、独特公共文化和共同法律习俗的具名人类共同体\"。第六章反驳霍布斯鲍姆等人的\"民族主义终结论\"：民族国家并未衰亡、民族认同并未碎片化、民族主义意识形态并未消解，反而借全球化而\"国际化\"并得以再生产。","framework":"①\"nationalism\"的五种用法：a.民族的形成过程；b.对民族的归属感或意识（史密斯将其单独处理）；c.民族的语言与象征；d.代表民族的社会政治运动；e.民族的学说/意识形态——本书取后三种为民族主义。②ethnie与nation的理想类型：两者共享具名、共同神话与记忆，民族另有共享历史、独特公共文化、实际居住家乡、共同法律习俗。③\"超越论\"的三个主张：民族国家衰亡、民族认同混杂化、民族主义消解。④民族的四项神圣属性：族群选民信念、神圣领土依恋、黄金时代记忆、英烈崇拜。","method":"概念分析与理想类型建构（韦伯式），辅以广泛的历史例证比较（欧洲、中东、非洲、亚洲），属理论—历史阐释性研究。","evidence":"西方\"族群复兴\"见于魁北克、佛兰德、苏格兰、加泰罗尼亚、布列塔尼、巴斯克、科西嘉、威尔士；苏联沿族群界线解体为约15个新国家，南斯拉夫分裂为斯洛文尼亚、克罗地亚、波黑、塞尔维亚、马其顿等；竞争性起源神话有希腊\"希腊化\"对\"拜占庭\"、埃及法老主义对阿拉伯—伊斯兰主义、法国罗马高卢对法兰克传统之争；\"黄金时代\"再发现有芬兰《卡勒瓦拉》、斯洛伐克大摩拉维亚王国、乌克兰哥萨克与基辅罗斯、津巴布韦大津巴布韦遗址；英烈崇拜见澳大利亚ANZAC仪式与英美阵亡将士纪念日。","limits":"理想类型高度抽象，史密斯自承从理想类型到经验个案存在大量近似与例外（如\"离散民族\"）；其对民族主义近乎功能主义式的持久性论证被现代主义者批评为低估了偶然性与精英建构；与布鲁贝克\"不以实体化方式思考民族\"的立场存在张力。","quotes":[{"en":"An ideological movement for attaining and maintaining autonomy, unity and identity for a population which some of its members deem to constitute an actual or potential \"nation\".","zh":"民族主义是这样一种意识形态运动：为一个被其部分成员视为构成现实或潜在\"民族\"的人口，争取并维持自主、统一与认同。"},{"en":"Most students of the subject have, nevertheless, agreed on two points: a nation is not a state and it is not an ethnic community.","zh":"尽管如此，多数研究者同意两点：民族不是国家，也不是族群共同体。"},{"en":"A global culture of the kind envisaged, at once scientific, affectively neutral and technical, would have to be placeless, timeless and memoryless.","zh":"人们所设想的那种全球文化——既是科学的、情感中立的，又是技术性的——必然是无地点、无时间、无记忆的。"}]},{"file":"Anderson, 1983, Chapter 1.pdf","title":"Imagined Communities: Reflections on the Origin and Spread of Nationalism（Introduction） 《想象的共同体：民族主义的起源与散布》导言","authors":"Benedict Anderson（本尼迪克特·安德森）","year":"1983","venue":"Verso（专著导言，课程选章）","thesis":"民族是\"想象的政治共同体——并且被想象为本质上有限且享有主权的共同体\"。民族性、民族主义是十八世纪末多种离散历史力量交汇\"自发蒸馏\"出的特殊文化人工物；一旦被创造出来，它们就成为\"模块化的\"，可被移植到形形色色的社会地形。马克思主义与自由主义理论在民族主义面前都已\"托勒密式\"地枯竭，需要哥白尼式的视角转换。","framework":"①民族定义四要素：a.想象的——最小民族的成员也不认识大多数同胞，但人人心中存有联结意象；b.有限的——最大的民族也有弹性但确定的边界，边界之外是其他民族，无人梦想与全人类重合；c.主权的——概念诞生于启蒙与革命摧毁神授王朝正当性的时代，自由的标志是主权国家；d.共同体——无论内部实际不平等与剥削如何，总被设想为深层水平友爱。②民族主义的三个悖论：a.历史学家眼中的客观现代性vs民族主义者眼中的主观古老性；b.国籍的形式普遍性vs具体表现的不可化约特殊性；c.政治力量巨大vs哲学思想贫乏。③文化人工物一经创造即具\"模块性\"，可移植到各种社会地形与意识形态星座。","method":"理论阐释与概念分析，辅以历史社会学式的比较视野（东南亚、拉丁美洲与欧洲经验），属思想史—政治理论写作。","evidence":"以越柬中战争开篇：这是革命资历无可争议的马克思主义政权之间首次大规模常规战争，且各方几乎未以可辨识的马克思主义语汇辩护（对照1969年中苏冲突的\"社会帝国主义\"修辞）；二战后每次成功革命都以民族命名（中华人民共和国、越南社会主义共和国），仅苏联与英国拒绝以民族命名。理论诊断引塞顿-沃森\"无法设计民族的科学定义\"、奈恩\"民族主义理论是马克思主义的重大历史性失败\"、盖尔纳\"民族主义在不存在民族处发明民族\"（安德森批评其把\"发明\"同化为\"捏造\"与\"虚假\"）、勒南\"民族的本质在于共同拥有也共同遗忘许多事物\"；并以爪哇村民的亲属庇护网、法国旧制度贵族的个人身份说明共同体只有\"想象的风格\"之别。","limits":"导言仅提出纲领而未展开印刷资本主义等机制论证（在后续章节）；\"想象\"一词常被误读为\"虚构\"，作者不得不反复澄清；对非欧洲个案的处理被后世批评仍带欧洲中心色彩，且较少解释民族认同在个体层面的微观机制。","quotes":[{"en":"It is imagined because the members of even the smallest nation will never know most of their fellow-members, meet them, or even hear of them, yet in the minds of each lives the image of their communion.","zh":"民族是想象的，因为即使最小民族的成员也永远不会认识、遇见甚至听说他们的大多数同胞，然而在每个人心中都活着他们彼此联结的意象。"},{"en":"In fact, all communities larger than primordial villages of face-to-face contact (and perhaps even these) are imagined. Communities are to be distinguished, not by their falsity/genuineness, but by the style in which they are imagined.","zh":"事实上，一切大于面对面接触的原始村落的共同体（也许连原始村落也不例外）都是想象的。共同体的区分标准不在于其真伪，而在于它们被想象的风格。"},{"en":"Ultimately it is this fraternity that makes it possible, over the past two centuries, for so many millions of people, not so much to kill, as willingly to die for such limited imaginings.","zh":"归根结底，正是这种友爱之情，使得过去两个世纪中数以百万计的人与其说愿意去杀戮，不如说甘愿为如此有限的想象赴死。"}]},{"file":"Mylonas and Tudor, 2021.pdf","title":"Nationalism: What We Know and What We Still Need to Know《民族主义：我们已知的与仍需探知的》","authors":"Harris Mylonas（哈里斯·米洛纳斯）& Maya Tudor（玛雅·都铎）","year":"2021","venue":"Annual Review of Political Science, 24: 109–132","thesis":"在全球民族主义政府复兴的背景下盘点政治学的民族主义研究：经典论争已沉淀为\"民族是历史偶然的、社会建构的\"之共识；当代研究呈三大趋势——把民族主义作为宏观政治力量的比较历史研究（聚焦国家、建构故事与政治冲突）、用调查与实验测量民族依恋的行为研究、揭示日常再生产机制的民族志研究。作者呼吁更多跨区域、跨学科的比较研究，尤其关注排斥性民族主义对民主与暴力等结果的影响。","framework":"①现代主义奠基：1983年同年出版盖尔纳《民族与民族主义》、安德森《想象的共同体》、霍布斯鲍姆与兰格《传统的发明》，三者都把民族视为工业化、城市化、印刷资本主义与反殖民的现代产物。②华威辩论：史密斯代表永存主义——\"历史不是任孩子挑拣的糖果店\"，一切民族主义归根结底是族群的；盖尔纳代表现代主义——以爱沙尼亚人证明族群要素对民族既非必要也非充分。③当代三大研究趋势：a.比较历史研究（民族主义作为宏观政治力量）；b.行为研究（调查与实验）；c.民族志研究（日常实践）。④米洛纳斯对\"非核心群体\"的国族建设三策略：同化、赋予少数群体权利、排斥。","method":"系统性文献综述（review article），综合比较历史、问卷调查、实验设计与参与式民族志等多种方法传统的代表性成果。","evidence":"爱沙尼亚人19世纪初连自知名称都没有，却在百年内建成民族国家；英属印度穆斯林精英1906年已建政团、迟至1940年才要求巴基斯坦国，桑戈尔与塞古·杜尔1957年仍向往泛非法属联邦；世界国家数从百年前不到60个增至近200个。达登与米洛纳斯以受控比较证明领土外部威胁驱动民族内容大众教育投资；巴尔塞利斯证明法属加泰罗尼亚的首轮民族内容教育在法国统治下进行，其认同弱于西班牙一侧；福卡发现一战期间美国对德裔的歧视刺激同化、小学语言禁令适得其反；布卢因与穆坎德发现卢旺达团结宣传降低族群显著性；Depetris-Chauvin等发现足球胜利提升民族认同与跨族群信任、减少国内暴力。","limits":"作者自承民族主义研究长期有欧美中心偏见，单国案例多而跨区域比较少；\"好民族主义/坏民族主义\"（爱国主义/民族主义）的区分在威胁情境下不稳定；民族叙事如何以及在何种条件下变迁仍是知识空白，短期态度变化能否持久亦未可知。","quotes":[{"en":"Nationalism is more relevant to the politics of our time than it has been in half a century.","zh":"民族主义与我们这个时代政治的相关性，超过了过去半个世纪中的任何时候。"},{"en":"As some political scientists are beginning to argue, it is not nationalism per se, but exclusionary nationalisms (also called ethnic or essentialist nationalisms) that are problematic for outcomes such as democracy.","zh":"正如一些政治学家开始论证的，对民主等结果构成问题的并非民族主义本身，而是排斥性民族主义（也称族群民族主义或本质主义民族主义）。"},{"en":"Current research is exploring nationalism's macrohistorical effects on a range of political outcomes; its micro-level effects on individual political behavior; and how quotidian conceptions of nationalism—in contrast to elite conceptions of nationalism—reproduce national narratives.","zh":"当前研究正在探索民族主义对一系列政治结果的宏观历史效应、对个体政治行为的微观效应，以及日常的民族主义观念——与精英的民族主义观念相对——如何再生产民族叙事。"}]}],"glossary":[{"en":"imagined community","zh":"想象的共同体","def":"安德森对民族的定义：成员互不相识，却在心中存有彼此联结意象的政治共同体，被想象为有限且享有主权。","src":"Anderson, 1983, Chapter 1.pdf"},{"en":"nation","zh":"民族","def":"史密斯的定义：一个有名号的人类共同体，居住在被认知的家乡，拥有共同神话与共享历史、独特的公共文化和共同的法律习俗。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"en":"nationalism","zh":"民族主义","def":"以民族的自主、统一与认同为目标的意识形态运动；也泛指民族情感、民族的象征语言及相关社会实践。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"en":"ethnie","zh":"族群共同体","def":"史密斯术语：有名字、与家乡相联结、有共同祖先神话、共享记忆和若干共同文化要素、至少精英层有团结感的共同体。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"en":"national state","zh":"民族性国家","def":"以民族主义原则获得正当性、成员具有一定民族统一与整合（但非文化同质）的国家；用来替代易误导的\"nation-state\"一词。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"en":"nation-state","zh":"民族国家","def":"国家边界与民族边界完全重合的政治共同体；康纳指出这种纯粹类型很罕见——近90%的国家是多族群的。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"en":"national identity","zh":"民族认同","def":"民族成员对构成民族独特遗产的符号、价值、神话、记忆与传统的持续再生产与再诠释，以及个体与这份遗产的可变认同。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"en":"modernism (nationalism theory)","zh":"现代主义（民族主义理论）","def":"认为民族与民族主义是工业化、城市化、印刷资本主义等现代力量之产物的理论流派，以盖尔纳、安德森、霍布斯鲍姆为代表。","src":"Mylonas and Tudor, 2021.pdf"},{"en":"perennialism","zh":"永存主义","def":"认为民族在某种意义上先于现代性存在、建立在先存族群文化要素之上的理论立场，以史密斯为代表。","src":"Mylonas and Tudor, 2021.pdf"},{"en":"primordialism","zh":"原生主义","def":"把民族视为天生给定、\"等待觉醒\"的原始政治实体的立场；当代学界多把它当作批评对象，而非自称的流派。","src":"Mylonas and Tudor, 2021.pdf"},{"en":"ethnosymbolism","zh":"族群象征主义","def":"史密斯开创的分析路径：强调民族的神话、象征、记忆与价值等族群文化基底，及其在现代的再诠释与重建。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"en":"constitutive story","zh":"建构故事","def":"一国建国时刻形成的\"我们是谁\"的核心叙事，围绕族群属性或价值原则构成；一旦沉淀，便深刻影响民主、暴力等政治结果。","src":"Mylonas and Tudor, 2021.pdf"},{"en":"civic vs. ethnic nationalism","zh":"公民民族主义与族群民族主义","def":"以居住与政治忠诚为归属标准，对以血缘与族群属性为归属标准的经典区分；其经验有效性正受到检视。","src":"Mylonas and Tudor, 2021.pdf"},{"en":"exclusionary nationalism","zh":"排斥性民族主义","def":"在本国公民内部制造种族、宗教或族群等级、把少数群体贬为二等公民的民族主义；研究认为危害民主的是它，而非民族主义本身。","src":"Mylonas and Tudor, 2021.pdf"},{"en":"banal nationalism","zh":"平庸民族主义","def":"比利格（Billig）概念：国旗、国歌等日常民族表征对民族归属感的持续再生产；能解释民族主义的延续，而非其起源。","src":"Mylonas and Tudor, 2021.pdf"},{"en":"everyday nationalism","zh":"日常民族主义","def":"把分析目光从精英移向普通人的日常实践与公民生活经验，研究民族归属如何被协商、接受或抵制的研究取向。","src":"Mylonas and Tudor, 2021.pdf"},{"en":"nation building","zh":"国族建设","def":"国家通过大众教育、人口普查、文化机器等手段系统培育民族认同的政策过程；米洛纳斯区分同化、赋权少数、排斥三种策略。","src":"Mylonas and Tudor, 2021.pdf"},{"en":"noncore group","zh":"非核心群体","def":"被执政精英视为未同化的族群群体；国家对其采取同化、少数权利还是排斥政策，取决于外交目标与外部庇护关系。","src":"Mylonas and Tudor, 2021.pdf"},{"en":"sacred properties of the nation","zh":"民族的神圣属性","def":"史密斯提出：族群选民信念、神圣领土依恋、黄金时代记忆、英烈崇拜四者，构成民族作为神圣共同体的基础。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"en":"ethno-history","zh":"族群历史","def":"共同体成员自己关于往昔的记录与记忆，聚焦英雄、牺牲与黄金时代，用以证明民族认同的真实性与独特性。","src":"Smith, 2010 (Chapter 1 & 6).pdf"}],"socratic":[{"q":"世界杯决赛夜，成千上万互不相识的人挤在广场上为同一支球队欢呼流泪，赛后人人都说\"我们赢了\"。这些素昧平生的人，为什么会觉得彼此是\"我们\"？安德森会怎样解释这种日常现象？","level":1,"hint":"先想想：一个几亿人的国家，你一生能认识多少人？可为什么电视里素不相识的同胞进球时你会激动？安德森正是从这种\"陌生人之间的连带感\"出发给民族下定义的——注意他用的是\"想象\"而不是\"虚假\"。到安德森的精读卡里找出他定义的四个要素，逐一对应到这个场景。","ref":"安德森把民族定义为\"想象的政治共同体——被想象为本质上有限且享有主权\"。想象：即使最小民族的成员也永不认识大多数同胞，但人人心中存有彼此联结的意象；有限：再大的民族也有边界，边界之外是其他民族；主权：民族概念诞生于启蒙与革命摧毁神授王朝正当性的时代，自由的标志是主权国家；共同体：无论内部实际不平等如何，民族总被设想为深层的水平友爱。球场上的\"我们\"，正是想象的共同体在日常生活中的现身。","wrong":"学生常答\"因为他们有共同利益\"或\"只是情绪感染\"。导师应追问：利益相同的公司同事为什么不一起唱国歌？单纯情绪感染能解释人们随后自愿参军服役吗？引导学生看到\"陌生人之间的共同体意象\"才是真正需要解释的现象。","followup":"安德森说共同体的区分不在真伪而在\"被想象的风格\"，这句话是什么意思？","src":"Anderson, 1983, Chapter 1.pdf","kw":["想象的共同体","民族","内部","主权","安德森","政治共同体","概念","定义"]},{"q":"观察一下周围的世界：每个国家都有国旗、国歌、首都、护照、烈士纪念碑，连最新独立的小国也要尽快置办齐全，缺了还被视为\"不像个国家\"。为什么这套\"标配\"在全球如此整齐划一？","level":1,"hint":"史密斯在第一章专门讨论了民族的象征体系：专名、旗帜、国歌分别承担什么功能？他提到民族象征已在一个由全球比较构成的\"民族的世界\"（world of nations）中获得独立生命。可以联想：为什么\"马其顿\"的国名都能引发国际争端？","ref":"史密斯指出，民族象征（专名、国旗、国歌、首都、铸币、护照、纪念仪式、阅兵、国家博物馆等）具有惊人的全球一致性：专名表达民族的独特性、英雄气概与天命感，国旗国歌以简明形式唤起独特的历史与命运。其功能有二：对外标示民族边界，对内以共享的记忆、神话与价值意象团结成员。每个民族都置办齐全，说明这套象征已在\"民族的世界\"中成为标配——缺了它们就是严重的\"民族亏空\"。","wrong":"学生常说\"这只是形式主义、面子工程\"。导师应追问：如果只是面子，为什么人们会为侮辱国旗而愤怒、为升旗而流泪？象征缺位为何被视为\"亏空\"而非解脱？引导学生认识象征的情感与认同功能。","followup":"这套象征体系与比利格所说的\"平庸民族主义\"有什么联系？","src":"Smith, 2010 (Chapter 1 & 6).pdf","kw":["民族","史密斯","全球","历史","神话","记忆","象征","边界"]},{"q":"中文里\"民族国家\"\"联合国\"这类说法常把 nation 和 state 混为一谈（联合国其实是国家的联合）。但史密斯提醒我们，学界罕见地在两点上达成了共识。是哪两点？为什么必须做这种区分？","level":1,"hint":"先用自己的话想想：苏联是一个国家，那俄罗斯人、乌克兰人是什么？苏格兰人公投决定是否脱离英国时，他们自称什么？再回精读卡找史密斯的两个定义：state 是一套什么样的制度？nation 是一种什么样的共同体？","ref":"两点共识是：民族不是国家，也不是族群共同体。国家是一套自主的、在特定领土上垄断合法强制与汲取的制度；民族则是一种被感知、被生活的共同体——居住在被认知的家乡、拥有共同神话与共享历史、独特公共文化和共同法律习俗。族群共同体（ethnie）只需与家乡相联结、有共同祖先神话、共享记忆与若干文化要素、至少精英层有团结感，不必实际居住家乡，也无需公共文化与共同法律。概念混淆会遮蔽现实：近90%的国家是多族群的，国家与民族很少重合。","wrong":"学生常答\"nation 就是有主权的民族\"或\"联合国里坐的都是民族\"。导师应追问：如果每个 nation 都有自己的 state，世界上该有多少个国家？亚美尼亚人流散数百年没有国家，他们还是民族吗？逼学生把制度与共同体两个层次分开。","followup":"既然 nation 与 state 很少重合，为什么\"民族国家\"仍是当今世界最具正当性的政治形式？","src":"Smith, 2010 (Chapter 1 & 6).pdf","kw":["族群共同体","民族","制度","文化","概念","历史","神话","记忆"]},{"q":"网络上常有人说：\"民族是近代才被发明出来的东西，所以是假的，不值得认真对待。\"这个推论成立吗？请借助安德森对盖尔纳的批评来分析。","level":2,"hint":"盖尔纳的原话是：民族主义\"在不存在民族的地方发明民族\"。安德森认为这个表述有个缺陷——盖尔纳急于揭露伪装，把\"发明\"悄悄换成了\"捏造\"和\"虚假\"。请区分三个词：invention、fabrication、imagining。再想一层：如果民族因为是\"想象的\"就是假的，那亲属、宗教、阶级这些共同体又是什么？","ref":"推论不成立，它犯了安德森指出的错误：把\"发明/想象\"同化为\"捏造/虚假\"。安德森的反驳分两层。其一，一切大于面对面村落的共同体都是想象的——爪哇村民以亲属庇护网想象联结，法国旧制度贵族以个人身份而非阶级被想象——\"想象的\"不是民族独有的缺陷，而是所有大规模共同体的存在方式。其二，共同体只能按\"被想象的风格\"区分，不能按真伪区分；想象不等于没有真实后果——数百万人甘愿为民族赴死，这是再真实不过的事实。","wrong":"学生常顺着题干答\"对，民族就是虚构的谎言\"。导师应追问：货币、公司、国家也都是建构物，它们\"假\"吗？你能因为民族是建构的，就宣布明天把它废除吗？引导学生区分\"认识论上的建构\"与\"存在论上的真实\"。","followup":"如果想象不等于虚构，民族的建构性是否意味着它可以被任意改写？","src":"Anderson, 1983, Chapter 1.pdf","kw":["民族","制度","真实","共同体","安德森","想象","发明","同化"]},{"q":"十九世纪初，生活在波罗的海东岸的农民甚至没有称呼自己的名称，更没有\"我们是爱沙尼亚人\"的意识；但不到一百年，他们建起了民族、民族意识和一个民族国家。这个真实案例支持\"民族自古长存\"还是\"民族是现代产物\"？","level":2,"hint":"这是盖尔纳在\"华威辩论\"中甩给史密斯的王牌案例。先弄清双方立场：史密斯说\"历史不是任孩子挑拣的糖果店\"，一切民族主义归根结底是族群的；盖尔纳则想证明族群要素对民族既非必要也非充分。爱沙尼亚人起初缺少了什么，却仍在百年内建成了民族？","ref":"它支持现代主义一边。华威辩论中，永存主义的史密斯主张古代文化、族群共同体与现代民族国家之间有深刻连续性，一切民族与民族主义归根结底是族群的；现代主义的盖尔纳以爱沙尼亚人反证：他们19世纪初既无族群意识也无自知名称，却在百年之内创造了民族、民族意识与民族国家，可见族群\"建筑要素\"对民族的诞生既非必要也非充分。米洛纳斯与都铎总结说，此后几十年的经验积累日益有利于现代主义理解，民族被公认为历史偶然的、社会建构的产物。","wrong":"学生常误读案例方向，以为\"百年建成\"说明爱沙尼亚人本来就有潜伏的民族。导师应追问：他们连自知名称都没有，\"潜伏的民族\"藏在哪里？如果族群要素是必要条件，这个民族从哪里长出来？逼学生正视案例对永存主义的杀伤力。","followup":"史密斯的族群象征主义能否吸纳这个反例？他会怎样回应？","src":"Mylonas and Tudor, 2021.pdf","kw":["族群共同体","现代主义","民族主义","民族国家","永存主义","文化","纳斯与都铎","米洛纳斯"]},{"q":"新冠疫情全球暴发时有个耐人寻味的现象：连马克龙、默克尔这样的\"欧盟旗手\"也第一时间关闭本国边界，各国领导人在国旗背景下发表讲话。一场\"始于全球、也终于全球\"的疫情，为什么应对杠杆却清一色是\"国家的\"？","level":2,"hint":"米洛纳斯与都铎在综述开头就用这个例子说明\"民族主义与我们时代政治的相关性超过过去半个世纪\"。再想：欧盟是超国家组织，为什么关掉的是法国、意大利的边界，而不是一条\"欧洲边界\"？公民忠诚与决策杠杆究竟握在谁手里？","ref":"疫情悖论式地展示了决策杠杆与公民忠诚的国家性质。综述指出：尽管全球化加深，民族国家仍是21世纪最有力的政治行为体——应对气候变化、疫情、贫困等重大挑战的首要权力都在它手中；一百年前世界不到60个国家，今天近200个。这也印证史密斯第六章的论点：国际组织非但没有架空民族国家，反而巩固了其\"唯一合法国际行为者\"地位，国家职能只是从经济军事转向社会文化领域，监控与规制能力空前增强。","wrong":"学生常答\"因为欧盟没有实权、效率低\"。导师应追问：为什么公民接受甚至要求本国封关？如果忠诚已经上交给欧洲，为什么没人抗议\"欧盟不保护我\"？引导学生区分行政能力与认同归属两个层面。","followup":"这与史密斯所说的\"民族主义的国际化\"有何关联？","src":"Mylonas and Tudor, 2021.pdf","kw":["民族国家","国际组织","文化","权力","史密斯","全球","综述","法国"]},{"q":"甘地自称\"激烈的民族主义者，但决不伤害任何民族或个人\"；曼德拉也自称\"民族主义者，但绝非种族主义者\"。而今天人们提到\"民族主义\"却常联想到排外与冲突。民族主义到底是解放的力量还是暴力的温床？","level":2,"hint":"别急于二选一。综述给出一条线索：问题也许不在民族主义本身，而在民族主义的类型——先找出\"排斥性民族主义\"的定义。再想社会心理学的警告：Li 与 Brewer 发现，同一个人的\"爱民族\"在不同情境下既可以是良性爱国，也可以是恶性民族主义。两层证据合起来指向什么结论？","ref":"三篇文献都拒绝简单定性。民族主义曾是推翻君主专制与殖民统治的自由运动核心——甘地、曼德拉都自称民族主义者而拒绝伤害与种族主义；但当今上台的一些民族主义（如白人民族主义、印度教民族主义）在本国公民内部制造族群等级，把少数群体贬为二等公民。研究因此主张：危害民主与和平的是排斥性民族主义，而非民族主义本身。但社会心理学提醒：爱国主义与民族主义高度相关，\"好坏\"之分在威胁情境下会被\"启动掉\"——这一区分有分析价值，但经验上不稳定。","wrong":"学生常凭直觉答\"民族主义=坏\"或\"爱国=好\"。导师应追问：甘地与特朗普都自称民族主义者，差别在哪？如果同一个人的爱国心在威胁下会变成排外，\"好坏\"是个人品质还是情境产物？引导学生从本质判断转向条件分析。","followup":"制度设计上如何防止包容性民族认同滑向排斥？","src":"Mylonas and Tudor, 2021.pdf","kw":["排斥性民族主义","民主","内部","研究","族群","群体","威胁","三篇文献"]},{"q":"同样面对国内多族群的现实，有的国家不惜重金推行统一语言的民族教育，有的国家却把教育\"外包\"出去或干脆不搞同化。是什么决定了国家在\"国族建设\"上的投入差异？","level":3,"hint":"别从国内族群结构找答案——达登与米洛纳斯的解释在国际层面。关键词：领土完整的外部威胁、公共物品供给。再想米洛纳斯对\"非核心群体\"的研究：同化、赋予少数权利、排斥三种策略的选择，又取决于什么外交变量？","ref":"达登与米洛纳斯在蒂利与波森基础上提出：国际环境的威胁程度决定国族建设投入。面临领土完整外部威胁的国家，更可能以公共物品形式提供国族建设政策——尤其是含民族内容的公共大众教育——从而解释语言同质性与民族凝聚力的差异；不受威胁的国家更可能外包教育等认同建构工具，或完全不投资同化。米洛纳斯进一步指出，对非核心群体采同化、赋予少数权利还是排斥政策，取决于国家外交目标是修正主义还是维持现状，以及它与该群体外部庇护国的敌友关系。","wrong":"学生常答\"取决于国内族群多寡或经济发展水平\"。导师应追问：两个国内族群构成相似的国家，为何一个建民族学校一个外包教育？外部威胁是通过什么机制转化为教育预算的？引导学生构建\"国际威胁→公共物品供给→认同同质化\"的因果链。","followup":"这一论点能解释后殖民国家国族建设成效的差异吗？试举一例。","src":"Mylonas and Tudor, 2021.pdf","kw":["非核心群体","国族建设","公共物品","民族","米洛纳斯","大众教育","建构","排斥"]},{"q":"一个国家的\"建国故事\"——建国时刻讲清楚\"我们是谁\"的那套叙事——为什么会影响几十年后的税收能力、民主质量，甚至大屠杀发生的风险？","level":3,"hint":"先弄清\"建构故事\"是什么：建国时刻围绕核心群体族群属性、价值原则或两者结合形成的民族归属叙事。再想它如何落地：首轮面向文盲人口的民族内容大众教育会发生什么？巴尔塞利斯对法属与西属加泰罗尼亚的比较说明了什么？叙事一旦\"沉淀\"，改变它需要什么条件？","ref":"建构故事形成于建国时刻及其后数十年精英间的战略互动，此后逐渐\"沉淀\"。其长臂效应在于传递机制：达登强调，首次向文盲人口推行含民族内容的大众教育会使认同固定化，此后由父母监督维持；巴尔塞利斯发现，法属加泰罗尼亚的首轮民族内容教育在法国统治下进行，其认同弱于西班牙一侧。沉淀后的叙事影响征税修路等国家能力、分配政治、投票行为、内战动态乃至大屠杀风险——当被排斥群体被视为\"从属且危险\"时。叙事有粘性，唯有领导层与组织在生存危机中持续努力才可能改变。","wrong":"学生常把建构故事当成宣传口号：\"说说而已，能有这么大影响？\"导师应追问：如果只是上层建筑，为什么它能预测征税能力与大屠杀风险？为什么法属与西属加泰罗尼亚的认同强度不同？引导学生把叙事当作可检验的因果变量，而非修辞。","followup":"既然叙事难改，研究\"叙事在何种罕见条件下确实改变\"为什么构成学术前沿？","src":"Mylonas and Tudor, 2021.pdf","kw":["建构故事","国家能力","民族","大众教育","加泰罗尼亚","沉淀","排斥","法国"]},{"q":"霍布斯鲍姆预言\"民族主义的时代即将终结\"，此后几十年的现实却是民族主义政府在全球复兴。史密斯当年系统反驳过霍布斯鲍姆——他的反驳分哪几层？结合后来的现实，谁的判断更有说服力？","level":3,"hint":"把史密斯的反驳拆成三层：民族国家衰亡了吗？民族认同碎片化了吗？民族主义意识形态消解了吗？每层他都有具体论据（如\"纯粹nation-state从来罕见\"\"国家职能转向社会文化领域\"\"全球文化是无地点、无时间、无记忆的\"）。再用综述开头描述的2010年代现实做裁判。","ref":"史密斯把\"超越论\"拆为三层逐一反驳。其一，民族国家衰亡论：纯粹nation-state从来罕见，以它为基准测量衰退没有意义；国家失去的经济军事职能已由社会文化职能补偿，国际组织反而巩固其合法地位。其二，认同混杂化论：民族文化统一从来不是\"确定性\"，竞争性起源神话古已有之，主导族群的公共文化与记忆至今仍在。其三，民族主义消解论：技术不等于文化，全球文化\"无地点、无时间、无记忆\"，无法满足情感与记忆需要；自决入宪章、示范效应与两次大战的催化使民族主义\"国际化\"。2010年代以来的民族主义复兴支持了史密斯。","wrong":"学生常不拆论题就站队：\"全球化这么猛，肯定是霍布斯鲍姆对。\"导师应追问：国家失去经济军事功能，必然意味着民族认同减弱吗？一个无地点、无时间、无记忆的文化，如何教人面对死亡与失去？引导学生区分国家、认同、意识形态三个分析层次再作判断。","followup":"用\"神圣属性\"框架分析：欧盟认同为何难以取代民族认同？","src":"Smith, 2010 (Chapter 1 & 6).pdf","kw":["民族主义","民族国家","国际组织","文化","史密斯","全球","族群","神话"]},{"q":"综合三篇文献：既然民族是\"想象的\"\"建构的\"，为什么它不是任意的？这个认识对多族群社会的政策设计有何启示？","level":4,"hint":"把三家证据串起来：安德森——民族是文化人工物，但有\"想象的风格\"且能激发至深情感；史密斯——\"历史不是糖果店\"，再诠释须在族群文化遗产设定的参数内进行；米洛纳斯与都铎——建构故事沉淀后有粘性，代际传递靠教育与家庭监督。三处证据共同否定了哪个推论？","ref":"三篇文献共同瓦解了\"建构即任意\"的推论。安德森说民族是历史力量交汇的文化人工物，但一旦创造便具模块性并激发深刻依恋；想象有风格之分，不等于虚构。史密斯强调民族必须建立在先存族群的神话、记忆与象征之上，再诠释只能在文化遗产设定的参数内进行。米洛纳斯与都铎补上机制：建构故事沉淀后有粘性，大众教育与家庭监督使其代际固化，改变需领导层在生存危机中持续努力。政策启示：既不能幻想轻易\"去民族化\"，也不应把排斥性叙事当作不可改变的自然事实。","wrong":"学生常在两极摇摆：\"建构的所以想怎么改就怎么改\"，或\"有族群根基所以本质不可变\"。导师应追问：达登的教育研究说明认同何时固定？爱沙尼亚案例支持哪一极？\"参数内的变化\"允许多大改写空间？引导学生形成\"有约束的建构\"这一中间判断。","followup":"用这一认识评价一项你熟悉的国族建设或整合政策。","src":"Mylonas and Tudor, 2021.pdf","kw":["建构故事","民族","文化","纳斯与都铎","米洛纳斯","史密斯","安德森","大众教育"]}],"quiz":[{"type":"mc","q":"下列哪一项不属于安德森对民族的定义要素？","options":["想象的（imagined）","有限的（limited）","同质的（homogeneous）","主权的（sovereign）"],"answer":2,"explain":"安德森定义民族为\"想象的政治共同体——被想象为本质上有限且享有主权\"，并作为\"共同体\"被设想为水平友爱。他从未要求民族内部同质；恰恰相反，民族\"无论实际不平等与剥削如何\"都被设想为共同体。","src":"Anderson, 1983, Chapter 1.pdf"},{"type":"mc","q":"史密斯从自称民族主义者的共同理想中，提炼出民族主义工作定义的哪三个总目标？","options":["独立、民主、繁荣","自主、统一、认同","主权、领土、人口","自由、平等、博爱"],"answer":1,"explain":"史密斯把工作定义建立在民族主义者的共同理想之上，提炼出民族自主（autonomy）、民族统一（unity）与民族认同（identity）三大总目标，认为民族主义者相信三者缺一，民族便无法生存。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"type":"tf","q":"安德森认为，民族既然是\"想象的共同体\"，就意味着民族是虚假、不真实的共同体。","answer":false,"explain":"恰恰相反。安德森明确批评盖尔纳把\"发明\"同化为\"捏造与虚假\"，指出一切大于面对面村落的共同体都是想象的；共同体的区分标准不在真伪，而在被想象的风格。想象的民族能产生极真实的后果——数百万人甘愿为之赴死。","src":"Anderson, 1983, Chapter 1.pdf"},{"type":"tf","q":"康纳（Walker Connor）指出，世界上近90%的国家是多族群的，国家与民族完全重合的\"nation-state\"十分罕见。","answer":true,"explain":"史密斯在第一章引康纳（1972）与吉登斯指出：单一民族与国家完全重合的\"nation-state\"很罕见，近90%的国家是多族群的，其中约一半被族群分裂严重困扰；因此他建议改用更中性的\"national state\"概念。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"type":"mc","q":"按史密斯的理想类型，民族（nation）区别于族群共同体（ethnie）的关键属性是？","options":["拥有共同祖先神话","实际居住在被认知的家乡、拥有独特公共文化与共同法律习俗","拥有共同语言","拥有自己的主权国家"],"answer":1,"explain":"对照表1.1：ethnie与nation共享具名、共同神话与记忆；民族独有的属性是共享历史、独特公共文化、实际居住于被认知的家乡、共同法律与习俗。拥有主权国家并非民族的必要条件，民族只需渴望一定程度的自治。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"type":"mc","q":"\"华威辩论\"中，盖尔纳举爱沙尼亚人的例子是为了证明什么？","options":["族群文化要素对民族的诞生既非必要也非充分","民族自古以来就一直存在","宗教是民族主义最重要的建筑要素","爱沙尼亚的民族主义是虚假的"],"answer":0,"explain":"爱沙尼亚人在19世纪初既无族群意识、甚至无自知名称，却在百年之内创造了民族、民族意识与民族国家。盖尔纳以此反驳史密斯\"一切民族主义归根结底是族群的\"之主张：民族不必定有族群过去。","src":"Mylonas and Tudor, 2021.pdf"},{"type":"mc","q":"米洛纳斯（Mylonas 2012）提出，国家对\"非核心群体\"可采取哪三种国族建设策略？","options":["同化、赋予少数群体权利、排斥","联邦化、分裂、征服","民主化、市场化、国际化","教育、宣传、镇压"],"answer":0,"explain":"米洛纳斯识别出执政精英对被视为未同化族群的三种策略：同化政策、赋予少数群体权利、将群体排斥于国家之外；采取何种策略，取决于国家外交目标（修正主义或维持现状）及与该群体外部庇护国的敌友关系。","src":"Mylonas and Tudor, 2021.pdf"},{"type":"tf","q":"史密斯认为，随着大众传媒与信息技术创造的全球文化兴起，民族主义将在后现代时代走向消解。","answer":false,"explain":"史密斯明确反驳这一论点：技术不等于文化，全球文化是\"无地点、无时间、无记忆的\"，无法满足情感与记忆需要；折衷拼贴的全球文化缺乏持久力。他认为全球化反而通过自决原则宪章化、示范效应等机制使民族主义\"国际化\"并得以强化。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"type":"sa","q":"请用自己的话解释\"想象的共同体\"，并举一个现实生活中的例子说明它的力量。","ref":"要点：民族的成员彼此素不相识，却在心中存有彼此联结的意象；民族被想象为有限（有边界、边界外是其他民族）且享有主权（以主权国家为自由的标志）；想象不等于虚构——它能激发极真实的情感与行动。例子合理即可，如：国庆升旗时陌生人共同肃立、世界杯期间全城为国家队助威、灾难发生后民众互称\"同胞\"并捐款。","explain":"评分要点：准确说出\"互不相识却心怀联结意象\"（2分）；点出\"想象≠虚假\"或有限/主权要素（1分）；现实例子恰当并能体现共同体的情感力量（1分）。","src":"Anderson, 1983, Chapter 1.pdf"},{"type":"sa","q":"什么是民族的\"建构故事\"（constitutive story）？请用本章提到的一项研究，说明它如何被固定下来或如何影响后来的政治结果。","ref":"要点：建构故事是建国时刻围绕核心群体的族群属性、价值原则或两者结合而形成的民族归属叙事，经精英战略互动后逐渐\"沉淀\"。例证（举一即可）：达登——首次向文盲人口推行含民族内容的大众教育使民族认同固定化，并由父母监督维持；巴尔塞利斯——法属加泰罗尼亚的首轮民族内容教育在法国统治下进行，故其加泰罗尼亚认同弱于西班牙一侧；施特劳斯——当被排斥群体被视为\"从属且危险\"时，大屠杀风险上升。","explain":"评分要点：定义包含\"建国时刻\"与\"族群属性/价值原则\"两要素（2分）；正确引用一项研究的机制或发现（2分）。","src":"Mylonas and Tudor, 2021.pdf"},{"type":"sa","q":"列出史密斯所说的民族的四项\"神圣属性\"，并说明他据此提出的关于民族认同持久性的假设。","ref":"四项神圣属性：①族群选民信念——民族是被拣选之民，肩负特殊使命或与神有圣约；②对神圣领土的依恋——祖先家园被圣徒、英雄与先贤圣化；③对\"黄金时代\"的共享记忆——族群历史的高峰；④\"光荣死者\"崇拜——英烈为民族的自我牺牲。假设：四项属性在一个族群人口中扩散得越广，民族认同就越强大而有韧性，成员与外部者的边界越鲜明，越不愿接纳新来者；反之，多于一项属性衰减或缺失，认同力量相应减弱，边界趋于模糊，更愿接纳外人。","explain":"评分要点：完整列出四属性（4分）；准确复述\"扩散越广认同越强、边界越鲜明\"的假设及反向推论（2分）。","src":"Smith, 2010 (Chapter 1 & 6).pdf"}],"flashcards":[{"front":"想象的共同体","back":"民族成员互不相识，却在心里把彼此当成\"我们\"——就像陌生人一起为国家队流泪。它还被想象为有限（有边界）且享有主权。","src":"Anderson, 1983, Chapter 1.pdf"},{"front":"民族的三个悖论（安德森）","back":"历史学家眼中民族很现代 vs 民族主义者眼中很古老；人人都有国籍 vs 每个民族都独一无二；政治能量巨大 vs 哲学思想贫乏。","src":"Anderson, 1983, Chapter 1.pdf"},{"front":"文化人工物与模块性","back":"民族是18世纪末多种历史力量交汇\"蒸馏\"出的文化产品；一旦造出，就像标准模块一样被移植到各种社会与意识形态中。","src":"Anderson, 1983, Chapter 1.pdf"},{"front":"\"想象的风格\"","back":"大于面对面村落的共同体都是想象的；区分它们不看真假，而看想象的方式——亲属网、王朝、阶级、民族，各有风格。","src":"Anderson, 1983, Chapter 1.pdf"},{"front":"民族主义的工作定义（史密斯）","back":"为一群被其部分成员视为（潜在）民族的人口，争取并维持自主、统一与认同的意识形态运动。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"front":"ethnie（族群共同体）","back":"有名字、与家乡相联结、有共同祖先神话、共享记忆、若干共同文化要素、至少精英层有团结感的共同体。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"front":"民族 vs 族群共同体","back":"民族必须实际住在家乡、有公共文化和共同法律；ethnie 只需象征性联结家乡与若干文化要素。流散数百年的亚美尼亚人是经典的边界难题。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"front":"national state（民族性国家）","back":"以民族主义原则获得正当性、成员有一定民族整合（但非文化同质）的国家。比\"nation-state\"更贴近现实：近90%的国家是多族群的。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"front":"民族认同（史密斯定义）","back":"成员对民族独特遗产（符号、价值、神话、记忆、传统）的持续再生产与再诠释，以及个体与这份遗产的可变认同。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"front":"族群象征主义","back":"史密斯的路径：现代民族不是凭空造的，而是对先存族群的神话、象征、记忆进行选择、重组与再编码的产物。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"front":"民族的四项神圣属性","back":"族群选民信念、神圣领土依恋、黄金时代记忆、英烈（光荣死者）崇拜。扩散越广，民族认同越强韧、边界越分明。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"front":"族群历史（ethno-history）","back":"成员自己讲述的\"我们的过去\"，聚焦英雄、牺牲与黄金时代——如芬兰人从《卡勒瓦拉》史诗中再造辉煌往昔。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"front":"民族主义国际化","back":"民族自决写进联合国宪章、各国民族主义互相示范、两次世界大战催化——全球化非但没消灭民族主义，反而把它变成国际规范。","src":"Smith, 2010 (Chapter 1 & 6).pdf"},{"front":"现代主义 vs 永存主义","back":"前者：民族是工业化、印刷资本主义等现代力量的产物；后者：民族建立在先存族群文化之上。爱沙尼亚百年建国是前者的王牌案例。","src":"Mylonas and Tudor, 2021.pdf"},{"front":"建构故事（constitutive story）","back":"建国时刻定下的\"我们是谁\"的核心叙事；一旦沉淀就有粘性，影响税收、民主乃至大屠杀风险。","src":"Mylonas and Tudor, 2021.pdf"},{"front":"排斥性民族主义","back":"在本国公民内部制造族群等级的民族主义（如白人民族主义、印度教民族主义）。研究认为危害民主的是它，而非民族主义本身。","src":"Mylonas and Tudor, 2021.pdf"},{"front":"平庸民族主义（banal nationalism）","back":"国旗、国歌等日常符号对民族感的悄悄再生产——每天升起的国旗比演说更有力。它能解释民族主义的延续，不能解释起源。","src":"Mylonas and Tudor, 2021.pdf"},{"front":"非核心群体（noncore group）","back":"被执政精英视为\"未同化\"的族群。国家对其同化、给少数权利还是排斥，取决于外交目标与该群体外部庇护国的敌友关系。","src":"Mylonas and Tudor, 2021.pdf"},{"front":"外部威胁与国族建设","back":"达登与米洛纳斯：面临领土威胁的国家更愿投资含民族内容的大众教育；无威胁的国家则外包教育或干脆不同化。","src":"Mylonas and Tudor, 2021.pdf"},{"front":"爱国主义与民族主义之分的不稳定性","back":"社会心理学发现二者高度相关：同一个人的\"爱国\"在威胁情境下，可以滑向排外的\"民族主义\"。","src":"Mylonas and Tudor, 2021.pdf"}]},{"id":"ch08","folder":"10. Theories and Practices in International Relations","title":"国际关系理论与实践","subtitle":"Theories and Practices in International Relations","overview":{"theme":"每天的新闻里，大国博弈、贸易摩擦、国际组织的斡旋轮番上演——这些现象背后是权力算计、制度约束，还是观念与认同？本章汇集国际关系学科最具影响力的经典文献来回答这个问题：从摩根索的古典现实主义到沃尔兹的结构理论，再到基欧汉的制度主义、温特的建构主义，最后落在福山与亨廷顿对冷战后世界秩序的两种对立预言上。读完你将获得一套理论工具箱，能对同一则国际新闻给出四种不同的解读。","coreQuestions":["国家为什么追求权力——是人性使然，还是国际体系结构所迫？","无政府状态是否必然导致自助与安全竞争？制度与规范能否改变这一逻辑？","霸权衰落后，国际合作何以可能持续？国际机制究竟起什么作用？","规范如何兴起、扩散并被内化？观念与理性计算是什么关系？","冷战结束后，世界将走向自由民主的普遍化（福山）还是文明的冲突（亨廷顿）？"],"thread":"本章按理论对话的逻辑递进：先以摩根索确立现实主义的古典基石（以权力界定的利益），再由沃尔兹将权力政治从人性转译为体系结构，米尔斯海默在结构内部展开进攻性与防御性现实主义之争；基欧汉两篇文献接受现实主义的无政府与国家中心前提，却论证制度能使霸权之后的合作持续，构成对新现实主义的内部修正；温特则釜底抽薪，指出自助本身是被互动建构的制度，'无政府是国家造就的'；芬尼莫尔与西金克把建构主义落到可经验检验的规范生命周期；最后福山与亨廷顿把理论之争带入政策层面，为冷战后世界开出两幅相反的世界图景，形成全章的闭环。","path":["第一步：从'国家为什么总要争强好胜'这个直觉出发读摩根索，掌握现实主义的原初命题——以权力界定的利益与政治领域的自主性。","第二步：把'人性'换成'结构'，读沃尔兹与米尔斯海默：没有世界政府这个处境本身如何塑造国家行为，并区分进攻与防御现实主义。","第三步：带着'美国衰落后世界会不会乱'的疑问读基欧汉两篇，看国际制度如何让合作在霸权之后延续。","第四步：追问'国家的身份与利益从哪来'，读温特与芬尼莫尔—西金克，理解规范与认同如何被建构、如何扩散。","第五步：用前四步的理论工具评判福山与亨廷顿这两幅相反的冷战后世界图景，形成自己的综合判断。"],"dialogue":"本章文献构成一场层层递进的辩论。摩根索与沃尔兹同为现实主义，却在权力动机上分裂：人性还是结构；米尔斯海默与沃尔兹同为结构现实主义者，却在'多少权力才够'上针锋相对。基欧汉接过沃尔兹的无政府前提却得出相反结论：无政府不必然导致战争，机制能降低交易成本、维系合作——沃尔兹则视制度为权力的影子。温特批评双方都困在理性主义里，把身份与利益当作给定；芬尼莫尔与西金克进一步展示规范如何重塑利益本身。福山与亨廷顿的争论则是这场理论之争的政策版本：观念普遍主义的胜利对阵文化多元主义的冲突，二者都可以在前面文献中找到理论根基。"},"readings":[{"file":"Morgenthau, 2019.pdf","title":"A Realist Theory of International Politics（现实主义的国际政治理论）","authors":"Hans J. Morgenthau（文件后半另附 John J. Mearsheimer《Anarchy and the Struggle for Power》节选）","year":"2019（读本重印；原著1948）","venue":"课程读本章节重印（Chapter 3: International Relations Theories）；节选自 Morgenthau, Politics among Nations: The Struggle for Power and Peace (1948)","thesis":"政治现实主义认为政治受根植于人性的客观规律支配；理解国际政治的路标是'以权力界定的利益'这一概念；政治领域具有自主性，不能用抽象普遍道德原则直接评判国家行为，普遍道德须经具体情境过滤；审慎（prudence）是政治的最高美德。","framework":"古典现实主义六原则（逐项）：①政治受根植于人性的客观规律支配——改进社会须先理解规律，违之者必败；②理解国际政治的路标是'以权力界定的利益'——观察者据此像站在政治家身后一样重推其理性决策，历史也证实政治家确实如此思考；③'利益以权力界定'的内核恒定，但利益的具体内容随时代情境变化——权力竞争的形式并非一成不变；④普遍道德原则不能抽象地直接套用于国家行为——必须先经具体时空情境的过滤；⑤不能把某一国家的道德抱负等同于支配宇宙的道德法则——否则只是把一国之私伪装成神意；⑥政治领域是自主的——经济学家问'这政策增加财富吗'，政治现实主义者问'这政策如何影响国家权力'。","method":"历史经验归纳与理性假设：假定政治家按权力利益理性行动，再以其行为的可预见后果检验该假设，反对先验抽象的理论标准。","evidence":"①十字军为'圣地'、威尔逊为'让世界安全于民主'、纳粹为扩张——终极目标迥异，都以追求权力为直接手段；②一笔对外贷款即使在银行家看来'不牢靠、不划算'，只要服务于国家政治政策就站得住脚——经济标准须让位于权力标准；③威尔逊式'权力政治将随民主与自治的胜利而消亡'的期待，被持续的权力竞争证伪。","limits":"以人性中的权力欲解释国家行为，被结构现实主义批评为不科学的形而上学；'以权力界定利益'有循环论证之嫌；对国内政治与观念的轻视遭自由主义与建构主义挑战。文本提取为双栏交错，且文件后半混入了米尔斯海默《大国政治的悲剧》节选。","quotes":[{"en":"The main signpost that helps political realism to find its way through the landscape of international politics is the concept of interest defined in terms of power.","zh":"帮助政治现实主义在国际政治的图景中找到方向的主要路标，是以权力来界定的利益概念。"},{"en":"International politics, like all politics, is a struggle for power. Whatever the ultimate aims of international politics, power is always the immediate aim.","zh":"国际政治同一切政治一样，是权力之争。无论国际政治的终极目标是什么，权力永远是其直接目标。"},{"en":"Realism, then, considers prudence—the weighing of the consequences of alternative political actions—to be the supreme virtue in politics.","zh":"因此现实主义认为，审慎——即对不同政治行动后果的权衡——是政治中的最高美德。"}]},{"file":"Waltz, 1979.pdf","title":"Theory of International Politics（《国际政治理论》节选：系统理论与政治结构）","authors":"Kenneth N. Waltz","year":"1979","venue":"Theory of International Politics（Addison-Wesley，第4、5、6章等节选）","thesis":"还原主义方法无法解释国际政治中反复出现的结果，必须建立系统理论：系统由结构与互动单元构成，结构由排序原则、单元功能分化与能力分配三要素界定；国际体系以无政府为排序原则、国家为同类单元，故唯一的结构变量是能力（极）的分配，均势因此会反复形成。","framework":"结构三要素（逐项）：①排序原则——国内政治是等级制（有中央权威），国际政治是无政府（无中央权威），两者是组织单元的不同方式；②单元的功能分化——国内单元分工各异，国际体系中的国家彼此'同类'、功能相似，此项近乎常数，可从结构分析中剔除；③能力在单元间的分配——国际体系唯一真正的结构变量，'极'的数量变化即结构变化。结构通过两条机制约束单元：竞争（落后者被淘汰或被迫效仿成功者）与社会化（单元相互模仿而趋同）。","method":"理论建构与概念分析；借微观经济学市场结构作类比，严格区分系统层次原因与单元层次原因，以抽象的'位置'定义取代对单元属性的描述。","evidence":"①市场类比：完全竞争、完全串谋甚至垄断可产生相同的价格结果，说明决定结果的是市场结构而非厂商属性；②社会化实例：1922年热那亚会议上，列宁叮嘱外长契切林'别说大话'，这位革命政权的外长便以传统外交官姿态与意识形态死敌德国做成交易；③均势命题：'均势一旦被打破，总会以某种方式重建'，均势会反复形成。","limits":"把国家当作无差别的黑箱，忽略国内政治、意识形态与文化；结构只'约束与塑造'而不决定，被批评为难以证伪；无法解释体系变革与规范内容，温特批评其结构概念'没有内容'。","quotes":[{"en":"A system is composed of a structure and of interacting units.","zh":"系统由结构与互动的单元两部分组成。"},{"en":"The expectation is not that a balance, once achieved, will be maintained, but that a balance, once disrupted, will be restored in one way or another. Balances of power recurrently form.","zh":"理论的预期不是均势一旦达成就被维持，而是均势一旦被打破，总会以某种方式重建。均势会反复形成。"}]},{"file":"Mearsheimer, 2013.pdf","title":"Structural Realism（结构现实主义）","authors":"John J. Mearsheimer","year":"2013","venue":"Dunne, Kurki & Smith 编 International Relations Theories: Discipline and Diversity（第3版，Oxford University Press）第4章","thesis":"结构现实主义从五项假设出发——无政府体系、国家拥有进攻性军力、意图不可确知、生存是首要目标、国家理性——推导出国家间的恐惧、自助与权力竞争；进攻性现实主义主张国家应最大化权力、追求地区霸权，防御性现实主义认为体系会惩罚过度扩张；二者对'中国能否和平崛起'给出相反预测。","framework":"五项假设（逐项）：①国际体系是无政府的——没有凌驾于国家之上的中央权威，无政府是排序原则而非混乱；②大国都拥有一定的进攻性军事能力——足以伤害邻国，且能力可随时变化；③国家永远无法确知他国意图——意图藏在决策者脑中，无法验证，连未来意图也无从判断；④生存是大国的首要目标——繁荣、人权等目标都必须让位于生存；⑤国家是理性行为体——会盘算最大化生存前景的战略（尽管也会误判）。五者叠加，推导出国家间的恐惧、自助与无休止的安全竞争；进攻性现实主义由此主张权力最大化与地区霸权，防御性现实主义则认为制衡联盟会惩罚过度扩张。","method":"教科书式理论梳理与演绎，配合案例研究：以'中国能否和平崛起'为测试案例，比较不同结构现实主义分支的预测。","evidence":"①美国1898年确立西半球地区霸权，此后绝不容忍'对等竞争者'：20世纪先后击败四个问鼎地区霸权的大国——德意志帝国（1900—18）、日本帝国（1931—45）、纳粹德国（1933—45）与苏联（1945—89）；②防御性现实主义的机制证据：俾斯麦的克制对照威廉二世与希特勒的扩张下场；民族主义时代占领他国得不偿失——美国在伊拉克的遭遇是对中国的警示；核武器进一步抬高扩张成本，故防御性现实主义判断中国崛起未必伴随激烈冲突。","limits":"同一理论家族对同一案例得出相反结论，预测力存疑；忽视国内政治路径（作者承认德意志帝国等扩张源于国内政治病理）；把国家当黑箱招致自由主义与建构主义批评。","quotes":[{"en":"In essence, great powers are trapped in an iron cage where they have little choice but to compete with each other for power if they hope to survive.","zh":"本质上，大国被困在铁笼之中：如果想生存下去，它们别无选择，只能彼此竞争权力。"},{"en":"Realists believe that power is the currency of international politics.","zh":"现实主义者认为，权力是国际政治的通货。"}]},{"file":"Keohane, 1989.pdf","title":"Neoliberal Institutionalism: A Perspective on World Politics（新自由制度主义：一种世界政治视角）","authors":"Robert O. Keohane","year":"1989","venue":"International Institutions and State Power（Westview Press）第1章","thesis":"世界政治的制度化程度变化对政府行为有重大影响：制度影响信息流与谈判机会、帮助监督遵约并作出可信承诺、塑造对协议稳定性的预期；新自由制度主义接受现实主义的无政府与国家中心假设，但否认无政府与战争之间存在必然逻辑联系，合作必须由制度促成而非自然发生。","framework":"新自由制度主义的制度概念（逐项）：①制度的三个层次——正式政府间组织、国际机制（有明确规则的制度）、惯例（非正式的协调规范，如互惠）；②衡量制度化程度的三特性——共同性（预期被多少行为体共享）、明确性（规则是否清晰规定）、自主性（机构能否修改自身规则）；③理论适用的两个条件——行为体间存在共同利益（有合作可图的余地），且制度变化对行为有实质影响。接受现实主义的无政府与国家中心前提，但否认无政府与战争之间存在必然逻辑联系。","method":"概念建构与理论对话；对新现实主义命题（无政府—战争必然性、相对收益压倒绝对收益）作逻辑审查并用经验反例检验。","evidence":"①谈判形成的秩序之例：1944年建立的布雷顿森林货币机制与海洋法机制，体现制度如何汇聚各国预期；②作者明确拒绝假定国家利益永远以相对收益界定、冲突模式永恒不变，以此与新现实主义划界；③概念辨析：合作≠和谐——和谐无需制度，合作是利益有分歧时经谈判与影响力达成的政治过程，制度的价值恰在分歧处体现。","limits":"作者自称提供的是'视角'而非严密演绎理论；仍以理性主义与外生偏好为前提，被温特批评未能处理身份与利益的形成；制度相对权力的独立因果作用程度仍是争论焦点。","quotes":[{"en":"The principal thesis of this book is that variations in the institutionalization of world politics exert significant impacts on the behavior of governments.","zh":"本书的核心论点是：世界政治制度化程度的变化对政府行为产生重大影响。"},{"en":"Cooperation must be distinguished from harmony. Cooperation is not automatic, but requires planning and negotiation.","zh":"合作必须与和谐相区分。合作不是自动出现的，它需要谋划与谈判。"}]},{"file":"Keohane, 2019.pdf","title":"From After Hegemony: Cooperation and Discord in the World Political Economy（《霸权之后》节选）","authors":"Robert O. Keohane","year":"2019（读本重印；原著1984）","venue":"课程读本章节重印（Chapter 9: Intergovernmental Organizations and Nongovernmental Organizations）；节选自 Keohane, After Hegemony（Princeton University Press, 1984）第1、6、7章","thesis":"现实主义霸权稳定论正确指出美国霸权塑造了战后国际机制，但霸权衰落并不等于合作终结；国际机制通过降低交易成本、提供信息、建立法律责任与议题联结，使无霸权条件下基于互补利益的合作成为可能；合作源于利益互补与制度安排，而非善意或和谐。","framework":"对霸权稳定论的修正＋机制的功能理论（逐项）：①借科斯定理思考——若权责明确、信息充分、交易成本为零，无需中央权威也能谈判达成合作；②世界政治不满足这些条件，故需机制来'逆转科斯定理'：机制建立法律责任模式，让承诺更可信、违背更有代价；③机制提供相对对称的信息，缓解不确定性；④机制降低交易成本，使逐议题谈判的边际成本下降；⑤机制构造议题联结，扩大可交易的空间。霸权有助于机制创建，但机制一旦建立便有惯性，霸权衰落不等于合作终结。","method":"理论演绎（制度经济学与博弈论）结合战后政治经济史检验；比较现实主义与制度主义对美国霸权衰落的竞争性预测。","evidence":"①历史检验：20世纪60年代末美国霸权开始衰落、战后机制受侵蚀，但70年代合作努力持续不断，证伪'霸权衰落即合作终结'的天真版本；②分析对象：贸易、货币与能源领域的机制（GATT、IMF、IEA等），说明违背规则的代价如何上升、监督与议题联结如何可行；③理论定位：合作不源于善意或和谐，而源于互补利益与人为建构的制度安排——相互依赖只制造协调需求，机制才把需求变成合作。","limits":"理论聚焦西方发达市场经济体之间的政治经济，对安全领域与南北问题适用性有限；机制效力与权力分配孰轻孰重仍受现实主义质疑；双栏文本提取交错，部分语句残缺。","quotes":[{"en":"Can cooperation take place without hegemony and, if so, how?","zh":"没有霸权，合作能否发生？如果能，又是如何发生的？"},{"en":"The persistence of attempts at cooperation during the 1970s suggests that the decline of hegemony does not necessarily sound cooperation's death knell.","zh":"20世纪70年代合作努力的持续表明，霸权的衰落并不必然敲响合作的丧钟。"}]},{"file":"Wendt, 1992.pdf","title":"Anarchy is What States Make of It: The Social Construction of Power Politics（无政府是国家造就的：权力政治的社会建构）","authors":"Alexander Wendt","year":"1992","venue":"International Organization, Vol. 46, No. 2","thesis":"新现实主义与新自由主义共享理性主义，都把国家的身份与利益当作外生给定；自助并非无政府结构的逻辑必然，而是互动过程中建构起来的制度；无政府本身不包含特定逻辑——'无政府是国家造就的'，身份与利益的内生变化可以生成竞争性或合作性的安全体系。","framework":"建构主义两原则（逐项）：①行动者基于客体对其具有的意义而行动——无政府与权力分配本身不能告诉我们谁是敌是友，意义由主体间知识（'知识分配'）构成；②意义在互动中生成——身份与利益不是外生给定，而是在交往过程中被塑造的。由此：自助不是无政府的逻辑必然，只是身份—利益结构的一种制度；'掠夺者论证'承认自助可在因果上偶然产生，但掠夺的出现本身是特定历史事件，且集体安全认同足够牢固时掠夺者破坏受限。","method":"理论批判与概念分析；思想实验（初次'相遇'情境、双行为体无政府）辅以现实例证，展示制度如何建构身份。","evidence":"①意义先于力量：美国军力对加拿大与对古巴意义完全不同，英国导弹与苏联导弹对美国的意义也迥异，尽管'结构位置'相似；②思想实验：无政府下国家初次'相遇'时没有既定的自我—他者观念，身份由互动塑造；③一个掠夺者能击败一百个和平主义者（无政府不提供保护），但已有集体安全认同的体系不必因掠夺者的可能存在而预先转向竞争；④现实检验：苏联威胁消失后，北约成员国若有不依赖该威胁的安全认同，旧的不安并不会自动回归。","limits":"作者承认建构主义者重本体论、轻因果与经验研究；理论预测力弱，难以说明无政府下身份变化的方向与触发条件；对新自由主义更多是补充而非替代，融合方案'可能两边不讨好'。","quotes":[{"en":"Self-help is an institution, one of various structures of identity and interest that may exist under anarchy.","zh":"自助是一种制度，是无政府状态下可能存在的各种身份与利益结构中的一种。"},{"en":"Anarchy is what states make of it.","zh":"无政府是国家造就的。"}]},{"file":"Finnemore and Sikkink, 1998.pdf","title":"International Norm Dynamics and Political Change（国际规范动态与政治变革）","authors":"Martha Finnemore & Kathryn Sikkink","year":"1998","venue":"International Organization, Vol. 52, No. 4","thesis":"规范研究是对学科传统关切的回归；规范按三阶段'生命周期'演化：规范兴起（规范企业家通过劝说争取规范领导国）→规范瀑布（国家、国际组织与网络推动社会化，动机转为合法性、声誉与自尊）→内化（规范获得理所当然的品质）；前两阶段之间存在'临界点'；规范与理性并非对立，行动者常以'战略性社会建构'重塑偏好与身份。","framework":"规范生命周期三阶段（逐项，含行动者/动机/机制）：①规范兴起——规范企业家（依托组织化平台）以利他、移情、理念承诺为动机，通过'劝说'争取规范领导国；②规范瀑布——国家、国际组织与跨国网络成为主要行动者，动机转为合法性、声誉与自尊，主导机制是社会化、制度化与示范；③内化——法律、专业阶层与官僚机构接手，动机是遵从，机制是习惯与制度化，规范获得'理所当然'的品质。①→②之间存在'临界点'：足够多的关键国家接受规范后，扩散自动加速。","method":"对政治学、法学、社会学中规范研究的归纳式理论建构；以妇女权利（选举权）与战争法两大议题领域的实证研究为检验材料。","evidence":"①妇女选举权：1904年国际妇女选举权协会（IWSA）成立，首次发起跨国运动；首个处理妇女议题的政府间机构是1928年成立的美洲妇女委员会（CIM）；临界点约在1930年——从1848年塞内卡福尔斯会议到1930年的80多年间仅约20国授予妇女选举权，而临界点后20年内约48国跟进；1930年后国际与跨国压力取代国内压力成为采纳主因；最早采纳者（新西兰、澳大利亚、芬兰）并非霸权国，美英反而滞后10—20年，可见这不是'霸权社会化'。②医疗人员战时豁免、妇女选举权等规范已内化到不再成为公共辩论议题。","limits":"生命周期完成并非必然，何种规范更易到达临界点仍需进一步理论化；模型不区分'好规范'与'坏规范'，恶性规范同样可能扩散；文本提取存在严重去空格与字符错位，引用须核对原文。","quotes":[{"en":"Completion of the 'life cycle' is not an inevitable process. Many emergent norms fail to reach a tipping point.","zh":"'生命周期'的完成并非必然过程。许多兴起中的规范未能到达临界点。"},{"en":"Norms acquire a taken-for-granted quality and are no longer a matter of broad public debate.","zh":"规范获得一种理所当然的品质，不再是广泛公共辩论的对象。"}]},{"file":"Fukuyama, 1989.pdf","title":"The End of History?（历史的终结？）","authors":"Francis Fukuyama","year":"1989","venue":"The National Interest, No. 16","thesis":"我们见证的不只是冷战结束，而是'历史本身的终结'——人类意识形态演化的终点与西方自由民主作为最终政府形式的普遍化；自由民主在理念层面已穷尽可行的系统性替代方案；历史由自然科学逻辑与'争取承认的斗争'驱动，承认需求在自由民主中得到满足，但'最后之人'的无聊可能重新启动历史。","framework":"黑格尔—科耶夫历史哲学（逐项）：①历史是有方向、有终点的辩证过程——有起点、中段与终点，理念层面的演化在法国大革命与美国革命的原则中已经完成；②历史的深层动力是'争取承认的斗争'（主奴辩证法）——人追求被承认为有尊严的存在，自由民主以普遍而平等的承认满足这一需求；③意识优先于物质——观念终将'按照自己的形象'重塑物质世界，消费文化的全球蔓延是其前奏。","method":"观念史思辨与当代政治趋势解读；以中苏改革、法西斯与马克思主义的命运、宗教与民族主义的局限为经验支撑。","evidence":"①两大共产主义国家的转向：苏联改革与中国市场化（农业改革使粮食产量五年翻番、约两万名中国留学生在西方求学），消费文化深入莫斯科新开的合作餐厅与商店、北京的农贸市场与彩电；②法西斯主义已被摧毁，马克思主义作为世界历史性意识形态只剩马那瓜、平壤、剑桥等孤立信徒；③宗教与民族主义虽存但都不是普遍方案——伊斯兰无法吸引非穆斯林；④文末坦承：后历史世界里承认的斗争将被经济计算取代，'历史的终结将非常令人伤感'。","limits":"被批评低估宗教、民族主义与非西方世界的挑战（亨廷顿针锋相对）；'理念胜利'与物质世界的脱节使判断过于乐观；作者自承认民族与宗教暴力将持续，论题存在内部张力；双栏文本提取交错。","quotes":[{"en":"The end of history as such: that is, the end point of mankind's ideological evolution and the universalization of Western liberal democracy as the final form of human government.","zh":"历史本身的终结：即人类意识形态演化的终点，以及西方自由民主作为人类政府最终形式的普遍化。"},{"en":"The end of history will be a very sad time.","zh":"历史的终结将是一段非常令人伤感的时光。"}]},{"file":"Huntington, 1993.pdf","title":"The Clash of Civilizations?（文明的冲突？）","authors":"Samuel P. Huntington","year":"1993","venue":"Foreign Affairs, Vol. 72, No. 3","thesis":"冷战后世界冲突的根本来源将不再是意识形态或经济，而是文化；西方、儒家、日本、伊斯兰、印度教、斯拉夫—东正教、拉美乃至非洲等七到八个文明之间的断层线将成为未来的战线；文明冲突源于文明差异的真实与根本、互动增多强化的文明意识、现代化对民族国家认同的削弱、西方权力顶峰引发的'回归根源'等六重原因。","framework":"文明范式（逐项）：①七至八个主要文明——西方、儒家、日本、伊斯兰、印度教、斯拉夫—东正教、拉丁美洲，可能还有非洲文明，其间断层线将成为未来战线；②文明必将冲突的六重理由：a.文明差异真实而根本（历史、语言、传统，尤以宗教为甚）；b.世界变小、互动增多，反而强化文明意识；c.现代化剥离地方与民族认同，宗教以原教旨主义形式填补真空；d.西方处于权力顶峰，激发非西方'回归根源'；e.文化特征比政治经济立场更难变通、更难妥协；f.经济区域主义以文明为单位整合；③关键概念：断层线战争、亲缘国家综合症、无所适从的国家。","method":"宏观历史比较与政策分析；以近代冲突形态的演化（君主战争—民族战争—意识形态战争）和当代断层线冲突为佐证。","evidence":"①断层线千年史：从732年图尔战役到海湾战争后伊斯兰与西方的持续张力；②数据：1980—1989年区域内贸易比重，欧洲51%→59%、东亚33%→37%、北美32%→36%，区域集团以共同文明为根基（欧共体立于欧洲文化与西方基督教）；③无所适从的国家：土耳其最典型——精英西化、申请加入欧共体，社会却有伊斯兰复兴，厄扎尔直言'我们是穆斯林，他们是基督徒'；墨西哥过去十年采取了类似位置；④亲缘国家综合症：高加索冲突中土耳其公开支持其宗教亲缘一方。","limits":"低估文明内部冲突与跨文明联盟，被批评把文明当作无内部分化的整体；国家仍被多数学者视为主要行为体；文明边界与因果机制模糊，且有'自我实现的预言'之嫌——把世界当作文明冲突来对待本身可能制造冲突。","quotes":[{"en":"It is my hypothesis that the fundamental source of conflict in this new world will not be primarily ideological or primarily economic. The great divisions among humankind and the dominating source of conflict will be cultural.","zh":"我的假设是：在这个新世界里，冲突的根本来源将主要不是意识形态的，也主要不是经济的。人类最大的分野与冲突的主要来源将是文化。"},{"en":"For the relevant future, there will be no universal civilization, but instead a world of different civilizations, each of which will have to learn to coexist with the others.","zh":"在可预见的未来，不会存在普世文明，只会有一个由不同文明构成的世界，每个文明都必须学会与其他文明共存。"}]}],"glossary":[{"en":"anarchy","zh":"无政府状态","def":"国际体系中没有凌驾于国家之上的'世界政府'。它是一种排序方式（与国内的等级制相对），不等于混乱——无政府下照样可以有秩序与合作。","src":"Waltz, 1979.pdf"},{"en":"self-help","zh":"自助","def":"没有中央保护者，国家只能靠自己保障生存。温特指出：自助不是无政府注定的结果，而是国家在互动中'处出来'的一种制度。","src":"Wendt, 1992.pdf"},{"en":"balance of power","zh":"均势","def":"国家相互制衡反复形成的格局。沃尔兹的预期不是均势永驻，而是'一旦被打乱，总会以某种方式重建'。","src":"Waltz, 1979.pdf"},{"en":"interest defined as power","zh":"以权力界定的利益","def":"摩根索的核心概念：用'权力'来理解政治家的利益追求。它让国际政治成为独立的分析领域，与算经济账、讲道德区分开。","src":"Morgenthau, 2019.pdf"},{"en":"structural realism","zh":"结构现实主义","def":"即新现实主义：不是人性坏，而是'没有世界政府'的体系结构迫使国家竞争权力；国家被看作功能相似的单元。","src":"Mearsheimer, 2013.pdf"},{"en":"offensive realism","zh":"进攻性现实主义","def":"米尔斯海默的分支：体系鼓励国家把权力最大化——争当地区霸权、阻止别国取得霸权，以此最大化生存概率。","src":"Mearsheimer, 2013.pdf"},{"en":"defensive realism","zh":"防御性现实主义","def":"沃尔兹的分支：过度扩张会招来制衡联盟的惩罚，国家只需适度权力即可保障生存，安全竞争因此相对温和。","src":"Mearsheimer, 2013.pdf"},{"en":"latent power","zh":"潜在权力","def":"构建军事力量的社会经济'原料'，主要是财富与人口规模。国家可以不经战争、靠增长潜在权力变强。","src":"Mearsheimer, 2013.pdf"},{"en":"hegemonic stability theory","zh":"霸权稳定论","def":"现实主义命题：开放稳定的国际经济秩序需要一个霸权国提供规则与公共品；霸权衰落，秩序就容易瓦解。","src":"Keohane, 2019.pdf"},{"en":"international regime","zh":"国际机制","def":"政府就特定议题领域达成的、含明确规则的制度，如布雷顿森林货币机制、海洋法机制；作用是汇聚各国预期。","src":"Keohane, 1989.pdf"},{"en":"neoliberal institutionalism","zh":"新自由制度主义","def":"基欧汉的视角：承认无政府与国家中心前提，但强调制度化程度的变化会显著影响世界政治中的合作与冲突。","src":"Keohane, 1989.pdf"},{"en":"cooperation vs. harmony","zh":"合作与和谐","def":"和谐是利益天然一致、无需商量；合作是有分歧时经谈判调整彼此行为。国际制度的价值恰在'有分歧'的地方。","src":"Keohane, 1989.pdf"},{"en":"transaction costs","zh":"交易成本","def":"谈成并监督一笔'交易'所需的信息、谈判与监督成本。国际机制靠压低这些成本，让合作更划算、更易达成。","src":"Keohane, 2019.pdf"},{"en":"norm life cycle","zh":"规范生命周期","def":"规范演化的三阶段模型：兴起（企业家劝说）→瀑布（各国跟进）→内化（理所当然）；前两阶段之间存在'临界点'。","src":"Finnemore and Sikkink, 1998.pdf"},{"en":"norm entrepreneur","zh":"规范企业家","def":"以理念为动机、借助组织平台、靠劝说推广新规范的行动者，是规范兴起阶段的'发起人'。","src":"Finnemore and Sikkink, 1998.pdf"},{"en":"tipping point","zh":"临界点","def":"足够多的关键国家接受某规范后的'门槛'：一过门槛，规范便雪崩式扩散到体系其余国家；许多新规范止步于门槛之前。","src":"Finnemore and Sikkink, 1998.pdf"},{"en":"identities and interests","zh":"身份与利益","def":"建构主义的核心变量：国家'是谁、想要什么'不是天生给定的，而是在互动中被主体间知识塑造出来的。","src":"Wendt, 1992.pdf"},{"en":"fault line","zh":"断层线","def":"不同文明之间的边界地带。亨廷顿预言：未来的冲突与战争最可能沿这些'接缝'爆发。","src":"Huntington, 1993.pdf"},{"en":"the end of history","zh":"历史的终结","def":"福山命题：人类意识形态演化到达终点，自由民主成为最终政府形式——不是'从此无事发生'，而是再无系统性替代方案。","src":"Fukuyama, 1989.pdf"},{"en":"struggle for recognition","zh":"争取承认的斗争","def":"黑格尔—科耶夫的历史动力：人追求被承认为有尊严的存在。福山认为自由民主让这一需求获得普遍满足。","src":"Fukuyama, 1989.pdf"}],"socratic":[{"q":"先看一个反常现象：有些国家会给外国发放明知很难收回的贷款，商人绝不会做这种'亏本买卖'，政府却照做不误。摩根索认为，要理解政治家这类行为，需要一块专门的'路标'。这块路标是什么？它用哪个概念来界定政治家的'利益'？","level":1,"hint":"想想政治家和银行家看同一笔贷款时问的问题有何不同。翻到摩根索六原则的第二条，注意'利益'前面还有一个关键限定词。","ref":"路标是'以权力界定的利益'。摩根索认为政治家按权力界定利益来思考和行动，历史证据也支持这一假定。一笔贷款即使在银行家看来不划算，只要服务于国家权力，在政治上就成立——这正是政治领域自主性的含义：经济学家问'是否盈利'，政治现实主义者问'如何影响国家权力'。这个概念让观察者像站在政治家身后一样重推其理性决策，使纷繁事实获得理论意义。","wrong":"典型错误是把路标说成'国家利益'或'国家道德'，丢掉了'以权力界定'这个限定。导师可追问：摩根索为什么不满足于'利益'二字？没有权力这个限定，政治分析与经济学、伦理学还有什么区别？","followup":"用这个路标回看历史：十字军、威尔逊'让世界安全于民主'、纳粹扩张——目标迥异，却共享什么直接目标？","src":"Morgenthau, 2019.pdf","kw":["以权力界定的利益","摩根索","影响","主义","理论","理性","历史","经济"]},{"q":"'无政府状态'这个词听起来像打砸抢的混乱场面；一个小区没了物业和保安，很多人的第一反应也是'要乱套'。但国际关系学者说整个世界就处于'无政府状态'，而世界大多数时候并不混乱。这个词在学科里到底指什么？","level":1,"hint":"把 anarchy 拆开理解：它只是'没有凌驾于国家之上的中央政府'，是一种排序方式，与'混乱'是两回事。再想想：小区里没人管时，住户们除了打架，还可能自己协商立规矩。","ref":"无政府状态指国际体系缺乏凌驾于国家之上的中央权威，它是体系的'排序原则'，与国内政治的等级制相对，而不是混乱的同义词。沃尔兹承认世界政治'并非全无制度与有序程序'；米尔斯海默把它当作产生安全竞争的结构条件；基欧汉进一步指出无政府与战争之间没有必然逻辑联系——秩序缺口的程度取决于通行的预期与制度。","wrong":"最常见的误解是把无政府直接等同于'一切人反对一切人的战争状态'。导师可追问：1988年的欧洲没有世界政府，却也不是战场——是什么在缺乏主权者时提供了秩序？这个追问正好把学生引向制度主义。","followup":"如果无政府不必然导致战争，现实主义者要靠哪一步额外论证，才能推出权力竞争的必然性？","src":"Keohane, 1989.pdf","kw":["无政府状态","制度","国际体系","中央权威","沃尔兹","基欧汉","结构","世界"]},{"q":"设想你和几个陌生人被困在一部电梯里：彼此都不知道对方想干什么，每个人手里都拿着一件可能伤人的工具，又没有保安可以呼叫。你会不会下意识地提防别人？米尔斯海默认为大国之间的处境与此类似。他用哪几条假设，一步步推出国家必然互相提防、争夺权力？","level":1,"hint":"按顺序数一数：头顶上有没有管事的？对方手里有没有伤害你的能力？你读得出对方的意图吗？你最优先保住的是什么？对方是不是也会盘算？五条拼起来就是答案。","ref":"五项假设：①体系无政府，没有中央权威；②大国都拥有进攻性军事能力，足以伤害邻国且能力可变化；③意图永远不可确知——意图藏在决策者脑中，无法验证；④生存是首要目标，其他目标必须让位；⑤国家是理性行为体，会盘算最大化生存的战略。单看任何一条都推不出冲突，但五条叠加就描绘出无休止安全竞争的世界：正因为意图不可知而能力可变，最稳妥的策略就是自己变强。","wrong":"初学者常漏掉'意图不可确知'这条，以为国家互疑是因为'人性本恶'。导师可追问：米尔斯海默需要假设人性恶吗？即使对方今天是好人，你为什么仍要提防？——因为无法确知其未来意图，这正是结构解释与人性解释的分水岭。","followup":"五条假设里你觉得哪一条最脆弱？如果它被推翻，整个推理链条还成立吗？","src":"Mearsheimer, 2013.pdf","kw":["政府","中央权威","进攻性","行为体","世界","体系","理性","冲突"]},{"q":"宿舍里，如果所有人都爱干净，卫生问题根本不用开会——这叫'和谐'；可一旦有人熬夜打游戏、有人要早起，就得坐下来立规矩——这才叫'合作'。基欧汉为什么坚持在国际政治里严格区分这两个词？这个区分对评价国际制度有什么用？","level":1,"hint":"顺着宿舍例子想：'立规矩'这件事在利益天然一致时根本不需要，恰恰在有分歧但可以协调时才显出价值。再想想：GATT、IMF 这类机制存在的理由是什么？","ref":"和谐是利益自然一致、无需调整行为的状态；合作则是原本有分歧的行为体通过谈判相互调整政策的结果，是高度政治性的过程。区分的意义在于：制度的价值恰在分歧处体现——没有分歧就无所谓合作问题；有分歧时，制度通过提供信息、监督遵约、塑造对协议稳定性的预期，把可能的合作变成现实。所以基欧汉既不接受'利益一致所以合作自动到来'，也不接受'无政府所以合作不可能'。","wrong":"典型错误是把合作理解成'大家目标一致、自然走到一起'。导师可追问：如果利益天然一致，还需要世贸组织这样的机制吗？机制在利益一致时更有用，还是在有分歧但可协调时更有用？","followup":"开放的国际经济环境为和平提供激励，但基欧汉为什么拒绝说它'确保'和平？","src":"Keohane, 1989.pdf","kw":["政府","制度","基欧汉","行为体","利益","接受","合作","政策"]},{"q":"手机市场里厂商再多，真正说了算的只有几家巨头；巨头的名单会变，'少数几家主导'的格局却很稳定。沃尔兹用三个要素来定义体系的'结构'，并据此解释国际政治里均势为何反复出现。这三个要素是什么？在国际体系里，真正起变化的是哪一个？","level":2,"hint":"三要素是：排序方式、单元之间有没有分工、实力怎么分布。逐一套到国际体系：有中央政府吗？国家之间有'你造芯片我种地'式的分工吗？排除之后，还剩下哪个变量？","ref":"三要素是排序原则、单元的功能分化、能力在单元间的分配。国际体系以无政府为排序原则；国家是'同类单元'，都要自己保生存，功能上相互复制，第二项近乎常数；于是结构变化只能来自第三项——能力即'极'的分配，如两极变多极。结构通过竞争与社会化约束单元：落后者被淘汰或被迫效仿，单元彼此模仿而趋同，制衡行为反复出现，所以'均势一旦被打破，总会以某种方式重建'。","wrong":"常见错误是把'国家间关系好坏、结盟与否'当作结构要素。导师可追问：沃尔兹为什么坚持把单元的属性与互动从结构定义里剔除？缓和或结盟属于结构变化，还是单元层面的变化？","followup":"既然结构只看能力分配，意识形态对立的两国与友好的两国在结构分析里有区别吗？这暴露了理论的什么盲点？","src":"Waltz, 1979.pdf","kw":["政府","均势","国际体系","社会化","约束","结构","竞争","能力"]},{"q":"关于'多少钱才够安全'，一种说法是越多越好，另一种说法是够用就行、树大招风。结构现实主义内部对'国家该追求多少权力'也有一模一样的争论：进攻性与防御性现实主义共享同一套假设，结论却相反。分歧的机制到底在哪里？","level":2,"hint":"双方分歧不在前提，而在对'体系反馈'的判断：如果你拼命扩张，其他国家会纷纷抱团对付你，还是会被你吓住？俾斯麦与威廉二世、希特勒的不同结局，各被哪一派当作证据？","ref":"分歧在于对体系反馈机制的判断。进攻性现实主义认为意图不可确知、他国能力可变，最安全的策略是最大化权力、争当地区霸权并阻止他国霸权；防御性现实主义认为追求霸权会招来制衡联盟、甚至自取灭亡，适度权力即可保障生存，安全竞争因此较温和。所以这不是'好战与和平'之争，而是对'更多权力是否更安全'的结构性判断之争。","wrong":"常见错误是把两派分歧说成'人性观不同'或'好战与爱好和平'。导师可追问：双方都承认无政府与生存目标，为什么对同一案例（如中国崛起）预测相反？这与摩根索用权力欲解释一切有何本质区别？","followup":"用两派立场分别预测中国的行为，哪一种更接近你观察到的现实？你的证据是什么？","src":"Mearsheimer, 2013.pdf","kw":["进攻性现实主义","防御性现实主义","权力","地区霸权","结构","体系","机制","安全"]},{"q":"一个班的班规是强势班主任定的。班主任调走了，班规是不是立刻作废？未必——大家可能发现按规矩办事更省事。基欧汉用同样的逻辑追问：美国霸权衰落后，它主导建立的国际机制还能维持合作吗？他靠什么机制解释'霸权之后的合作'？","level":2,"hint":"关键在科斯定理：没有权威时，谈判达成交易需要哪些条件（权责明确、信息充分、成本低）？国际机制恰好批量提供这些条件，所以机制一旦建立就有'惯性'。","ref":"基欧汉借科斯定理说明：缺乏中央权威时，只要权责明确、信息充分、交易成本低，行为体仍可通过谈判达成合作；国际机制的功能正是降低交易成本、提供相对对称的信息、建立法律责任模式并构造议题联结，使违背规则的代价上升。霸权对机制的创建重要，但机制一旦建立便产生惯性，使基于互补利益的合作在霸权衰落后延续。20世纪70年代霸权衰落中合作努力持续，证伪了'霸权衰落即合作终结'的天真命题。","wrong":"常见错误是答成'相互依赖自动产生合作'，把基欧汉说成天真的相互依赖论者。导师可追问：基欧汉明说相互依赖只制造政策协调的需求，需求如何变成合作？中间需要什么人为建构的东西？","followup":"现实主义者反驳说机制不过是美国权力的延伸。基欧汉的哪些证据能回应这一反驳，哪些不能？","src":"Keohane, 2019.pdf","kw":["交易成本","国际机制","中央权威","霸权衰落","基欧汉","行为体","降低交易成","利益"]},{"q":"1989年福山宣布'历史终结了'，可第二天打开新闻，战争、政变一样不少，直到今天也是如此。是新闻证明福山错了吗？先别急着下结论：福山说的'历史'和我们日常说的'发生了很多事'是同一个意思吗？他说的'终结'到底是什么终结了？","level":2,"hint":"福山用的是黑格尔—科耶夫意义上的'历史'：有方向、有终点的意识形态演化过程，而不是'事件的流水账'。再注意他自己对民族与宗教暴力的预言。","ref":"终结的是人类意识形态的演化：自由民主穷尽了可行的系统性替代方案，理念之争在原则上已经解决。这不等于事件停止——福山明说新闻版面仍会被事件填满；历史世界与后历史世界并存，民族与宗教暴力还会持续，只是不再有能与自由民主匹敌的普遍意识形态对手。所以'用某场战争反驳福山'打偏了靶子：他区分的是理念层面与物质世界两层。","wrong":"典型误读是把'历史终结'当成'从此天下太平'，再拿任何一场冲突来'打脸'。导师可追问：福山本人预言民族与宗教暴力会怎样？你的反驳击中的是他说的哪一层？","followup":"福山文末说历史终结'将非常令人伤感'——他担心哪一种人性需求从此失去出口？","src":"Fukuyama, 1989.pdf","kw":["意识形态","民主","民族","世界","持续","战争","普遍","历史"]},{"q":"'文明不同就会冲突'——如果只记住这一句，亨廷顿的论证就成了同义反复：差异存在了几千年，为什么偏偏冷战后才'冲突化'？亨廷顿其实给了六条理由，回答的正是'为什么是现在、以什么方式'。请至少复述其中四条，并说明它们之间的递进关系。","level":2,"hint":"顺着链条想：差异本身→互动变多激活了什么→现代化削弱了旧认同，谁来填补→西方正处权力顶峰，非西方如何反应→文化特征和政治立场哪个更难妥协→经济区域化按什么边界整合。","ref":"六条：①文明差异真实而根本（历史、语言、传统，尤以宗教）；②世界变小、互动增多，反而强化文明意识；③现代化剥离地方与民族国家认同，宗教常以原教旨主义形式填补真空；④西方处于权力顶峰，激发非西方'回归根源'；⑤文化特征比政治经济立场更难变通（'你是谁'无法像'你站哪边'那样选择）；⑥经济区域主义以文明为单位整合（1980—89年欧洲区域内贸易从51%升至59%）。六条从差异的存在、意识的激活、认同的来源到利益的结构，层层递进推出断层线冲突。","wrong":"典型错误是把六条压成'文明不同所以冲突'一句空话。导师可追问：差异存在了几千年，为什么偏偏在冷战后冲突化？亨廷顿用哪几条回答'为什么是现在'？","followup":"六条里哪一条最依赖'冷战结束'这个特定历史时刻？抽掉它，论证还站得住吗？","src":"Huntington, 1993.pdf","kw":["民族国家","断层线","文化","真实","权力","认同","主义","结构"]},{"q":"搬到新小区，对隔壁邻居你可以先假定'他可能是坏人，我得防着'，也可以先正常来往、看他的表现再定。温特说国家之间也是这样：'自助'（谁都防着谁）不是无政府天生注定的，而是处出来的。请重构他的论证：为什么无政府在逻辑上不必然产生自助？'掠夺者论证'又在帮谁说话？","level":3,"hint":"抓住两点：①国家初次'相遇'时没有现成的敌友观念，身份在互动中形成；②掠夺者论证说明自助可以'偶然地'产生——但'偶然产生'和'逻辑必然'是两回事，这恰恰支持温特而非反驳他。","ref":"温特指出：国家初次相遇前没有对自我与他者的既定观念，也就没有既定的安全利益，身份与利益由互动塑造，故自助不是无政府的逻辑产物。掠夺者论证承认：一个掠夺性国家可迫使一百个和平主义者转向竞争性权力政治，自助因此在因果上偶然成为制度——但这依赖掠夺者这类特定历史事件；若集体安全认同足够牢固，掠夺者的破坏也受限。无政府本身没有逻辑，'无政府是国家造就的'。","wrong":"典型误读是把温特当成'合作自动到来'的理想主义者。导师可追问：温特否认竞争性权力政治的存在吗？他攻击的是'必然性'还是'现实性'？承认掠夺者的作用是削弱还是加强他的论证？","followup":"苏联威胁消失后，北约成员国为什么没有彼此恐惧、各自扩军？这一事实更支持温特还是沃尔兹？","src":"Wendt, 1992.pdf","kw":["身份与利益","政府","自助","制度","权力","掠夺者","观念","认同"]},{"q":"想想'冰桶挑战'如何从少数人的倡议刷屏全球，再想想'公共场所禁烟'如何从激进主张变成理所当然。芬尼莫尔与西金克把这类过程总结为'规范生命周期'。请用三阶段模型解释妇女选举权规范的全球扩散：各阶段谁在推动、出于什么动机、靠什么机制？","level":3,"hint":"按表格逐格填：兴起期（企业家／理念／劝说）→瀑布期（国家与组织／合法性声誉／社会化）→内化期（法律与专业阶层／遵从／习惯）。再用1904、1928、1930这三个年份把模型落地。","ref":"兴起阶段：规范企业家（1904年成立的国际妇女选举权协会）以利他、移情、理念承诺为动机，通过劝说争取规范领导国。临界点约在1930年——从1848年塞内卡福尔斯会议起80多年仅约20国授予选举权，而临界点后20年内约48国跟进。瀑布阶段：国家、国际组织与网络以合法性、声誉、自尊为动机，经社会化与制度化扩散（1928年首个政府间机构美洲妇女委员会成立）。内化阶段：规范获得理所当然的品质——今天没人再公开辩论妇女该不该投票。","wrong":"常见错误是把扩散动力从头到尾说成'进步理念的说服'。导师可追问：瀑布阶段的国家是在被说服，还是在追求合法性与声誉？早采纳者与晚采纳者动机为何不同？这正体现作者'不同阶段由不同逻辑主导'的核心主张。","followup":"该模型能解释良性规范的扩散，那歧视性或极端主义规范是否遵循同样的生命周期？模型的盲点在哪里？","src":"Finnemore and Sikkink, 1998.pdf","kw":["规范企业家","临界点","政府","国际组织","制度","妇女选举权","社会化","动机"]},{"q":"把摩根索、沃尔兹、基欧汉、温特请进同一个讨论群，话题是'无政府下国家行为由什么决定'。他们各自会把主要原因归到哪里？排成一条线后，你能看出国际关系理论怎样的演进逻辑？再用这条线评一评：福山和亨廷顿谁的世界图景更有解释力？","level":4,"hint":"按'人性→物质结构→结构＋制度→观念结构'组织；注意每一步都不是全盘推翻前人，而是改变解释变量的层次。评价福山与亨廷顿时想想：两人的分歧其实是'世界政治的基本动力是什么'之争。","ref":"摩根索归因于人性中的权力欲；沃尔兹换成体系结构——无政府与能力分配约束出均势；基欧汉保留结构前提、加入制度变量——机制改变信息、交易成本与预期；温特更进一步：结构的意义本身由主体间知识与身份建构。演进逻辑是从单元属性到系统结构、从物质约束到制度调节再到观念建构。福山与亨廷顿之争可在此定位：建构主义者指出两人都在谈认同却对认同如何形成语焉不详；现实主义者强调权力结构约束依旧；制度主义者追问既有机制能否整合非西方崛起。两人各有局部真理，关键在认同建构与权力结构的互动。","wrong":"常见错误是把四家学说讲成'谁对谁错'的擂台赛，或用'9·11证明亨廷顿赢了'这类单一事件宣判宏大理论。导师可追问：基欧汉否认无政府吗？温特否认权力吗？若都不否认，分歧究竟是经验命题的对立，还是解释层次与本体论前提的不同？单一事件在对方框架里能否被消化？","followup":"若为这个讨论群添一位'第五人'（如女性主义或后殖民理论），它会挑战这四人共享的哪个前提？","src":"Wendt, 1992.pdf","kw":["交易成本","政府","均势","制度","权力","福山与亨廷","山与亨廷顿","摩根索"]}],"quiz":[{"type":"tf","q":"'无政府状态'在国际关系学中就是'混乱与战争不断'的同义词。","answer":false,"explain":"望文生义了。无政府只表示'没有凌驾于国家之上的中央权威'，是一种排序原则，与混乱是两回事——否则今天的世界应时刻处于战争，事实显然不是。","src":"Waltz, 1979.pdf"},{"type":"mc","q":"摩根索认为，帮助政治现实主义理解国际政治的'主要路标'是什么？","options":["普世的道德原则","以权力界定的利益","国民生产总值","国际法的约束力"],"answer":1,"explain":"六原则第二条：路标是'以权力界定的利益'。它让政治成为自主的分析领域——银行家问盈亏，政治现实主义者问政策如何影响国家权力。","src":"Morgenthau, 2019.pdf"},{"type":"tf","q":"福山说'历史终结'，意思是世界上从此不再发生战争与重大事件。","answer":false,"explain":"终结的是意识形态层面的演化（自由民主穷尽系统性替代方案），不是事件的停止。福山明说新闻仍会被事件填满，民族与宗教暴力还会持续。","src":"Fukuyama, 1989.pdf"},{"type":"mc","q":"芬尼莫尔与西金克的规范生命周期模型中，三阶段的正确顺序是：","options":["内化→规范兴起→规范瀑布","规范兴起→规范瀑布→内化","规范瀑布→临界点→规范兴起","规范兴起→内化→规范瀑布"],"answer":1,"explain":"兴起（企业家劝说）→（临界点）→瀑布（各国跟进、社会化）→内化（理所当然）。可以联想'公共场所禁烟'：少数人倡议→各国立法→理所当然。","src":"Finnemore and Sikkink, 1998.pdf"},{"type":"mc","q":"下列哪一项不在亨廷顿列举的七至八个主要文明之中？","options":["西方文明","儒家文明","斯拉夫—东正教文明","日耳曼—维京文明"],"answer":3,"explain":"原文列举：西方、儒家、日本、伊斯兰、印度教、斯拉夫—东正教、拉丁美洲，可能还有非洲文明。'日耳曼—维京文明'不在其中。","src":"Huntington, 1993.pdf"},{"type":"tf","q":"温特认为，只要体系是无政府的，国家之间就必然形成'谁都防着谁'的自助体系。","answer":false,"explain":"恰恰相反。温特论证自助是互动中建构的制度，不是无政府的逻辑必然——无政府本身没有固定剧本，'无政府是国家造就的'。","src":"Wendt, 1992.pdf"},{"type":"mc","q":"按米尔斯海默笔下进攻性现实主义的预测，崛起的中国最可能怎么做？","options":["满足于现状，不做任何战略调整","谋求亚洲地区霸权，并试图把美国军事力量挤出亚洲","立即谋求全球霸权并发动世界大战","主动放弃发展军力以换取国际信任"],"answer":1,"explain":"原文：中国将效法美国做地区霸权、推行'自己的门罗主义'；正如美国1898年确立西半球霸权后，先后击败德意志帝国、日本帝国、纳粹德国与苏联四个潜在竞争者。","src":"Mearsheimer, 2013.pdf"},{"type":"mc","q":"沃尔兹界定体系结构的三要素，不包括下列哪一项？","options":["排序原则","单元的功能分化","能力在单元间的分配","单元间的互动强度"],"answer":3,"explain":"沃尔兹坚持把单元的属性与互动从结构定义中剔除，只保留排序原则、功能分化与能力分配；互动属于单元层面。","src":"Waltz, 1979.pdf"},{"type":"sa","q":"用你自己的话解释基欧汉所说的'合作'与'和谐'的区别，并各举一个现实或国际政治中的例子。","ref":"和谐是利益天然一致、无需调整行为的状态，例如两个都重视环保的国家在减排上自发同向；合作则是原本有分歧的行为体通过谈判调整彼此政策的结果，例如各国在GATT/WTO框架下互相开放市场、解决贸易争端。制度的价值恰在分歧处体现：没有分歧就不需要机制，有分歧时才需要信息与监督来促成合作。","explain":"评分要点：定义准确（和谐=自然一致；合作=有分歧+谈判调整）；例子合理，可来自生活（如合租立规矩）或时政；能点出'制度在分歧处才有价值'。","src":"Keohane, 1989.pdf"},{"type":"sa","q":"用你自己的话解释温特'无政府是国家造就的'，并举一个现实例子说明国家间的'身份'如何改变它们对彼此军力的感受。","ref":"温特认为无政府本身不规定行为逻辑：国家初次相遇时没有既定的敌友观念，身份与利益在互动中建构，自助只是可能的制度之一。例如同为拥核国家，英国导弹与当年的苏联导弹对美国的意义完全不同；美国军力对加拿大和古巴的意义也迥异——结构位置相似，身份关系不同，威胁感就不同。","explain":"评分要点：点出'身份与利益由互动建构'；例子体现'同样的军力、不同的意义'；避免把温特读成'合作会自动到来'的理想主义者。","src":"Wendt, 1992.pdf"}],"flashcards":[{"front":"无政府状态（anarchy）","back":"不是'混乱'，而是'没有世界政府'：国际体系里没人管得着国家，与国内的等级制相对。","src":"Waltz, 1979.pdf"},{"front":"以权力界定的利益","back":"摩根索的'路标'：看政治家行为先问'这如何影响国家权力'，就像商人先问'赚不赚钱'。","src":"Morgenthau, 2019.pdf"},{"front":"审慎（prudence）","back":"摩根索眼中的政治最高美德：先掂量各方案的后果再行动，而不是拿抽象道德直接套国家行为。","src":"Morgenthau, 2019.pdf"},{"front":"均势（balance of power）","back":"强者互相提防、纷纷抱团制衡，于是'谁也别想独大'的格局一再重现——像班里几个大块头互相盯着。","src":"Waltz, 1979.pdf"},{"front":"结构三要素","back":"排序原则＋单元分工＋实力分布。国际体系前两项基本不变，'几个大国说了算'（极数）才是结构变化。","src":"Waltz, 1979.pdf"},{"front":"进攻性现实主义","back":"米尔斯海默主张：权力越多越安全，要争当地区霸权、阻止别国霸权——就像美国1898年后做的那样。","src":"Mearsheimer, 2013.pdf"},{"front":"防御性现实主义","back":"沃尔兹一脉主张：扩张过头会招来大家抱团围堵，权力'够用就行'，俾斯麦的克制是榜样。","src":"Mearsheimer, 2013.pdf"},{"front":"潜在权力（latent power）","back":"造军力的'原材料'：钱（财富）和人（人口）。不打仗也能靠经济增长悄悄变强。","src":"Mearsheimer, 2013.pdf"},{"front":"新自由制度主义","back":"基欧汉：接受'没有世界政府、国家是主角'，但制度立得好不好，实实在在影响合作还是冲突。","src":"Keohane, 1989.pdf"},{"front":"合作与和谐之别","back":"和谐＝天然合拍，不用谈；合作＝有分歧还要谈拢，像合租立规矩。制度的价值恰在有分歧处。","src":"Keohane, 1989.pdf"},{"front":"霸权稳定论","back":"老大在位秩序稳，老大衰落秩序散？基欧汉说未必——规矩一旦立起来会有'惯性'。","src":"Keohane, 2019.pdf"},{"front":"国际机制的功能","back":"降交易成本、供信息、立责任、串议题——让各国在'老大衰落'之后仍能谈成买卖。","src":"Keohane, 2019.pdf"},{"front":"'无政府是国家造就的'","back":"温特：无政府本身没有固定剧本，是战是和，取决于国家在互动中把彼此当成什么人。","src":"Wendt, 1992.pdf"},{"front":"自助是一种制度","back":"'谁都防着谁'不是天生的，是处出来的——就像邻里关系，可以处成戒备，也可以处成互助。","src":"Wendt, 1992.pdf"},{"front":"规范生命周期","back":"新规矩三步走：少数人倡议→各国跟风→理所当然。想想禁烟、禁塑令是怎么扩散开的。","src":"Finnemore and Sikkink, 1998.pdf"},{"front":"临界点（tipping point）","back":"足够多的关键国家接受后，规范像雪崩一样扩散；很多新规矩就死在这个门槛之前。","src":"Finnemore and Sikkink, 1998.pdf"},{"front":"规范企业家","back":"为理念奔走的'发起人'：借组织平台四处劝说，如1904年为妇女投票权奔走的国际协会。","src":"Finnemore and Sikkink, 1998.pdf"},{"front":"历史的终结","back":"福山：不是'从此无事发生'，而是意识形态大赛分出胜负——自由民主再无系统性对手。","src":"Fukuyama, 1989.pdf"},{"front":"争取承认的斗争","back":"人不仅要面包，还要被承认有尊严。福山认为自由民主让'人人被承认'，历史因此到头。","src":"Fukuyama, 1989.pdf"},{"front":"文明断层线","back":"不同文明的'接缝地带'。亨廷顿预言未来冲突多在这里爆发，就像地震多发生在板块边界。","src":"Huntington, 1993.pdf"}]},{"id":"ch09","folder":"11. Domestic Politics and International Relations","title":"国内政治与国际关系","subtitle":"Domestic Politics and International Relations","overview":{"theme":"为什么总统在电视上放了\"绝不退让\"的狠话，就很难再体面收场？为什么谈判代表一句\"我国会通不过\"反而可能砍下更好的条件？本章从这类日常现象入手，探讨国内政治与国际关系之间双向、交织的因果关系：国际体系如何塑造国内政治结构（\"第二意象反转\"），国内行为体、制度与信息如何反过来决定国家在国际谈判与危机中的行为。四篇经典文献共同挑战现实主义把国家视为单一行为体（unitary actor）的假定。","coreQuestions":["因果箭头是否可以反转——国际体系（战争与贸易）如何塑造国内政治制度与发展道路？","国际谈判与国内批准如何相互嵌套？\"获胜集合\"（win-set）的大小由什么决定，又如何影响谈判结果？","国内观众成本如何使国际危机中的升级成为可信信号？为什么民主国家在公开对抗中更不易退缩？","放弃单一行为体假设后，国内偏好结构、政治制度与信息分布如何决定国际合作的可能性与条件？","国内约束究竟是领导人的外交负担，还是可以被策略性利用的谈判资产？"],"thread":"本章按因果方向与理论递进组织成一个完整学习单元。起点是 Gourevitch（1978）：他反转华尔兹\"第二意象\"的因果箭头，论证国际体系（战争与贸易）本身就是国内政治结构的原因，为\"国内—国际\"研究补上被忽视的另一半。Putnam（1988）接着提出双层博弈框架：谈判者同时在国际（Level I）与国内（Level II）两张棋盘上行动，\"获胜集合\"概念把国内批准约束形式化，并揭示小获胜集合既可作谈判筹码又会增加非自愿背叛风险的悖论。Fearon（1994）把国内政治进一步博弈论化：观众成本使危机升级成为有信息量的代价信号，国内制度由此直接塑造国际危机的走向与战争风险。最后 Milner（1997）进行综合与超越：以\"多头政体\"取代单一行为体假设，用偏好、制度、信息三个变量构建可检验的合作理论，并明确指出双层博弈只是框架而非理论。四篇文献从\"反转箭头\"到\"同时博弈\"再到\"机制化、模型化\"，构成本章清晰的知识阶梯。","path":["先读 Gourevitch：从\"岛国英国与平原普鲁士为何走上不同政体道路\"这一问题进入，把握\"第二意象反转\"的问题意识与战争、贸易两条因果通道。","再读 Putnam：用\"谈完协议还要回家表决\"的日常经验理解 Level I/Level II、批准与获胜集合概念，并用1978年波恩峰会案例看双层博弈如何运作。","然后读 Fearon：从\"为什么放狠话反而更难收场\"入手，理解观众成本、消耗战模型与\"谁更可能退缩\"的比较静态结论，体会国内制度如何成为信号机制。","最后读 Milner：用偏好—制度—信息三变量框架整合前文，思考双层博弈如何发展为可检验理论。","回头比较四篇：国内约束是负担还是资产？因果箭头是单向、双向还是同时？写一段自己的综合评述。"],"dialogue":"四篇文献围绕因果方向与理论化程度展开对话。Gourevitch 批评国际关系学者只盯着国内→国际的箭头，主张反转过来研究国际体系如何塑造国内结构；Putnam 则拒绝单向争论，主张领导人\"同时\"在两个层次博弈——他在结论中明确说双层路径既不同于第二意象也不同于第二意象反转。Fearon 与现实主义传统对话：摩根索式观点认为民主的国内约束是现实政治博弈中的劣势，他却证明强大国内观众带来的承诺与信号能力恰是民主国家的战略资产，并可能缓解民主国家间的安全困境。Milner 则把前三者推进一步：她赞赏双层博弈的洞见，但直指其\"只是框架、不是理论\"，并以理性选择方法提出可检验的偏好、制度、信息假说。共同靶子是华尔兹式单一行为体假设——四篇文献从不同角度证明，打开国家这个\"黑箱\"不仅可能，而且必需。"},"readings":[{"file":"Gourevitch 1978.pdf","title":"The Second Image Reversed: The International Sources of Domestic Politics（第二意象反转：国内政治的国际根源）","authors":"Peter Gourevitch（彼得·古勒维奇）","year":"1978","venue":"International Organization, Vol. 32, No. 4, pp. 881-912","thesis":"既有文献主要研究国内结构如何影响国际政治（第二意象），却忽视了反向因果：国际体系本身——国家间权力分配（战争）与经济财富分配（贸易）——深刻塑造国内政治制度（政体类型）与联盟格局。文章进而批评\"强弱国家\"论把国内结构当作非政治的中性约束，忽视利益与执政联盟的内容；并论证相互依赖、跨国渗透并非当代新现象，宣称历史断裂的\"新时代论\"被夸大。","framework":"以国际体系为自变量、国内结构为因变量。国际经济通道评五派：①Gerschenkron 后发工业化论——越晚工业化越需国家与银行集中协调（Moore、Kurth 延伸）；②依附论（Frank、Wallerstein）——核心设定的体系压力决定边缘的发展与政体强弱；③自由发展学派——世界市场普惠，后来者终与先发国趋同；④跨国—相互依赖学派（Nye & Keohane、Morse）——相互依赖是断裂性新时代；⑤新重商主义与国家中心马克思主义（Gilpin）——\"国家消亡\"论不成立，国家保有自主回应空间。国际国家体系通道评 Hintze、Anderson 等：战争像市场一样奖惩不同的国内组织形式。","method":"理论综述与批判性文献评估，辅以欧洲近代史（15-19世纪）与1873-96年大萧条等历史例证做启发性论证，而非系统检验。","evidence":"英格兰与普鲁士对照：海峡屏障使英国免养常备陆军、改发展难以用于对内镇压的海军，走向宪政；普鲁士地处无险平原，大选帝侯建立自主筹资、不受等级会议监督的常备陆军，走向\"驻军国家\"与绝对主义。引 Hintze\"一切国家组织最初都是军事组织\"，及 Perry Anderson 对西欧（内生）/东欧（外生）绝对主义的区分；1873—96年大萧条加速英国民主化、催生法德关税壁垒与美国平民党；Gerschenkron 的英德后发工业化对照；贸易路线转移致东欧再农奴化、荷兰市场推动英国圈地；《谷物法》之争说明国际—国内之分在19世纪已无意义。","limits":"本文是评论与议程设置，未提供系统的因果机制与可检验假设；作者自承后两部分（强弱国家、相互依赖）处理得\"过于简略而试探性\"；也承认外部压力除 outright occupation（直接占领）外很难完全决定国内结果，回应方式的选择仍需国内政治解释。","quotes":[{"en":"Put more simply, political development is shaped by war and trade.","zh":"简言之，政治发展是由战争与贸易塑造的。"},{"en":"Instead of being a cause of international politics, domestic structure may be a consequence of it. International systems, too, become causes instead of consequences.","zh":"国内结构可以不是国际政治的原因，而是其结果；国际体系也可以成为原因而非结果。"},{"en":"The international system is not only a consequence of domestic politics and structures but a cause of them.","zh":"国际体系不仅是国内政治与国内结构的结果，也是它们的原因。"}]},{"file":"Putnam, 1988.pdf","title":"Diplomacy and Domestic Politics: The Logic of Two-Level Games（外交与国内政治：双层博弈的逻辑）","authors":"Robert D. Putnam（罗伯特·帕特南）","year":"1988","venue":"International Organization, Vol. 42, No. 3, pp. 427-460","thesis":"国际谈判者同时身处两盘棋局：国际谈判桌（Level I）与国内批准过程（Level II）。任何 Level I 协议必须获得 Level II 批准，由此引出\"获胜集合\"概念——能在国内获得必要多数的所有可能协议之集合。获胜集合越大协议越易达成，但较小的获胜集合反而能成为谈判筹码；集合过小则谈判破裂与\"非自愿背叛\"风险上升。","framework":"双层博弈分析框架：将谈判分解为 Level I 讨价还价与 Level II 批准两个阶段，批准只能\"整案表决、修改即视为拒绝\"。获胜集合大小由三组因素决定：①Level II 行为体的权力、偏好与联盟——\"无协议\"代价越低者越怀疑协议、集合越小，偏好同质或异质改变谈判处境；②Level II 制度——批准所需多数越大（如美参议院2/3）集合越小，政党纪律与决策者自主性则扩大之；③Level I 谈判者策略——侧支付、\"善意\"与议题关联可重塑集合。另提出回响（国际压力改变国内力量平衡）、协同议题关联（一桌的举动促成另一桌新联盟）与首席谈判者的自主偏好及否决角色。","method":"理论建构与概念分析，以1978年波恩七国峰会为引导性案例，穿插凡尔赛条约、巴拿马运河条约、东京回合、意大利—IMF谈判、1954年的里雅斯特谈判、1930年伦敦海军条约等历史例证。","evidence":"1978年波恩峰会：施密特同意追加占 GNP 1% 的财政刺激、卡特承诺1980年底前放开油价、福田承诺7%增长；德国总理府、经济部、社民党与工会的扩张派本就在国内立场上支持刺激，借国际压力克服财政部、自民党与联邦银行反对。凡尔赛条约：约80%的公众与参议员愿附保留批准，实为威尔逊本人否决（\"I shall consent to nothing\"）。巴拿马运河条约：美方以\"须获至少67名参议员支持\"压巴方让步。福克兰/马尔维纳斯谈判双方获胜集合毫无重叠，战争几乎不可避免。另有1954年的里雅斯特谈判、1974与1977年意大利—IMF谈判、东京回合等例证。","limits":"作者及后续合作者承认这只是\"有前景的分析框架\"而非可检验理论；Level I/II 的先后分解\"便于阐述但不符合实际\"（预期效应使两层次相互渗透）；获胜集合在现实中难以事先测量，谈判者常对对方 Level II 严重误判；对 Level II 之间跨国直接联系的处理被简化了。","quotes":[{"en":"The answer to that question is clearly \"Both, sometimes.\" The more interesting questions are \"When?\" and \"How?\"","zh":"那个问题（究竟是国内政治决定国际关系还是相反）的答案显然是\"两者皆是，视情况而定\"。更有趣的问题是\"何时？\"与\"如何？\"。"},{"en":"Conversely, a small domestic win-set can be a bargaining advantage: \"I'd like to accept your proposal, but I could never get it accepted at home.\"","zh":"反过来，较小的国内获胜集合可以成为谈判优势：\"我本想接受你的提议，但它在国内绝对通不过。\""},{"en":"Involuntary defection instead reflects the behavior of an agent who is unable to deliver on a promise because of failed ratification.","zh":"非自愿背叛指的是代理人因批准失败而无法兑现承诺的行为（区别于理性算计下的主动违约）。"}]},{"file":"Fearon, 1994.pdf","title":"Domestic Political Audiences and the Escalation of International Disputes（国内政治观众与国际争端的升级）","authors":"James D. Fearon（詹姆斯·费伦）","year":"1994","venue":"American Political Science Review, Vol. 88, No. 3, pp. 577-592","thesis":"国际危机被建模为一场政治\"消耗战\"：双方领导人在国内观众注视下选择攻击、退缩或升级，退缩者承受随升级递增的观众成本。均衡分析表明，观众成本使升级成为关于决心的有信息量的信号，使国家得以\"学习\"对手的真实偏好；一旦越过唯一的\"地平线\"（horizon），双方都被锁定，战争不可避免。最有力的比较静态结论是：观众成本更高的一方（如民主国家）在公开对抗中永远更不可能退缩，而军力均势与利益均势在危机开始后对谁会退缩没有直接影响。","framework":"危机谈判的代价信号理论：私有信息＋歪曲动机使\"廉价谈话\"不足为凭，只有付真实代价的信号才可信。文中先区分退缩的两类代价——就议题让步本身的代价与危机中新增、随升级递增的观众成本（只有后者传递新信息）；再把可能使升级有信息量的机制归为三类：①物质成本——动员的财政与组织负担、时间偏好；②与战争风险挂钩的成本——谢林\"留有余地的威胁\"与先发制人风险；③国内与国际观众成本——作者论证其最重要、最具危机特征。再借委托—代理逻辑说明：民主领导人作为代理人可被选民问责，观众成本更高，信号更可信，可能缓解民主国家间的安全困境。","method":"形式化博弈论：把危机形式化为带不完全信息与军事\"外部选项\"的政治消耗战，定义精炼的贝叶斯均衡，做比较静态分析；辅以历史例证说明机制。","evidence":"1914年俄国动员因增大德国先发制人动因而成为有信息量的信号；1755年纽卡斯尔公爵派两个团赴美洲，同僚认为此举\"engaged the honor of the king\"；努特卡危机中皮特借公开升级抬高议会可接受的条款；古巴导弹危机中决策者更担心对方的选择而非机械事故；索尔兹伯里、劳合·乔治、肯尼迪、老布什（\"this will not stand\"）的公开讲话可信地赌上政治前途，而希特勒、萨达姆式的狠话信号价值低；Maoz 与 Russett 统计1945年后271场民主—专制危机中62%由专制方发起，印证\"民主国家更少搞有限试探\"的预测。","limits":"作者自承模型只允许\"一方退缩\"作为和平解决方式，未纳入连续报价式讨价还价；假设仅退缩方支付观众成本；\"观众惩罚升级后退缩\"被承认是一种社会惯例而非普遍规律（小国对抗大国退缩反获赞扬的例子）；观众成本的经验可测量性后来引发大量争议（如 Schultz 等对操作化的质疑）。","quotes":[{"en":"Relative audience costs matter: the side with a stronger domestic audience (e.g., a democracy) is always less likely to back down than the side less able to generate audience costs (a nondemocracy).","zh":"起作用的是相对的观众成本：拥有更强大国内观众的一方（如民主国家）永远比难以产生观众成本的一方（非民主国家）更不可能退缩。"},{"en":"Surprisingly, in the model, neither the balance of forces nor the balance of interests has any direct effect on the probability that one side rather than the other will back down once both sides have escalated.","zh":"出人意料的是，在模型中，一旦双方都已升级，军力均势与利益均势对哪一方更可能退缩都没有直接影响。"},{"en":"I have argued that states resolve this dilemma by \"going public\"-by taking actions such as troop mobilizations and public threats that focus the attention of relevant political audiences and create costs that leaders would suffer if they backed down.","zh":"我论证国家通过\"公开化\"来化解这一困境——采取诸如动员军队、公开威胁等行动，聚焦相关政治观众的注意力，从而制造出领导人一旦退缩就须承受的成本。"}]},{"file":"Milner, 1997.pdf","title":"Interests, Institutions, and Information: Domestic Politics and International Relations, Chapter 1 \"Introduction\"（利益、制度与信息：国内政治与国际关系，第一章导论）","authors":"Helen V. Milner（海伦·米尔纳）","year":"1997","venue":"Princeton University Press（普林斯顿大学出版社专著，本章为其导论）","thesis":"现实主义把国家视为单一行为体的做法是误导：即使希特勒、斯大林、佛朗哥式的独裁者也须与内部集团分享权力，各国国内政治实为程度不一的\"多头政体\"（polyarchy）。国际合作的可能性与条件由三个国内变量决定——行为体偏好结构（谁更鸽派、偏好相距多远）、政治制度（决策权如何在行政与立法间分配）、信息分布（不完全信息增加合作失败，但知情利益集团的信号可予以缓解）。","framework":"理性选择的双层博弈理论化：以行政首脑、立法机构、利益集团为行为体，在无政府国际环境下建立简约模型；因变量是合作的概率与协议条款。三组可检验假说：①偏好——最鸽派行为体掌权时合作最可能；行政与立法偏好相距越远（政府越分裂），合作越少、条款越偏鹰派；②制度——立法权分配改变合作概率与条款，权力移向立法机构则条款更偏向它；谈判期间制度变更易引发否决；③信息——不完全信息增加合作失败且利于行政方，但立法机构若能依赖知情利益集团的背书信号，合作反而比完全信息时更可能、条款更贴近立法机构。三者共同决定国内\"多头政体\"的程度。作者明言双层博弈\"是框架而非理论\"，本书目标正是将其发展为可检验理论。","method":"理性选择建模（形式化置于附录，正文用日常语言阐述假设与结果）＋成对比较案例法：每对案例控制在同一时期、同一组国家而议题不同，以固定国际环境、分离国内变量的效应。","evidence":"八个案例（1940—1993）按成功/失败配对以固定国际环境：①第5章美英布雷顿森林货币合作（成功）对国际贸易组织ITO（失败）；②第6章美英民航与石油政策谈判；③第7章法德欧洲煤钢共同体ECSC（成功）对欧洲防务共同体EDC（失败）；④第8章NAFTA与《马斯特里赫特条约》（均成功，用以检验国际环境变化后国内变量是否仍有效）。用成对设计质问体系理论：国际环境基本不变时，何以同一对国家在一个议题上合作成功、在另一个上失败？并加入英国不参与ECSC/EDC的\"非事件\"，纠正只研究成功合作的选样偏差。","limits":"作者承认案例选择方式决定其不能构成对竞争性假说的严格检验，主要用于验证自身假说；理性选择模型结果对假设敏感，数学可能\"令人迷惑而非启发\"；分析最易适用于民主国家，对非民主国家的适用性仅被断言而未论证。","quotes":[{"en":"This book argues that domestic politics and international relations are inextricably interrelated.","zh":"本书主张：国内政治与国际关系不可分割地交织在一起。"},{"en":"Rather than the struggle for state survival taking priority, the struggle for internal power and compromise dominates foreign policy making.","zh":"占据主导的不是国家生存之争，而是内部权力与妥协之争——后者支配着对外政策的制定。"},{"en":"Information is power; hence more uncertainty means less cooperation, and it advantages the actor who has private information.","zh":"信息就是权力；因此不确定性越大，合作越少，而拥有私人信息的行为体越占优势。"}]}],"glossary":[{"en":"Second Image","zh":"第二意象","def":"华尔兹层次分析中的一层：用国家内部特征解释战争与对外政策，因果箭头从国内指向国际。","src":"Gourevitch 1978.pdf"},{"en":"Second Image Reversed","zh":"第二意象反转","def":"古勒维奇把箭头倒过来：研究国际体系（战争与贸易）如何塑造国内政治结构与发展道路。","src":"Gourevitch 1978.pdf"},{"en":"International State System","zh":"国际国家体系","def":"国家间权力分配与安全竞争的环境；它的压力像市场一样，奖励某些国内组织形式、惩罚另一些。","src":"Gourevitch 1978.pdf"},{"en":"Strong and Weak States","zh":"强弱国家论","def":"用\"国家机构扛不扛得住社会压力\"解释对外经济政策的主张；古勒维奇批评它不问谁掌权、为谁谋利，太\"非政治\"。","src":"Gourevitch 1978.pdf"},{"en":"Interdependence","zh":"相互依赖","def":"各国社会跨越国界深度挂钩的状态；古勒维奇论证它古已有之，并非当代才有的新现象。","src":"Gourevitch 1978.pdf"},{"en":"Dependencia","zh":"依附论","def":"认为资本主义核心国家的扩张造成边缘国家欠发达的学派，故把相互依赖追溯为资本主义的古老属性。","src":"Gourevitch 1978.pdf"},{"en":"Two-Level Games","zh":"双层博弈","def":"帕特南的比喻：领导人同时在\"国际谈判桌\"和\"国内批准桌\"两盘棋上下棋，哪一盘都输不起。","src":"Putnam, 1988.pdf"},{"en":"Level I / Level II","zh":"第一层次／第二层次","def":"Level I 指谈判者之间的国际讨价还价；Level II 指国内各选民集团讨论是否批准协议。","src":"Putnam, 1988.pdf"},{"en":"Win-Set","zh":"获胜集合","def":"国内整案表决时能拿到必要多数的所有国际协议的集合；集合大小决定谈判空间。","src":"Putnam, 1988.pdf"},{"en":"Ratification","zh":"批准","def":"国内认可或执行协议所需的任何正式或非正式过程（不限于国会投票）；协议只能整案表决，修改等于拒绝。","src":"Putnam, 1988.pdf"},{"en":"Involuntary Defection","zh":"非自愿背叛","def":"领导人真心想履约、却因国内批准失败而无法兑现承诺；区别于故意违约，获胜集合越小风险越大。","src":"Putnam, 1988.pdf"},{"en":"Reverberation","zh":"回响","def":"国际压力传回国内后改变国内联盟与力量对比的效应，使国内结果不再能当作既定前提。","src":"Putnam, 1988.pdf"},{"en":"Synergistic Issue Linkage","zh":"协同议题关联","def":"国际桌上的一个策略举动，在国内桌上促成意想不到的新联盟，使原本不可能的协议成为可能。","src":"Putnam, 1988.pdf"},{"en":"Audience Costs","zh":"观众成本","def":"领导人公开升级危机后又退缩，被国内观众视为外交失败而受惩罚的政治代价；升级越多，代价越大。","src":"Fearon, 1994.pdf"},{"en":"War of Attrition","zh":"消耗战","def":"比谁先从坚持中退出的博弈；费伦用它建模危机——坚持本身不付费，只有退缩方才付观众成本。","src":"Fearon, 1994.pdf"},{"en":"Costly Signaling / Cheap Talk","zh":"代价信号／廉价谈话","def":"要让对手相信，信号必须让发送者自己破费；动动嘴皮的\"廉价谈话\"谁都会说，故不足为凭。","src":"Fearon, 1994.pdf"},{"en":"Security Dilemma","zh":"安全困境","def":"一国为自保而增强军备，反被他国视为威胁而引来反制，结果更不安全；费伦认为民主国家间的可信信号可缓解之。","src":"Fearon, 1994.pdf"},{"en":"Unitary Actor Assumption","zh":"单一行为体假设","def":"把国家当作内部铁板一块的单一决策者；米尔纳论证放松它能产生新的、富有成果的解释。","src":"Milner, 1997.pdf"},{"en":"Polyarchy","zh":"多头政体","def":"行政、立法、利益集团等多方分享决策权的国内状态；米尔纳用它描述各国国内政治的常态（程度不一）。","src":"Milner, 1997.pdf"},{"en":"Structure of Domestic Preferences","zh":"国内偏好结构","def":"行政、立法、利益集团等关键行为体在某个议题上立场的相对位置与距离；随议题变化，是解释合作的核心变量。","src":"Milner, 1997.pdf"},{"en":"Hegemonic Stability Theory","zh":"霸权稳定论","def":"现实主义变体：权力集中于一个霸权国时，国际经济更稳定开放、合作更可能；米尔纳将其列为竞争性解释。","src":"Milner, 1997.pdf"}],"socratic":[{"q":"假设学生会派你代表全校去和校方谈\"宿舍熄灯时间\"，谈好的方案还得拿回全校公投通过才能生效。谈判时你会多出哪些顾虑？——国家领导人进行国际谈判时，处境和你有什么相似之处？","level":1,"hint":"先想两个具体场景：你在桌上答应的条件，带回去被同学否决了会怎样？反过来，你能不能利用\"同学们很挑剔\"这一点向校方压价？帕特南（Putnam）把领导人的这种处境称为\"双层博弈\"。","ref":"相似之处正是帕特南\"双层博弈\"的核心：领导人同时在两张桌上博弈——Level I 是与他国谈判者的国际讨价还价，Level II 是国内选民集团对协议的批准讨论；任何 Level I 协议都须拿回 Level II 整案表决才能生效。领导人不能只盯着对手，还须时刻掂量\"国内能通过什么\"——能在国内获得必要多数的所有协议的集合，就叫\"获胜集合\"（win-set）。你对公投的顾虑就是其日常版。","wrong":"初学者常答\"领导人签了字就算数\"。导师可追问：威尔逊总统签了凡尔赛条约，美国为什么最后没有加入国联？（提示：想想参议院的角色）——可见签字只是 Level I 结束，Level II 的批准才是终点。","followup":"如果公投规则从简单多数改成三分之二多数才算通过，你的谈判空间会变大还是变小？","src":"Putnam, 1988.pdf","kw":["获胜集合","双层博弈","批准","谈判者","领导人","帕特南","国内","国际"]},{"q":"某次劳资谈判中，工会主席对会员直播喊话：\"不涨薪10%我们绝不复工！\"结果资方只肯涨6%，主席反而下不来台了。政治人物明知\"放狠话\"可能让自己难收场，为什么还偏偏要在公开场合放？费伦（Fearon）说，这恰恰是他们故意的。","level":1,"hint":"比较两种结局：悄悄谈成6%，没人说什么；当众喊过\"绝不\"再接受6%，会员会怎么看主席？——\"狠话\"改变了主席自己退缩的代价。费伦把这种代价叫\"观众成本\"。再想一层：为什么一个理性的人会故意抬高自己退缩的代价？","ref":"因为私下声明是\"廉价谈话\"，对手无法判断你是真决心还是虚张声势。公开化（动员、公开威胁）把国内观众的注意力聚焦到危机上：一旦退缩，领导人将被观众视为外交失败而受惩罚——这就是观众成本，且随升级递增。故意抬高自己的退缩代价，等于向对方发出有代价的信号：\"我连退路都烧了，你说我是不是认真的？\"这正是费伦所说的\"公开化\"（going public）逻辑——国家借此让对手相信自己宁战不让。","wrong":"常见错误是答\"放狠话只是为了面子和鼓舞士气\"。导师可追问：如果只是面子，对手为什么要在乎？——只有当狠话让说话者自己付出代价、让低决心者不敢模仿时，它才传递了信息。单纯的面子论解释不了信号的可信性。","followup":"如果一国观众根本不关心外交（比如社会高度封闭），这套信号机制还管用吗？","src":"Fearon, 1994.pdf","kw":["观众成本","廉价谈话","领导人","国内","危机","升级","代价","信号"]},{"q":"买二手车时，你故意对卖家说：\"我老婆只批了一万块预算，多一分她都不签字。\"——为什么这种\"自曝家底式示弱\"反而可能帮你砍下价来？用帕特南的术语说，你在利用什么？","level":1,"hint":"谢林早就指出：谈判者的力量有时恰恰在于\"明显无法让步\"。站在卖家立场想：如果他真的相信你无权超过一万，他只剩两个选择——接受一万，或者谈崩。帕特南把\"国内能批准的协议集合\"叫获胜集合，你刚才的做法等于故意把它说成什么样？","ref":"你在利用\"较小的获胜集合\"作为谈判筹码。帕特南指出：被感知到的获胜集合越大，谈判者越容易被对方压价；反过来，较小的国内获胜集合可以成为谈判优势——\"我本想接受你的提议，但它在国内绝对通不过。\"对方若还想成交，只能向你靠拢。实例：巴拿马运河条约谈判中，美方多次警告巴方\"新条约必须得到至少67名参议员支持\"，以此拒绝进一步让步。当然这是双刃剑：集合缩到与对方毫无重叠时，谈判就会破裂。","wrong":"学生常答\"示弱就是吃亏，应该表现得财大气粗\"。导师可追问：财大气粗时，卖家会怎么要价？——你的预算空间越大，对方越敢往高处咬。\"能被说服\"恰恰是会被利用的弱点，\"无法被说服\"反而成了力量。","followup":"如果对方识破了你的\"一万块\"其实是装出来的，这个策略还成立吗？","src":"Putnam, 1988.pdf","kw":["获胜集合","谈判者","帕特南","国内","谈判筹码","条约","支持","集合越"]},{"q":"打开欧洲地图：英国是岛国，普鲁士（后来德国的核心）地处无险可守的平原。古勒维奇（Gourevitch）认为，这个地理差异经过一系列中间环节，最终把两国推向不同的政体道路。请先凭常识猜一猜这条因果链，再对照精读卡检验。","level":1,"hint":"链条的起点是\"面临的入侵威胁不同\"，终点是\"宪政 vs 绝对主义\"。中间要经过一个关键变量：国家被迫建立什么样的军事组织？再想想：海军和陆军，哪一个更适合用来对内镇压老百姓？","ref":"机制链条是：英吉利海峡大幅降低入侵风险→英国无需供养大规模常备陆军→转而发展海军，而海军难以用于对内镇压→军事机器对宪政发展的压力小→自由的宪政秩序得以生长。普鲁士相反：平原无险、战争威胁持续→大选帝侯建立自主筹资、不受等级会议监督的常备陆军→军队与王权主导国家组织→走向\"驻军国家\"与绝对主义。古勒维奇借此说明：国际安全环境像市场一样奖惩不同的国内组织形式，从而塑造国内政治发展。","wrong":"常见答法是\"岛国天然民主\"式的地理决定论。导师可追问：地理本身会投票、会立法吗？——它必须通过\"军事组织形式\"这一中介变量才起作用；如果海军也能高效镇压内乱，这个论证还成立吗？","followup":"Perry Anderson 说东欧绝对主义是\"外生\"的、西欧是\"内生\"的，这与古勒维奇的论证如何呼应？","src":"Gourevitch 1978.pdf","kw":["国内政治","国际","主义","组织","战争","风险","发展","常备陆军"]},{"q":"1978年波恩峰会上，德国总理施密特公开扮演\"被迫让步\"的角色，同意追加财政刺激。但他的亲信透露，总理其实是\"让自己被推了一把\"。请用双层博弈的逻辑解释：他为什么要演这出戏？","level":2,"hint":"先查精读卡：德国政府内部谁支持刺激、谁反对？（总理府、经济部、社民党、工会 vs 财政部、自民党、联邦银行）再想想\"回响\"（reverberation）——国际压力传回国内后会改变什么？1980年德国要举行大选，这个背景对哪一派有利？","ref":"施密特政府内部的扩张派（总理府、经济部、社民党、工会）本就在国内立场上认为刺激政策有利，尤其1980年大选临近，却无力克服财政部、自民党与联邦银行的反对。国际压力恰好给了他们杠杆：\"不是我要刺激，是国际社会要求我们\"——这就是\"回响\"：国际压力改变国内力量平衡，使原本被卡住的少数派政策得以通过。所以波恩协议并非\"美国施压、德国让步\"，而是各国政府内有实权的少数派借国际谈判桌办成自己在国内办不成的事。","wrong":"学生常按现实主义叙述答成\"德国被美国压服了\"。导师可追问：如果是被迫让步，如何解释协议几乎全部被落实？被迫的一方通常阳奉阴违——谁在国内暗中获益并推动落实？","followup":"这个案例中\"国际要求的政策\"与\"国内想要却办不到的政策\"重合，这对\"国家自主性\"的讨论有何启示？","src":"Putnam, 1988.pdf","kw":["政府","回响","内部","国际压力","谈判","国内","协议","改变"]},{"q":"提起希特勒、斯大林，很多人会说\"独裁者当然一个人说了算\"。米尔纳（Milner）却连这种最极端的例子都不放过，论证他们也无法独断。她凭什么这么说？这个论证动摇了国际关系理论里的哪个基本假设？","level":2,"hint":"想想：独裁者靠谁抓军队、靠谁管经济、靠谁执行命令？这些人如果集体不配合，他还独裁得起来吗？米尔纳把\"决策权由多方分享\"的状态叫\"多头政体\"（polyarchy），并认为它才是各国国内政治的常态。","ref":"米尔纳指出，即使希特勒、斯大林、佛朗哥也依赖军方、寡头、大企业或政党的支持才能执政：史学研究把希特勒政权描述为至少四个权力中心相互竞争的\"多元统治\"；斯大林的决策受制于内部派系斗争；佛朗哥因民族主义联盟构成复杂而只能搞\"有限多元\"。这些集团实际分享议程设置与否决权。因此\"国家是单一行为体\"这一现实主义假设是误导：各国国内政治都是程度不一的多头政体，占据主导的不是国家生存之争，而是内部权力与妥协之争。","wrong":"学生常答\"独裁体制是例外，民主国家才有多头政治\"。导师可追问：军队不执行命令的独裁者还是独裁者吗？——权力永远需要代理人执行，有代理人就有权力分享；差别只在程度，不在有无。","followup":"米尔纳用哪三个变量来刻画一个国家\"多头\"的程度？","src":"Milner, 1997.pdf","kw":["民族主义","多头政体","内部","权力","国内政治","单一行为体","米尔纳","集团"]},{"q":"费伦模型有个反直觉结论：军力较弱或利益较小的一方，一旦危机进入公开对抗，并不比对手更容易退缩。请先凭常识判断\"你觉得谁该先眨眼\"，再解释为什么模型不支持这个常识。","level":2,"hint":"关键在于\"自我选择\"：危机公开化之前，双方已经掂量过彼此的军力和利益。一个明知自己又弱又不占理的国家，通常会怎么做？（一开始就悄悄让步）它要是偏不、反而公开对抗——这个动作本身告诉了对手什么？","ref":"常识（George & Smoke、Jervis 等）认为军力弱或利益小的一方更可能退缩。费伦指出这漏掉了选择效应：理性国家会依据可观察的军力与利益事先筛选——弱势方通常在危机前就悄悄让步；若它仍选择升级进入公开对抗，这一行为本身就发出信号，表明它比原先预期的更有决心。于是事前指标对\"升级后谁退缩\"不再有直接影响，决定退缩概率的是相对观众成本。费伦反讽：若该常识成立，理性国家之间根本不会发生危机。","wrong":"学生常答\"军力当然重要，弱国必退\"。导师可追问：如果弱国必退、双方又都理性，强国还需要走到公开危机这一步吗？弱国为什么不一开始就让步？——能被观察到的危机，已经是被筛选过的非随机样本。","followup":"这个\"自我选择\"逻辑对用历史危机数据做实证研究的学者意味着什么方法论警示？","src":"Fearon, 1994.pdf","kw":["观众成本","决定","危机","升级","信号","理性","选择","决心"]},{"q":"直觉上，国会掌握的信息越充分，应该越容易批准对国家有利的协议。米尔纳却得出一个\"中间状态最优\"的反直觉结论：国会不完全知情、但能获得知情利益集团背书时，合作反而比完全信息时更容易达成。请解释这个机制。","level":3,"hint":"站在不知情国会的立场：行政首脑谈回的协议里可能塞了偏向她的条款，国会无法分辨，最保险的选择是什么？（否决）再引入一个变量：如果有了解内情的利益集团愿意公开为协议\"站台\"，国会还怕吗？利益集团为什么愿意免费当\"信息员\"？","ref":"完全信息时各方知根知底；纯不对称信息时，国会担心行政首脑塞进偏离条款而更常否决——不确定性增加合作失败，且利于掌握私人信息的行政方。但米尔纳允许中间状态：国会可依赖知情利益集团的信号——集团为影响政策自愿提供低成本信息，只要至少一个知情集团背书，国会就愿意批准，合作概率甚至高于完全信息情形，条款也更贴近国会偏好，行政的信息优势被抵消。利益集团由此获得\"信息提供者\"这一新角色。","wrong":"学生常死记\"信息越多合作越多\"的线性结论。导师可追问：信息分布其实有三种状态（完全／纯不对称／有信号者），哪种对合作最有利？为什么\"半知情＋可信信号\"能同时克服效率损失与行政优势？","followup":"利益集团的信号要可信需要满足什么条件？如果它和行政首脑串通，机制还成立吗？","src":"Milner, 1997.pdf","kw":["批准","利益集团","米尔纳","完全信息","信号","偏好","合作","否决"]},{"q":"费伦证明危机存在一个唯一的\"地平线\"（horizon）：一旦升级越过它，双方宁可开战也不会退缩，而且彼此都知道这一点。请解释地平线是怎么\"长出来\"的——为什么两个都不想打仗的理性领导人，会被一步步锁进战争？","level":3,"hint":"把危机想成一场\"比谁胆小\"的消耗战：退缩要付观众成本，且越晚退缩越贵。低决心的人会怎样？（越来越倾向先撤）于是坚持得越久的人，在对手眼里越像哪种人？当双方都认定\"对方已不可能退缩\"时，继续等待还有什么意义？","ref":"军事\"外部选项\"（可随时攻击）与递增的观众成本共同制造了锁定：随着升级，低决心类型越来越倾向于先行退缩止损，坚持者就越来越可能是高决心类型——双方不断上调对对手决心的估计。模型证明危机总有唯一的地平线：一个升级水平，达到后双方都已确定被锁定，此时退缩的代价高于战争，攻击成为理性选择。地平线之前，对\"对手可能被锁定\"的恐惧促使双方寻求和解；观众成本率越高，传递同等信息所需的升级越少，地平线来得越早。","wrong":"常见错误是把地平线当成双方\"约好\"或外部强加的截止期限。导师可追问：模型里没有任何人设定时间表——它是双方策略互动的内生结果。是什么让\"继续等下去\"最终变成一个不
