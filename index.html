再值得的选择？","followup":"如果提高双方的观众成本率，地平线会来得更早还是更晚？这对\"民主国家间危机更短\"的预测意味着什么？","src":"Fearon, 1994.pdf","kw":["观众成本","地平线","信息","危机","共同","战争","升级","代价"]},{"q":"现实主义（如摩根索）认为，民主国家的国内约束使其在现实政治博弈中处于劣势。费伦、帕特南、米尔纳却都在某种意义上证明\"约束可以是资产\"。请分别说明三人的论证，并指出：约束在什么条件下会从资产反转成负担？","level":4,"hint":"三人说的\"资产\"机制不同：费伦讲信号可信度，帕特南讲谈判筹码，米尔纳讲条款塑造。再想三个\"临界点\"：费伦的地平线、帕特南\"集合缩到与对方毫无重叠\"、米尔纳的政府分裂与信息不对称——越过临界点会发生什么？","ref":"费伦：高观众成本使信号更可信、承诺更有效——约束是信号资产，但代价是危机可能越过地平线锁定为战争。帕特南：小 win-set 是\"我国内通不过\"的筹码，但集合过小则破裂与非自愿背叛风险上升——\"甜酸\"资产。米尔纳：立法否决权等约束可把条款拉向有利于己，但政府分裂与信息不对称也使合作更易失败。三者不矛盾：共享\"约束的价值是条件性的\"这一命题，分歧只在条件的内容，共同反驳现实主义\"国内约束即劣势\"论。","wrong":"学生常给单向答案\"约束是资产（或负担）\"并引一篇为据。导师可追问：费伦的地平线、帕特南的 Y3、米尔纳的分裂政府分别提醒我们什么？能否构造一个三篇都会预测\"约束有害\"的情形？（提示：观众成本极高＋集合无重叠＋政府分裂）","followup":"由此回看摩根索\"民主国家在现实政治博弈中处于劣势\"的论断：它在哪些条件下仍可能成立？","src":"Fearon, 1994.pdf","kw":["非自愿背叛","观众成本","政府","帕特南","米尔纳","地平线","国内","信息"]}],"quiz":[{"type":"mc","q":"帕特南所说的 Level I 与 Level II 分别指什么？","options":["谈判者之间的国际讨价还价；国内选民集团内部关于是否批准协议的讨论","中央政府与地方政府两个行政层级","行政部门与立法部门的日常分工","战争与贸易两条国际影响通道"],"answer":0,"explain":"Level I 是国际谈判桌，Level II 是国内批准桌：任何 Level I 达成的协议都须经 Level II 整案表决通过才生效。记住\"两张棋桌\"的比喻即可——领导人在国际桌谈完，还得回家过批准关。","src":"Putnam, 1988.pdf"},{"type":"mc","q":"按帕特南的定义，\"获胜集合\"（win-set）是指：","options":["对某 Level II 选民集团而言，付诸简单赞成/反对表决时能赢得必要多数的所有 Level I 协议的集合","谈判者在 Level I 上愿意接受的所有协议的范围","国际体系中所有可能实现的双赢协议","国内所有支持国际合作的政党组成的联盟"],"answer":0,"explain":"win-set 属于 Level II 选民集团而非谈判者（模型先假设谈判者无独立偏好），且以\"整案表决能获得必要多数\"为判定标准；它不是\"双赢协议\"的泛称，也不是政治联盟。","src":"Putnam, 1988.pdf"},{"type":"tf","q":"\"观众成本\"是领导人在危机中公开升级后又退缩时，因国内观众视其为外交失败而施加的、随升级程度递增的政治代价。","answer":true,"explain":"正确。观众成本有两个要点：一是\"递增\"——升级越多、退缩越贵；二是\"新增\"——它区别于\"就议题让步本身的代价\"（那个代价何时让步都一样）。正因如此，只有观众成本能传递关于国家决心的新信息。","src":"Fearon, 1994.pdf"},{"type":"mc","q":"古勒维奇的\"第二意象反转\"，反转的是哪条因果箭头？","options":["由\"国际体系塑造国内结构\"反转为\"国内结构塑造国际体系\"","由\"国内结构解释国际政治\"反转为\"国际体系（战争与贸易）塑造国内政治发展\"","由\"国家中心\"反转为\"社会中心\"","由\"经济决定政治\"反转为\"政治决定经济\""],"answer":1,"explain":"华尔兹式\"第二意象\"用国家内部属性解释国际结果（国内→国际）；古勒维奇把箭头倒过来：国内结构可以不是国际政治的原因，而是其结果——国际体系（战争与贸易）也是国内政治发展的原因。注意他并不否认国内影响国际，而是补上被忽视的另一半。","src":"Gourevitch 1978.pdf"},{"type":"mc","q":"费伦（1994）模型中最有力、最反直觉的比较静态结论是：","options":["军力较弱的一方总是最先退缩","观众成本更高的一方（如民主国家）在公开对抗中永远更不可能退缩","利益攸关较小的一方更可能把危机升级到战争","危机升级时间越长，双方越可能达成和解"],"answer":1,"explain":"模型的核心发现是相对观众成本决定退缩概率：观众成本越高，升级信号越可信、退缩代价越大，故民主国家更不易退缩；军力与利益均势在危机开始后无直接影响（A错），且随升级双方退缩概率递减（D错）。","src":"Fearon, 1994.pdf"},{"type":"mc","q":"米尔纳用以解释国际合作概率与条款的三个核心自变量是：","options":["国家实力、霸权兴衰、国际制度","相对收益、绝对收益、交易成本","国内行为体偏好结构、国内政治制度、信息在国内的分布","观众成本、获胜集合、议题关联"],"answer":2,"explain":"米尔纳以偏好（谁掌权、偏好间距）、制度（决策权分配）、信息（完全/不对称/有信号者）三个国内变量构建可检验假说；A 是现实主义体系变量，B 是新自由制度主义与现实主义之争，D 是帕特南与费伦的概念。","src":"Milner, 1997.pdf"},{"type":"tf","q":"在帕特南的分析中，一国获胜集合越大，其谈判者在 Level I 上越不容易被对方\"摆布\"（pushed around）。","answer":false,"explain":"恰恰相反：被感知到的获胜集合越大，谈判者越容易被对方压价；较小的获胜集合才是谈判优势（\"国内通不过\"），但过小则导致僵局。这是 win-set 大小的\"甜酸\"两面。","src":"Putnam, 1988.pdf"},{"type":"tf","q":"米尔纳认为不完全信息在国内总是降低国际合作的可能性，信息越充分合作就越多。","answer":false,"explain":"错误。不对称信息确实增加否决与合作失败，但当立法机构能依赖知情利益集团的背书信号时，合作反而比完全信息情形更可能，且条款更贴近立法机构偏好——信息分布的\"中间状态\"对合作最有利。","src":"Milner, 1997.pdf"},{"type":"sa","q":"请用自己的话解释\"观众成本\"，并举一个现实例子（可以来自国际新闻，也可以来自日常生活）。","ref":"观众成本指：领导人在危机中公开升级（如电视讲话放狠话、动员军队）后若退缩，会因国内观众视其为外交失败而受惩罚，且代价随升级递增。关键在\"公开\"与\"递增\"：悄悄让步无人追究，大张旗鼓后再让步就下不来台。例子：某国总统在记者会上宣布\"绝不让步\"，几天后若接受对方条件，反对党与选民必然群起攻击，代价远大于一开始就私下妥协；日常版如家长当众宣布\"这次绝不给你买\"，再心软就被全家看作没原则。","explain":"评分要点：(1) 说清\"公开升级后退缩才被罚\"与\"随升级递增\"两个特征；(2) 例子须体现\"公开表态抬高了自己退缩的代价\"；(3) 能进一步指出这使信号更可信（低决心者不敢模仿）者为优。","src":"Fearon, 1994.pdf"},{"type":"sa","q":"帕特南说较小的获胜集合既是谈判资产又是谈判风险。请用自己的话解释这对\"甜酸\"两面，并各举一个例子（可用文中案例，也可用现实类比）。","ref":"甜：小 win-set 意味着\"我本想答应，但国内通不过\"，对方想成交只能向你靠拢——国内弱点成了外交筹码，如巴拿马运河条约谈判中美方以\"须获至少67名参议员支持\"为由拒绝再让步。酸：集合越小，双方集合不重叠、谈判破裂和\"非自愿背叛\"（想履约却被国内否决）的风险越大——福克兰/马尔维纳斯谈判中双方获胜集合毫无重叠，战争几乎不可避免。故 win-set 大小的效应不是单调的：适度小是资产，过小成灾难。","explain":"评分要点：(1) 资产面＝以国内约束为筹码让对方靠拢（可引谢林\"明显无法让步的力量\"）；(2) 风险面＝集合不重叠→僵局、破裂或非自愿背叛；(3) 例子具体、与机制对应。","src":"Putnam, 1988.pdf"}],"flashcards":[{"front":"第二意象反转","back":"把\"国内影响国际\"的箭头倒过来：问国际体系（战争与贸易）如何塑造国内政治。例：岛国英国免养陆军，走上宪政之路。","src":"Gourevitch 1978.pdf"},{"front":"战争与贸易","back":"古勒维奇概括的国际体系影响国内政治的两条通道：国家间权力分配（战争/安全）与财富分配（贸易/市场）。","src":"Gourevitch 1978.pdf"},{"front":"驻军国家（garrison state）","back":"普鲁士模式的绰号：常备陆军自主筹资、不受议会监督，军队与王权压倒一切，民主难以生长。","src":"Gourevitch 1978.pdf"},{"front":"强弱国家论及其批评","back":"用\"国家扛不扛得住社会压力\"解释对外经济政策；古勒维奇批评它不问谁掌权、为谁谋利，太\"非政治\"。","src":"Gourevitch 1978.pdf"},{"front":"相互依赖是古老现实","back":"古勒维奇：跨国渗透与国际—国内纠缠16世纪就有，\"如今全新\"的说法被夸大，该争的是情形差异而非新旧之别。","src":"Gourevitch 1978.pdf"},{"front":"双层博弈","back":"帕特南的比喻：领导人同时在\"国际谈判桌\"与\"国内批准桌\"两盘棋上下棋，哪一盘都输不起。","src":"Putnam, 1988.pdf"},{"front":"获胜集合（win-set）","back":"国内整案表决能拿到必要多数的所有国际协议的集合；越大越易成交，但越小越能当筹码，过小则谈崩。","src":"Putnam, 1988.pdf"},{"front":"win-set 的三组决定因素","back":"①国内行为体的权力、偏好与联盟；②批准制度（如需几分之几多数）；③谈判者策略（侧支付、议题关联）。","src":"Putnam, 1988.pdf"},{"front":"非自愿背叛","back":"领导人真心想履约，却因国内批准失败而无法兑现——不是存心违约。例：总统签了协议，国会不批。","src":"Putnam, 1988.pdf"},{"front":"回响（reverberation）","back":"国际压力传回国内、改变国内力量对比的效应。例：德国扩张派借波恩峰会压力，推动了原本通不过的刺激政策。","src":"Putnam, 1988.pdf"},{"front":"协同议题关联","back":"国际桌上的一个动作在国内桌上促成意外的新联盟，使原本不可能的协议成为可能。例：波恩一揽子交易。","src":"Putnam, 1988.pdf"},{"front":"首席谈判者的否决角色","back":"谈判者不是\"诚实掮客\"：他有自己的偏好与联盟投资，可否决本可批准的协议。例：凡尔赛条约实为威尔逊本人所否。","src":"Putnam, 1988.pdf"},{"front":"观众成本","back":"公开升级危机后又退缩，被国内观众惩罚的代价，且升级越多代价越大。例：电视上放了狠话就很难再软下来。","src":"Fearon, 1994.pdf"},{"front":"政治消耗战","back":"费伦对危机的建模：双方比谁先撑不住；与经典消耗战不同，坚持不花钱，只有退缩方才付观众成本。","src":"Fearon, 1994.pdf"},{"front":"地平线（horizon）","back":"危机中唯一的升级临界点：越过它双方宁可开战也不退缩，且彼此心知肚明，战争由此\"不可避免\"。","src":"Fearon, 1994.pdf"},{"front":"代价信号 vs 廉价谈话","back":"要让对手信你，信号必须让你自己破费；空口白话谁都能说，故不足为凭。例：放狠话＋电视直播＝烧掉退路。","src":"Fearon, 1994.pdf"},{"front":"民主国家的信号优势","back":"民主领导人怕被选民惩罚，公开表态更可信、更少虚张声势搞\"有限试探\"，可能缓解民主国家间的安全困境。","src":"Fearon, 1994.pdf"},{"front":"单一行为体假设","back":"把国家当作铁板一块的决策者。米尔纳反驳：连希特勒、斯大林都得靠内部集团捧场，没人真能说一不二。","src":"Milner, 1997.pdf"},{"front":"多头政体（polyarchy）","back":"米尔纳的核心概念：决策权由行政、立法、利益集团等多方分享的国内状态；偏好越分歧、信息占有越平均、制度越分权，\"多头\"程度越高。","src":"Milner, 1997.pdf"},{"front":"利益与政策偏好的区分","back":"利益是不变的基本目标（商人求财、政客求连任）；政策偏好是由利益派生、随议题变化的具体立场。前者是根，后者是叶。","src":"Milner, 1997.pdf"},{"front":"成对案例比较法","back":"米尔纳的设计：同一对国家、同一时期、不同议题的成功与失败案例配对，固定国际环境以凸显国内变量的作用。","src":"Milner, 1997.pdf"}]},{"id":"ch10","folder":"12. Selected Research Methods","title":"政治学研究方法选讲","subtitle":"Selected Research Methods","overview":{"theme":"为什么有的药吃了'感觉有效'却证明不了有效？为什么民调有时在大选前翻车？为什么记者追问一个市长比发一万份问卷更能讲清一件事？本章从这些日常疑问出发，走进政治学研究中最核心的几种经验方法：实验、抽样调查、调查实验与深度访谈、个案研究。六篇文献共同回答一个问题——面对一个政治学问题，研究者应当选择何种方法，以及每种方法在因果推断与外部效度之间付出了怎样的代价。","coreQuestions":["为什么实验被视为因果推断的基准方法？经典实验设计由哪些要素构成，其效度受到哪些威胁？","抽样调查如何从样本推论总体？1936年《文学文摘》的惨败揭示了什么样的方法论教训？","调查实验如何把实验逻辑嵌入大规模问卷调查？操纵性、许可性、促成性三种设计的区别何在？","小插图（vignette）实验为何适合研究种族等敏感议题？它的优势与陷阱分别是什么？","深度访谈与个案研究放弃了什么、又换回了什么？'分析性概括'与'统计概括'的分歧意味着什么？"],"thread":"本章构成一条从'控制的逻辑'到'情境的逻辑'的学习主线。Babbie首先给出因果推断的基准模型——经典实验及其效度威胁清单；Burnham等转向政治学研究最常用的工具——抽样调查与民意测验，展示从样本推论总体的条件与陷阱；Sniderman以自述方式讲述二者如何融合为调查实验，并按'倾向'的角色区分出三种设计逻辑；Mutz进一步落到调查实验中最常用的小插图处理，展示其在敏感议题上的威力与'个体判断≠集体判断'的陷阱；Gray等则走向谱系另一端，论证深度访谈以牺牲概括性与信度换取效度与丰富性；Yin最后为个案研究正名，提出'分析性概括'这一与抽样逻辑平行的概括逻辑。六种文献拼合成一张完整的'方法选择地图'。","path":["第一步：读Babbie第8章，掌握经典实验的构成要素与内外部效度威胁，建立因果推断的基准框架——先想清楚'一款保健品宣称有效，要怎样设计实验才能证明'。","第二步：读Burnham等第4章，理解抽样调查的逻辑、随机与非随机抽样的差别及《文学文摘》的教训。","第三步：读Sniderman，看实验逻辑如何被嵌入问卷调查，区分三种调查实验设计及其检验的假设。","第四步：读Mutz，通过小插图实验的具体案例理解调查实验的操作细节、优势与解释陷阱。","第五步：对照读Gray等与Yin，思考质性方法（深度访谈、个案研究）如何以不同逻辑回应'概括何以可能'这一共同难题。"],"dialogue":"六篇文献围绕同一对张力展开对话：因果识别的纯度与经验世界的丰富性难以兼得。Babbie代表实验一极，承认实验的外部效度问题但坚持其因果优势；Yin针锋相对地指出实验'刻意把现象从情境中剥离'，而个案研究恰恰要拥抱情境，并以'分析性概括'回应'单一个案如何概括'的质疑。Burnham等展示了抽样调查强大的统计概括能力，却留下'只能快照、难以追因'的缺口；Sniderman与Mutz正是来补这个缺口的——把随机化处理嵌入代表性样本，但Mutz诚实地揭示：小插图里对'迈克尔'这个人的判断未必能推论到对群体的政策态度。Gray等则从质性一侧提醒：标准化问卷抓不到的东西（意义、过程、敏感情感），要靠访谈的深度去换。方法之争的背后，是'什么样的知识算数'的认识论之争。"},"readings":[{"file":"Babbie, 2020.pdf","title":"Experiments（《社会研究实践》第8章：实验）","authors":"Earl R. Babbie（厄尔·巴比）","year":"2020","venue":"The Practice of Social Research（第15版），Cengage 教材","thesis":"实验是社会研究中探究因果关系的基本模式：研究者选取受试者、对其施加刺激、观察结果。经典实验由三对要素构成：①自变量与因变量——前者是实验者操纵的刺激，后者是被观测、据以判断刺激效果的结果；②前测与后测——在刺激前后各测一次因变量，变化量才可确认；③实验组与控制组——两组同做前后测，但只有实验组接受刺激。再以随机化分配受试者，使两组在所有变量上期望相等，从而系统性地排除内部效度威胁。","framework":"以Campbell与Stanley《实验与准实验研究设计》为骨架：①区分经典实验与三种不达标的前实验设计——一次性个案研究（只测一次、无对照）、单组前后测设计（无控制组）、静态组比较（有对照但无随机化）；②用所罗门四组设计组合'有无前测×有无刺激'，以检验二者的交互作用；③以内部/外部效度二分组织整个效度讨论。","method":"教材式系统讲解：以'放映穆斯林历史影片能否降低偏见'为贯穿假想例，配合图示比较各种设计，并引述Pygmalion效应（实验者预期污染结果）、网络实验与利用自然灾害等社会事件的'自然实验'等实证案例。","evidence":"列举Campbell与Stanley提出的八种内部无效性来源：①历史——实验期间发生的外部事件；②成熟——受试者随时间自身变化；③测验——前测本身使人对议题更敏感；④测量工具——前后测工具不可比；⑤统计回归——极端分数向均值回落；⑥选择偏差——两组起点本不同；⑦实验耗损——受试者不对称退出；⑧士气低落（demoralization）——控制组因被剥夺感而表现异常。并指出'前测×刺激的交互'属外部无效性，可用所罗门四组设计检验。","limits":"实验的主要弱点是外部无效性——实验室结果未必反映真实生活；前测与刺激的交互作用是典型的外部效度威胁。伦理上，实验几乎总涉及欺骗，且侵入受试者生活，研究者须权衡研究价值与对受试者的潜在伤害。","quotes":[{"en":"At the most basic level, experiments involve (1) taking action and (2) observing the consequences of that action.","zh":"在最基本的层面上，实验包含：（1）采取行动；（2）观察该行动的后果。"},{"en":"First, experiments almost always involve deception.","zh":"第一，实验几乎总是涉及欺骗。"},{"en":"double-blind experiment: An experimental design in which neither the subjects nor the experimenters know which is the experimental group and which is the control.","zh":"双盲实验：一种受试者与实验者都不知道哪一组是实验组、哪一组是控制组的实验设计。"}]},{"file":"Brunham et al., 2008.pdf","title":"Surveys, Polls and Focus Groups（《政治学研究方法》第4章：调查、民意测验与焦点小组）","authors":"Peter Burnham, Karin Gilland, Wyn Grant, Zig Layton-Henry 等","year":"2008","venue":"Research Methods in Politics（第2版），Palgrave Macmillan 教材","thesis":"抽样调查与民意测验是当代政治生活与政治学研究的基础设施。样本调查通过对总体的代表性样本获取信息以概括总体；其科学性系于抽样程序——随机抽样使总体中每个体有相等且独立的入选机会并可估计误差，而配额、滚雪球等非随机抽样虽便宜快捷，其推论效力却存疑。","framework":"以概率/非概率抽样二分为骨架。随机抽样五种：①简单随机抽样——每个体等概率入选；②系统随机抽样——按固定间隔从名册抽取；③分层随机抽样——先按关键特征分层、再在各层内随机抽取；④多阶段抽样——先抽区域再抽人以降低成本；⑤整群抽样——以村庄等群组为单位抽取，省钱但增大抽样误差。非随机两种：①配额抽样——访谈员按配额自由选人；②滚雪球抽样——靠受访者互相推荐。另以面板（panel）设计弥补横断面'快照'的局限。","method":"教材式综述结合历史案例分析：追溯民调从《文学文摘》邮寄选票到盖洛普科学抽样的演变，并以Rowntree约克贫困调查的普查—抽样对照验证抽样的可靠性。","evidence":"①1936年《文学文摘》向约1000万人寄出模拟选票、回收200万份，因名单取自汽车与电话用户名录、严重低代表贫困选民，预测兰登大胜却被罗斯福轻易击败，不久停刊；盖洛普同年以科学抽样正确预测。②Rowntree 1936年约克调查：先做工人阶级家庭普查，再按1/10、1/20、1/30、1/40、1/50比例抽样核对，抽样结果与普查相当吻合。③Butler与Stokes《英国的政治变迁》面板研究：1963年夏首访、1964年与1966年大选后两度重访，揭示总体数字掩盖下的选民高波动性。","limits":"面板研究会因成员流失和'留存者更关心议题'而逐渐失去代表性；配额抽样无法计算样本代表性且访谈员可能无意偏选与自己相似的人；抽样框（如电话簿）会系统性遗漏低收入或无电话人群。注意：本章提取文本在'抽样框'一节开始处即中断，问卷设计、访谈员效应与焦点小组部分缺失。","quotes":[{"en":"opinion pollsters are now major players on the electoral scene. Their findings shape the mood of protagonists and of voters.","zh":"民意测验者如今是选举舞台上的重要角色。他们的调查结果塑造着竞选各方与选民的情绪。（引Butler与Kavanagh）"},{"en":"Randomness means that each case in a population has an equal and independent chance of being included in the sample.","zh":"随机意味着总体中的每一个体都有相等且独立的机会被纳入样本。"}]},{"file":"Sniderman, 2011.pdf","title":"The Logic and Design of the Survey Experiment: An Autobiography of a Methodological Innovation（调查实验的逻辑与设计：一项方法论创新的自述）","authors":"Paul M. Sniderman（保罗·斯奈德曼）","year":"2011","venue":"Cambridge Handbook of Experimental Political Science，Cambridge University Press，第8章","thesis":"调查实验是半个世纪以来调查研究最大的变革。作者以自述方式回顾计算机辅助随机化实验的诞生，并按所检验的假设（而非操作程序）区分三种设计：①操纵性设计——让受访者做其本无倾向做的事；②许可性设计——不施加压力，只让受访者安全表达既有倾向；③促成性设计——提供一个相关理由，促成受访者做其本有倾向做的事。'倾向'在因果故事中的位置，是三种设计的分类轴心。","framework":"以'倾向（predispositions）在实验中扮演的角色'为轴心的设计分类学（'促成性'系作者自创命名）；并结合Gaines、Kuklinski与Quirk的'前处理'（pre-treatment）概念——受访者并非白板进入访谈，既有经验会持续调节处理效应，理解这一点是理解调查实验逻辑的前提。","method":"方法论自传与实例分析：从split ballot的局限讲到计算机辅助访谈的随机化突破；逐一剖析框架实验（含双框架条件）、Kuklinski的列举实验（List Experiment）、Tversky-Kahneman亚洲流感实验、Stoker的平权行动论证实验与'反论证'技术等经典设计。","evidence":"①Sniderman与Theriault（2004）在框架实验中加入'双框架并呈'条件：单独呈现某框架时复制了旧有框架效应，但竞争性框架同现时，受访者反而能选出最接近自身立场的政策，推翻了'公众是被框架操纵的木偶'的结论；②Kuklinski列举实验：实验组清单多一项敏感事项、个人回答不可识别，以两组'愤怒项数'均值之差估计对平权行动愤怒者的比例；③Stoker（1998）反论证实验：给出有实质内容的反方理由，促人重新审视初始选择；④与Carmines（1997）的Regardless of Race与Color Blind实验：以道德普世主义而非族群特殊主义论证帮助黑人的政策，支持度显著提高。","limits":"调查实验的外部效度门槛只是'较低'而非'低'；早期split ballot设计只有两种条件，其重复性曾助长'公民没有真实态度'的时代误见（zeitgeist）；文末亦坦承多研究者平台（Multi-Investigator Project、TESS）的成功依赖NSF资助与计算成本革命。","quotes":[{"en":"The modern survey experiment is the biggest change in survey research in a half century.","zh":"现代调查实验是半个世纪以来调查研究中最大的变革。"},{"en":"A manipulative design aims to get respondents to do what they are not predisposed to do. In contrast, a permissive design aims to allow respondents to do what they are predisposed to do without encouraging them to do it.","zh":"操纵性设计旨在让受访者做他们本无倾向去做的事；相比之下，许可性设计旨在让受访者做他们本有倾向去做的事，而不去鼓励他们这样做。"},{"en":"Respondents do not enter public opinion interviews as blank slates.","zh":"受访者并不是作为白板进入民意访谈的。"}]},{"file":"Mutz, 2011.pdf","title":"Vignette Treatments（《基于总体的调查实验》第4章：小插图处理）","authors":"Diana C. Mutz（戴安娜·穆茨）","year":"2011","venue":"Population-Based Survey Experiments，Princeton University Press，第4章","thesis":"小插图处理让研究者借助调查实验的大样本，在单一研究中同时操纵多个因子并检验复杂交互作用。由于每个受访者只看到描述的一个版本、无法比较，它对种族等敏感议题的测量相对隐蔽；但其'不引人注目'与'处理被稀释'是同一枚硬币的两面，且对个体的判断不能直接等同于对集体的政策态度。","framework":"将vignette视为'直接处理'的一个亚种：以随机化软件在文本、图片或音视频中对人物/情境/政策的属性做全因子（full factorial）系统变异，依靠大样本避免小单元格问题，在总体代表性样本中实现实验室无法完成的复杂设计。","method":"方法论评述结合案例深描：Pager与Freese的失业救助小插图、Darley与Solan等的工厂毒气法律责任设计、Fong与Luttmer以卡特里娜飓风为背景的视听小插图实验，以及Ostfeld与Mutz的移民政策实验。","evidence":"①Pager与Freese：3（种族：黑/白/未指明）×3（失业原因：裁员/解雇/入狱）×2（工作史：稳定/不稳定）共18个条件；假设对象'迈克尔'为黑人时，受访者支持'大量'政府救助的比例比其为白人时高出近30%，白人与黑人受访者皆然，入狱经历则显著拉低支持。②Sniderman等的裁员工人实验实现96个实验条件，'这种规模在实验室里通常不可能'。③Ostfeld与Mutz的移民实验：在肤色（深/浅）×同化程度（高/低）的2×2之外再加第三因子——把非法移民从匿名的'他们'改写为具名的'利纳一家'，受访者一致地更同情具名群体、移民政策态度随之改变，尽管因变量问的是一般政策而非这家人。","limits":"小插图因信息密集，受访者注意力分散，可能削弱处理的内部实验真实性，故须做操纵检验并预试；图片的选择特异性带来混淆与外部效度问题；最关键的解释陷阱是'对个体的判断不等于对集体的判断'——若研究兴趣在政策层面，个体化小插图的结果可能产生误导。","quotes":[{"en":"But judgments about individual people are not the same as judgments about collectives.","zh":"但对个体的人的判断并不等同于对集体的判断。"},{"en":"With sensitive topics, the direct approach has very limited credibility.","zh":"对于敏感议题，直接提问的方式可信度非常有限。"}]},{"file":"Gray et al., 2007.pdf","title":"Intensive Interviewing（《研究想象力》第8章：深度访谈）","authors":"Paul S. Gray, John B. Williamson, David A. Karp, John R. Dalphin","year":"2007","venue":"The Research Imagination，Cambridge University Press 教材，第8章","thesis":"深度访谈是一种'在收集数据的过程中才确定恰当问题'的近身会话技术，研究者与受访者的相互努力构成清晰沟通。它适合调查难以触及的人群与议题——精英、罪犯、临终者、污名化亚文化——其最大长项是效度与数据丰富性，最大短板是概括性与信度。","framework":"以深度访谈区别于结构式访谈的四条标准组织：①投入与互惠（commitment and reciprocity）——双方致力于互利互动，访谈者适度自我暴露使交流成为双向交换；②共享意义（shared meanings）——双方能识别彼此行为与陈述的真实意图；③灵活性（flexibility）——互动的进程与内容可按双方需要调整；④同化（assimilation）——双方对进行中的互动加以消化与解释。另设专节讨论访谈的归纳逻辑及信度与效度的权衡。","method":"教材式讲解辅以大量研究实例：从女性刑侦人员的研究设想出发，讨论受访者接触、访谈准备与执行、敏感话题、提问准则、记录方式、避免'过度融洽'与非语言信号，并延伸至电话、电邮与网络访谈等新形式。","evidence":"Karp访谈50名抑郁症患者写成Speaking of Sadness，受访者以'像笼中来回踱步的老虎'形容抑郁；Vigilant访谈40名海洛因使用者；Thompson与Harred在7家酒吧历时9个月访谈40余名脱衣舞者研究污名管理；McMahon以平均2.5小时的访谈研究59名母亲，揭示母职中渐进而无意识的身份转变。","limits":"样本小且非概率，无法做统计概括（'50%±30%'毫无意义）；提问方式因访谈而异、缺乏标准化，研究难以复制，信度低于调查；高度依赖访谈者技巧，易受访谈者偏差与社会期许效应污染；分析缺乏标准化，不同分析者可能得出不同解释。","quotes":[{"en":"In this chapter, the focus is on intensive interviewing, a technique in which, by contrast, appropriate questions are often determined as data are being collected.","zh":"本章聚焦深度访谈——与之相反，这种技术中恰当的问题往往是在收集数据的过程中才被确定下来的。"},{"en":"its weakest attributes tend to be generalizability and reliability and that its greatest strengths are found in the validity and richness of data obtained and the personal accounts and stories that are often missed by more quantitative approaches to data.","zh":"它最弱的属性是概括性与信度，而最大的长项在于所获数据的效度与丰富性，以及那些常被更量化的数据方法错过的个人叙述与故事。"}]},{"file":"Yin, 2009.pdf","title":"Case Study Research: Design and Methods（《个案研究：设计与方法》导论）","authors":"Robert K. Yin（罗伯特·殷）","year":"2009","venue":"Case Study Research: Design and Methods（第4版），Sage，第1-2章","thesis":"个案研究是一种独立而完整的研究策略，选择依据三个条件：①问题类型——'如何''为什么'类问题指向个案研究与实验，'谁/什么/哪里/多少'类问题指向调查与档案分析；②研究者对实际行为事件的控制程度——能控制宜实验，不能控制宜个案；③焦点是当代还是历史现象——当代且现象与情境交融宜个案。个案如实验一样，概括到理论命题（分析性概括）而非总体（统计概括）；多个案设计遵循'复制逻辑'而非'抽样逻辑'。","framework":"以上述三条件为五种研究策略（实验、调查、档案分析、历史、个案研究）定位；反对把策略按探索—描述—解释分层的等级观，主张每种策略都可用于全部三种目的；以两部分'技术性定义'界定个案研究：①在真实生活情境中研究当代现象，尤其当现象与情境的边界不清晰时；②处理'感兴趣的变量多于数据点'的独特处境，因而依赖多源证据汇聚。","method":"方法论论证与经典个案评析：比较各策略的适用情境表（图1.1），剖析Allison《决策的本质》（古巴导弹危机解释性单一个案）与Whyte《街角社会》（描述性个案），并以Szanton的多城市研究说明多案例复制设计。","evidence":"①Allison《决策的本质》以1962年古巴导弹危机为解释性单一个案，用三个竞争性理论透镜——理性行动者、复杂官僚组织、政治动机集团——比较其解释力，并明示其教训可概括到更广的外交与复杂政府行动；②Whyte《街角社会》为描述性个案经典；③Szanton《Not Well Advised》先以八个大学—城市合作个案展示失败模式，再以五个个案做理论复制，示范多案例复制设计（逐项复制与理论复制）。","limits":"作者列出三大传统批评并逐一回应：①缺乏严谨——研究者马虎、让偏见影响结论（但实验与问卷同样有此风险）；②难以概括——'单一个案怎能概括'与'单个实验怎能概括'是同一个问题，答案都是分析性概括；③耗时且报告冗长——此系与民族志混淆，并非个案方法的本然。但也承认'做个案研究的能力无法被筛选或测验'，好个案依旧难做。","quotes":[{"en":"case studies are the preferred strategy when 'how' or 'why' questions are being posed, when the investigator has little control over events, and when the focus is on a contemporary phenomenon within some real-life context.","zh":"当提出的是'如何'或'为什么'的问题、研究者对事件几乎没有控制、且焦点是真实生活情境中的当代现象时，个案研究是首选策略。"},{"en":"case studies, like experiments, are generalizable to theoretical propositions and not to populations or universes.","zh":"个案研究与实验一样，是概括到理论命题，而不是概括到总体或全域。"},{"en":"An experiment, for instance, deliberately divorces a phenomenon from its context, so that attention can be focused on only a few variables.","zh":"例如，实验刻意地把现象从其情境中剥离出来，以便把注意力只集中在少数几个变量上。"}]}],"glossary":[{"en":"experiment","zh":"实验","def":"研究者主动施加一个刺激（如放一段影片）再观察结果变化的研究方式，是探究因果关系的首要工具。","src":"Babbie, 2020.pdf"},{"en":"independent / dependent variable","zh":"自变量／因变量","def":"自变量是实验者操纵的刺激（吃不吃药），因变量是被观测、据以判断刺激效果的结果（病好没好）。","src":"Babbie, 2020.pdf"},{"en":"randomization","zh":"随机化","def":"用抽签式随机方式把受试者分入两组，使两组在各方面'起跑线上'大体相同，是实验可比性的关键。","src":"Babbie, 2020.pdf"},{"en":"internal / external validity","zh":"内部／外部效度","def":"内部效度问'效果真是实验刺激造成的吗'；外部效度问'这个结果放到实验之外的真实世界还成立吗'。","src":"Babbie, 2020.pdf"},{"en":"Solomon four-group design","zh":"所罗门四组设计","def":"组合'有无前测'与'有无刺激'的四组设计，可单独检验前测与实验刺激的交互作用，防范外部无效性。","src":"Babbie, 2020.pdf"},{"en":"sample survey","zh":"抽样调查","def":"通过总体中有代表性的样本获取信息、据以概括整个总体的研究方式，可做描述也可分析变量关系。","src":"Brunham et al., 2008.pdf"},{"en":"opinion poll","zh":"民意测验","def":"测量公众（尤其选民）意见的快照式调查，更关心预测选举结果，而非深挖选民的社会特征与动机。","src":"Brunham et al., 2008.pdf"},{"en":"random (probability) sampling","zh":"随机（概率）抽样","def":"总体中每个体有相等且独立入选机会的抽样程序；正因为规则客观，样本代表性与抽样误差才可以计算。","src":"Brunham et al., 2008.pdf"},{"en":"quota sampling","zh":"配额抽样","def":"访谈员按年龄、性别等配额指标自由挑人（如商场门口拦人凑数）；快捷便宜，但代表性无法计算，推论可疑。","src":"Brunham et al., 2008.pdf"},{"en":"panel study design","zh":"面板研究设计","def":"对同一批受访者隔一段时间再访，看态度如何随时间变化；局限是成员流失、留下来的人越来越不典型。","src":"Brunham et al., 2008.pdf"},{"en":"sampling frame","zh":"抽样框","def":"据以抽取样本的总体名单（如选民登记册、电话簿）；名单漏了谁，样本就系统性偏掉谁。","src":"Brunham et al., 2008.pdf"},{"en":"survey experiment","zh":"调查实验","def":"把随机化实验处理悄悄嵌入问卷调查：受访者只见一个版本，兼具实验的因果识别与调查的样本代表性。","src":"Sniderman, 2011.pdf"},{"en":"manipulative / permissive / facilitative designs","zh":"操纵性／许可性／促成性设计","def":"Sniderman的三种调查实验设计：让人做本无倾向之事；不加压力让人表达既有倾向；给一个相关理由促成既有倾向。","src":"Sniderman, 2011.pdf"},{"en":"List Experiment","zh":"列举实验","def":"实验组的清单多一项敏感事项，受访者只报'有几项让我愤怒'的总数；两组均值之差即估计持敏感态度者比例，个人态度永不暴露。","src":"Sniderman, 2011.pdf"},{"en":"pre-treatment","zh":"前处理","def":"受访者不是白纸一张：他们带入访谈的既有经验与倾向会持续影响对实验处理的反应。","src":"Sniderman, 2011.pdf"},{"en":"vignette treatment","zh":"小插图处理","def":"给受访者看一段假设人物或情境的描述，随机变异其中若干属性（如肤色、失业原因），比较各版本回答的差异。","src":"Mutz, 2011.pdf"},{"en":"intensive interviewing","zh":"深度访谈","def":"非标准化、会话式的深入访谈，问题常在聊的过程中才生成；以概括性与信度为代价，换取效度与数据丰富性。","src":"Gray et al., 2007.pdf"},{"en":"case study","zh":"个案研究","def":"在真实生活情境中研究当代现象的经验探究，适合现象与情境边界不清的'如何/为什么'问题，靠多源证据相互印证。","src":"Yin, 2009.pdf"},{"en":"analytic generalization","zh":"分析性概括","def":"个案像实验一样概括到'理论命题'而非'总体'：研究一个村是为了检验和扩展理论，不是为了说全国的村都这样。","src":"Yin, 2009.pdf"},{"en":"replication logic","zh":"复制逻辑","def":"多案例设计中把每个个案当作一次实验复制——预期同样结果（逐项复制）或预期相异结果（理论复制），而非追求代表总体。","src":"Yin, 2009.pdf"}],"socratic":[{"q":"一款保健品广告说：'100位使用者服用一个月后，90%的人说感觉好多了。'朋友劝你别信，说'这不叫实验'。用本章的术语分析：这个'研究'缺了经典实验的哪些要素？","level":1,"hint":"先回忆Babbie给出的三对要素：两类变量、两次测量、两个组。再逐条对照广告：它有没有明确的'刺激'与'结果'测量？最关键的是——有没有一群'没吃这个药'的人作对照？","ref":"它几乎缺了全部三对要素。经典实验要求：①自变量与因变量——明确操纵的刺激与被测的结果；②前测与后测——服用前后各测一次，'感觉好多了'只是事后回忆，没有可比的前测基线；③实验组与控制组——没有不吃药的对照组，就无法排除'不吃也会好'（自愈、季节变化）和安慰剂效应。只有把实验组的变化与未受刺激的对照组比较，改善才能归因于药物本身。","wrong":"常见答法：'90%已经很高了，可以算有效'，或只答'缺个双盲'。导师可追问：'如果这90人里有一大半本来就会自愈，广告的说法还成立吗？没有对照组，你能发现这一点吗？'引导学生看到：问题不在比例高低，而在没有对照就无法做因果归因。","followup":"如果让你为这款保健品设计一个合格实验，你最先补上的要素是哪一个？","src":"Babbie, 2020.pdf","kw":["因变量","自变量","实验","感觉","控制","操纵","刺激","结果"]},{"q":"1936年美国总统大选前，《文学文摘》杂志回收了200万份模拟选票——这在今天是难以想象的巨大样本——却预测共和党兰登大胜，结果罗斯福轻松获胜；同一年，盖洛普用小得多的样本预测对了。请你复述事实并指出：问题出在样本'大小'上吗？","level":1,"hint":"注意《文学文摘》的名单是从哪里弄来的——1936年，家里有汽车、装得起电话的是什么阶层的人？那一年的选举围绕新政展开，失业和低收入选民支持谁？","ref":"问题不在样本大小，而在抽样框的系统性偏差。《文学文摘》从电话用户名录和汽车登记册获取名单，向约1000万人寄出模拟选票、回收200万份。1936年选举围绕新政高度阶级极化，失业与低收入选民强烈支持罗斯福，而他们当时很少拥有汽车与电话，被严重低代表。此前选举阶级分化不强，同样的偏差未曾暴露。样本再大也补不了'名单本身就漏掉一类人'；盖洛普的科学抽样反而准确。《文学文摘》不久后停刊。","wrong":"典型误解是把失败归因于'样本还不够大'或'邮寄问卷回收率低'。导师应追问：'如果名单本身就漏掉了一类选民，再增加一倍的邮寄量能补回来吗？'把讨论从'数量'拉回到'抽样框的系统性偏差'这一机制上。","followup":"今天我们用电话簿或线上平台招募受访者，可能重演哪一种《文学文摘》式偏差？","src":"Brunham et al., 2008.pdf","kw":["抽样框","代表","文学文摘","系统","偏差","支持","电话","汽车"]},{"q":"市场调研公司常在商场门口'拦人做问卷'：给访谈员下达'20名30岁以下女性、20名中年男性'之类的任务量。这种按指标凑人的做法看起来也照顾了各类人群，为什么教材仍说从这种样本'推论是可疑的'？","level":1,"hint":"关键不在'有没有配额指标'，而在'最后由谁、按什么规则选人'：访谈员是自己挑人，还是按客观程序抽人？被拒绝的人能否被替换？再想想：白天在商场门口，能碰到哪些人、碰不到哪些人？","ref":"这是配额抽样。年龄、性别等配额可以规定，但访谈员可自由选择任何符合配额的人，被拒访还可以替换，无回答偏误被绕开，最终样本的代表性无法计算、抽样误差无从估计。访谈的时间地点还造成系统偏差——白天在公共场所会漏掉全职工人，访谈员还可能无意识地偏选与自己相似的人。随机抽样则用客观程序选人、成员不可替换，代表性才可计算。市场研究者辩称配额够细就接近随机，但其非随机本质使统计推论可疑。","wrong":"学生常答'配额抽样没有分层所以不准'。导师应追问：'配额抽样明明也按人口特征设了层和额，为什么仍不能计算误差？'逼学生抓住'选择环节的随机性'而非'层的有无'这个机制核心。","followup":"滚雪球抽样明知不具代表性，为什么对吸毒者、无家可归者等群体仍可能是唯一可行的办法？","src":"Brunham et al., 2008.pdf","kw":["配额抽样","随机抽样","代表","研究者","访谈","选择","统计","系统"]},{"q":"假如你直接问选民：'如果来领失业救济的是个黑人，你愿意政府多帮他吗？'很多人会因为怕显得'不正确'而不说真话。本章介绍的哪类设计能绕过这种压力？它为什么能绕过？","level":1,"hint":"想想小插图（vignette）实验里，每个受访者看到几个版本的描述？他知不知道别人看到的版本和他不同、知不知道研究者关心的正是'种族'这个属性？","ref":"小插图处理能绕过社会期许压力。在组间设计中，每个受访者只看到描述的一个版本（比如只有'黑人迈克尔'），不知道其他版本存在，也无从察觉研究关注的正是种族，因此无需掩饰——Mutz指出'对于敏感议题，直接提问的方式可信度非常有限'。随机化软件在大样本中对人物属性做系统变异，比较各版本的平均回答之差，即估计出种族的效应。列举实验同理：受访者只报总数、个人态度不可识别，于是敢于承认敏感态度。","wrong":"典型误解：'承诺匿名，受访者就会说真话'。导师可追问：'匿名问卷里，人们就愿意承认种族偏见了吗？社会期许压力只来自“怕被研究者知道”，还是也来自受访者内心的自我形象？'引导学生区分两层压力，理解'无法比较才无压力'的机制。","followup":"这种'隐蔽'也有代价——如果受访者根本没注意到被操纵的属性，会发生什么？","src":"Mutz, 2011.pdf","kw":["小插图处理","列举实验","随机化","受访者","研究","设计","敏感","议题"]},{"q":"Yin提出了选择研究策略的三个条件。请你说明这三个条件是什么，并用它们论证：为什么'为什么某市成功推行了垃圾分类'适合做个案研究，而'宗教信仰是否影响投票选择'更适合调查？","level":2,"hint":"三个条件分别涉及：问题的形式（如何/为什么，还是谁/什么/多少）、研究者对实际行为事件的控制程度、焦点是当代还是历史现象。把每个研究问题逐一对号入座。","ref":"Yin的三条件是：①研究问题的类型——'如何''为什么'类问题指向解释，'谁''什么''哪里''多少'类问题指向描述；②研究者对实际行为事件的控制程度；③焦点是当代现象还是历史现象。个案研究适合'如何/为什么'+无法控制事件+当代情境；调查适合'谁/什么/哪里/多少'+无需控制+当代；实验适合'如何/为什么'+能控制。'垃圾分类为何成功'是如何/为什么、无法控制、当代且现象与情境难分，故宜个案；'宗教与投票'是谁/什么类问题、关心分布与相关，故宜调查。","wrong":"学生常背出三条件却不会应用，或误以为'个案研究只能做探索'。导师应追问：'Yin为什么说把策略按探索—描述—解释分层是一种误解？Allison研究导弹危机用的是个案，它做的是探索、描述还是解释？'用反例纠正等级观。","followup":"如果现象与情境的边界不清晰，为什么这反而成为选择个案研究而非调查的理由？","src":"Yin, 2009.pdf","kw":["个案研究","实验","研究者","调查","控制","情境","条件","描述"]},{"q":"新药临床试验中，不仅病人不知道自己吃的是真药还是安慰剂，连发药的医生也不知道。为什么要这样'双重保密'？如果只有病人不知道、医生知道，会出什么问题？","level":2,"hint":"想想两个方向上的偏差：病人'以为'自己吃了药，身体和心理会怎样？医生若知道谁吃了真药，他在观察和记录时会不会不自觉地'看出'疗效？Babbie讲的Pygmalion效应与此有何关系？","ref":"这是双盲实验：受试者与实验者都不知道分组。病人知道自己分组会产生安慰剂效应——'以为吃了药'本身就改变感受与表现；实验者知道分组，则可能在观察和记录时不自觉地预断结果（Pygmalion效应即此类）。只有双方都不知情，组间差异才能干净地归因于药物。若仅病人不知情（单盲），实验者的预期偏差仍可污染测量，因果归因就不纯。","wrong":"常见错误：'双盲是为了防止病人撒谎'。导师应追问：'病人没有撒谎，只是真的“感觉”好转，这算不算药效？这个效应是我们想测的吗？'帮助学生区分'报告偏差'与'预期本身造成的真实体验变化'。","followup":"政治心理学实验（如看竞选广告）里'双盲'往往做不到——研究者总知道谁看了哪个版本，这会留下什么隐患？","src":"Babbie, 2020.pdf","kw":["实验","结果","测量","偏差","知道","受试者","分组","改变"]},{"q":"有人质疑个案研究：'你只研究了一个城市，凭什么说结论有普遍意义？'Yin回应说，这个问题和'你只做了一个实验，凭什么概括'是同一个问题。请解释'分析性概括'与'统计概括'的区别，以及这个类比如何为个案研究辩护。","level":2,"hint":"先想想：一个实验的结果是如何被'概括'的——靠把实验对象当成总体的'样本'，还是靠在不同条件下反复复制？Yin正是从这个类比切入的。","ref":"统计概括是从样本按概率逻辑推论总体、枚举频次，这是抽样调查的逻辑；分析性概括是把研究结果作为证据去扩展和概括理论命题，个案不是总体的'样本'。Yin指出，科学事实从不建立在单一实验上，而建立在不同条件下多次复制的实验系列上；'单个实验如何概括'与'单一个案如何概括'是同一个问题。因此个案研究像实验一样概括到理论命题而非总体，多个案设计遵循复制逻辑（逐项复制检验同一结果、理论复制检验预期相异的结果），而非抽样逻辑。","wrong":"常见错误是把分析性概括理解为'往理论上靠一靠的修辞'，或者仍用'代表性'标准要求个案。导师应追问：'Szanton研究多个城市时，他是在抽取城市的样本，还是在做多次实验复制？这两种理解对选择城市的方式有何不同要求？'","followup":"既然个案概括的是理论，那么选择一个'极端'或'关键'个案，是否可能比选择一个'典型'个案更有价值？","src":"Yin, 2009.pdf","kw":["分析性概括","个案研究","抽样调查","复制逻辑","实验","总体","条件","设计"]},{"q":"一位研究者想理解抑郁症患者的内心世界，导师却说'别发问卷，去做深度访谈'。为什么问卷在这里使不上劲？深度访谈换来了什么、又付出了什么代价？","level":2,"hint":"想想Gray等所说的'问题在收集数据的过程中才确定'：问卷的问题在访问前就固定死了，而'抑郁是什么体验'是一个我们连该问什么都不完全清楚的问题。","ref":"对意义深厚、连'该问什么'都不清楚的议题，标准化问卷无从设计；深度访谈让问题在会话中生成，受访者能用自己的语言讲述——Karp访谈50名抑郁症患者，有人形容抑郁'像笼中来回踱步的老虎'，这是问卷选项给不出的。它换来效度与数据的丰富性，代价是：小样本且非概率，无法统计概括；提问因人而异，研究难以复制、信度低；高度依赖访谈者个人技巧，易受访谈者偏差污染。优势与短板是同一设计选择的两面。","wrong":"常见答法：'问卷也能加开放题，所以没本质区别'。导师可追问：'印在纸上的开放题，能根据对方上一句话临时追问吗？受访者愿意在纸面上对陌生人袒露自杀念头吗？'凸显'会话性'与'融洽关系'才是深度访谈的核心。","followup":"如果访谈者与受访者关系处得'太好'，会出现什么新风险？","src":"Gray et al., 2007.pdf","kw":["深度访谈","受访者","问卷","研究","选择","效度","设计","议题"]},{"q":"某公司为提升员工满意度做了为期三个月的'幸福感培训'，前后各测一次满意度，发现显著提升，于是宣布培训有效。请你扮演方法审稿人：用Campbell与Stanley的八种内部无效性来源，至少找出四种替代解释。","level":3,"hint":"把八种威胁按四类记忆：时间流逝带来的（历史、成熟）、测量带来的（测验、工具）、分组带来的（选择、回归）、流失与士气带来的（耗损、士气低落）。逐条问：这期间公司有没有发生别的事？员工自己会不会随时间变化？第一次填问卷本身会不会改变他们？","ref":"可提出的替代解释如：①历史——三个月里公司可能涨薪、换领导，变化与培训无关；②成熟——员工随时间自然适应或疲劳；③测验——前测本身让员工开始反思满意度；④统计回归——若专挑原本最不满的部门，分数会自然向均值回升；⑤选择偏差——自愿参训者本就不同；⑥实验耗损——最不满者中途离职，留存者满意度虚高；⑦士气低落——未参训的对照组因被剥夺感而表现异常；⑧测量工具——两次问卷措辞不同则不可比。加上随机化控制组与前后测，才能堵上其中多数漏洞。","wrong":"学生常罗列名词却讲不出机制，或把'测验×刺激的交互'也算进控制组能解决的问题。导师应追问：'对照组也做了前测，两组都受影响，为什么这个交互仍威胁结论？'引导学生看到：它威胁的是结果能否外推到'未经前测的真实人群'，属外部无效性。","followup":"Campbell与Stanley为什么主张：只要随机化做得好，前测其实并非必需？","src":"Babbie, 2020.pdf","kw":["随机化","实验","问卷","选择","控制","统计","前测","变化"]},{"q":"Sniderman把调查实验分为操纵性、许可性、促成性三种设计，并强调区别在于'检验的假设'而非'操作'。请用框架实验、列举实验、反论证技术分别对应三种设计，并说明各自检验什么。","level":3,"hint":"追问每种设计中'倾向'扮演什么角色：是要克服它、掩护它、还是激活它？列举实验中受访者为什么愿意承认愤怒？反论证为什么算'促成'而非'操纵'？","ref":"操纵性设计让人做本无倾向之事：如框架实验随机呈现正面或负面框架，检验能否把人'推向'某立场——Sniderman与Theriault加入双框架条件后发现，受访者面对竞争框架反而能依自身立场选择，说明公众并非木偶。许可性设计不施压、让人安全表达既有倾向：如Kuklinski的列举实验，清单多一项敏感事项且个人回答不可识别，由组均值差估计对平权行动愤怒者的比例。促成性设计提供相关理由促成既有倾向：如反论证技术给出有实质内容的反方理由，让人重新审视与总体立场不一致的初始选择——多数人是在'纠正失误'而非'改变立场'。","wrong":"常见误解是按操作特征分类，如'列举实验操纵了清单长度所以是操纵性设计'。导师应追问：'在列举实验中，研究者的目标是改变受访者的态度，还是让既有态度可以被诚实测量？'把分类标准从操作拉回假设：设计的差别在于倾向在因果故事中的位置。","followup":"如果受访者'不是白板'而是带着前处理进入实验，同一处理对不同倾向的人效应不同，这对'平均处理效应'的解释意味着什么？","src":"Sniderman, 2011.pdf","kw":["促成性设计","列举实验","操纵性","许可性","受访者","选择","总体","条件"]},{"q":"Mutz报告了一个看似古怪的发现：把移民政策小插图里匿名的'他们'改写成有名有姓的'利纳一家'——人数、情节完全相同——受访者的移民政策态度就显著改变了。这个发现说明了什么？它给用个体故事研究政策态度的人什么警告？","level":3,"hint":"注意：因变量问的是一般移民政策，不是'该不该帮这家人'。先承认这个效应本身有趣（个体化呈现唤起同情），再追问：对'利纳一家'的反应能代表对'非法移民群体'的态度吗？","ref":"它说明：对个体的判断不等于对集体的判断。具名化、个体化的呈现唤起更多同情，即使因变量问的是一般政策态度，结果也随之移动。这既是机制发现，也是方法警告：若研究兴趣在政策层面（对群体的态度），用个体化小插图测得的效应可能有系统性偏差——人们可以对某个具体移民家庭充满善意，同时主张收紧移民政策。小插图的设计细节（有没有名字、是个体还是群体）不是技术琐事，而会实质改变研究结论。","wrong":"典型误读：'这说明公众其实同情移民，政策应该更开放'——把方法发现当成实质主张。导师应追问：'这个实验能告诉我们公众“真实”的移民态度是什么吗？还是只能告诉我们态度随呈现方式而变？'","followup":"Pager与Freese的'迈克尔'实验让受访者对个体的判断直接进入政策问题（政府该帮多少），Mutz会怎么评价这个设计？","src":"Mutz, 2011.pdf","kw":["因变量","小插图","研究","方法","设计","个体","判断","群体"]},{"q":"假如你要研究'种族是否影响选民对福利政策的支持'，本章哪些方法可以上场？请设计一条混合方法路线，并说明每种方法在这条路线中回答别的回答不了的问题。","level":4,"hint":"按本章的'方法地图'分配任务：谁负责因果识别？谁负责总体代表性？谁负责机制与意义？谁负责理论概括？","ref":"可行路线：①用抽样调查（Burnham）以概率样本测量种族态度与福利态度的分布与相关，回答'多少、谁'；②嵌入调查实验/小插图设计（Sniderman、Mutz），随机变异受益者的种族与其他属性，识别种族的因果效应并检验与可责性、工作史的交互，同时用列举实验绕过社会期许；③对关键群体做深度访谈（Gray），理解支持或反对背后的理由结构与情感，生成新假设；④选择若干社区做个案研究（Yin），追踪福利政治在真实情境中的过程，把统计规律概括到理论命题。调查给分布，实验给因果，访谈给意义，个案给情境化机制与理论概括。","wrong":"常见失误是把方法并列罗列（'四种方法都用'）而不说明分工，或让某一种方法（通常是实验）包办全部问题。导师应追问：'你的实验结果能说明选民在真实竞选中如何被动员吗？你的个案发现凭什么超出这个城市？'逼学生为每种方法标定其不可取代的贡献与边界。","followup":"在这条路线里，各方法得到的'种族效应'若大小不一致（如小插图显示亲黑偏好、个案显示白人反弹），你应把它当作矛盾，还是当作关于不同层次机制的证据？","src":"Mutz, 2011.pdf","kw":["个案研究","抽样调查","调查实验","列举实验","深度访谈","真实","小插图","选择"]}],"quiz":[{"type":"mc","q":"经典实验设计中，控制组的主要作用是？","options":["检验前测是否提高了受试者对刺激的敏感度","提供一个未接受实验刺激的对照，以排除成熟、历史等替代性解释","确保样本对总体具有统计代表性","让实验者可以在两组间轮换刺激以增加数据量"],"answer":1,"explain":"控制组与实验组同样接受前后测，但不接受刺激。这样，实验组发生的变化若在对照组没发生，才能归因于刺激而非成熟、历史等其他因素。检验'前测×刺激'的交互是所罗门四组设计的任务；样本代表性靠抽样方法，不靠分组。","src":"Babbie, 2020.pdf"},{"type":"tf","q":"双盲实验中，实验者知道分组情况但受试者不知道，因此可以避免受试者的安慰剂效应。","answer":false,"explain":"错误。双盲是受试者与实验者都不知道分组：防安慰剂效应靠'受试者不知'，防实验者预期污染结果（Pygmalion效应）靠'实验者也不知'。若实验者知道分组，只是单盲。","src":"Babbie, 2020.pdf"},{"type":"mc","q":"1936年《文学文摘》民调惨败的根本原因是？","options":["样本量太小，只有200万份回收问卷","问卷措辞诱导了受访者","抽样框取自汽车与电话名录，系统性低代表了支持罗斯福的贫困选民","访谈员在街头访问时只采访了与自己相似的人"],"answer":2,"explain":"其名单来自电话用户与汽车登记册；1936年选举围绕新政高度阶级极化，贫困选民被严重低代表。200万份的巨大样本不能弥补抽样框的系统性偏差——名单漏了谁，结果就偏掉谁。盖洛普以科学抽样正确预测，《文学文摘》随后停刊。","src":"Brunham et al., 2008.pdf"},{"type":"tf","q":"配额抽样由于设定了年龄、性别、职业等配额指标，因此可以像随机抽样一样计算样本代表性。","answer":false,"explain":"错误。配额抽样中访谈员自由选择符合配额的人、被拒访还可替换，选择环节不随机、无回答偏误被绕开，故最终样本代表性无法计算。设不设配额指标不是关键，'谁来选、能否替换'才是关键——这正是它与随机抽样的根本区别。","src":"Brunham et al., 2008.pdf"},{"type":"mc","q":"按Yin提出的三条件，下列哪一研究问题最适合采用个案研究？","options":["某国选民中支持提高遗产税的比例是多少？","某市政府为什么能成功推动跨部门数据共享改革？","观看竞选广告是否会使选民的投票意向改变？","19世纪欧洲各国选举权是如何逐步扩大的？"],"answer":1,"explain":"'为什么成功'属如何/为什么类问题，研究者无法控制事件、且是真实情境中的当代现象，正落在个案研究的适用域。A是'多少'宜调查；C可控制刺激宜实验；D是历史事件宜历史研究。","src":"Yin, 2009.pdf"},{"type":"tf","q":"按Yin的观点，个案研究的主要目的是通过足够大的个案数量实现对总体的统计概括。","answer":false,"explain":"错误。Yin主张个案与实验一样概括到理论命题（分析性概括）而非总体（统计概括）；个案不是总体的'样本'，多个案遵循复制逻辑（像重复实验）而非抽样逻辑。'单一个案怎能概括'与'单个实验怎能概括'是同一个问题。","src":"Yin, 2009.pdf"},{"type":"mc","q":"在Sniderman的分类中，Kuklinski的列举实验（List Experiment）属于哪种设计，其理由是什么？","options":["操纵性设计，因为它通过增加清单条目操纵了受访者的选择","许可性设计，因为它不加压力，让受访者在不被识别的情况下表达既有倾向","促成性设计，因为它给受访者提供了一个支持敏感立场的理由","前实验设计，因为它缺少控制组"],"answer":1,"explain":"列举实验中实验组仅比基线组多一项敏感事项，受访者只报总数、个人态度不可识别；两组均值差即估计持敏感态度者比例。它不诱导态度，只移除表达压力，让既有倾向安全浮出水面，故为许可性设计。注意分类标准是'检验的假设'而非操作。","src":"Sniderman, 2011.pdf"},{"type":"mc","q":"Mutz指出，从小插图实验推论政策态度时最值得警惕的陷阱是？","options":["受访者会识破研究目的并故意给出相反回答","对假设个体的判断并不等同于对相应集体或政策的态度","小插图只能操纵一个因子，无法检验交互作用","网络调查无法呈现图片材料"],"answer":1,"explain":"Ostfeld与Mutz的移民实验显示，仅把匿名群体改写成有名有姓的'利纳一家'就显著改变政策态度，说明个体化呈现与集体层面政策判断之间存在系统性差异；若研究兴趣在政策，个体化小插图可能误导。小插图恰恰擅长多因子全因子设计，C、D均与原文相悖。","src":"Mutz, 2011.pdf"},{"type":"tf","q":"深度访谈的非标准化特征既是其数据丰富性的来源，也是其难以复制、信度较低的根源。","answer":true,"explain":"正确。提问随受访者与情境调整，使访谈能深入意义世界、获得高效度与丰富数据；但同一问题措辞、强调因人而异，导致数据不可比、研究难复制。Gray等明确指出：其短板（概括性、信度）恰是长项（效度、丰富性）的必然代价，是同一设计选择的两面。","src":"Gray et al., 2007.pdf"},{"type":"sa","q":"用自己的话解释：为什么随机分配受试者能让实验组和控制组'可比'？请举一个现实生活中的例子（如分班、抽签）说明这个道理。","ref":"随机分配让每个受试者进入任一组的机会均等，于是两组在年龄、性别、态度等所有已知和未知变量上'期望相等'——剩下的差异只是随机噪声，且人越多噪声越小。两组间唯一的系统性差别就是是否接受刺激，前后变化因此可归因于刺激。例子：班主任用抽签而不是按成绩分甲乙班，两班平均水平大体相当；若让老师挑人，两班起点不同，之后任何差距都说不清是分班造成的还是教学造成的。","explain":"评分要点：须答出（1）机会均等使两组在所有变量上期望相等、差异只剩随机噪声；（2）所举例子体现'随机而非人为挑选'。只说'随机就是随便分'不得分；举抛硬币决定谁吃药等例子均可。","src":"Babbie, 2020.pdf"},{"type":"sa","q":"Sniderman与Theriault在框架实验中加入'双框架并呈'条件后发现了什么？这一发现对'公众被框架操纵'的判断意味着什么？","ref":"他们发现：单独呈现正面或负面框架时，复制了以往框架效应（框架能显著移动支持度）；但当两个竞争性框架同时呈现——更接近真实政治中政党争相框定议题的情形——受访者并未陷入混乱，反而更能够选出与其总体立场最接近的政策选项。这说明早期实验把公众描绘成'被框架牵着走的木偶'是'把政治从政治故事中抽掉'的实验假象；竞争性框架环境下公民表现出比预期更强的判断能力。","explain":"评分要点：须同时答出（1）单框架条件复制旧效应、（2）双框架条件下受访者依自身立场选择两点；只答'框架效应很强'为偏题；能联系Sniderman'政治被抽掉'的批评为加分点。","src":"Sniderman, 2011.pdf"}],"flashcards":[{"front":"经典实验（classical experiment）","back":"包含自变量/因变量、前测/后测、实验组/控制组三对要素的因果检验设计：两组前后测，仅实验组接受刺激。","src":"Babbie, 2020.pdf"},{"front":"前实验设计（preexperimental designs）","back":"Campbell与Stanley命名的三种不达标设计：一次性个案研究、单组前后测设计、静态组比较；缺随机化或对照，因果解释漏洞多。","src":"Babbie, 2020.pdf"},{"front":"内部无效性（internal invalidity）","back":"效应不能确归因于刺激的风险，来源有历史、成熟、测验、工具、回归、选择、耗损、士气低落八种。如培训期间恰逢加薪，效果就记错了账。","src":"Babbie, 2020.pdf"},{"front":"外部无效性（external invalidity）","back":"实验结果无法推论到实验之外真实世界的风险；典型来源是前测与实验刺激的交互作用，可用所罗门四组设计检验。","src":"Babbie, 2020.pdf"},{"front":"双盲实验","back":"受试者与实验者均不知分组的设计，如新药试验中病人和发药医生都不知情；既防安慰剂效应，也防实验者预期偏差。","src":"Babbie, 2020.pdf"},{"front":"随机化（randomization）","back":"以随机方式分配受试者，使两组在所有变量上期望相等（人越多越可靠）；是实现组间可比性的首选方法，优于配对。","src":"Babbie, 2020.pdf"},{"front":"民意测验 vs 抽样调查","back":"民意测验是测公众意见的快照式调查，重在预测选举结果；抽样调查范围更广，可描述社会构成、价值与行为并做变量分析。","src":"Brunham et al., 2008.pdf"},{"front":"《文学文摘》教训","back":"1936年以汽车/电话名录寄出千万张选票，因抽样框系统性漏掉贫困选民而预测兰登胜出、惨遭失败；大样本不能补救偏差抽样框。","src":"Brunham et al., 2008.pdf"},{"front":"配额抽样","back":"访谈员按年龄性别等配额自由选人（如商场门口拦人凑数）；快捷便宜，但代表性无法计算、拒访可被替换，推论可疑。","src":"Brunham et al., 2008.pdf"},{"front":"滚雪球抽样","back":"由初始受访者推荐同类人入样；是接触吸毒者、无家可归者等隐匿群体的可行办法，但样本难有代表性，更适合探索性研究。","src":"Brunham et al., 2008.pdf"},{"front":"面板研究设计","back":"对同一批受访者多次重访以观察态度变化；Butler与Stokes借此发现英国选民的高波动性。局限：成员流失、留存者代表性递减。","src":"Brunham et al., 2008.pdf"},{"front":"调查实验（survey experiment）","back":"把随机化实验处理嵌入问卷调查；受访者只见一个版本而不知有多个版本。Sniderman称之为半个世纪来调查研究最大的变革。","src":"Sniderman, 2011.pdf"},{"front":"许可性设计与列举实验","back":"不加压力、让人安全表达既有倾向的设计；列举实验靠两组清单均值差估计敏感态度比例，个人回答不可识别。","src":"Sniderman, 2011.pdf"},{"front":"小插图处理（vignette）","back":"在假设人物/情境描述中随机变异属性的处理；大样本支持全因子设计（可达96个条件），对敏感议题较隐蔽。","src":"Mutz, 2011.pdf"},{"front":"个体判断≠集体判断","back":"Mutz的警告：给移民起个名字（'利纳一家'）就显著改变政策态度——对假设个体的反应未必能推论到对群体或政策的态度。","src":"Mutz, 2011.pdf"},{"front":"操纵检验（manipulation check）","back":"在因变量测量后检验受访者是否感知到操纵的步骤；小插图信息密集，处理可能'埋得太深'而失效，故须预试与检验。","src":"Mutz, 2011.pdf"},{"front":"深度访谈","back":"问题在数据收集过程中生成的会话式技术；以概括性与信度为代价，换取效度与数据丰富性，适合难以触及的人群与敏感议题。","src":"Gray et al., 2007.pdf"},{"front":"过度融洽（overrapport）","back":"访谈者与受访者关系过密以致丧失客观距离、受访者回避坦白的危险；访谈者须保持对访谈进程的控制。","src":"Gray et al., 2007.pdf"},{"front":"个案研究（case study）","back":"在真实情境中研究当代现象、且现象与情境边界不清时使用的经验探究；适合'如何/为什么'问题，依赖多源证据汇聚。","src":"Yin, 2009.pdf"},{"front":"分析性概括 vs 统计概括","back":"个案与实验一样概括到理论命题（分析性），而非从样本枚举频次推论总体（统计性）；多个案遵循复制逻辑而非抽样逻辑。","src":"Yin, 2009.pdf"}]}]}
</script>
<script>
"use strict";
/* ================= data & store ================= */
const DATA = JSON.parse(document.getElementById('course-data').textContent);
const CHAPTERS = DATA.chapters;
const LS_KEY = 'polsci_course_v1';
function blankCh(){return {visited:{},soc:{idx:0,results:{},answers:{},attempts:{},summary:null},quiz:{best:null,last:null,done:false},flash:{known:{},seen:{}}};}
let store;
try{store = JSON.parse(localStorage.getItem(LS_KEY))||{};}catch(e){store={};}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){}}
function chState(id){if(!store[id])store[id]=blankCh();const s=store[id];if(!s.soc)s.soc=blankCh().soc;if(!s.quiz)s.quiz=blankCh().quiz;if(!s.flash)s.flash=blankCh().flash;if(!s.visited)s.visited={};return s;}
function chById(id){return CHAPTERS.find(c=>c.id===id);}
function chNo(id){return String(CHAPTERS.findIndex(c=>c.id===id)+1).padStart(2,'0');}

/* progress: 导览/精读/术语各10%（访问即得）；课堂30%按题；练习20%完成即得；闪卡20%按看过比例 */
function chProgress(ch){
  const s=chState(ch.id);let p=0;
  ['overview','readings','glossary'].forEach(t=>{if(s.visited[t])p+=10;});
  const n=ch.socratic.length,dn=Object.keys(s.soc.results).length;
  p+=30*(n?dn/n:0);
  if(s.quiz.done)p+=20;
  const f=ch.flashcards.length,sn=Object.keys(s.flash.seen).length;
  p+=20*(f?sn/f:0);
  return Math.round(p);
}
function totalProgress(){return Math.round(CHAPTERS.reduce((a,c)=>a+chProgress(c),0)/CHAPTERS.length);}
function updateMini(){const p=totalProgress();document.getElementById('mini-pct').textContent=p+'%';document.getElementById('mini-bar').style.width=p+'%';}

/* ================= utils ================= */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
const view=document.getElementById('view');
const TABS=[['overview','导览'],['readings','文献精读'],['glossary','术语表'],['socratic','苏格拉底课堂'],['quiz','检索练习'],['flashcards','闪卡']];
const LEVELS={1:'概念理解',2:'比较梳理',3:'机制分析',4:'批判综合'};
let rvObserver=null;
function bindReveal(){
  if(rvObserver)rvObserver.disconnect();
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.08});
  document.querySelectorAll('.rv').forEach(n=>io.observe(n));
  rvObserver=io;
  /* 兜底：无论 IO 是否触发，1.6s 后强制显示所有待入场元素，避免内容永久不可见 */
  clearTimeout(window.__rvFallback);
  window.__rvFallback=setTimeout(()=>document.querySelectorAll('.rv:not(.in)').forEach(n=>n.classList.add('in')),1600);
}
function scrollTop(){window.scrollTo({top:0,behavior:'auto'});}

/* ================= router ================= */
function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const parts=h.split('/').filter(Boolean);
  if(!parts.length){renderHome();return;}
  const ch=chById(parts[0]);
  if(ch){renderChapter(ch,parts[1]||'overview');return;}
  renderHome();
}
window.addEventListener('hashchange',route);

/* ================= chapter shell ================= */
function renderChapter(ch,tab){
  if(!TABS.some(t=>t[0]===tab))tab='overview';
  const s=chState(ch.id);
  if(['overview','readings','glossary'].includes(tab)){s.visited[tab]=1;save();}
  const tabName=TABS.find(t=>t[0]===tab)[1];
  document.getElementById('crumb').innerHTML=`<a href="#/" style="color:#a9a59a">首页</a> / <span>第${chNo(ch.id)}章 ${esc(ch.title)}</span> / ${tabName}`;
  const p=chProgress(ch);
  const tabs=TABS.map(t=>{
    let done='';
    if(t[0]==='overview'&&s.visited.overview)done='<span class="dot"></span>';
    if(t[0]==='readings'&&s.visited.readings)done='<span class="dot"></span>';
    if(t[0]==='glossary'&&s.visited.glossary)done='<span class="dot"></span>';
    if(t[0]==='socratic'&&Object.keys(s.soc.results).length>=ch.socratic.length&&ch.socratic.length)done='<span class="dot"></span>';
    if(t[0]==='quiz'&&s.quiz.done)done='<span class="dot"></span>';
    if(t[0]==='flashcards'&&Object.keys(s.flash.seen).length>=ch.flashcards.length&&ch.flashcards.length)done='<span class="dot"></span>';
    return `<a class="tab ${t[0]===tab?'on':''}" href="#/${ch.id}/${t[0]}">${t[1]}${done}</a>`;
  }).join('');
  view.innerHTML=`
  <section class="ch-hero"><div class="wrap">
    <a class="backlink" href="#/">← 返回课程首页</a>
    <div class="cno">CHAPTER ${chNo(ch.id)}</div>
    <h1>${esc(ch.title)}</h1>
    <div class="en">${esc(ch.subtitle)}</div>
    <div class="meta"><span>文献 ${ch.readings.length} 篇</span><span>术语 ${ch.glossary.length} 条</span><span>研讨题 ${ch.socratic.length} 道</span><span>练习 ${ch.quiz.length} 题</span><span>闪卡 ${ch.flashcards.length} 张</span><span class="prog"><i style="width:${p}%"></i></span><span>${p}%</span></div>
  </div></section>
  <nav class="tabs"><div class="wrap">${tabs}</div></nav>
  <section class="panel"><div class="wrap" id="panel-body"></div></section>`;
  const body=document.getElementById('panel-body');
  scrollTop();
  if(tab==='overview')renderOverview(body,ch);
  else if(tab==='readings')renderReadings(body,ch);
  else if(tab==='glossary')renderGlossary(body,ch);
  else if(tab==='socratic')renderSocratic(body,ch);
  else if(tab==='quiz')renderQuiz(body,ch);
  else if(tab==='flashcards')renderFlash(body,ch);
  bindReveal();updateMini();
  const onTab=document.querySelector('.tab.on');if(onTab)onTab.scrollIntoView({inline:'center',block:'nearest'});
}

      </button>
      <div class="rd-body">
        <div class="rd-meta"><span><b>作者</b> ${esc(r.authors)}</span><span><b>年份</b> ${esc(r.year)}</span><span><b>出处</b> ${esc(r.venue)}</span></div>
        <div class="rd-sec"><div class="lb">核心论点</div><p>${esc(r.thesis)}</p></div>
        <div class="rd-sec"><div class="lb">理论框架</div><p>${esc(r.framework)}</p></div>
        <div class="rd-sec"><div class="lb">研究方法</div><p>${esc(r.method)}</p></div>
        <div class="rd-sec"><div class="lb">关键证据</div><p>${esc(r.evidence)}</p></div>
        <div class="rd-sec"><div class="lb">局限与争议</div><p>${esc(r.limits)}</p></div>

function renderGlossary(box,ch){
  box.innerHTML=`<h3 class="p-title rv">术语表</h3><p class="p-desc rv">本章 ${ch.glossary.length} 个核心术语，中英对照。输入任意关键词即时过滤。</p>
  <div class="gl-search rv"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="gl-q" type="search" placeholder="搜索术语（中 / 英 / 释义）…" aria-label="搜索术语"></div>
  <div id="gl-list"></div>`;
  const list=box.querySelector('#gl-list');
  function draw(f){
    const items=ch.glossary.filter(g=>!f||(g.en+g.zh+g.def+(g.src||'')).toLowerCase().includes(f));
    list.innerHTML=items.length?items.map(g=>`<div class="gl-item">
      <div class="row1"><span class="en">${esc(g.en)}</span><span class="zh">${esc(g.zh)}</span></div>
      <div class="def">${esc(g.def)}</div><div class="src">来源：${esc(g.src)}</div></div>`).join('')
      :`<div class="gl-empty">没有匹配的术语。</div>`;
  }
  draw('');
  box.querySelector('#gl-q').addEventListener('input',e=>draw(e.target.value.trim().toLowerCase()));
}

/* ================= socratic seminar ================= */
const AFFIRM=['答到点子上了，珍妮给你记一朵小红花。','很好，这个回答抓住了要害。','漂亮——看来这部分知识已经在你脑子里安家了。','正是如此。你组织语言的样子，已经有几分政治学者的味道了。','说得清楚又准确，这节课的小鱼干你没白吃。','说得好，关键概念一个都没漏。'];
function tutorAvatar(){return `<div class="avatar" aria-hidden="true">珍</div>`;}
function msgTutor(html,extra){
  return `<div class="msg tutor ${extra||''}">${tutorAvatar()}<div class="bub"><div class="who">猫大珍妮</div>${html}</div></div>`;
}
function msgUser(text){return `<div class="msg user"><div class="bub">${esc(text)}</div></div>`;}
function msgSys(text){return `<div class="msg sys"><div class="bub">— ${esc(text)} —</div></div>`;}
function resLabel(r){return r==='pass_first'?'<span class="res-tag ok">一次通过</span>':r==='pass_retry'?'<span class="res-tag mid">修正后通过</span>':r==='revealed'?'<span class="res-tag bad">已揭示答案</span>':'<span class="res-tag bad">已跳过</span>';}

function renderSocratic(box,ch){
  const s=chState(ch.id).soc;
  box.innerHTML=`<h3 class="p-title">苏格拉底课堂</h3>
  <p class="p-desc">猫大珍妮教授将围绕本章文献逐题追问。请在输入框放开作答——说清关键概念比辞藻重要，答错了她也不会挠你。</p>
  <div class="chat"><div class="chat-log" id="chat-log"></div>
    <div class="chat-input" id="chat-input-area"></div>
  </div>`;
  const log=box.querySelector('#chat-log');
  const inputArea=box.querySelector('#chat-input-area');

  function bubble(html){const n=el(html);log.appendChild(n);return n;}
  function typing(){
    const n=el(msgTutor('<span class="typing"><i></i><i></i><i></i></span>'));
    log.appendChild(n);n.scrollIntoView({block:'end',behavior:'smooth'});return n;
  }
  function tutorSay(html,done){
    const t=typing();
    const delay=window.matchMedia('(prefers-reduced-motion: reduce)').matches?60:Math.min(500+html.length*4,1600);
    setTimeout(()=>{t.remove();const n=bubble(msgTutor(html));n.scrollIntoView({block:'end',behavior:'smooth'});if(done)done();},delay);
  }
  function redrawInput(){inputArea.innerHTML='';buildInput();}

  /* ----- history rebuild ----- */
  function rebuildHistory(){
    log.innerHTML='';
    const introQs=ch.overview.coreQuestions.slice(0,3).map((q,k)=>`${k+1}. ${esc(q)}`).join('<br>');
    bubble(msgTutor(`同学你好呀，欢迎来到本章研讨课。我是猫大珍妮，这门课的带教教授——一只有十多年教龄、偶尔会在讲台上打瞌睡的猫。这一章《${esc(ch.title)}》，我们要一起追问这样几个问题：<br>${introQs}<br>接下来我会一题一题问你，共 ${ch.socratic.length} 题。别紧张：在我的课堂上，说错的答案比沉默有价值得多，而且我从来不挠答错的学生。`));
    if(s.idx>0){
      for(let i=0;i<s.idx&&i<ch.socratic.length;i++){
        const it=ch.socratic[i],r=s.results[i];
        bubble(msgTutor(`<span class="lvl-tag">第${i+1}题 · ${LEVELS[it.level]||'思考'}</span><div>${esc(it.q)}</div>${r?resLabel(r):''}`));
        if(s.answers[i])bubble(msgUser(s.answers[i]));
        else bubble(msgSys(r==='revealed'?'查看了参考答案':'跳过了本题'));
      }
      if(s.summary){renderSummaryCard();return;}
      bubble(msgSys(`已恢复到上次进度 · 第 ${s.idx+1} 题`));
    }
    if(s.summary){renderSummaryCard();return;}
    askCurrent(true);
  }

  function currentItem(){return ch.socratic[s.idx];}

  function askCurrent(instant){
    if(s.idx>=ch.socratic.length){finishChapter();return;}
    const it=currentItem();
    const html=`<span class="lvl-tag">第${s.idx+1}题 / 共${ch.socratic.length}题 · ${LEVELS[it.level]||'思考'}</span><div>${esc(it.q)}</div>`;
    if(instant){bubble(msgTutor(html));}
    else tutorSay(html);
    redrawInput();
  }

  /* ----- grading ----- */
  function grade(ans,it){
    const len=ans.replace(/\s/g,'').length;
    const kws=it.kw||[];
    const hits=kws.filter(k=>ans.includes(k));
    const rate=kws.length?hits.length/kws.length:(len>=15?1:0);
    return {len,hits,rate,pass:len>=15&&rate>=0.5};
  }

  function advance(){
    save();
    s.idx++;save();
    if(s.idx>=ch.socratic.length){setTimeout(finishChapter,700);}
    else{setTimeout(()=>askCurrent(false),700);}
  }

  function onSubmit(ans){
    const it=currentItem();if(!it)return;
    bubble(msgUser(ans));
    s.answers[s.idx]=ans;
    s.attempts[s.idx]=(s.attempts[s.idx]||0)+1;
    const att=s.attempts[s.idx];
    const g=grade(ans,it);
    save();redrawInput();
    if(g.pass){
      s.results[s.idx]=att===1?'pass_first':'pass_retry';save();
      const praise=AFFIRM[Math.floor(Math.random()*AFFIRM.length)];
      tutorSay(`${praise}${it.followup?`<div class="followup"><b>追问 · 不必作答</b>${esc(it.followup)}</div>`:''}`,advance);
    }else if(att>=2){
      tutorSay(`这道题确实有点刁钻，先别灰心——珍妮见过最优秀的学生也在这种题上栽过跟头。要不要先看看参考答案？看明白了我们再往前走，一样算你全程认真参与。<br><button class="act" id="btn-reveal">好的，看看参考答案</button>`,()=>{
        const b=document.getElementById('btn-reveal');
        if(b)b.addEventListener('click',()=>{
          b.remove();
          s.results[s.idx]='revealed';save();
          tutorSay(`<div class="ref-box"><div class="lb">参考答案</div>${esc(it.ref)}</div>对照一下自己的思路，差在哪儿一眼就能看见——这正是进步最快的地方。<br><button class="act" id="btn-nextq">明白了，进入下一题 →</button>`,()=>{
            const nb=document.getElementById('btn-nextq');
            if(nb)nb.addEventListener('click',advance);
          });
        });
      });
    }else if(g.hits.length>0){
      const missing=(it.kw||[]).filter(k=>!g.hits.includes(k)).slice(0,2);
      tutorSay(`方向是对的，就差一层窗户纸。你已经提到了「${g.hits.slice(0,2).join('」「')}」，很好。再往前想一步${missing.length?`——和「${missing.join('」「')}」有关的部分，该怎么补进来`:'，还能补充哪些关键概念'}？`);
    }else{
      tutorSay(`嗯……这个回答珍妮要轻轻按一下暂停。不是批评你，是这个方向容易滑到别处去。来，给你一个小提示，我们再试一次：<div class="followup"><b>提示</b>${esc(it.hint)}</div>`);
    }
  }

  function skipQuestion(){
    const it=currentItem();if(!it)return;
    s.results[s.idx]='skipped';s.answers[s.idx]=s.answers[s.idx]||'';
    save();
    bubble(msgSys('跳过了本题'));
    tutorSay(`好，这道题我们先放它一马。不过说好了，课后记得回《${esc(it.src)}》把它捡回来——珍妮会悄悄抽查的哦。`,advance);
  }

  function buildInput(){
    if(s.idx>=ch.socratic.length)return;
    const wrap=el(`<div>
      <div class="box">
        <textarea id="ans" rows="2" placeholder="写下你的回答（Ctrl+Enter 发送）…" aria-label="作答输入框"></textarea>
        <button class="send" id="send" aria-label="发送回答"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12l16-8-5 8 5 8-16-8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="chat-tools">
        <div class="left">
          <button id="skip">跳过本题</button>
          <button id="restart">重新开始本章对话</button>
        </div>
        <div class="chat-progress">第 <b>${s.idx+1}</b> / ${ch.socratic.length} 题 · 已答 ${Object.keys(s.results).length} 题</div>
      </div>
    </div>`);
    const ta=wrap.querySelector('#ans'),send=wrap.querySelector('#send');
    function submit(){const v=ta.value.trim();if(!v)return;ta.value='';onSubmit(v);}
    send.addEventListener('click',submit);
    ta.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();submit();}});
    ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';});
    wrap.querySelector('#skip').addEventListener('click',skipQuestion);
    wrap.querySelector('#restart').addEventListener('click',()=>{
      if(!confirm('确定要清空本章课堂记录，重新开始对话吗？'))return;
      const st=chState(ch.id);st.soc=blankCh().soc;save();
      renderChapter(ch,'socratic');
    });
    inputArea.appendChild(wrap);
  }

  /* ----- finish & summary ----- */
  function finishChapter(){
    const n=ch.socratic.length;
    const mastered=[],weak=[],srcs=new Set();
    ch.socratic.forEach((it,i)=>{
      const r=s.results[i];
      if(r==='pass_first')mastered.push(it.q);
      else{weak.push({q:it.q,r});if(it.src)srcs.add(it.src);}
    });
    const pf=mastered.length,ratio=n?pf/n:0;
    const grade=ratio>=0.7?['A','见解扎实']:ratio>=0.4?['B','稳步推进']:['C','需要温故'];
    s.summary={mastered,weak:weak.map(w=>w.q),weakRes:weak.map(w=>w.r),srcs:[...srcs],grade,ratio,ts:Date.now()};
    save();updateMini();
    bubble(msgTutor(`今天的研讨就到这里，${ch.socratic.length} 个问题我们一个不落地走完了——辛苦啦，先伸个懒腰。下面是这节课的小结，建议照着它温习薄弱的地方，下次见面珍妮可是要提问的。`));
    setTimeout(()=>{renderSummaryCard();const n2=log.lastElementChild;if(n2)n2.scrollIntoView({block:'start',behavior:'smooth'});},900);
    redrawInput();
  }

  function renderSummaryCard(){
    const sm=s.summary;if(!sm)return;
    inputArea.innerHTML='';
    const mastered=sm.mastered.length?sm.mastered.map(q=>`<li class="good">${esc(q)}</li>`).join(''):'<li class="good">（本轮没有一次通过的题目）</li>';
    const weak=sm.weak.length?sm.weak.map((q,i)=>`<li class="weak">${esc(q)} <span style="font-size:12px;color:var(--ink3)">${sm.weakRes[i]==='pass_retry'?'修正后通过':sm.weakRes[i]==='revealed'?'查看了答案':'已跳过'}</span></li>`).join(''):'<li class="weak">（没有薄弱点，全部一次通过）</li>';
    const srcs=sm.srcs.length?sm.srcs.map(x=>`<span>${esc(x)}</span>`).join(''):'<span>无需特别复习</span>';
    log.appendChild(el(`<div class="msg tutor">${tutorAvatar()}<div class="bub" style="max-width:94%;flex:1">
      <div class="who">学习小结 · ${esc(ch.title)}</div>
      <div class="sum-card" style="box-shadow:none;border:none;padding:6px 0 0">
        <div class="grade"><div class="g">${sm.grade[0]}</div><div class="gt"><b>${sm.grade[1]}</b><span>首轮答对 ${sm.mastered.length} / ${ch.socratic.length} 题（${Math.round(sm.ratio*100)}%）</span></div></div>
        <h5>已掌握要点</h5><ul>${mastered}</ul>
        <h5>薄弱点</h5><ul>${weak}</ul>
        <h5>建议复习文献</h5><div class="srcs">${srcs}</div><div style="margin-top:14px;font-size:13px;color:var(--ink3);font-style:italic">—— 猫大珍妮，写于研讨课结束后（刚睡醒）</div>
        <div class="actions">
          <button class="btn solid" id="sum-restart">重新开始本章对话</button>
          <a class="btn" href="#/${ch.id}/quiz">去检索练习 →</a>
        </div>
      </div>
    </div></div>`));
    const rb=document.getElementById('sum-restart');
    if(rb)rb.addEventListener('click',()=>{
      if(!confirm('确定要清空本章课堂记录（含本小结），重新开始吗？'))return;
      const st=chState(ch.id);st.soc=blankCh().soc;save();
      renderChapter(ch,'socratic');
    });
  }

  rebuildHistory();
  if(s.idx>0)window.scrollTo({top:document.body.scrollHeight,behavior:'auto'});
}

/* ================= quiz ================= */
function renderQuiz(box,ch){
  const st=chState(ch.id);
  let i=0,correct=0;const review=[];
  box.innerHTML=`<h3 class="p-title">检索练习</h3><p class="p-desc">合上书本，凭记忆作答。选择 / 判断即时反馈，简答自评。${st.quiz.best!=null?`历史最高分：<b style="color:var(--gold)">${st.quiz.best}</b> / ${ch.quiz.length}`:''}</p>
  <div class="quiz-shell" id="qz"></div>`;
  const shell=box.querySelector('#qz');

  function drawQ(){
    if(i>=ch.quiz.length){drawResult();return;}
    const q=ch.quiz[i];
    const typeName=q.type==='mc'?'选择题':q.type==='tf'?'判断题':'简答题';
    let inner=`<div class="qz-qbar"><span>第 ${i+1} / ${ch.quiz.length} 题</span><span class="bar"><i style="width:${(i)/ch.quiz.length*100}%"></i></span><span>已得分 ${correct}</span></div>
    <div class="qz-card"><span class="qz-type">${typeName}</span><div class="qz-q">${esc(q.q)}</div><div id="qz-main"></div><div id="qz-foot"></div></div>`;
    shell.innerHTML=inner;
    const main=shell.querySelector('#qz-main'),foot=shell.querySelector('#qz-foot');

    function explain(ok,verdict){
      return `<div class="qz-exp"><div class="verd ${ok?'ok':'no'}">${verdict}</div>${esc(q.explain)}<div style="margin-top:6px;font-size:12px;color:var(--ink3)">来源：${esc(q.src)}</div></div>`;
    }
    function nextBtn(){
      const d=el(`<div class="qz-actions"><button class="btn solid" id="qz-next">${i+1<ch.quiz.length?'下一题 →':'查看成绩'}</button></div>`);
      foot.appendChild(d);
      d.querySelector('#qz-next').addEventListener('click',()=>{i++;drawQ();});
    }

    if(q.type==='mc'){
      const letters='ABCD';
      main.innerHTML=q.options.map((o,k)=>`<button class="qz-opt" data-k="${k}"><span class="k">${letters[k]}</span><span>${esc(o)}</span></button>`).join('');
      let answered=false;
      main.querySelectorAll('.qz-opt').forEach(btn=>btn.addEventListener('click',()=>{
        if(answered)return;answered=true;
        const k=+btn.dataset.k,ok=k===q.answer;
        if(ok)correct++;
        review.push({q:q.q,ok,ex:q.explain});
        main.querySelectorAll('.qz-opt').forEach(b=>{b.disabled=true;const kk=+b.dataset.k;if(kk===q.answer)b.classList.add('right');else if(kk===k)b.classList.add('wrong');});
        foot.innerHTML=explain(ok,ok?'回答正确 ✓':'回答错误 ✗');
        nextBtn();
      }));
    }else if(q.type==='tf'){
      main.innerHTML=`<div class="qz-tf-row"><button class="qz-opt" data-v="1"><span>✓ 正确</span></button><button class="qz-opt" data-v="0"><span>✗ 错误</span></button></div>`;
      let answered=false;
      main.querySelectorAll('.qz-opt').forEach(btn=>btn.addEventListener('click',()=>{
        if(answered)return;answered=true;
        const v=btn.dataset.v==='1',ok=v===q.answer;
        if(ok)correct++;
        review.push({q:q.q,ok,ex:q.explain});
        main.querySelectorAll('.qz-opt').forEach(b=>{b.disabled=true;const bv=b.dataset.v==='1';if(bv===q.answer)b.classList.add('right');else if(b===btn)b.classList.add('wrong');});
        foot.innerHTML=explain(ok,ok?'判断正确 ✓':`判断错误 ✗（正确答案：${q.answer?'正确':'错误'}）`);
        nextBtn();
      }));
    }else{
      main.innerHTML=`<div class="qz-sa"><textarea id="sa-ta" placeholder="先凭记忆写下你的答案要点…" aria-label="简答作答区"></textarea>
        <div class="qz-actions"><button class="btn" id="sa-show">对照参考答案</button></div></div>`;
      main.querySelector('#sa-show').addEventListener('click',()=>{
        main.querySelector('#sa-show').remove();
        foot.innerHTML=`<div class="qz-exp"><div class="verd ok">参考答案</div>${esc(q.ref)}
          <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2);font-size:13px;color:var(--ink2)">${esc(q.explain)}</div>
          <div style="margin-top:6px;font-size:12px;color:var(--ink3)">来源：${esc(q.src)}</div></div>
        <div class="qz-actions"><span style="align-self:center;font-size:13.5px;color:var(--ink2)">自评：</span>
          <button class="btn" id="sa-ok" style="border-color:var(--green);color:var(--green)">我答对了</button>
          <button class="btn" id="sa-no" style="border-color:var(--red);color:var(--red)">需要复习</button></div>`;
        foot.querySelector('#sa-ok').addEventListener('click',()=>{correct++;review.push({q:q.q,ok:true,ex:q.ref});i++;drawQ();});
        foot.querySelector('#sa-no').addEventListener('click',()=>{review.push({q:q.q,ok:false,ex:q.ref});i++;drawQ();});
      });
    }
  }

  function drawResult(){
    const total=ch.quiz.length;
    st.quiz.last=correct;st.quiz.done=true;
    if(st.quiz.best==null||correct>st.quiz.best)st.quiz.best=correct;
    save();updateMini();
    shell.innerHTML=`<div class="qz-card qz-result">
      <div class="score">${correct}<small> / ${total}</small></div>
      <div class="best">历史最高：${st.quiz.best} / ${total} · 本次已存档</div>
      <div class="qz-actions" style="justify-content:center;margin-top:24px">
        <button class="btn solid" id="qz-retry">重新测验</button>
        <button class="btn" id="qz-review-btn">逐题回顾</button>
        <a class="btn ghost" href="#/${ch.id}/flashcards">去闪卡 →</a>
      </div>
      <div class="qz-review" id="qz-review" style="display:none">
        ${review.map((r,k)=>`<div class="rv-item"><span class="qq">${k+1}. ${esc(r.q)}</span><span class="st res-tag ${r.ok?'ok':'bad'}">${r.ok?'答对':'需复习'}</span><p>${esc(r.ex)}</p></div>`).join('')}
      </div>
    </div>`;
    shell.querySelector('#qz-retry').addEventListener('click',()=>{i=0;correct=0;review.length=0;drawQ();});
    shell.querySelector('#qz-review-btn').addEventListener('click',()=>{
      const rv=shell.querySelector('#qz-review');
      rv.style.display=rv.style.display==='none'?'block':'none';
    });
  }
  drawQ();
}

/* ================= flashcards ================= */
function renderFlash(box,ch){
  const st=chState(ch.id);
  const cards=ch.flashcards;
  let i=0,flipped=false;
  box.innerHTML=`<h3 class="p-title">闪卡记忆</h3><p class="p-desc">看正面回忆，点卡片翻面核对，然后诚实标记"认识 / 不认识"。</p>
  <div class="fc-shell" id="fc"></div>`;
  const shell=box.querySelector('#fc');

  /* jump to first unseen card */
  while(i<cards.length&&st.flash.seen[i])i++;

  function drawCard(){
    flipped=false;
    if(i>=cards.length){drawDone();return;}
    const c=cards[i];
    st.flash.seen[i]=true;save();updateMini();
    const knownCount=Object.keys(st.flash.known).length;
    shell.innerHTML=`<div class="fc-meta"><span>第 ${i+1} / ${cards.length} 张</span><span class="bar"><i style="width:${(i)/cards.length*100}%"></i></span><span>已掌握 ${knownCount}</span></div>
    <div class="fc-stage"><div class="fc-card" id="fc-card" role="button" tabindex="0" aria-label="点击翻面">
      <div class="fc-face front"><span class="src">${esc(c.src)}</span><div class="lb">TERM · 正面</div><div class="txt">${esc(c.front)}</div><div class="hint">点击卡片查看背面</div></div>
      <div class="fc-face back"><span class="src">${esc(c.src)}</span><div class="txt">${esc(c.back)}</div><div class="hint">标记认识或不认识，进入下一张</div></div>
    </div></div>
    <div class="fc-btns">
      <button class="btn no" id="fc-no">✗ 不认识</button>
      <button class="btn yes" id="fc-yes">✓ 认识</button>
    </div>`;
    const card=shell.querySelector('#fc-card');
    function flip(){flipped=!flipped;card.classList.toggle('flip',flipped);}
    card.addEventListener('click',flip);
    card.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}});
    shell.querySelector('#fc-yes').addEventListener('click',()=>{st.flash.known[i]=true;save();i++;drawCard();});
    shell.querySelector('#fc-no').addEventListener('click',()=>{delete st.flash.known[i];save();i++;drawCard();});
  }

  function drawDone(){
    const knownCount=Object.keys(st.flash.known).length;
    const pct=Math.round(knownCount/cards.length*100);
    shell.innerHTML=`<div class="qz-card fc-done">
      <div class="pct">${pct}%</div>
      <p>本章 ${cards.length} 张闪卡已全部过完，掌握 ${knownCount} 张。<br>${pct>=80?'掌握得很好，可以过两天再来一轮。':'建议"重置重练"，重点攻克不认识的卡片。'}</p>
      <div class="qz-actions" style="justify-content:center">
        <button class="btn solid" id="fc-reset">重置重练</button>
        <button class="btn" id="fc-again">不重置，再过一遍</button>
        <a class="btn ghost" href="#/${ch.id}/socratic">回课堂 →</a>
      </div>
    </div>`;
    shell.querySelector('#fc-reset').addEventListener('click',()=>{st.flash=blankCh().flash;save();i=0;drawCard();});
    shell.querySelector('#fc-again').addEventListener('click',()=>{i=0;drawCard();});
  }

  if(cards.length===0){shell.innerHTML='<div class="gl-empty">本章暂无闪卡。</div>';return;}
  if(i>=cards.length)drawDone();else drawCard();
}

/* ================= boot ================= */
route();updateMini();
</script>
