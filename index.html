<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>政治学经典阅读 · 苏格拉底研讨课</title>
<style>
:root{
  --paper:#faf7f2; --paper2:#f3eee5; --ink:#20222b; --ink2:#5b5e6b; --ink3:#8a8d99;
  --line:#e4ddcf; --line2:#d5cdbb;
  --accent:#1c5751; --accent-d:#123f3a; --accent-bg:rgba(28,87,81,.07);
  --gold:#b08d57; --gold-bg:rgba(176,141,87,.10);
  --red:#a4443c; --green:#3c7a4e;
  --serif:Georgia,'Songti SC','STSong','SimSun',serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --radius:14px;
  --shadow:0 1px 2px rgba(32,34,43,.05),0 6px 24px rgba(32,34,43,.06);
  --shadow-h:0 2px 4px rgba(32,34,43,.06),0 14px 36px rgba(32,34,43,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
::selection{background:rgba(176,141,87,.28)}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.35}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* ---------- top nav ---------- */
#topbar{position:sticky;top:0;z-index:50;background:#22232c;color:#f2efe7;box-shadow:0 1px 0 rgba(0,0,0,.25)}
#topbar .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{font-family:var(--serif);font-size:16px;letter-spacing:.06em;color:#f2efe7;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand svg{flex:none}
.brand b{color:var(--gold);font-weight:600}
.crumb{font-size:13px;color:#a9a59a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.crumb span{color:#e8e2d4}
.mini-prog{display:flex;align-items:center;gap:8px;font-size:12px;color:#a9a59a;white-space:nowrap}
.mini-prog .bar{width:84px;height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.mini-prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#d8bd8d);border-radius:2px;transition:width .5s ease}

/* ---------- reveal animation ---------- */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:none}
  *{animation-duration:.001s!important;transition-duration:.001s!important}
  html{scroll-behavior:auto}
}

/* ---------- hero ---------- */
.hero{padding:84px 0 56px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(28,87,81,.08),transparent 65%);pointer-events:none}
.hero .kicker{font-size:13px;letter-spacing:.35em;color:var(--gold);margin-bottom:18px}
.hero h1{font-size:clamp(30px,5vw,50px);letter-spacing:.02em;margin-bottom:18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.sub{max-width:640px;color:var(--ink2);font-size:16.5px;margin-bottom:34px}
.hero-row{display:flex;align-items:center;gap:44px;flex-wrap:wrap}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct b{font-family:var(--serif);font-size:26px}
.ring .pct span{font-size:11px;color:var(--ink3);letter-spacing:.1em}
.hero-stats{display:flex;gap:36px;flex-wrap:wrap}
.hstat b{display:block;font-family:var(--serif);font-size:26px;color:var(--accent-d)}
.hstat span{font-size:13px;color:var(--ink2)}
.hstat{border-left:2px solid var(--line2);padding-left:16px}

/* ---------- philosophy ---------- */
.philo{padding:56px 0;border-bottom:1px solid var(--line)}
.philo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:30px}
.philo-item{padding:26px 24px;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
.philo-item .num{font-family:var(--serif);font-size:15px;color:var(--gold);letter-spacing:.2em;margin-bottom:10px}
.philo-item h3{font-size:19px;margin-bottom:8px}
.philo-item p{font-size:14px;color:var(--ink2)}
.sec-head{display:flex;align-items:baseline;gap:16px}
.sec-head .no{font-family:var(--serif);color:var(--gold);font-size:14px;letter-spacing:.25em}
.sec-head h2{font-size:26px}
.sec-head .rule{flex:1;height:1px;background:var(--line2)}

/* ---------- chapter cards ---------- */
.chapters{padding:56px 0 72px}
.ch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:32px}
.ch-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 22px 20px;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.7,.3,1),box-shadow .35s ease,border-color .35s ease;position:relative;overflow:hidden}
.ch-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-h);border-color:var(--line2)}
.ch-card::before{content:attr(data-no);position:absolute;right:14px;top:2px;font-family:var(--serif);font-size:64px;color:rgba(28,87,81,.07);line-height:1}
.ch-card .cno{font-size:12px;letter-spacing:.3em;color:var(--gold);margin-bottom:10px}
.ch-card h3{font-size:19px;margin-bottom:4px}
.ch-card .en{font-size:12.5px;color:var(--ink3);font-style:italic;font-family:var(--serif);margin-bottom:14px}
.ch-card .meta{font-size:13px;color:var(--ink2);margin-bottom:14px}
.ch-card .prog{height:5px;border-radius:3px;background:var(--paper2);overflow:hidden;margin-bottom:6px}
.ch-card .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#4d8d84);border-radius:3px;transition:width .6s ease}
.ch-card .pnum{font-size:12px;color:var(--ink3);margin-bottom:16px}
.ch-card .go{margin-top:auto;align-self:flex-start;font-size:14px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:7px 18px;transition:background .25s,color .25s;min-height:44px;display:inline-flex;align-items:center}
.ch-card .go:hover{background:var(--accent);color:#fff}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:40px 0 56px;margin-top:20px}
footer .note{font-size:13.5px;color:var(--ink2);max-width:640px}
footer .brandline{font-family:var(--serif);font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:var(--ink)}
footer .privacy{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--accent-d);background:var(--accent-bg);border:1px solid rgba(28,87,81,.18);padding:8px 14px;border-radius:999px}

/* ---------- chapter page ---------- */
.ch-hero{padding:52px 0 30px;border-bottom:1px solid var(--line)}
.ch-hero .cno{font-size:13px;letter-spacing:.35em;color:var(--gold);margin-bottom:10px}
.ch-hero h1{font-size:clamp(26px,4vw,38px)}
.ch-hero .en{font-family:var(--serif);font-style:italic;color:var(--ink3);margin-top:6px}
.ch-hero .meta{display:flex;gap:22px;margin-top:16px;font-size:13.5px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.ch-hero .meta .prog{width:140px;height:5px;border-radius:3px;background:var(--paper2);overflow:hidden;display:inline-block;vertical-align:middle}
.ch-hero .meta .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#4d8d84)}
.tabs{position:sticky;top:56px;z-index:40;background:rgba(250,247,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:14px;color:var(--ink2);padding:8px 16px;border-radius:999px;border:1px solid transparent;transition:all .25s;min-height:40px;white-space:nowrap}
.tab:hover{color:var(--accent);background:var(--accent-bg)}
.tab.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
.panel{padding:44px 0 80px;min-height:50vh}
.panel h3.p-title{font-size:22px;margin-bottom:6px}
.panel .p-desc{color:var(--ink2);font-size:14px;margin-bottom:28px}

/* overview */
.ov-theme{font-family:var(--serif);font-size:18.5px;line-height:1.9;padding:26px 28px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;margin-bottom:34px}
.ov-block{margin-bottom:36px}
.ov-block h4{font-size:15px;letter-spacing:.2em;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.ov-block h4::after{content:"";flex:1;height:1px;background:var(--line)}
.ov-q{list-style:none;counter-reset:q}
.ov-q li{counter-increment:q;padding:14px 0 14px 52px;position:relative;border-bottom:1px dashed var(--line);font-size:15.5px}
.ov-q li::before{content:counter(q,decimal-leading-zero);position:absolute;left:0;top:14px;font-family:var(--serif);color:var(--accent);font-size:17px}
.ov-thread{font-size:15px;color:var(--ink2);line-height:1.95;background:var(--paper2);padding:22px 24px;border-radius:var(--radius)}
.steps{list-style:none}
.steps li{position:relative;padding:0 0 22px 40px;font-size:15px}
.steps li::before{content:"";position:absolute;left:9px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.steps li::after{content:"";position:absolute;left:13px;top:24px;bottom:-2px;width:1px;background:var(--line2)}
.steps li:last-child::after{display:none}
.ov-dialog{font-size:15px;color:var(--ink2);line-height:1.95;padding:22px 24px;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}

/* readings */
.rd-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px;overflow:hidden;transition:box-shadow .3s}
.rd-card:hover{box-shadow:var(--shadow)}
.rd-head{width:100%;text-align:left;padding:20px 24px;display:flex;gap:16px;align-items:flex-start;min-height:44px}
.rd-head .idx{font-family:var(--serif);color:var(--gold);font-size:15px;flex:none;padding-top:2px}
.rd-head .tt{flex:1}
.rd-head .tt b{font-family:var(--serif);font-size:17px;font-weight:600;display:block;line-height:1.5}
.rd-head .tt .abs{font-size:13.5px;color:var(--ink2);margin-top:6px}
.rd-head .caret{flex:none;color:var(--ink3);transition:transform .3s;padding-top:4px}
.rd-card.open .caret{transform:rotate(180deg)}
.rd-body{display:none;padding:0 24px 24px 63px}
.rd-card.open .rd-body{display:block}
.rd-meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--ink2);background:var(--paper2);border-radius:10px;padding:12px 16px;margin-bottom:18px}
.rd-meta b{color:var(--ink);font-weight:600}
.rd-sec{margin-bottom:16px}
.rd-sec .lb{font-size:12px;letter-spacing:.25em;color:var(--accent);margin-bottom:6px;font-weight:600}
.rd-sec p{font-size:14.5px;color:var(--ink2);line-height:1.9}
.rd-quote{margin:10px 0 18px;padding:16px 20px;border-left:3px solid var(--gold);background:var(--gold-bg);border-radius:0 10px 10px 0}
.rd-quote .en{font-family:var(--serif);font-size:15.5px;line-height:1.8;color:var(--ink)}
.rd-quote .zh{font-size:13px;color:var(--ink2);margin-top:6px}
.rd-src{font-size:12px;color:var(--ink3);margin-top:4px}

/* glossary */
.gl-search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 18px;margin-bottom:22px;max-width:460px}
.gl-search input{flex:1;border:none;outline:none;background:none;height:46px;font-size:15px}
.gl-search svg{color:var(--ink3);flex:none}
.gl-item{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:12px}
.gl-item .row1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.gl-item .en{font-family:var(--serif);font-weight:600;font-size:16px}
.gl-item .zh{color:var(--accent-d);font-weight:600;font-size:15px}
.gl-item .def{font-size:14px;color:var(--ink2);margin-top:6px}
.gl-item .src{font-size:12px;color:var(--ink3);margin-top:6px}
.gl-empty{color:var(--ink3);text-align:center;padding:40px 0;font-size:14px}

/* ---------- socratic chat ---------- */
.chat{max-width:780px;margin:0 auto}
.chat-log{padding:8px 0 20px}
.msg{display:flex;gap:12px;margin-bottom:18px;animation:msgIn .45s ease both}
@keyframes msgIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.msg.tutor .avatar{position:relative;flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent-d);color:#f0e8d8;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;box-shadow:inset 0 0 0 2px rgba(176,141,87,.55)}
.msg .bub{max-width:82%;padding:14px 18px;border-radius:4px 16px 16px 16px;background:#fff;border:1px solid var(--line);font-size:15px;line-height:1.85;box-shadow:var(--shadow)}
.msg.tutor .avatar::before,.msg.tutor .avatar::after{content:'';position:absolute;top:-6px;width:0;height:0;border:5px solid transparent;border-bottom:9px solid var(--accent-d)}
.msg.tutor .avatar::before{left:7px;transform:rotate(-20deg)}
.msg.tutor .avatar::after{right:7px;transform:rotate(20deg)}
.msg.tutor .who{font-size:12px;color:var(--gold);letter-spacing:.15em;margin-bottom:4px}
.msg.user{flex-direction:row-reverse}
.msg.user .bub{background:var(--accent);color:#f4f1e9;border:none;border-radius:16px 4px 16px 16px}
.msg.sys{justify-content:center}
.msg.sys .bub{background:none;border:none;box-shadow:none;color:var(--ink3);font-size:12.5px;letter-spacing:.1em;padding:4px}
.lvl-tag{display:inline-block;font-size:11.5px;letter-spacing:.12em;color:var(--accent-d);background:var(--accent-bg);border:1px solid rgba(28,87,81,.2);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.res-tag{display:inline-block;font-size:11.5px;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle}
.res-tag.ok{background:rgba(60,122,78,.12);color:var(--green)}
.res-tag.mid{background:var(--gold-bg);color:var(--gold)}
.res-tag.bad{background:rgba(164,68,60,.1);color:var(--red)}
.bub .ref-box{margin-top:10px;padding:12px 14px;background:var(--paper2);border-radius:10px;font-size:14px;line-height:1.85}
.bub .ref-box .lb{font-size:11px;letter-spacing:.25em;color:var(--gold);margin-bottom:4px}
.bub button.act{margin-top:12px;display:inline-flex;align-items:center;font-size:13.5px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:8px 18px;min-height:40px;transition:all .25s}
.bub button.act:hover{background:var(--accent);color:#fff}
.bub button.act.ghost{border-color:var(--line2);color:var(--ink2)}
.bub button.act.ghost:hover{background:var(--paper2);color:var(--ink)}
.bub .followup{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;color:var(--ink2)}
.bub .followup b{color:var(--gold);font-weight:600;font-size:12px;letter-spacing:.15em;display:block;margin-bottom:2px}
.typing{display:inline-flex;gap:5px;padding:6px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
.chat-input{position:sticky;bottom:0;background:linear-gradient(to top,var(--paper) 78%,transparent);padding:16px 0 18px}
.chat-input .box{display:flex;gap:10px;background:#fff;border:1px solid var(--line2);border-radius:16px;padding:10px;box-shadow:var(--shadow)}
.chat-input textarea{flex:1;border:none;outline:none;resize:none;background:none;font-size:15px;line-height:1.6;max-height:120px;padding:8px 10px}
.chat-input .send{flex:none;align-self:flex-end;width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .25s}
.chat-input .send:hover{background:var(--accent-d)}
.chat-input .send:disabled{background:var(--line2);cursor:not-allowed}
.chat-tools{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--ink3)}
.chat-tools .left{display:flex;gap:14px;align-items:center}
.chat-tools button{color:var(--ink3);font-size:12.5px;padding:6px 4px;min-height:32px}
.chat-tools button:hover{color:var(--accent)}
.chat-progress{font-size:12.5px;color:var(--ink2)}
.chat-progress b{color:var(--accent-d)}
/* summary card */
.sum-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);margin-top:8px}
.sum-card .grade{display:flex;align-items:center;gap:18px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.sum-card .grade .g{font-family:var(--serif);font-size:44px;color:var(--gold);line-height:1}
.sum-card .grade .gt b{display:block;font-size:17px}
.sum-card .grade .gt span{font-size:13px;color:var(--ink2)}
.sum-card h5{font-size:13px;letter-spacing:.2em;color:var(--accent);margin:16px 0 8px}
.sum-card ul{list-style:none}
.sum-card li{font-size:14px;color:var(--ink2);padding:7px 0 7px 22px;position:relative;border-bottom:1px dashed var(--line)}
.sum-card li::before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;border-radius:50%}
.sum-card li.good::before{background:var(--green)}
.sum-card li.weak::before{background:var(--gold)}
.sum-card .srcs{display:flex;flex-wrap:wrap;gap:8px}
.sum-card .srcs span{font-size:12.5px;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink2)}
.sum-card .actions{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}

/* buttons shared */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;border-radius:999px;padding:10px 22px;min-height:44px;border:1px solid var(--accent);color:var(--accent);transition:all .25s}
.btn:hover{background:var(--accent);color:#fff}
.btn.solid{background:var(--accent);color:#fff}
.btn.solid:hover{background:var(--accent-d)}
.btn.ghost{border-color:var(--line2);color:var(--ink2)}
.btn.ghost:hover{background:var(--paper2);color:var(--ink)}

/* quiz */
.quiz-shell{max-width:780px;margin:0 auto}
.qz-qbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:14px}
.qz-qbar .bar{flex:1;height:4px;border-radius:2px;background:var(--paper2);margin:0 16px;overflow:hidden}
.qz-qbar .bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.qz-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
.qz-type{display:inline-block;font-size:11.5px;letter-spacing:.15em;color:var(--gold);border:1px solid rgba(176,141,87,.4);border-radius:999px;padding:3px 12px;margin-bottom:14px}
.qz-q{font-family:var(--serif);font-size:19px;line-height:1.7;margin-bottom:20px}
.qz-opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;font-size:15px;transition:all .2s;min-height:44px;background:#fff}
.qz-opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-bg)}
.qz-opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2)}
.qz-opt.right{border-color:var(--green);background:rgba(60,122,78,.08)}
.qz-opt.right .k{background:var(--green);border-color:var(--green);color:#fff}
.qz-opt.wrong{border-color:var(--red);background:rgba(164,68,60,.07)}
.qz-opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
.qz-opt:disabled{cursor:default;color:var(--ink2)}
.qz-tf-row{display:flex;gap:12px}
.qz-tf-row .qz-opt{flex:1;justify-content:center}
.qz-exp{margin-top:16px;padding:16px 18px;border-radius:12px;font-size:14px;line-height:1.85;background:var(--paper2);border-left:3px solid var(--gold);animation:msgIn .4s ease both}
.qz-exp .verd{font-weight:600;margin-bottom:4px}
.qz-exp .verd.ok{color:var(--green)}.qz-exp .verd.no{color:var(--red)}
.qz-sa textarea{width:100%;min-height:120px;border:1px solid var(--line2);border-radius:12px;padding:14px;font-size:15px;line-height:1.7;outline:none;resize:vertical;background:#fff}

.qz-result .score{font-family:var(--serif);font-size:56px;color:var(--accent-d)}

.fc-meta .bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.fc-stage{perspective:1400px;margin-bottom:24px}

.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;text-align:center}
.fc-face.front .lb{font-size:11.5px;letter-spacing:.3em;color:var(--gold);margin-bottom:16px}
.fc-face.front .txt{font-family:var(--serif);font-size:24px;line-height:1.6}
.fc-face.back{transform:rotateY(180deg);background:var(--accent-d);color:#f2efe7}
.fc-face.back .txt{font-size:16px;line-height:1.9}
.fc-face .hint{position:absolute;bottom:16px;font-size:12px;color:var(--ink3)}
.fc-face.back .hint{color:rgba(242,239,231,.5)}
.fc-face .src{position:absolute;top:16px;right:20px;font-size:11px;color:var(--ink3)}
.fc-face.back .src{color:rgba(242,239,231,.5)}
.fc-btns{display:flex;gap:14px;justify-content:center}
.fc-btns .btn{min-width:140px}
.fc-btns .no{border-color:rgba(164,68,60,.5);color:var(--red)}
.fc-btns .no:hover{background:var(--red);color:#fff}
.fc-btns .yes{border-color:var(--green);color:var(--green)}
.fc-btns .yes:hover{background:var(--green);color:#fff}
.fc-done{text-align:center;padding:36px 10px}
.fc-done .pct{font-family:var(--serif);font-size:52px;color:var(--accent-d)}
.fc-done p{color:var(--ink2);font-size:14.5px;margin:10px 0 24px}

/* empty/back */
.backlink{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2);margin-bottom:18px;padding:6px 0}
.backlink:hover{color:var(--accent)}

{"course":"政治学经典阅读 · 苏格拉底研讨课","chapters":[{"id":"ch01","folder":"1-2 Introduction + Political Ideologies","title":"导论与政治意识形态","subtitle":"Introduction and Political Ideologies","overview":{"theme":"从一个日常困惑开始：为什么小区装一部电梯、定一条垃圾分类规则都要反复协商？本章回答一个双重导论问题：政治是什么、政治知识如何被生产出来。海伍德教材界定政治、政体与政治意识形态等基本概念，秦亚青则以西方国际关系学为案例，展示现实主义、自由主义、建构主义三大理论范式围绕冲突与合作问题展开竞争的知识谱系。","coreQuestions":["什么是政治？不同的思想家和学术传统如何理解政治，政治活动发生在哪些领域？","政治研究能否成为科学？规范、经验与科学三种研究取向各有什么得失？","什么是政治意识形态？自由主义、社会主义等主要意识形态的核心原则与内部张力是什么？","国际关系中冲突与合作何者为主？现实主义、自由主义、建构主义分别给出什么答案？","理论范式如何竞争与演进？意识形态会终结吗，非西方的政治理论何以可能？"],"thread":"本章以'概念—方法—范式'三级递进组织学习。首先通过海伍德第1章掌握政治的四种界定（政府艺术、公共事务、妥协共识、权力）与政治研究的规范、经验、科学取向，建立概念与方法的工具箱；第2章的政体分类训练比较分析能力；第3章引入政治意识形态，指出一切政治分析都在某种意识形态范式内进行。随后秦亚青的文集把这一命题落到国际关系学科：先以知识谱系框架总览现实主义—新自由主义—建构主义的理论竞争宏线，再分别精读现实主义（权力）、自由主义（制度）、建构主义（文化）三篇评析，最后回到体系理论比较与学科反思，完成从'学概念'到'看范式打架'再到'批判性综合'的进阶。","path":["第一步：从'小区装电梯''大选民调翻车'等日常场景切入，精读海伍德第1章，弄清政治的四种界定与政治研究的四种取向，回答'政治能否科学化'。","第二步：读海伍德第2、3章，掌握政体分类的比较逻辑与意识形态概念及其主要形态。","第三步：读秦亚青'知识谱系'一文，用冲突与合作主题串起现实主义、自由主义、建构主义三座里程碑。","第四步：依次精读现实主义、自由主义、建构主义三篇评析，逐派把握其核心命题、思想渊源与遭到的批判。","第五步：以'权力·制度·文化'三种体系理论的比较做综合，并反思体系理论的科学性代价与西方中心问题。"],"dialogue":"海伍德与秦亚青构成'总—分'对话：海伍德说政治与冲突、合作密不可分，秦亚青展示的正是国际关系学界围绕冲突与合作的三次大论战。现实主义（卡尔、摩根索、沃尔兹）认定冲突根植于人性或无政府性，合作脆弱；新自由制度主义（基欧汉）承认无政府性却论证制度可以促成合作；建构主义（温特）则釜底抽薪，宣称无政府状态本身是国家实践建构的产物。这场论战又回响着教材的意识形态命题：秦亚青借马克思主义批判新自由制度主义——国际制度服务于既定霸权体系，恰是马克思'意识形态掩盖权力关系'论断的国际版；而海伍德'意识形态终结'之辩与秦亚青'范式竞争推动知识再生产'的判断相互印证——意识形态与理论之争远未终结。"},"readings":[{"file":"政治学 1-3.pdf","title":"《政治学》（第三版）第1—3章：什么是政治？／政府、体系和政体／政治意识形态（Politics, 3rd edn, Chs.1-3）","authors":"安德鲁·海伍德（Andrew Heywood）","year":"2007（英文第三版，中译本教材）","venue":"《政治学》（第三版）中译本，公共管理类经典译丛教材","thesis":"政治是人们制定、维系和修正其一般生活规则的活动，与冲突及合作密不可分。原文列全四种界定：①作为政府艺术的政治——政治即国家机构与公职人员的事务；②作为公共事务的政治——政治只存在于公共领域，与私人生活分开；③作为妥协和共识的政治——政治是以辩论、谈判而非武力解决冲突的方式；④作为权力和资源分配的政治——权力存在于一切社会关系，家庭学校皆有政治。政治研究有规范、经验、科学与理性选择四取向，彻底价值中立难以实现。意识形态是内在一致的思想观念体系，为政治行动提供基础，自由主义、社会主义各有核心原则，'终结'论本身亦是意识形态。","framework":"概念—方法—范式三层递进：①界定政治的四种传统理解（政府艺术、公共事务、妥协共识、权力），并说明'政治领域'随界定由窄到宽；②区分政治哲学（规范）、经验描述、行为主义科学、形式政治理论（理性选择）四种研究取向；③政体分类用三把尺子：亚里士多德'谁统治／谁受益'六分法、冷战'三个世界'划分、现代五类政体（西方多头制、新民主制、东亚政体、伊斯兰政体、军事政体）；④按意识形态家族（自由主义、保守主义、社会主义等）梳理核心要素与内部传统。","method":"教科书式概念辨析与政治思想史梳理，辅以比较方法讨论政体分类（亚里士多德六分法、三个世界、五种现代政体），并对行为主义、理性选择等研究方法做元理论反思。","evidence":"亚里士多德分析158个希腊城邦建立政体分类；伊斯顿'价值的权威性分配'与政治系统模型；克里克《为政治辩护》界定妥协政治；达尔《多头制》以'容忍反对声音＋广泛政治参与'定义多头制。自由主义七要素：个人主义、自由、理性、平等、宽容、同意、宪政；社会主义六要素：共同体、博爱、社会平等、需求、社会阶级、公有制。终结论谱系：贝尔《意识形态的终结》（1960）'经济战胜了政治'、福山《历史的终结》、吉登斯'超越左右'、后现代'宏大叙事'；马克思《德意志意识形态》'统治阶级的思想'。","limits":"作为导论教材，各主题只能点到为止；其政体分类与'多头制'概念以西方经验为中心，作者自承任何分类都有简单化与种族中心主义风险；对非西方政治形态着墨有限。","quotes":[{"en":"政治在最广义上是人们制定、维系和修正其一般生活规则的活动。","zh":"—"},{"en":"统治阶级的思想在每一时代都是占统治地位的思想。这就是说，一个阶级是社会上占统治地位的物质力量，同时也是社会上占统治地位的精神力量。支配着物质生产资料的阶级，同时也支配着精神生产的资料。","zh":"（引马克思、恩格斯《德意志意识形态》）"},{"en":"哲学家们只是用不同的方式解释世界，而问题在于改变世界。","zh":"（引马克思《关于费尔巴哈的提纲》，1845）"}]},{"file":"权力·制度·文化 1-2.pdf","title":"西方国际关系学——知识谱系与理论发展；权力·制度·文化——国际政治学的三种体系理论","authors":"秦亚青","year":"2003；2002","venue":"前篇原载《外交学院学报》2003年第3期；后篇原载《世界经济与政治》2002年第6期，均收入文集《权力·制度·文化》","thesis":"西方国际关系学知识谱系含两要素：研究主题（冲突与合作，即战争与和平）与发展宏线（现实主义—新自由主义—社会建构主义的学理论战）。三大体系理论都以科学实在论为认识论、以国家为体系单位，但体系特征不同：①结构现实主义——国际体系结构（大国间权力分配），核心命题'结构选择'；②新自由制度主义——国际制度，'制度选择'；③温和建构主义——国际体系文化（观念分配），'文化选择'。对科学性的追求成就了宏理论，也削弱了其解释力。","framework":"①以库恩范式论、波普尔证伪、拉卡托斯研究纲领搭建'知识谱系'分析框架（研究主题＋发展宏线），以里程碑著作重建理论竞争轨迹；②用沃尔兹体系理论三要素（体系设定、体系特征与单位特征、二者关系）对三大理论做同构比较，以'S—→U'简化模型对照因果或建构逻辑；③以共时性、客观性、简约性三特征衡量体系理论的科学性，并逐一检视其代价。","method":"学科史梳理与理论比较研究：以标志性著作（摩根索1948、沃尔兹1979、基欧汉1984、温特1999）为里程碑重建学理脉络，并以'S—→U'简化模型对照三种理论的因果或建构逻辑。","evidence":"里程碑：摩根索《国家间政治》（1948）起现实主义主导三十年（1948—1979）；沃尔兹《国际政治理论》（1979）；基欧汉、奈《权力与相互依赖》（1977）与《霸权之后》（1984）开启两'新'论战；温特《无政府状态是国家造就的》（1992）成为建构主义宣言；1998年《国际组织》纪念专辑承认三足鼎立。后篇指出体系理论三重代价：共时性抹杀历史（1648年前无国家体系、中国朝贡体系亦非国家体系）、客观性回避结构—能动者互构（温特体系化后也弱化双向互构）、简约性排除国内政治（国家被假定为单一行为体）。","limits":"作者自认三种理论的科学化追求削弱了历史感与解释广度；并坦承西方国际关系学以美国为重心、追求宏理论，非西方理论难以进入知识谱系的里程碑位置，反思主义学派始终处于边缘。","quotes":[{"en":"总结三种体系理论，我们可以看出，结构现实主义的体系特征是权力，新自由制度主义的体系特征是制度，建构主义的体系特征是文化。","zh":"—"},{"en":"如果说新自由制度主义对新现实主义的突破点是质疑无政府条件下合作的可能性问题，那么建构主义的突破点是质疑无政府性这一基本概念本身。","zh":"—"}]},{"file":"权力·制度·文化 3.pdf","title":"权力政治与结构选择——现实主义与新现实主义评析","authors":"秦亚青","year":"部分内容1996年发表（文集修订版）","venue":"部分曾以《西方国际关系学的现实主义与新现实主义理论》为题载《外交学院学报》1996年第2期，收入文集《权力·制度·文化》","thesis":"卡尔、摩根索、沃尔兹是现实主义发展史上的三座里程碑：卡尔在批判理想主义（乌托邦主义）中奠定现实主义基础，摩根索以六原则和权力政治建构理论大厦，沃尔兹以国际体系无政府性取代人性作为第一推动，把现实主义科学化、简约化为'结构选择'理论。冷战后现实主义分化为强化权力命题的进攻性现实主义（最大现实主义）与引入国内层次的新古典现实主义（最小现实主义），但权力政治这一核心始终未变。","framework":"思想史脉络分析：①卡尔以三命题批判乌托邦主义——道德虚幻、权力重要、利益冲突；②摩根索'人性观—利益观—道德观'三环相扣，撑起现实主义六原则；③沃尔兹三假定——体系无政府性、国家为基本单位、体系结构（大国间权力分配）决定国家行为；④冷战后按'最大现实主义／最小现实主义'谱系定位进攻性现实主义与新古典现实主义等变体。","method":"理论文本的解读与评析：对《20年危机》《国家间政治》《国际政治理论》《大国政治的悲剧》等经典做命题式重构，并综述自由主义、建构主义、新马克思主义对其国家中心说、结构选择说与无政府逻辑的批判。","evidence":"卡尔《20年危机》提出道德虚幻、权力重要、利益冲突三命题，称理想主义'几乎完全无视权力因素'。摩根索《国家间政治》六原则：政治受根植人性的客观法则支配；以权力定义利益；此利益为普遍适用的客观原则；普世道德不能指导国家行为；国家道德不等同于普世道德；现实主义是独立理论学派。沃尔兹以可观察的无政府性替换无法证伪的人性，'结构选择'记作B=f(S)。米尔斯海默《大国政治的悲剧》代表进攻性现实主义；沃尔特的'威胁均衡'引入意图与知觉变量，滑向最小现实主义。","limits":"现实主义遭多方批判：国家中心说忽视非国家行为体，结构选择说过于静态且排除国内政治，无政府逻辑被建构主义证明并非唯一；作者也指出进攻性现实主义极端悲观，新古典现实主义则牺牲了理论的简约性与独特性。","quotes":[{"en":"卡尔奠定了现实主义的基础，摩根索建构了现实主义的理论大厦，沃尔兹完善了现实主义的科学体系。","zh":"—"},{"en":"在某种意义上，政治总是权力政治。","zh":"（引卡尔《20年危机》）"},{"en":"利益冲突是实实在在的、无法避免的现实。如果掩盖这种现实，就会歪曲问题的真实性质。","zh":"（引卡尔《20年危机》）"}]},{"file":"权力·制度·文化 4-5.pdf","title":"自由主义国际关系理论的思想渊源；国际制度与国际合作——反思新自由制度主义","authors":"秦亚青","year":"部分内容1998年发表（文集修订版）","venue":"后篇部分载《外交学院学报》1998年第1期，两篇均收入文集《权力·制度·文化》","thesis":"自由主义国际关系理论有四大思想源泉：①格劳秀斯《战争与和平法》——国际社会说，国际法可规范国家战争行为；②洛克——自然权利、政府基于被统治者同意、主权在民；③斯密——自由市场与'看不见的手'，自由贸易带来普遍繁荣；④康德《论永久和平》——共和制、国际联盟与世界公民三层次通向永久和平。新自由制度主义是其当代系统表达：承认无政府性，但论证国际制度能通过提供可靠信息、降低交易成本、实施惩罚减弱政治市场失灵，使理性自私的国家达成合作（'制度选择'）。","framework":"前篇为思想渊源梳理，沿时间线从古希腊罗马、阿奎那到启蒙思想家，提炼自由主义的人性观、历史观、道德观与国家观；后篇以理性主义与博弈论（囚徒困境、市场失灵）为分析工具，解剖'制度何以促成合作'的机制。","method":"政治思想史考证与理论机制分析相结合：先溯源概念谱系，再用交易成本经济学与重复博弈模型论证国际制度的纵向效应与横向（网络）效应，最后以马克思主义国家理论和现实主义权力观做批判性反思。","evidence":"国际制度三形式：①有明确规则章程的正式政府间与非政府国际组织（如联合国、国际红十字会）；②国际机制，即政府间就某一问题领域协商同意的明确规则（如海洋法、国际货币体系、国际贸易组织）；③国际惯例（如成文化之前的外交豁免）。博弈论证：囚徒困境效用结构DC＞CC＞DD＞CD刺激不合作；制度的纵向效应（变单次博弈为重复博弈）与横向（网络）效应（跨领域联成制度网络）加上信息供给，使效用结构转为CC＞DC＞DD＞CD，囚徒困境变为以合作为首选的猎鹿博弈。标志著作：《权力与相互依赖》（1977）、《霸权之后》（1984）。","limits":"作者指出新自由制度主义两大缺陷：回避'国际制度为谁服务'——战后制度本质上是维护美国主导的霸权体系；博弈推理中淡化权力因素，而权力能决定谁参与制度、制定规则并改变博弈解（如安理会否决权）。其科学严谨性亦不及新现实主义。","quotes":[{"en":"新自由制度主义所说的国际制度是一个外延较大的概念，指持续的、相互关联的正式与非正式规则体系，这些规则体系可以界定行为规范、制约行为体活动、帮助行为体的期望值趋同。","zh":"—"},{"en":"对于上帝忠实的信徒而言，甚至战争也具有和平的性质，因为战争的目的不是出于贪婪和残酷，而是出自对和平的期冀，是为了制止邪恶、助长善良。","zh":"（引托马斯·阿奎那）"}]},{"file":"权力·制度·文化 6.pdf","title":"国际政治的社会建构——温特及其建构主义国际政治理论","authors":"秦亚青","year":"2000","venue":"原为温特《国际政治的社会理论》中译本（上海人民出版社2000年版）译序，收入文集《权力·制度·文化》","thesis":"温特的社会建构主义是20世纪90年代最重要的国际关系理论，走的是理性主义与反思主义之间的'中间道路'：本体论上坚持理念主义——国际体系结构的核心是观念分配（体系文化）而非物质实力分配；认识论上坚持科学实在论。体系文化建构国家身份，国家身份建构国家利益，国家利益决定国家行为；无政府状态是国家造就的，存在霍布斯、洛克、康德三种无政府文化。","framework":"①以方法论（整体主义／个体主义）与世界观（物质主义／理念主义）两尺度把国际关系理论分为四象限，将温特定位于整体主义／理念主义象限；②以'施动者—结构互构'与'文化选择'（Sc—→Ui—→Ub）重构体系理论逻辑，体系与单位的关系由因果深化为建构；③以'中间道路'概括其反物质主义本体论＋科学实在论认识论的双重定位。","method":"理论评介与学理定位：追踪温特从1987年施动者—结构论文、1992年《无政府状态是国家造就的》到1999年《国际政治的社会理论》的思想发展，并系统综述理性主义与反思主义两翼对其的批评。","evidence":"霍布斯文化（敌人/杀戮）、洛克文化（对手/竞争，威斯特伐利亚主权体系，国家低灭亡率说明其为当今主导文化）、康德文化（朋友/非暴力与互助）三种无政府逻辑；费丽莫《国际社会中的国家利益》、卡赞斯坦《国家安全的文化》等实证研究表明规范可被内化；1992年论文成为90年代引用最多的国际关系论文。","limits":"理性主义者（克拉斯纳、基欧汉）批评其理念主义本体论，认为物质实力仍是国际政治实质、理念—物质二元对立无意义；反思主义者批评其科学实在论认识论与理念主义本体论不可调和，且把国家假定为先于社会的施动者，回避了'身份的身份'问题，体系化也弱化了施动者—结构的双向互构。","quotes":[{"en":"温特建构主义被称为“中间道路”：反物质主义本体论，但坚持理性主义认识论；反反思主义认识论，但坚持理念主义本体论。","zh":"—"},{"en":"体系文化构成了国家身份，国家身份建构了国家利益，国家利益决定了国家行为。","zh":"—"}]}],"glossary":[{"en":"politics","zh":"政治","def":"海伍德的定义：人们制定、维系和修正共同生活规则的活动；本质上是一种社会活动，冲突与合作是它的两面。","src":"政治学 1-3.pdf"},{"en":"conflict & cooperation","zh":"冲突与合作","def":"冲突是因观点、需求或利益不同产生的竞争；合作是协同努力达成共同目标。政治正是围绕这两种现象展开的。","src":"政治学 1-3.pdf"},{"en":"governance","zh":"治理","def":"比'政府'更宽的概念，泛指协调社会生活的各种方式；政府只是参与治理的机构之一，故有'没有政府的治理'一说。","src":"政治学 1-3.pdf"},{"en":"behaviouralism","zh":"行为主义","def":"主张政治研究只应依据可观察行为、提供可量化资料的取向，1950—60年代在美国政治学界达于巅峰，后被批评范围狭窄、隐含保守偏见。","src":"政治学 1-3.pdf"},{"en":"rational-choice theory","zh":"理性选择理论","def":"借用经济学'理性人'模型研究政治的取向：假设个人理性自利，再推导其政治行为，与弗吉尼亚学派关系密切。","src":"政治学 1-3.pdf"},{"en":"polyarchy","zh":"多头制","def":"达尔用语，字面'多人的统治'：以容忍反对声音和广泛政治参与为两大特征，是现代代议民主的'大致近似物'。","src":"政治学 1-3.pdf"},{"en":"ideology","zh":"意识形态","def":"一套大体内在一致的思想观念，为维护、修正或推翻现存权力关系体系提供有组织政治行动的基础。","src":"政治学 1-3.pdf"},{"en":"false consciousness","zh":"虚假意识","def":"马克思主义概念：被剥削的无产阶级接受了统治阶级意识形态，看不清自己被剥削的处境，例如把剥削关系当成'自然秩序'。","src":"政治学 1-3.pdf"},{"en":"classical / modern liberalism","zh":"古典自由主义／现代自由主义","def":"古典自由主义要'守夜人'式最小国家与自由放任；现代自由主义转向支持国家干预与社会福利，持积极自由观。","src":"政治学 1-3.pdf"},{"en":"end of ideology / end of history","zh":"意识形态终结／历史终结","def":"贝尔1960年宣称西方政治观念已经衰微；福山论证自由民主已取得最终胜利；海伍德指出'终结'论断本身也是一种意识形态。","src":"政治学 1-3.pdf"},{"en":"knowledge genealogy","zh":"知识谱系","def":"一门学科知识发展变化的系统，含研究主题与发展宏线两要素，展示知识生产和再生产的过程。","src":"权力·制度·文化 1-2.pdf"},{"en":"systemic theory","zh":"体系理论","def":"从国际体系层次特性解释国家行为的理论（对应还原理论）：需设定体系、体系特征与单位特征及二者关系，具共时性、客观性、简约性。","src":"权力·制度·文化 1-2.pdf"},{"en":"anarchy","zh":"无政府状态","def":"国际体系缺乏中央权威的基本状态。沃尔兹把它设为国际关系的第一推动；温特则认为它是国家实践建构的，可有多种逻辑。","src":"权力·制度·文化 3.pdf"},{"en":"structural realism (neorealism)","zh":"结构现实主义（新现实主义）","def":"沃尔兹的科学化现实主义：以无政府性为体系条件、大国间权力分配为核心自变量解释国家行为，核心命题'结构选择'。","src":"权力·制度·文化 3.pdf"},{"en":"offensive realism","zh":"进攻性现实主义","def":"米尔斯海默的理论：大国追求权力最大化乃至霸权，大国冲突难以避免，属冷战后的'最大现实主义'。","src":"权力·制度·文化 3.pdf"},{"en":"neoclassical realism","zh":"新古典现实主义","def":"坚持权力政治核心但引入国内政治与领导人认知的现实主义变体，脱离体系层次，被归入'最小现实主义'。","src":"权力·制度·文化 3.pdf"},{"en":"neoliberal institutionalism","zh":"新自由制度主义","def":"基欧汉创立：承认无政府性，但国际制度能通过提供信息、降低交易成本与惩罚违规促成合作，核心是'制度选择'。","src":"权力·制度·文化 4-5.pdf"},{"en":"international regime","zh":"国际机制","def":"政府间就某一问题领域协商达成的明确规则（如海洋法、国际贸易组织），是国际制度的三种形式之一。","src":"权力·制度·文化 4-5.pdf"},{"en":"market failure","zh":"市场失灵","def":"因质量不确定等信息问题，市场互动产生次优结果。新自由制度主义以此类比国际合作障碍，认为制度提供信息可以克服。","src":"权力·制度·文化 4-5.pdf"},{"en":"cultures of anarchy","zh":"无政府文化","def":"温特提出的三种国际体系文化：霍布斯文化（敌人）、洛克文化（对手）、康德文化（朋友），同一无政府状态可有不同逻辑。","src":"权力·制度·文化 6.pdf"}],"socratic":[{"q":"假设你所在的小区要决定'是否加装电梯、费用怎么分摊'：一楼不同意，顶楼最积极，社区出面协调。整个过程没有一位政府官员参与，为什么海伍德仍会说这是'政治'？","level":1,"hint":"想想海伍德定义里的三个动作——制定、维系、修正某种'规则'；再想想为什么冲突与合作会同时出现在这件小事里。","ref":"海伍德把政治定义为'人们制定、维系和修正其一般生活规则的活动'，它首先是一种社会活动，不局限于政府机构。装电梯正是在为共同生活立规则：一楼与顶楼利益不同是'冲突'，协商分摊方案是'合作'。多样性与资源稀缺使这种规则博弈无处不在，所以亚里士多德说'人是天生的政治动物'。判断是不是政治，看的是有没有围绕共同规则的集体博弈，而不是看发生在哪个场所。","wrong":"最典型错误：'没有政府参与就不是政治，顶多是邻里纠纷。'导师追问：如果只有政府里的事才算政治，公司股权谈判、家庭家务分工算什么？把政治锁死在政府场所，会漏掉多少真实的规则制定活动？这正是四种界定中最窄的一种。","followup":"既然政治如此普遍，为什么日常用语里'搞政治'常带贬义？","src":"政治学 1-3.pdf","kw":["政府","海伍德","冲突","合作","定义","利益","博弈","亚里士多德"]},{"q":"一位传统派说：'政治就是当官和议会里的事，厨房里没有政治。'一位女权主义者反驳：'家务怎么分工、谁决定家庭开支，都是政治——个人的就是政治的。'教材梳理的四种政治界定中，两人各自依据哪一种？","level":1,"hint":"四种界定对'政治发生在哪里'的回答由窄到宽：政府场所→公共领域→解决冲突的方式→一切社会关系。把两个人对号入座即可。","ref":"传统派依据'作为政府艺术的政治'：政治限于国家机构与公职人员。女权主义者依据'作为权力和资源分配的政治'：这是最宽泛的界定，权力存在于一切社会关系，家庭内的分工与开支决策同样涉及权力与资源，故是政治。中间还有两种：'作为公共事务的政治'（政治只在公共领域）与'作为妥协和共识的政治'（政治是以和平协商而非武力解决冲突的方式）。四种界定依次把'政治的领域'划得越来越宽。","wrong":"学生常答'两人只是立场不同，没有对错'，却说不出界定名称。导师追问：教材明确列了哪四种？划界标准分别是场所、方式还是关系结构？再用'公司董事会的权力斗争'测试学生能否正确归入第四种界定。","followup":"如果权力无处不在，'政治'概念会不会泛化到失去分析价值？海伍德如何看待这个风险？","src":"政治学 1-3.pdf","kw":["政府","权力","界定","关系","主义","冲突","公共","共识"]},{"q":"一家公司实行'末位淘汰'：支持者说'大家同一起跑线、各凭本事，很公平'；反对者说'起点相似，结局却是有人失业、有人暴富，这不叫公平'。这场争论对应自由主义与社会主义对'平等'的哪种不同理解？","level":1,"hint":"翻到两种意识形态的要素清单：自由主义讲'机会平等（同样的赛场）'，社会主义强调的平等前面多了'社会'二字——注意'机会'与'结果'的对照。","ref":"这对应'机会平等'与'社会（结果）平等'之争。自由主义从个人主义出发，主张机会平等：给每个人同等机会去实现并不等同的潜能，支持'贤能统治'，但不接受结果平等。社会主义把社会平等列为核心价值，重视结果平等，认为一定的结果平等是社会稳定与团结的保障，也是法律和政治权利得以真正实现的基础。'末位淘汰'之争正是这两种平等观的日常版本——双方都要'公平'，但公平的所指不同。","wrong":"最常见错误是把分歧说成'一方要公平、一方不要公平'。导师追问：双方都自认为站在公平一边，那分歧究竟在'公平'的哪个维度？是起点的同等对待，还是结局的差距控制？把争论翻译成'机会—结果'两轴再回答。","followup":"你能想出哪个现实政策试图在两种平等观之间折中？（提示：社会保障与再分配）","src":"政治学 1-3.pdf","kw":["自由主义","社会主义","平等","价值","统治","个人","基础","日常"]},{"q":"A国宣布扩军，声明'纯粹为了自卫'；B国看到后深感威胁，也跟着扩军；A国再把这当作敌意的证据……谁都不想打仗，军费却越滚越高。现实主义者会说，这种'安全困境'的根源不在任何一国的坏心眼，而在什么？","level":1,"hint":"关键在于国际体系缺了一样国内社会习以为常的东西——中央政府和警察。没有这个'守夜人'，国家只能靠谁保护自己？","ref":"根源在国际体系的'无政府状态'：国际体系缺乏中央权威，是无政府体系，因而是自助体系，国家只能靠增强自身实力保障生存。一国增强国力的举动无论动机如何，都会被对手视为威胁，安全困境由此形成。沃尔兹把无政府性设为国际关系的'第一推动'，正因为它既能像'人性恶'那样解释冲突，又是可观察的客观事实。这个例子的要点是：冲突并不必然源于恶意，而可能源于结构本身。","wrong":"典型错误：'是因为领导人好战或人性贪婪。'导师追问：换成两个真心爱好和平的国家，在无政府结构下它们能完全放心吗？用人性解释冲突，为什么被沃尔兹认为不科学？（无法测量、无法证伪）","followup":"温特会怎样挑战这个结论？无政府状态真的只有一种逻辑吗？","src":"权力·制度·文化 3.pdf","kw":["无政府状态","安全困境","自助","国际关系","国际体系","沃尔兹","冲突","人性"]},{"q":"你在电商平台敢先付款给陌生卖家，是因为平台定规则、公示评价、处罚欺诈。国际社会没有'世界政府'，可多数时候各国仍遵守WTO规则和海洋法。新自由制度主义怎样解释这种'没有警察也能合作'的现象？","level":2,"hint":"把电商平台的三个功能（定规则、供信息、做处罚）平移到国际制度上；再想想'下次还要做生意'这种长远算计起了什么作用。","ref":"国际制度是持续的、相互关联的正式与非正式规则体系，含国际组织、国际机制、国际惯例三种形式。它靠两类机制促成合作：一是惩罚——纵向效应把单次博弈变成重复博弈，违规损害声誉、招致互给性报复；横向（网络）效应把不同问题领域联成制度网络，一处违规处处受罚；二是信息——许多不合作源于缺乏对方可靠信息（类似市场失灵），制度提供高质量信息降低不确定性。国家为长远利益计算而守约，正如你为信誉不敢欺诈买家。","wrong":"学生常说'因为有联合国强制执行'。导师追问：联合国对大国有多少强制力？国际制度不像国内法律那样有执行机制——那国家遵守规则的动力究竟来自哪里？引导学生落到声誉、报复与长远利益计算上。","followup":"秦亚青批评这一理论回避'制度为谁服务'——战后国际制度主要是在谁主导的体系中建立的？","src":"权力·制度·文化 4-5.pdf","kw":["国际机制","市场失灵","国际组织","制度","合作","体系","相互","利益"]},{"q":"英国拥有数百枚核弹，美国安之若素；朝鲜只有几枚，美国如临大敌。武器数量差几十倍，威胁感却完全颠倒。温特会用哪对概念解释这种反差？","level":2,"hint":"温特的名言是'无政府状态是国家造就的'。关键不在物质实力，而在国家相互把对方当作什么角色——回忆三种无政府文化里的敌人、对手、朋友。","ref":"温特认为物质实力的意义由'体系文化'（观念分配）赋予：同样的武器，在朋友手中不构成威胁，在敌人手中才是。三种无政府文化对应三种相互身份：霍布斯文化中国家互为敌人，逻辑是'杀戮和被杀'；洛克文化中互为对手，承认彼此生存权，国家低灭亡率说明它是当今主导文化；康德文化中互为朋友，以非暴力解决争端、一方受威胁时出手相助。美英共享康德式友谊文化，美朝则陷在霍布斯式敌意里，威胁感自然颠倒。","wrong":"学生易答'因为朝鲜更难预测、更危险'，仍停留在物质与心理层面。导师追问：同样一批物质能力，在霍布斯文化和康德文化中的意义有何不同？'观念赋予物质以意义'这句话在这个例子里如何体现？","followup":"如果敌人与朋友的身份是被建构的，一对'敌人'关系有没有转圜的可能？","src":"权力·制度·文化 6.pdf","kw":["无政府文化","体系文化","三种无政府","温特","相互","分配","物质","观念"]},{"q":"某机构用海量民调数据预测大选，结果'翻车'，事后承认：数据很精确，但选哪些变量、怎么设计问题，都带着研究者的预设。行为主义相信'只研究可观察行为、用可量化资料'就能让政治研究成为科学，这种信心有何问题？","level":2,"hint":"教材对行为主义的批评有三层：研究范围是否太窄？'价值无涉'真的可能吗？只研究可测量的东西，会不会把真正重要的问题（自由、平等、正义）挤出视野？","ref":"行为主义在1950—60年代达于巅峰，自称'价值无涉'。批评有三：其一，它把研究限定在可观察行为，范围狭窄，使一代政治学家背弃规范政治思想传统，'自由''平等'等大问题因难以量化而被抛弃；其二，只研究可观察之物，暗含着将现状合法化的保守偏见；其三，所谓价值中立难以成立——选什么模型、用什么概念，本身就隐含价值预设。民调翻车正说明：测量可以很精确，框架却未必中立。","wrong":"典型错误是滑向另一极端：'所以数据和民调都是骗人的。'导师追问：教材否定的是'数据'还是'价值无涉的宣称'？抛弃量化研究又会失去什么？引导学生把批评定位为'科学方法有用，但要自知其限度'。","followup":"规范取向（政治哲学）能补上这个缺口吗？它自身的局限又是什么？","src":"政治学 1-3.pdf","kw":["行为主义","政治学","概念","自由","研究","规范","平等","价值"]},{"q":"同一个词，1796年特蕾西用它来命名一门中性的'思想科学'；半个世纪后，马克思却用它指'统治阶级的思想'——掩盖矛盾、制造'虚假意识'的欺骗性观念。这个词义的翻转说明了什么？我们今天说'意识形态'时更接近哪种用法？","level":2,"hint":"注意马克思认为自己的学说是'科学'而非意识形态——他把意识形态放在什么的对立面？再对照海伍德的中性社会科学定义（解释现状、理想未来、变迁路径三特点）。","ref":"词义翻转本身就是一部思想史：特蕾西希望意识形态成为研究观念来源的实证科学，享有与动物学同等的地位；马克思则揭露它的社会功能——统治阶级支配物质生产资料，也支配精神生产资料，意识形态维护阶级制度，让被剥削者产生'虚假意识'。海伍德的社会科学定义回归中性：一套大体内在一致的思想观念，解释现存秩序、提供理想未来模式、勾勒变迁路径，为政治行动提供基础。今天学术用法接近海伍德，日常用法仍带马克思的批判色彩。","wrong":"学生常把意识形态直接等同于'谎言和宣传'。导师追问：按海伍德的定义，自由主义、环保主义算不算意识形态？如果算，'意识形态'还能等于'谎言'吗？一个词的中性用法与批判用法分别服务于什么分析目的？","followup":"如果一切政治分析都以某种意识形态范式为基础，'客观的政治科学'还可能吗？","src":"政治学 1-3.pdf","kw":["意识形态","虚假意识","制度","海伍德","马克思","研究","科学","定义"]},{"q":"1930年代，国际联盟面对侵略只会呼吁和平、束手无策。卡尔在《20年危机》中说这不是偶然的失败——他从哪三个方面论证'乌托邦主义'（理想主义）在学理上就站不住脚？","level":3,"hint":"记三个关键词：道德、权力、利益。逐一自问：国际社会有统一的普世道德吗？理想主义者看见权力的作用了吗？各国利益真的天然和谐吗？","ref":"卡尔的三命题：①道德虚幻——近乎无政府的国际社会难以界定普世道德，只有国家舆论而无统一的国际舆论，国家只能在道德与权力间求平衡；②权力重要——理想主义'几乎完全无视权力因素'，'在某种意义上，政治总是权力政治'；③利益冲突——国际利益和谐是虚幻，'利益冲突是实实在在的、无法避免的现实'，掩盖它只会歪曲问题。国联的失败正是无视权力与利益冲突的代价。","wrong":"学生常答成一句'理想主义太天真'。导师追问：卡尔反对的是道德本身，还是用'应然'冒充'实然'？他指出理想主义'几乎完全无视权力因素'——这是学理诊断，不是道德指责，二者差别在哪里？","followup":"摩根索怎样把卡尔的批判系统化为现实主义六原则？","src":"权力·制度·文化 3.pdf","kw":["政府","权力","利益冲突","界定","国际","主义","命题","卡尔"]},{"q":"沃尔兹说，用'人性恶'解释国际冲突会让整个学科失去科学性——可两千年来哲人都在谈人性。他凭什么判定人性不能作出发点？他用什么取而代之，又带来了什么新结论？","level":3,"hint":"科学理论的核心概念要满足什么条件？'人性'能观察、测量、证伪吗？'国际体系没有中央政府'这件事呢？顺着这个对照想下去。","ref":"沃尔兹的理由：人性无法测量、无法证伪，是先验判定，以它为出发点'就从根本上使国际关系学失去了科学性'。他以国际体系的无政府性取而代之——那是客观存在的社会事实。无政府体系是自助体系，国家首要目标是生存而非权力最大化（防御性现实主义）；体系结构（大国间权力分配）决定国家行为，核心命题'结构选择'记作B=f(S)，简约且可证伪，现实主义由此从'国际关系的哲学'变成科学理论。","wrong":"学生常只说'沃尔兹更科学'，却说不出科学在哪里。导师追问：可证伪性是什么意思？'人性恶'这个命题能被证伪吗？沃尔兹的哪个变量是可以观察测量的？逼着学生把'科学化'落到操作标准上。","followup":"这种科学化的代价是什么？体系理论把哪些可能重要的东西排除在外了？","src":"权力·制度·文化 3.pdf","kw":["防御性现实主义","政府","自助","权力","国际关系","国际体系","沃尔兹","结构选择"]},{"q":"请用'体系特征—体系单位—二者关系'这把尺子，比较结构现实主义、新自由制度主义与温和建构主义。三家都在解释冲突与合作，分歧究竟在哪里？","level":3,"hint":"三者的单位都是国家，分歧在体系特征（权力／制度／文化）以及体系作用于单位的方式——特别注意'因果关系'与'建构关系'的区别，以及国家利益是给定的还是被建构的。","ref":"①结构现实主义：体系特征是国际体系结构（大国间权力分配），'结构选择'（Sp—→Ub），体系对单位是因果关系；②新自由制度主义：体系特征是国际制度，'制度选择'（Si—→Ub），仍是因果关系；③温和建构主义：体系特征是体系文化（观念分配），'文化选择'（Sc—→Ui—→Ub），体系文化先建构国家身份与利益，利益再决定行为——是建构关系而非因果关系。国家利益在前两家是给定的，在温特这里是被建构的。","wrong":"学生常把三者差异说成'关注的变量不同'，忽略本体论分野。导师追问：在现实主义和自由主义那里，国家利益是给定的还是被建构的？建构主义凭什么说自己的结构理论比沃尔兹'更彻底'？（结构不只约束行为，还造就行为体的身份本身）","followup":"三种理论都追求'体系理论'形态，这种共同追求暴露了西方国际关系学的什么传统？","src":"权力·制度·文化 1-2.pdf","kw":["新自由制度主义","结构现实主义","身份与利益","文化","权力","建构主义","国际制度","国际体系"]},{"q":"贝尔1960年宣布'意识形态终结'，福山在冷战后宣布'历史终结'，可今天左右之争、民粹主义与生态政治依然激烈。这些'终结论'各自说了什么、错在哪里？海伍德为什么说终结论本身就是一种意识形态？","level":4,"hint":"先分清三种'终结'：贝尔看到的真是终结吗（还是主要政党达成共识）？福山是说意识形态不重要了吗？吉登斯与后现代主义又各指什么？最后问：一个宣布'争论结束'的命题，自身有没有价值立场？","ref":"贝尔宣称政治思想宝库已耗尽、'经济战胜了政治'，但海伍德指出那不如说是主要政党达成了福利资本主义共识（凯恩斯—福利主义共识）。福山不是说意识形态不重要，而是论证自由民主已取得决定性最终胜利。吉登斯认为传统左右之分在全球化时代不再适用；后现代主义把主要意识形态斥为现代化的'宏大叙事'。海伍德的点睛：'终结'论断自身携带价值立场，也是一种意识形态——争论仍在继续，演化永无休止。","wrong":"典型错误是把福山读成'意识形态从此不重要'，或把终结论当作已被证实的结论。导师追问：女性主义、生态主义、宗教政治的兴起与'终结'论断矛盾吗？一个宣称'争论已经结束'的命题，通常站在争论的哪一边？","followup":"把这个问题接到秦亚青身上：国际关系理论'三足鼎立'的论战史，是否也证明范式之争不会终结？","src":"政治学 1-3.pdf","kw":["现代主义","意识形态","民主","海伍德","自由","共识","终结","价值"]}],"quiz":[{"type":"tf","q":"按照海伍德的定义，'政治'只发生在政府、议会等国家机构之内。","answer":false,"explain":"错误。海伍德把政治界定为'人们制定、维系和修正其一般生活规则的活动'，它首先是一种社会活动，小区协商、公司决策中都可能有政治。'政治＝政府机构里的事'只是教材所列四种界定中最窄的一种（作为政府艺术的政治）。","src":"政治学 1-3.pdf"},{"type":"mc","q":"海伍德对'政治'所下的最广义定义是：","options":["政治是国家机构中权力的争夺与运用","政治是人们制定、维系和修正其一般生活规则的活动","政治是价值的权威性分配，仅限政府过程","政治是统治阶级维护其利益的意识形态活动"],"answer":1,"explain":"选B，这是教材原文的定义。A对应'作为政府艺术的政治'，范围太窄；C是伊斯顿的说法，侧重政府过程；D是马克思主义对'意识形态'功能的描述，不是政治的定义。记忆线索：三个动词——制定、维系、修正——加上'一般生活规则'。","src":"政治学 1-3.pdf"},{"type":"mc","q":"女权主义者提出'个人的就是政治的'，认为家务分工也是政治。这一主张依据的是四种界定中的哪一种？","options":["作为政府艺术的政治","作为公共事务的政治","作为妥协和共识的政治","作为权力和资源分配的政治"],"answer":3,"explain":"选D。第四种界定最宽泛：权力存在于一切社会关系之中，家庭内部的分工与资源分配同样涉及权力，故'个人的就是政治的'。A把政治限于政府机构，B把政治限于公共领域，C强调以协商而非武力解决冲突的方式——三者都无法涵盖家庭内部的权力关系。","src":"政治学 1-3.pdf"},{"type":"tf","q":"'意识形态'一词自特蕾西1796年首创时起就带有贬义和批判色彩。","answer":false,"explain":"错误。特蕾西最初用该词指一门中性的'思想科学'，希望它享有与动物学同等的地位；到马克思那里才获得'统治阶级的思想''虚假意识'等批判含义；当代社会科学（如海伍德）的用法又回归中性，指一套有内在一致性的思想观念。词义本身经历了'中性—批判—中性'的循环。","src":"政治学 1-3.pdf"},{"type":"tf","q":"沃尔兹与摩根索一样，把人性作为国际关系的第一推动。","answer":false,"explain":"错误。这正是新现实主义对古典现实主义的关键突破：沃尔兹认为人性无法测量、无法证伪，是先验判定，以它为出发点会使国际关系学失去科学性；他以国际体系的无政府性（客观存在的社会事实）取代人性作为第一推动，并得出国家追求生存而非权力最大化的结论。","src":"权力·制度·文化 3.pdf"},{"type":"mc","q":"按照新自由制度主义，国际制度的三种形式是：","options":["国际条约、国际法庭、国际联盟","正式政府间与非政府国际组织、国际机制、国际惯例","霸权体系、均势体系、集体安全体系","双边协定、多边协定、联合国宪章"],"answer":1,"explain":"选B。秦亚青概括：①有明确规则章程的正式国际组织（如联合国、国际红十字会）；②国际机制，即政府间就某一问题领域协商同意的明确规则（如海洋法、国际货币体系）；③国际惯例（如成文化之前的外交豁免）。其他选项或为具体个案，或与国际制度的定义无关。","src":"权力·制度·文化 4-5.pdf"},{"type":"mc","q":"温特提出的三种无政府文化，按国家间相互身份排列正确的是：","options":["霍布斯文化—朋友；洛克文化—对手；康德文化—敌人","霍布斯文化—敌人；洛克文化—对手；康德文化—朋友","霍布斯文化—对手；洛克文化—敌人；康德文化—朋友","霍布斯文化—敌人；洛克文化—朋友；康德文化—对手"],"answer":1,"explain":"选B。霍布斯文化中国家互为敌人，逻辑是'杀戮和被杀'；洛克文化中互为对手，承认彼此生存权利，威斯特伐利亚主权体系是其标志，也是当今主导文化；康德文化中互为朋友，以非暴力解决争端并相互援助。记忆线索：从'你死我活'到'赛场竞争'再到'患难相助'。","src":"权力·制度·文化 6.pdf"},{"type":"tf","q":"基欧汉认为，霸权国衰落之后，国际制度仍可以独立存在并继续发挥促进合作的作用。","answer":true,"explain":"正确。这正是《霸权之后》的核心论点：制度一经建立便具有权威性与关联性，其惩罚违规、提供信息的功能不因霸权国衰落而消失，因此'霸权之后'合作仍然可能。当然，基欧汉也承认战后制度最初是在美国主导的霸权体系中产生的——这正是秦亚青批评它'回避制度为谁服务'的原因。","src":"权力·制度·文化 4-5.pdf"},{"type":"mc","q":"卡尔在《20年危机》中批判'乌托邦主义'的三个基本命题，不包括下列哪一项？","options":["国际社会难以界定普世道德，只有国家舆论而无统一的国际舆论","权力仍是国际关系中至关重要的因素","国家间利益和谐是虚幻的，利益冲突是无法避免的现实","人性本恶是国际冲突不可消除的最终根源"],"answer":3,"explain":"选D。卡尔批判三要点是道德虚幻、权力重要、利益冲突（对应道德、权力、利益三关键词）。'人性本恶'是摩根索古典现实主义的第一推动，不是卡尔的命题；沃尔兹后来更以无政府性取代人性。做这类题时先锁定'三'这个数字对应的关键词组，再排除张冠李戴项。","src":"权力·制度·文化 3.pdf"},{"type":"sa","q":"请用自己的话解释'结构选择''制度选择''文化选择'，并各举一个现实例子加以说明。","ref":"①结构选择（沃尔兹）：国际体系结构即大国间物质权力分配决定国家行为（Sp—→Ub）——例：两极格局下中小国家纷纷选边结盟，因为权力集中在两个超级大国手中。②制度选择（基欧汉）：体系结构不变时，国际制度作为关键变量促成合作（Si—→Ub）——例：各国通过WTO规则谈判解决贸易摩擦，而不是直接开打贸易战。③文化选择（温特）：体系文化（观念分配）建构国家身份与利益，再决定行为（Sc—→Ui—→Ub）——例：美国从不把英国的数百枚核弹视为威胁，却对朝鲜的几枚如临大敌，因为朋友与敌人的身份不同。","explain":"评分要点：三个定义准确（说出体系特征分别是权力／制度／文化，能配公式更好）；三个例子恰当且能体现'权力分配决定''制度促成合作''文化建构身份'三种不同逻辑；若能指出前两者是因果关系、第三者是建构关系，可加分。","src":"权力·制度·文化 1-2.pdf"},{"type":"sa","q":"请用自己的话解释'机会平等'与'社会（结果）平等'的区别，各举一个现实例子，并说明二者分别对应哪种意识形态传统。","ref":"机会平等：给每个人同样的赛场和规则，让各人实现并不等同的潜能，结果差距被视为合理的'贤能统治'——例：统一高考、公开招聘，程序面前人人平等。它对应自由主义（个人主义蕴涵的道德平等＋不接受结果平等）。社会（结果）平等：重视终点处差距的缩小，认为一定的结果平等是社会稳定团结、法律与政治权利真正实现的基础——例：累进税制、全民医保、最低生活保障等再分配安排。它对应社会主义（其核心价值之一）。两者都自称'公平'，分歧在公平落在起点还是终点。","explain":"评分要点：定义能点出'起点／终点（机会／结果）'这一对照；例子现实且恰当；正确对应自由主义与社会主义；若进一步指出自由主义者并不反对法律与政治平等、只是反对结果平等，可加分。","src":"政治学 1-3.pdf"}],"flashcards":[{"front":"政治（海伍德的定义）","back":"人们制定、维系和修正共同生活规则的活动。小区定停车规则、国家立法律都是政治；核心是一边冲突一边合作。","src":"政治学 1-3.pdf"},{"front":"政治的四种理解","back":"①政府的事②公共领域的事③用协商而非武力解决冲突的方式④一切权力与资源分配关系。范围由窄到宽，'家务分工也是政治'属第四种。","src":"政治学 1-3.pdf"},{"front":"治理（governance）","back":"协调社会生活的各种方式，比'政府'大：政府、企业、社区组织都参与，故有'没有政府的治理'一说。","src":"政治学 1-3.pdf"},{"front":"行为主义","back":"主张只研究可观察、可量化的行为，1950—60年代盛行。批评者说它漏掉'自由''平等'等大问题，还自称价值中立。","src":"政治学 1-3.pdf"},{"front":"多头制（polyarchy）","back":"达尔对现代代议民主的称呼：容忍反对派＋广泛政治参与，只是民主的'大致近似物'，区别于古希腊直接民主。","src":"政治学 1-3.pdf"},{"front":"意识形态（社会科学定义）","back":"一套大体内在一致的思想体系：解释现状、描绘理想社会、指明变革路径，为政治行动提供基础。自由主义、社会主义都是。","src":"政治学 1-3.pdf"},{"front":"虚假意识","back":"马克思用语：被剥削者接受了统治阶级的说法，认不出自己被剥削——例如把贫富分化全归因于'个人不努力'。","src":"政治学 1-3.pdf"},{"front":"古典自由主义 vs 现代自由主义","back":"古典：国家管得越少越好（'守夜人'国家、自由放任）；现代：接受国家干预与福利，追求'有能力去实现'的积极自由。","src":"政治学 1-3.pdf"},{"front":"社会主义的核心价值","back":"共同体、博爱（合作优于竞争）、结果平等、按需分配、阶级政治、公有制——'没有人是一座孤岛'是其精神底色。","src":"政治学 1-3.pdf"},{"front":"意识形态终结论","back":"贝尔：政党已达福利资本主义共识；福山：自由民主最终胜利。海伍德反驳：宣布'终结'本身就是一种意识形态。","src":"政治学 1-3.pdf"},{"front":"知识谱系","back":"一门学科知识的'家谱'：研究主题（国关＝冲突与合作）＋发展宏线（现实主义→新自由主义→建构主义的接力论战）。","src":"权力·制度·文化 1-2.pdf"},{"front":"现实主义三座里程碑","back":"卡尔奠基（批判乌托邦主义）、摩根索建大厦（六原则与权力政治）、沃尔兹科学化（结构现实主义）。","src":"权力·制度·文化 3.pdf"},{"front":"无政府状态（anarchy）","back":"国际上没有'世界政府'的状态。现实主义视之为自助与冲突的根源；温特说它是国家互动的产物，可以有多种文化逻辑。","src":"权力·制度·文化 3.pdf"},{"front":"结构选择","back":"沃尔兹：大国间权力分配（结构）决定国家行为，记作B=f(S)。两极或多极格局一变，国家行为跟着变。","src":"权力·制度·文化 3.pdf"},{"front":"进攻性现实主义","back":"米尔斯海默：大国不满足于安全，还要追求权力最大化、争当霸权，故大国冲突难免——'最大现实主义'。","src":"权力·制度·文化 3.pdf"},{"front":"新自由制度主义","back":"基欧汉：没有世界政府也能合作——制度靠惩罚违规、提供信息促成合作，就像电商平台让陌生交易可信。","src":"权力·制度·文化 4-5.pdf"},{"front":"国际制度的三种形式","back":"①正式国际组织（如联合国）②国际机制（如海洋法、国际贸易组织）③国际惯例（如成文化前的外交豁免）。","src":"权力·制度·文化 4-5.pdf"},{"front":"三种无政府文化","back":"温特：霍布斯文化＝互为敌人（杀戮）、洛克文化＝互为对手（竞争但承认生存权，当今主导）、康德文化＝互为朋友（互助）。","src":"权力·制度·文化 6.pdf"},{"front":"中间道路（via media）","back":"温特的定位：本体论上反物质主义（重视观念文化），认识论上坚持科学方法——在理性主义与反思主义之间搭桥。","src":"权力·制度·文化 6.pdf"},{"front":"体系理论的科学性代价","back":"共时性抹杀历史、客观性回避施动者—结构互构、简约性排除国内政治——越'科学'，能解释的东西反而越少。","src":"权力·制度·文化 1-2.pdf"}]},{"id":"ch02","folder":"3. Nation-State and Government","title":"民族国家与政府","subtitle":"Nation-State and Government","overview":{"theme":"为什么有些国家拿了几十年国际援助却依然贫困？为什么同一座城市被边界劈成两半，一边富裕一边凋敝？本章以现代民族国家为中心，回答三个层层递进的问题：国家是什么（概念与理论谱系）、如何研究国家（方法论反思）、以及国家能力与制度如何决定国家兴衰与民族整合（经验与历史解释）。国家既是政治学的核心研究对象，也是理解现代世界秩序与不平等的钥匙。","coreQuestions":["国家是什么？它与政府有何区别？可以从哪些理论视角理解国家权力？","韦伯式的国家中心研究路径有何缺陷？什么是'社会中的国家'视角？","为什么必须区分'国家职能范围'与'国家能力'？哪个维度对发展更关键？","为什么地理、文化和统治者无知都无法解释国家间的贫富差异？制度如何起作用？","为什么有的多族群国家实现了民族整合，有的却沿族群断层线分裂？"],"thread":"本章按'概念—方法—维度—后果—整合'的逻辑展开。海伍德教材首先给出国家的概念地图：三种理解视角、五种关键特征、国家与政府的区别、四种对立的国家理论以及从最小国家到极权国家的角色谱系，为全章奠基。米格代尔随即进行方法论清算，指出韦伯式理想型把国家本质化、高估其能力，主张转向'有限国家'与'社会中的国家'的过程视角。福山把国家性分解为职能范围与国家能力两个维度，论证能力优先于范围。阿西莫格鲁与罗宾逊进一步把制度（包容/汲取）确立为国家贫富分殊的根本原因，驳斥地理、文化与无知三种流行假说。维默最后把视野拉长到跨代际历史，用中央集权遗产、公共物品供给与市民社会组织三机制解释民族国家构建的成败，并批评外部强加的国家构建方案。五篇文献由'国家是什么'一路推进到'国家如何形成与成败'。","path":["第一步：先想'换政府为什么不等于换国家'，再读海伍德教材，掌握国家的三种视角、五个特征、四大理论与五种角色，建立概念框架。","第二步：先想'为什么国家没法在每个街角都站警察，人们却仍然守规矩'，读米格代尔，理解'有限国家'与'社会中的国家'。","第三步：先想'政府管得少是否等于政府弱'，读福山，学会用'范围—能力'二维矩阵分析国家性，审视华盛顿共识的得失。","第四步：先想'为什么有的国家拿了很多援助依然贫困'，读阿西莫格鲁与罗宾逊，检验地理、文化、无知三大假说为何失效，把握制度解释的逻辑。","第五步：先想'为什么瑞士多语言却不分裂、比利时却濒于分裂'，读维默，理解民族国家构建的三大机制与外部干预的限度。"],"dialogue":"五篇文献围绕'国家'形成多重对话。海伍德把国家呈现为各种理论争夺的概念战场，米格代尔则批评所有这些视角都沿袭了韦伯式的分析性孤立，高估了国家的统一与全能——这是'国家中心论'与'社会中心论'的张力。福山与阿西莫格鲁—罗宾逊都反对'只要政策正确就能致富'的无知假说，但福山强调行政能力建设，A&R强调激励与权力分配的制度结构，前者可被视作后者'包容性制度'的供给条件。维默则正面挑战福山在伊拉克、阿富汗式的外部民族构建方案：公共物品必须由本土政府提供，民族整合是跨代际的'板块构造'过程，而非一两届总统任期内可完成的工程。米格代尔'有限国家'的告诫，恰是对福山与维默共同问题意识的理论注脚。"},"readings":[{"file":"政治学 5.pdf","title":"政治学（第三版）第5章：国家（Politics, 3rd ed., Ch. 5 'The State'）","authors":"安德鲁·海伍德（Andrew Heywood）","year":"2007（英文第三版；中译本中国人民大学出版社）","venue":"《政治学》教材（公共行政与公共管理经典译丛）","thesis":"国家是政治学的核心概念，却可从三种视角理解：①唯心主义视角（黑格尔）把国家视为建立在'普遍利他主义'上的道德共同体；②功能主义视角以维持社会秩序的功能界定国家；③组织视角把国家界定为被认可为'公共'的机构集合。本书采用组织视角，据此区分国家与政府，再围绕'国家权力服务于谁'梳理四种对立的国家理论，按职能宽窄排列五种国家角色，最后讨论全球化时代国家权力的变化。","framework":"概念地图由四组框架性列举构成：①理解国家的三种视角——唯心主义（道德共同体）、功能主义（维持秩序的机构）、组织视角（公共机构集合）；②国家的五个关键特征——至高无上、机构是'公共的'、活动暗含合法性、垄断合法性暴力作为统治工具、领土单位；③四种对立的国家理论——多元主义国家（中立裁判）、资本主义国家（阶级统治工具）、利维坦式国家（自我膨胀的怪兽）、家长式国家（男性权力机构）；④五种国家角色——最小国家→发展型国家→社会—民主国家→集体化国家→极权国家。","method":"概念辨析、思想史梳理与规范政治理论综述，辅以各国政体的类型比较。","evidence":"黑格尔的家庭—市民社会—国家三环节与1648年《威斯特伐利亚条约》；霍布斯的'利维坦'意象与洛克的'守夜人'式有限国家；达尔、林德布洛姆、加尔布雷思把古典多元主义修正为新多元主义；米利班德与普兰查斯的工具主义—结构主义之争，葛兰西的霸权理论；诺齐克、哈耶克、弗里德曼代表的新右派；日本通产省（MITI）的发展型国家、法国经济计划、奥地利与瑞典的社会—民主国家、苏联东欧的集体化国家、希特勒德国与斯大林苏联的极权国家；弱国家案例为索马里、塞拉利昂、利比里亚、刚果。","limits":"教材式类型学综述，理论呈现较为静态，缺少系统的经验检验；以西方思想史与政体经验为中心，对非西方国家的国家形成着墨有限。","quotes":[{"en":"对'合法性暴力'（legitimate violence，马克斯·韦伯语）的垄断是国家主权的实际体现。","zh":"—（海伍德引韦伯之语界定国家的强制属性）"},{"en":"政府是国家权威借以实施的工具。政府是国家在制定和贯彻国家政策过程中的'大脑'，使国家能够生生不息。","zh":"—"}]},{"file":"Migdal, 2001.pdf","title":"State in Society, 'Studying the State'（社会中的国家：研究国家）","authors":"乔尔·米格代尔（Joel S. Migdal）","year":"2001","venue":"State in Society: Studying How States and Societies Transform and Constitute One Another, Cambridge University Press","thesis":"比较政治学的核心问题始终是人们为何服从。受韦伯支配的各种视角把国家当作可孤立分析的独立组织，窥探其内部构造——这种'分析性孤立'本质化了国家、神秘化并高估了其能力。应把国家重新理解为'有限国家'：国家在与社会力量的接合中被削弱、分割并相互转化，边界日益模糊。研究应从结构转向过程，融合文化主义与制度主义，走向'社会中的国家'路径。","framework":"依次评述四种研究视角：①文化主义——格尔茨的'剧场国家'，仪式与'主导叙事'是粘合国家各部分的'文化黏合剂'；②体系主导的结构主义——戈德斯通用人口—资源比率解释国家崩解，国家被视为可互换的整体；③理性主义——贝茨用统治者的利益与激励解释'明知故犯'的坏政策；④历史制度主义——波兰尼、亨廷顿、埃文斯强调制度配置决定国家能力，'国家不是通用件'。再给出国家形象（统一全能的理想型）与国家实践（相互矛盾的运作）的二分，落脚于'有限国家'与'社会中的国家'。","method":"理论史与方法论批判：系统评述文化主义、结构主义、理性主义与历史制度主义的国家研究，并引述米切尔（Timothy Mitchell）等对国家—社会边界建构的分析。","evidence":"格尔茨对前殖民巴厘'剧场国家'的研究（'权力服务于排场，而非排场服务于权力'）；埃塞俄比亚军官向政变同僚递上亨廷顿著作的轶事；埃文斯的'嵌入性自主'；米切尔指出韦伯式定义只是'剩余性刻画'；罗斯伯里论墨西哥的'说话的国家与心不在焉的听众'——中央法律、政令在地方应用中折射变形；布恩对塞内加尔'碎裂内核'的分析；国家通过语言政策、正规教育、集体仪式与大众传媒争夺对民族集体意识的定义权。","limits":"本章是方法论纲领而非完整经验研究，论证更多依赖引证而非一手案例；对东亚等相对'强国家'案例的讨论有限；'有限国家'概念本身的操作化仍需后续研究。","quotes":[{"en":"The effect is to essentialize the state and overstate its capabilities.","zh":"其效果是把国家本质化，并高估其能力。"},{"en":"The mutual transformation of state and society has led to contending coalitions that have cut across both and blurred the lines between them.","zh":"国家与社会的相互转化催生了横跨双方的竞争性联盟，模糊了二者之间的界线。"}]},{"file":"Fukuyama, 2004.pdf","title":"State-Building, Ch. 1 'The Missing Dimensions of Stateness'（国家构建：国家性的缺失维度）","authors":"弗朗西斯·福山（Francis Fukuyama）","year":"2004","venue":"State-Building: Governance and World Order in the Twenty-First Century, Cornell University Press","thesis":"'9·11'使弱国家与失败国家问题凸显为国际秩序的核心议题。理解'国家性'必须区分两个被混为一谈的维度：国家职能范围（scope，政府承担的功能与目标）与国家能力（strength，制定执行政策、清明执法的能力）。华盛顿共识的改革误区在于只顾压缩范围而忽视甚至损害能力；最优路径是缩小范围的同时增强能力，且证据表明能力比范围对长期经济增长更重要。","framework":"'国家性'二维框架：①国家职能范围（X轴）——依据世界银行1997年《世界发展报告》，从'最低限度'经'中间'到'积极干预'排列为连续谱；②国家能力（Y轴）——制定执行政策、清明透明执法、控制腐败的制度能力。两轴组合成四象限矩阵：第一象限'范围有限+能力强'为最优，第四象限'范围广+能力弱'为最差。改革路径对比：最优为路径I（缩范围、强能力），常见错误是路径II（范围与能力双降）。","method":"概念建构与跨国类型比较，结合对世界银行报告、东亚奇迹、撒哈拉以南非洲结构调整与后共产主义私有化的政策评估。","evidence":"美国'有限范围+强大能力'位居第一象限，法治为多国所羡慕；撒哈拉以南非洲结构调整期间，道路、公共卫生、基础教育与农业投入锐减，'主权性开支'（军队、外交、总统府职位）却剧增——肯尼亚总统办公室雇员从1971年的18,213人增至1990年的43,230人；新西兰1984年起先压缩范围、1988年《国家部门法》再强化行政能力，走出'西北向'最优路径；韩泰1997年危机源于缺乏监管机构的过早资本账户自由化；俄罗斯私有化因能力不足落入寡头之手；弗里德曼2001年公开认错：'法治可能比私有化更基本'；东亚高绩效经济体范围差异极大（从香港到韩国），共同点是国家能力都很强。","limits":"'国家能力'难以精确测量，范围与能力的'最优组合'因国情而异，分析框架的政策可操作性有限；其外部国家构建方案后来被维默等批评为忽视本土历史条件。","quotes":[{"en":"It therefore makes sense to distinguish between the scope of state activities, which refers to the different functions and goals taken on by governments, and the strength of state power, or the ability of states to plan and execute policies and to enforce laws cleanly and transparently.","zh":"因此，有必要区分国家活动的范围——即政府承担的不同职能与目标——与国家权力的强度，即国家制定和执行政策、清明透明地实施法律的能力。"},{"en":"The problem of weak states and the need for state-building have thus existed for many years, but the September 11 attacks made them more obvious.","zh":"弱国家问题与国家构建的必要性由此已存在多年，只是'9·11'事件使之变得更加醒目。"}]},{"file":"Acemoglu & Robinson, 2012.pdf","title":"Why Nations Fail, Ch. 2-3 'Theories That Don't Work' & 'The Making of Prosperity and Poverty'（国家为什么会失败：失效的理论／繁荣与贫困的形成）","authors":"达龙·阿西莫格鲁、詹姆斯·罗宾逊（Daron Acemoglu & James A. Robinson）","year":"2012","venue":"Why Nations Fail: The Origins of Power, Prosperity, and Poverty, Crown Publishers","thesis":"世界贫富差异无法由三大流行假说解释：①地理假说（孟德斯鸠的气候—懒惰论；萨克斯的热带疾病与贫瘠土壤论；戴蒙德的物种禀赋论）；②文化假说（韦伯的新教伦理及其现代变体）；③无知假说（统治者不知道如何让穷国致富）。根本原因是制度：包容性经济制度（以包容性政治制度为后盾）保障多数人的产权与公平竞争，带来持续繁荣；汲取性制度让精英以多数人为代价致富。汲取性制度下也能出现增长（苏联、中国），但因缺乏创造性破坏而不可持续。","framework":"新制度政治经济学：①制度四分——包容性/汲取性×经济/政治制度，且彼此共生（汲取性经济制度依赖汲取性政治制度维系）；②机制链——制度塑造激励、激励决定经济绩效；③无知假说的替代解释——统治者面对的激励与约束而非知识决定政策选择；④增长的政治经济学——创造性破坏同时制造经济输家与政治输家，故掌权者常阻挠增长；⑤汲取性增长的两种路径，政治集权是其共同关键。","method":"历史比较与准'自然实验'式对照（诺加利斯双城、朝韩、东西德等地理文化相同而制度迥异的案例），辅以历史叙事与反事实推理。","evidence":"诺加利斯被美墨边界一分为二，两侧地理文化相同而贫富悬殊；朝韩对比驳斥文化假说——夜间卫星图上南方灯火通明、北方几近全黑，收入差约十倍。刚果王国1483年起即接触葡萄牙人，拒绝采纳轮子和犁却迅速采纳枪支——是激励而非文化在起作用。加纳总理布西亚明知价格管制与高估汇率不善仍采纳（'是好政治'：向城市强势集团输送廉价食品并创收），1971年12月27日与IMF签署贬值协议后阿克拉爆发骚乱，随即被阿昌庞领导的军事政变推翻。巴巴多斯1680年普查：约6万人口中近3.9万是奴隶，175个最大种植园主占据40名法官中的29席——精英有稳固产权，制度仍属汲取性。苏联1928—1970年代靠国家强制调配资源实现增长，终因无创造性破坏而在1970年代停滞。","limits":"'制度'概念包罗过宽，界定与测量不严格；制度本身的起源（内生性）需后续章节回答；对文化因素的处理被批评为过于简单；对中国'汲取性增长不可持续'的判断存在持续争议。","quotes":[{"en":"World inequality, however, cannot be explained by climate or diseases, or any version of the geography hypothesis. Just think of Nogales. What separates the two parts is not climate, geography, or disease environment, but the U.S.-Mexico border.","zh":"然而，世界不平等无法用气候、疾病或任何版本的地理假说来解释。想想诺加利斯：把两个部分隔开的不是气候、地理或疾病环境，而是美墨边界。"},{"en":"Yet Busia's experience underscores the fact that the main obstacle to the adoption of policies that would reduce market failures and encourage economic growth is not the ignorance of politicians but the incentives and constraints they face from the political and economic institutions in their societies.","zh":"然而布西亚的经历凸显了一个事实：采纳能减少市场失灵、促进经济增长的政策，其主要障碍不是政治家的无知，而是他们从本国政治与经济制度中面对的激励与约束。"}]},{"file":"Wimmer, 2018.pdf","title":"Nation Building, Introduction（民族国家构建：为什么有的国家凝聚而有的分裂，导论）","authors":"安德烈亚斯·维默（Andreas Wimmer）","year":"2018","venue":"Nation Building: Why Some Countries Come Together While Others Fall Apart, Princeton University Press","thesis":"民族国家构建的成败取决于跨代际缓慢展开的'板块构造'式历史过程：19世纪大众政治来临之前已形成的中央集权国家遗产（带来官僚能力与语言同化）、政府公平提供公共物品的能力、以及志愿性市民社会组织的早期兴起，共同决定了能否建立跨越族群断层的包容型政治联盟。政治整合与国家认同是民族构建的一体两面；外部强加的'民族构建'（阿富汗、伊拉克、波黑）若缺乏本土条件注定失败，民族整合是以代际而非年份计的事业。","framework":"关系性视角（relational perspective）结合交换理论：把国家与公民的关系拆为三个维度，各对应一个机制——①组织形式：志愿结社能横向结成跨族群联盟网络，庇护网络则纵向分割于族群内部；②交换资源：政府公平供给公共物品以换取纳税与政治忠诚，私相授受则积累不起整合；③沟通媒介：共享语言/文字降低结盟的'交易成本'，语言碎片化使网络沿语言线聚集。三个机制又都由大众政治时代之前的中央集权国家遗产塑造，故称'板块构造'理论。","method":"三对配对比较案例研究（瑞士/比利时、博茨瓦纳/索马里、中国/俄国）分别展示三大机制，再转向大样本统计分析（'嵌套方法'设计）检验殖民经历、政体类型、经济发展、宗教重叠与战争等竞争性解释。","evidence":"瑞士的射击俱乐部、读书会、合唱团等志愿组织在19世纪上半叶已遍布各语区，'压倒'了语言多样性带来的整合难题；比利时的结社遭拿破仑与荷兰国王压制且局限于法语区，佛拉芒人被当作'内部殖民地'统治，国家如今濒于沿语言线分裂。博茨瓦纳承袭前殖民时期高度集权的茨瓦纳诸王国，独立后官僚能公平提供道路、学校、医疗与旱灾救济；索马里历史上从未出现统治内陆游牧人口的集权政体，巴雷政权只能靠军事化运动（送中学生下乡扫盲）提供公共物品，终致氏族庇护与内战。中国以统一文字和科举跨越语言分歧——'语言民族主义的狗在汉族中从未吠叫'；罗曼诺夫俄国的沟通空间被拉丁、阿拉伯、西里尔、蒙古等多种语言文字割裂，帝国两次沿语言线解体。大样本：155国EPR数据（1946—2005）显示识字率每升一个标准差（28%），被排斥人口比例平均下降30%；123国调查（覆盖92%世界人口）显示被歧视群体的国家自豪感比纳入群体低1.5分（4分制）；阿富汗数据显示，外国NGO与美军的项目反而提升了对塔利班的支持。","limits":"作者自承跨案例比较时'其他条件无法保持均等'，难以判定三机制的相对权重；长时段历史解释难以严格证伪；对民族构建的规范评价保持'不可知论'，可能回避了整合过程中同化压力的正义问题。","quotes":[{"en":"Why did some countries fall apart, often along ethnic fault lines, while others held together over decades and centuries, despite hosting a diverse population?","zh":"为什么一些国家——往往沿着族群断层线——分崩离析，而另一些国家尽管人口构成多元，却能在数十年乃至数百年间维系不坠？"},{"en":"public goods need to be provided by local governments, rather than foreigners, if the goal is to foster the political cohesion of struggling nations.","zh":"如果目标是培育困顿民族的政治凝聚力，公共物品就必须由本国政府而非外国人来提供。"},{"en":"It is a matter of generations rather than years.","zh":"这是以代际而非年份计的事业。"}]}],"glossary":[{"en":"state","zh":"国家","def":"在确定领土内拥有最高管辖权的政治共同体，包括政府、法院、军队、警察、国企等所有'公共'机构；它长久存在，不因政府换届而改变。","src":"政治学 5.pdf"},{"en":"government","zh":"政府","def":"国家权威的具体执行者，是国家制定和贯彻政策的'大脑'；政府是暂时的、会更替（换总统、换内阁），只是国家的一部分。","src":"政治学 5.pdf"},{"en":"sovereignty","zh":"主权","def":"国家高于社会一切社团、行使最高且不受限制之权力的属性——'一国之内国家说了算'；现代主权观念在1648年《威斯特伐利亚条约》中系统化。","src":"政治学 5.pdf"},{"en":"legitimate violence","zh":"合法性暴力","def":"韦伯的界定：只有国家可以正当地使用强制力（警察抓人、法院判刑）；对'合法性暴力'的垄断是国家主权的实际体现。","src":"政治学 5.pdf"},{"en":"pluralist state","zh":"多元主义国家","def":"一种国家理论：国家像中立的裁判，对各竞争利益一视同仁、不偏向任何一方；源于社会契约论，是自由主义传统的主流看法。","src":"政治学 5.pdf"},{"en":"the new right","zh":"新右派","def":"20世纪后期的思潮：把国家描绘成与社会分离、由自利官僚驱动而不断膨胀的'利维坦式怪兽'，主张把国家压回'守夜人'式的最小规模。","src":"政治学 5.pdf"},{"en":"minimal state","zh":"最小国家（守夜人国家）","def":"只管三件事的国家：维持内部秩序、保护契约与私有财产、抵御外来攻击；机构限于警察、法院与军队，其余留给市场和社会。","src":"政治学 5.pdf"},{"en":"developmental state","zh":"发展型国家","def":"主动干预经济、以推动工业增长为目标的国家；工业化越晚国家角色越大，典型是二战后日本通产省（MITI）引导投资。","src":"政治学 5.pdf"},{"en":"state-in-society","zh":"社会中的国家","def":"米格代尔的研究路径：别把国家当成独立自足的机构来研究，要看它与社会力量打交道时如何相互改变、边界如何模糊。","src":"Migdal, 2001.pdf"},{"en":"limited state","zh":"有限国家","def":"米格代尔的概念：国家在与社会的接合中被分割、削弱，能要求的服从是有限的——'全能国家'只是神话。","src":"Migdal, 2001.pdf"},{"en":"scope of state activities","zh":"国家职能范围","def":"福山的概念：政府'管多宽'——承担多少职能与目标，从只管国防治安到积极干预经济，构成一条连续谱。","src":"Fukuyama, 2004.pdf"},{"en":"state capacity / strength","zh":"国家能力／强度","def":"福山的概念：政府'做得成事'的能力——制定政策、执行法律、清明透明行政；比'管多宽'更能决定长期发展。","src":"Fukuyama, 2004.pdf"},{"en":"Washington Consensus","zh":"华盛顿共识","def":"IMF、世界银行等给发展中国家开的改革清单：私有化、削减补贴、放松管制，一味压缩国家范围，却常误伤国家能力。","src":"Fukuyama, 2004.pdf"},{"en":"neopatrimonialism","zh":"新庇护主义","def":"把公职与公款当作'人脉网'酬谢工具的统治方式：庇护部门不断膨胀，修路、办学等公共部门反被裁减；盛行于撒哈拉以南非洲。","src":"Fukuyama, 2004.pdf"},{"en":"inclusive institutions","zh":"包容性制度","def":"让多数人都能参与经济活动并保护其产权的制度：人人可创业、可签约、规则公平——持续繁荣的根源。","src":"Acemoglu & Robinson, 2012.pdf"},{"en":"extractive institutions","zh":"汲取性制度","def":"让少数精英吸取多数人财富的制度（如奴隶种植园）；它也能带来一时增长，但因扼杀创新而难以为继。","src":"Acemoglu & Robinson, 2012.pdf"},{"en":"nation building","zh":"民族国家构建","def":"让国内不同族群融入同一政治共同体的过程：一面是政治整合（跨族群联盟），一面是国家认同，两面一体。","src":"Wimmer, 2018.pdf"},{"en":"public goods","zh":"公共物品","def":"人人共享、由政府提供的物品：治安、道路、学校、防疫。政府公平供给公共物品，公民才愿以忠诚与认同回报。","src":"Wimmer, 2018.pdf"},{"en":"voluntary associations / civil society","zh":"志愿结社／市民社会","def":"民众自发结成的组织：射击俱乐部、读书会、工会等。兴起得早且遍布各地，就能把不同族群编进同一张政治网络。","src":"Wimmer, 2018.pdf"}],"socratic":[{"q":"新闻里常说'某国政府倒台''某国政府换届'，但没人说'某国倒台'。为什么换个政府、甚至内阁集体辞职，国家却照常运转？请用海伍德的区分，说出国家与政府的三点主要差别。","level":1,"hint":"先凭常识想：政府换届时，警察、法院、税务系统会跟着解散吗？再对照精读卡，从'谁包含谁''谁更长久''谁代表谁的利益'三个角度整理答案。","ref":"国家与政府的区别：①范围——国家涵盖所有公共机构与全体公民，政府只是国家的一部分；②存续——国家持续甚至永久存在，政府是暂时性组织、往复更替；③功能与利益——政府是国家权威借以实施的工具，是国家制定和贯彻政策的'大脑'，代表某一时期掌权党派的利益；国家则行使非人格的权威，代表社会的永久利益（公共利益）。所以政府倒台只是'大脑'换人，国家的机构框架照常运转。这一区分也是有限政府与立宪政府的理念基石。","wrong":"典型错误是把二者当同义词，或只答'国家大、政府小'。导师可追问：'如果政府等于国家，反对现政府是否等于叛国？'让学生意识到混淆二者的政治后果，再回到三点区别。","followup":"用这个区分解释：为什么文官系统要求政治中立，而内阁部长不必？","src":"政治学 5.pdf","kw":["代表","政府","范围","公共","组织","政策","机构","利益"]},{"q":"'9·11'袭击者大多出身中产家庭，而且是在西欧而不是在自己的祖国激进化的。这说明什么？贫困是恐怖主义的直接原因吗？福山为什么说'9·11'让弱国家问题变得无法回避？","level":1,"hint":"先区分'直接原因'和'结构性土壤'：恐怖分子本人穷不穷，和他们赖以滋生的国家弱不弱，是两个问题。再想想'市场经济+自由民主'这套组合为什么不是想要就能有。","ref":"福山明确指出：贫困不是恐怖主义的近因——袭击者出身中产，且是在西欧而非母国激进化。'9·11'真正凸显的是弱国家与失败国家问题：市场繁荣加自由民主的'现代性套餐'对世界上许多人极具吸引力（移民从穷国向富国单向流动即为明证），但许多社会难以实现它；无法提供秩序、安全、法律与产权的弱国家由此构成对国际秩序的威胁。弱国家与国家构建的必要性早已存在多年，'9·11'只是让它变得醒目。","wrong":"最常见的错误是脱口而出'贫困导致恐怖主义'。导师应追问：'如果贫困是原因，为什么袭击者不来自最穷的阶层和国家？'逼学生区分近因与条件，回到文本细节。","followup":"如果问题在弱国家而非贫困，发展援助的优先事项应该是什么？","src":"Fukuyama, 2004.pdf","kw":["民主","弱国家","世界","秩序","福山","构建","提供","主义"]},{"q":"诺加利斯这座城市被美墨边界劈成两半：两边气候、地理、疾病环境一样，居民文化背景也相似，北边却远比南边富裕。朝韩更醒目——同一个民族，夜间卫星图上南方灯火通明、北方几乎全黑。这两个画面最能动摇哪两种流行的贫富解释？","level":1,"hint":"把它当成一个对照实验：两边什么变量被'控制住'了？唯一不同的变量是什么？答案就藏在精读卡列出的三个'失效假说'之中。","ref":"动摇的是地理假说与文化假说。诺加利斯两侧地理、气候、疾病环境与文化背景几乎相同，唯一实质差异是边界两侧的不同制度——不同政权施加不同规则、创造不同激励。朝韩在分治前语言、民族、文化高度同质，差异同样只能归因于制度。既然地理与文化在对照中被保持恒定，它们就解释不了两侧的贫富悬殊，阿西莫格鲁与罗宾逊由此把根本原因锁定在制度上。东西德是第三个同类证据。","wrong":"学生常复述'制度重要'的结论，却说不出为什么这两个案例有说服力。导师应追问：'如果文化是关键变量，你怎么解释墨西哥移民过了边界收入就倍增？'引导其说出'控制变量'的逻辑。","followup":"这种'自然实验'的说服力有无边界？全球化时代，边界两侧真的互不渗透吗？","src":"Acemoglu & Robinson, 2012.pdf","kw":["民族","制度","文化","三个","解释","地理","假说","激励"]},{"q":"美国政府'管得少'——没有全民医保、市场管制也少，但它执行法律的能力（从交通罚单到民权法案）却非常强。反过来，埃及有高效的国内安全机器，却连办签证、给小企业发执照都办不利索。可见'强国家'的'强'字有歧义：福山把它拆成了哪两个维度？","level":2,"hint":"想想'政府管的事多不多'和'政府管的事能不能办成'是不是一回事。给两个维度各起一个名字，再想想美国该放进矩阵的哪个象限。","ref":"福山区分国家职能范围（scope，政府承担的职能与目标的宽窄）与国家能力（strength，制定执行政策、清明透明执法的制度能力）。'强'常被混用于两者，造成理解混乱。美国是最佳例证：有限政府传统使其范围历史上很窄，但在该范围之内创制和执行法律政策的能力非常强，法治为世界许多国家所羡慕，属'范围有限+能力强'的第一象限。埃及则说明同一国家不同机构的能力可以参差不齐。把两个维度分开，才能看清'压缩范围'与'削弱能力'是两回事。","wrong":"典型错误是把'小政府'等同于'弱政府'。导师应追问：'按你的逻辑，新加坡和香港政府管得少，它们是弱国家吗？'迫使学生把两个维度拆开，再各找一例填入四象限。","followup":"把中国、瑞典、索马里分别放进这个矩阵，你会怎么摆？依据是什么？","src":"Fukuyama, 2004.pdf","kw":["国家职能范围","国家能力","政府","制度","历史","理解","世界","维度"]},{"q":"为什么有些发展中国家接受了IMF和世界银行几十年的援助与改革方案，却依然贫困？福山对'华盛顿共识'在撒哈拉以南非洲的遭遇给出了一个出人意料的分析：改革反而削弱了国家。这个机制是什么？","level":2,"hint":"关键不在'减不减'，而在'由谁来减、减哪个部门'。精读卡里肯尼亚总统办公室雇员从1.8万涨到4.3万的数据，暗示了答案。","ref":"机制如下：华盛顿共识要求压缩国家范围，但改革由谁执行决定了结果。撒哈拉以南非洲盛行'新庇护主义'政权——庇护网络与现代韦伯式官僚部门并存，且视后者为资源竞争者。外部削减范围的压力被政权利用为借口，裁撤的恰是履行常规公共行政的现代部门——道路、公共卫生、基础教育与农业投入锐减；同时庇护部门和'主权性开支'（军队、外交、总统府职位）反而扩张，肯尼亚总统办公室雇员从1971年的18,213人增至1990年的43,230人。最优路径本是'缩范围+强能力'，实际却走了范围与能力双降的错误路径；捐助方因无法控制当地政治结果而无力阻止。","wrong":"常见答法是笼统归因于'西方政策失败'或'非洲人腐败'。导师应追问：'同样的削减要求，为什么砍在现代部门而不是庇护部门头上？''捐助者的条件为何失灵？'逼学生说出政权内部两部门竞争这一机制。","followup":"这个案例对'把制度当快递包裹寄给弱国家'的援助思路提出了什么根本质疑？","src":"Fukuyama, 2004.pdf","kw":["新庇护主义","华盛顿共识","主权","能力","决定","范围","公共","机制"]},{"q":"一个有意思的现象：国家不可能在每个街角都站一个警察，可多数人还是会在红灯前停下。米格代尔问的核心问题是'人们为什么服从'。除了怕被惩罚，还有哪些机制让秩序成为可能？","level":2,"hint":"想想你自己为什么守规矩：怕被抓只是其一。办手续、上学、签合同离不开国家是不是其二？'我是某国人'的身份认同是不是其三？这三种机制分别对应精读卡里的哪些视角？","ref":"米格代尔梳理了三个层次的服从机制：①强制——法官与狱警是国家的核心，但国家无力处处布警，单靠强制机构会迅速不堪重负；②制度性计算与惯例——国家规则保障契约、饮水、信贷、教育，成为人们'生存策略'的一部分，服从是理性的交换，历史制度主义者强调这种例行化（人们遵循惯常路径而非事事算计）；③文化性认同——人们把个人身份系于'集体自我意识'（民族认同），服从成为维系自我身份的方式。国家试图通过语言政策、教育、仪式与传媒独占集体意识的定义权，但统一叙事总会被多元社会折射变形，故国家始终是'有限国家'。","wrong":"学生常只答'怕惩罚'或空泛的'道德约束'。导师应追问：'如果只靠强制，要多少警察才够？为什么新政权的合法性危机总表现为认同危机？'引导其看到三层机制的递进。","followup":"用这三层机制分析：为什么弱国家的公民往往把忠诚投向宗族、教派而不是国家？","src":"Migdal, 2001.pdf","kw":["民族认同","有限国家","制度","文化","米格代尔","三个","历史","机制"]},{"q":"加纳总理布西亚是受过专业训练的经济学家，明知价格管制和高估汇率在经济学上不可持续，上台后却照做不误；1971年他接受IMF的贬值方案，首都阿克拉爆发骚乱，他随即被军事政变推翻。这个案例驳倒了哪个流行的贫富解释？","level":2,"hint":"先问：他是'不懂'还是'不能'？价格管制压低了农产品价格——想想这对哪一群人有利，这群人在政治上有什么分量。","ref":"驳倒的是无知假说——穷国之所以穷是因为统治者不知道如何致富。布西亚深知这些政策在经济学上不善，但它们'是好政治'：价格管制向政治上强大的城市集团输送廉价食品并为政府创收。采纳良政的主要障碍不是政治家的无知，而是他们从本国政治经济制度中面对的激励与约束——签署贬值协议近乎政治自杀，他也确实因此被政变推翻。穷国'做错'往往不是失误或无知，而是有意为之。","wrong":"两种典型误读：'布西亚不懂经济'或'IMF害了他'。导师应追问：'文本哪句表明他明知政策不善？既然知道，他图什么？'把学生的解释从'认知'层面拉到'激励与约束'层面。","followup":"如果问题出在激励而非知识，'给穷国派经济顾问'这类援助为什么收效甚微？","src":"Acemoglu & Robinson, 2012.pdf","kw":["政府","制度","假说","政策","激励","经济","统治","致富"]},{"q":"同一件事——国家征税办福利——在四种国家理论眼里评价截然不同。请分别用多元主义、马克思主义、新右派、女性主义的口吻回答'国家究竟代表谁的利益'，并指出米格代尔为什么说这个问题本身可能问错了。","level":3,"hint":"先把四派答案排成一列：中立裁判／阶级工具／自利怪兽／男性权力机构。米格代尔的提醒是：这些答案都预设了国家是一个统一行动者——这正是他要打破的想象。","ref":"多元主义：国家是对社会竞争利益进行裁判的中立机构，正当性来自社会契约与政治义务。马克思主义：国家不能脱离阶级结构——或是压迫从属阶级的工具（工具主义），或以让步缓和阶级冲突、维系资本主义（结构主义），新马克思主义又承认国家的相对自主。新右派：国家追求与社会相分离的自我利益，由自利官僚驱动而不断膨胀。激进女性主义：国家权力反映男性统治的深层压迫结构。米格代尔则转换问题：争论国家'整体'代表谁，预设了国家是统一行动者，这正是本质化想象；真实答案是多面的——国家的不同部分与不同社会力量结成不同联盟，须在'社会中的国家'里具体研究。","wrong":"学生常选边一站（如'国家就是统治阶级工具'）而无力处理反例。导师应追问：'如果国家纯粹是资产阶级工具，福利国家和普选权从何而来？''如果国家完全中立，新多元主义承认的企业特权位置又如何解释？'迫使学生在反例中校准立场。","followup":"四派中哪一派最接近米格代尔自己的立场？为什么又不完全像？","src":"政治学 5.pdf","kw":["社会中的国家","多元主义","新右派","代表","真实","权力","米格代尔","研究"]},{"q":"博茨瓦纳和索马里：都有非洲殖民经历、族群多样性相近、经济都靠畜牧业，独立后一个成了非洲最成功的民族构建故事、一个却陷入内战解体。维默用这对'配对案例'想说明哪个机制？'配对'的设计妙处在哪里？","level":3,"hint":"配对比较就像对照实验：先把两国相同的条件列出来，剩下那个关键差异就是变量。想想独立之前，两国的'国家遗产'有何不同。","ref":"说明的是公共物品供给机制，而其根源可追溯到大众政治时代之前形成的中央集权遗产。博茨瓦纳的茨瓦纳诸王国在前殖民与殖民时期已发展为高度集权、整合严密的政体，独立后被纳入国家政府之下，官僚因此能有效扩展出口、修建道路学校、提供旱灾救济，且少有族群偏袒，执政党赢得跨地区支持，内阁与议会大体反映族群构成；索马里历史上从未出现统治内陆游牧人口的集权政体，公共物品供给能力缺失，巴雷政权只能靠军事化运动（如送中学生下乡扫盲）应急，最终滑向氏族庇护与内战。配对的妙处在于：共同条件（殖民经历、族群多样性、畜牧经济）被'控制'，集权遗产这一差异便凸显为解释变量。","wrong":"学生易把差异归因于'博茨瓦纳有钻石'（经济发展解释）。导师应追问：'维默自己也提出钻石这个竞争解释，他为什么还要继续做跨国大样本检验？'让学生体会配对案例无法排除竞争解释的局限。","followup":"索马里人说同一种语言却仍整合失败——这对'语言同质性促进民族构建'的判断意味着什么？","src":"Wimmer, 2018.pdf","kw":["公共物品","政府","共物品供给","能力","整合","历史","解释","集权"]},{"q":"福山说'国家能力比职能范围更重要'；阿西莫格鲁与罗宾逊却说苏联、中国式的汲取性增长不可持续。苏联和中国的国家能力都很强——两位（组）作者的判断是互补还是矛盾？请综合评述。","level":3,"hint":"把两个框架当成两条不同的轴：福山问'国家能不能做成事'，A&R问'制度为谁服务、激励谁'。分别给苏联/中国在两条轴上定位，再看冲不冲突。","ref":"二者更多是互补而非矛盾。福山的轴是国家能否'做成事'：苏联与中国恰恰展示了强大的政治集权与执行能力——能把资源与人强制调配到高生产率部门，这正是A&R所说汲取性增长的必要条件（'政治集权是汲取性增长的关键'）。但A&R的轴是制度'为谁服务、激励谁'：能力再强，若制度汲取、缺乏创造性破坏，增长终将如苏联在1970年代那样停滞。两框架结合可得：国家能力是增长的必要条件，包容性制度才是增长可持续的充分保障。分歧只在规范重心：福山更担心弱能力国家的失序，A&R更警惕强能力但汲取性的国家。","wrong":"常见错误是二选一：要么说'完全矛盾，一个夸能力一个骂集权'，要么说'完全一致没有张力'。导师应追问：'中国案例在两框架下的位置分别是什么？''福山会不会同意能力可以服务于汲取？'逼学生把两个维度正交化后再比较。","followup":"如果一个国家能力弱且制度汲取（如许多撒哈拉以南国家），两框架分别会开出什么不同的'药方'？","src":"Acemoglu & Robinson, 2012.pdf","kw":["包容性制度","国家能力","汲取性","创造性破坏","关键","福山","集权","激励"]},{"q":"美军推翻塔利班和萨达姆之后，西方投入巨资在阿富汗、伊拉克'重建民族国家'，结果却远非所愿。福山认为弱国家威胁国际秩序、外部力量可以帮助重建；维默却断言这类外部民族构建'很可能失败'。两人的分歧仅仅是方法之争，还是理论之争？","level":4,"hint":"注意两人对'时间尺度'和'公共物品由谁提供'的不同设定。维默的问题不是'怎么建'，而是'能不能被建'。","ref":"分歧是理论性的。福山站在政策工程立场：弱国家威胁国际秩序，外部力量可以帮助重建国家。维默的'板块构造'理论则从根本上否定这种可工程化预设——民族整合依赖大众政治时代之前就开始的集权遗产、公共物品供给传统与市民社会组织，是以代际而非年份计的过程，不可能在一两届总统任期内完成。更尖锐的是机制判断：只有当公共物品由本土政府而非外国人提供时，公民才以政治忠诚与民族认同作为交换；阿富汗的调查数据甚至显示，外国NGO与美军的项目反而提升了对塔利班的支持。福山要'建国家'，维默追问的是'国家能否被建'——直指发展干预的认识论基础。","wrong":"学生常把分歧简化为'福山乐观、维默悲观'或'快慢之争'。导师应追问：'如果只是时间长短，多派几年兵不就行了？维默为什么认为延长时间也没用？'引导学生看到机制层面（本土供给公共物品）而非时间层面的根本分歧。","followup":"用米格代尔的'有限国家'概念裁决这场争论：它会支持谁？为什么？","src":"Wimmer, 2018.pdf","kw":["民族认同","市民社会","公共物品","政府","弱国家","共物品供给","理论","整合"]},{"q":"综合本章：一个多族群、殖民历史深、国家能力弱的发展中国家向你求助。请分别从海伍德（概念与理论谱系）、米格代尔、福山、阿西莫格鲁与罗宾逊、维默的视角出发，各开一条'诊断'或'药方'，并指出它们之间有没有共同底色。","level":4,"hint":"不必给出'正确答案'，练习的是把五个框架各用一遍：概念上它缺什么？方法上别迷信什么？维度上先补哪块？制度上改什么激励？历史上急不得什么？","ref":"示例综合：海伍德提醒先厘清'国家'与'政府'，不把对现政府的不满当成否定国家本身，四种国家理论则提示'国家代表谁'本身就是斗争场；米格代尔告诫抛弃全能国家想象，到国家与社会的接合处观察真实能力；福山主张在压缩不当干预的同时优先建设行政能力，避免'范围与能力双降'；A&R指出关键是改变激励结构——让权力广泛分布并受约束，使掌权者无法靠汲取致富；维默提醒公共物品必须由本土政府公平供给，民族整合是以代际计的事业。共同底色：都反对'国家一纸命令就能建成'的工程想象，都把能力、激励与历史条件置于政策口号之上。","wrong":"常见问题是把五篇背成五段名词解释，彼此无对话。导师应追问：'维默会不会同意福山的能力建设方案？米格代尔会怎么评价你的诊断书？'迫使学生让作者互相质询。","followup":"五篇之中，谁的建议最容易被误用成'外部干预指南'？为什么？","src":"Migdal, 2001.pdf","kw":["公共物品","代表","政府","民族","真实","权力","米格代尔","理论"]}],"quiz":[{"type":"mc","q":"海伍德归纳的国家五个关键特征，下列哪一项不在其中？","options":["国家是至高无上的","国家机构是'公共的'","国家由民主选举产生","国家是一个领土单位"],"answer":2,"explain":"五个特征是：至高无上、公共性、暗含合法性、统治工具（垄断合法性暴力）、领土单位。民主选举是某些政府的产生方式，不是国家的构成特征。","src":"政治学 5.pdf"},{"type":"tf","q":"在海伍德的用法中，'国家'与'政府'两词可以互换使用，因为二者范围相同。","answer":false,"explain":"国家范围比政府更广：国家涵盖所有公共机构与全体公民，政府只是国家的一部分；国家持久存在而政府暂时更替。这一区分是有限与立宪政府的核心理念。","src":"政治学 5.pdf"},{"type":"tf","q":"福山指出，'9·11'袭击者大多出身贫困，这说明贫困是恐怖主义的直接原因。","answer":false,"explain":"恰恰相反：袭击者出身中产阶层，且是在西欧而非母国激进化——贫困不是恐怖主义的近因。'9·11'凸显的是弱国家与失败国家无法提供秩序、安全与产权这一结构性问题。","src":"Fukuyama, 2004.pdf"},{"type":"mc","q":"下列哪一项不属于海伍德所说的'四种对立的国家理论'？","options":["多元主义国家","资本主义国家","利维坦式国家","社会—民主国家"],"answer":3,"explain":"四种对立理论回答'国家权力服务于谁'：多元主义、资本主义（马克思主义）、利维坦式（新右派）、家长式（女性主义）。社会—民主国家属于'国家角色'类型（按职能宽窄排列的谱系），与最小国家、发展型国家、集体化国家、极权国家并列。","src":"政治学 5.pdf"},{"type":"mc","q":"在福山的'范围—能力'矩阵中，美国最接近哪个象限？","options":["范围有限＋能力强","范围广＋能力强","范围有限＋能力弱","范围广＋能力弱"],"answer":0,"explain":"美国的有限政府传统使国家活动范围历史上很窄，但在该范围之内创制和执行法律政策的能力非常强，法治为世界许多国家所羡慕——正是'范围有限＋能力强'的第一象限。","src":"Fukuyama, 2004.pdf"},{"type":"mc","q":"下列哪个案例最直接地同时驳斥了地理假说与文化假说？","options":["苏联1970年代的经济停滞","诺加利斯被美墨边界分为贫富两半","肯尼亚总统办公室雇员激增","巴巴多斯的甘蔗种植园"],"answer":1,"explain":"诺加利斯两侧地理、气候、疾病环境与居民文化背景几乎相同，唯一实质差异是边界两侧的不同制度，因此贫富差异无法归因于地理或文化，只能归因于制度。","src":"Acemoglu & Robinson, 2012.pdf"},{"type":"tf","q":"米格代尔认为，韦伯式国家中心视角系统性地低估了国家的实际能力。","answer":false,"explain":"恰恰相反：分析性孤立把国家刻画为统一自足的机构，'本质化了国家并高估了其能力'。米格代尔主张以'有限国家'纠正这种高估，揭示国家在实践中被社会力量分割与削弱。","src":"Migdal, 2001.pdf"},{"type":"tf","q":"阿西莫格鲁与罗宾逊认为，汲取性制度下完全不可能出现经济增长。","answer":false,"explain":"汲取性制度可以产生增长（苏联、中国即为例证），因为政治集权使国家能强制调配资源；但这种增长缺乏创造性破坏，内在有限且不可持续，苏联1970年代的停滞即是明证。","src":"Acemoglu & Robinson, 2012.pdf"},{"type":"mc","q":"维默提出的民族国家构建三大机制，不包括下列哪一项？","options":["大众政治时代之前的中央集权国家遗产","政府公平提供公共物品的能力","志愿性市民社会组织的早期兴起","外部大国的军事占领与民主改造"],"answer":3,"explain":"三大机制是集权国家遗产、公共物品供给能力、志愿组织网络。外部强加的民族构建恰是维默批评的对象：若缺乏本土整合条件，阿富汗、伊拉克式干预注定失败。","src":"Wimmer, 2018.pdf"},{"type":"sa","q":"请用自己的话解释'国家职能范围'与'国家能力'的区别，并举一个现实例子说明两者为何不能混为一谈。","ref":"范围指政府'管多宽'——承担的职能与目标的多寡；能力指政府'做得成事'的本领——制定执行政策、清明透明执法的制度能力。例：美国政府管得相对少（无全民医保、市场管制少）但执法能力很强，是'窄范围＋强能力'；许多发展中国家政府什么都想管，却连基本治安、办学都保障不了，是'宽范围＋弱能力'。混淆两者的后果：华盛顿共识一味压缩范围，结果误伤能力，不少国家走上'范围与能力双降'的错误路径。","explain":"评分要点：①说出'管多宽'与'做得成事'的通俗区分；②例子能体现两个维度可独立变化；③能点出混淆的政策后果者加分。","src":"Fukuyama, 2004.pdf"},{"type":"sa","q":"请用自己的话解释'包容性制度'与'汲取性制度'的区别，并举一个例子说明汲取性制度下的增长为何难以持续。","ref":"包容性制度允许鼓励多数人参与经济活动：保障产权、公平竞争、开放准入，因此多数人有动力投资与创新，支撑持续繁荣（如美国、韩国）。汲取性制度让精英以多数人为代价致富：产权只属于少数人，多数人缺乏激励。汲取性制度也能增长——精英可凭政治集权把资源强制调入高生产率部门（如苏联1928—1970年代的工业化、加勒比甘蔗种植园）；但这种增长不伴随创造性破坏与广泛的技术创新，内在有限，苏联1970年代的停滞即其结局。","explain":"评分要点：①定义抓住'多数人参惠'与'精英汲取'的对立；②例子具体；③指出'无创造性破坏→不可持续'的机制。","src":"Acemoglu & Robinson, 2012.pdf"}],"flashcards":[{"front":"国家（state）","back":"领土内行使最高权力的政治共同体，含全部公共机构。政府会更替，国家长存——换总统不等于换国家。","src":"政治学 5.pdf"},{"front":"政府（government）","back":"国家权威的执行工具，国家的'大脑'。它是暂时的、可换届的，只是国家的一部分；批评政府不等于不爱国。","src":"政治学 5.pdf"},{"front":"合法性暴力","back":"韦伯语：只有国家能正当地使用强制力（警察、监狱）。对合法性暴力的垄断，是国家主权的实际体现。","src":"政治学 5.pdf"},{"front":"主权（sovereignty）","back":"国家高于社会一切社团的最高权力属性。1648年《威斯特伐利亚条约》后，主权国家成为国际体系的基本单位。","src":"政治学 5.pdf"},{"front":"社会契约","back":"霍布斯、洛克等的学说：人们自愿让渡部分自由建立国家，换取秩序与安全。它是论证'为何服从'的假想契约。","src":"政治学 5.pdf"},{"front":"多元主义国家","back":"视国家为中立裁判的理论：各利益集团公平竞争，国家不偏向任何一方。新多元主义承认大企业拥有'特权位置'。","src":"政治学 5.pdf"},{"front":"新右派（利维坦式国家观）","back":"把国家看成由自利官僚驱动、不断膨胀的怪兽：官僚为保职位和预算而支持'大政府'，故主张最小国家。","src":"政治学 5.pdf"},{"front":"最小国家","back":"'守夜人'国家：只维持秩序、保护契约与财产、抵御外敌，机构限于警察、法院、军队。19世纪英美是典型。","src":"政治学 5.pdf"},{"front":"发展型国家","back":"以干预促发展的国家：国家与主要经济利益集团结成合作关系引导工业化，典型是日本通产省（MITI）模式。","src":"政治学 5.pdf"},{"front":"国家角色类型谱","back":"按职能宽窄排列：最小国家→发展型→社会—民主型→集体化→极权国家；后者泛政治化，消灭市民社会。","src":"政治学 5.pdf"},{"front":"社会中的国家（state-in-society）","back":"米格代尔路径：别把国家当独立机构孤立研究，要看它与社会力量接合时如何相互转化、边界如何模糊。","src":"Migdal, 2001.pdf"},{"front":"有限国家（limited state）","back":"米格代尔：国家在与社会的角力中被分割削弱，能要求的服从有限——'统一全能的国家'只是神话。","src":"Migdal, 2001.pdf"},{"front":"国家形象 vs 国家实践","back":"形象＝统一全能的官方叙事；实践＝地方上相互矛盾的实际运作。中央政策到地方'折射变形'即是落差。","src":"Migdal, 2001.pdf"},{"front":"国家职能范围（scope）","back":"福山：政府'管多宽'——从只管国防治安到积极干预经济。范围宽窄与能力强弱是两个独立维度。","src":"Fukuyama, 2004.pdf"},{"front":"国家能力（state capacity）","back":"福山：政府'做得成事'的能力——政策能制定、法律能执行。香港与韩国范围迥异，能力强却是共同优势。","src":"Fukuyama, 2004.pdf"},{"front":"新庇护主义（neopatrimonialism）","back":"把公职当'自己人'酬劳的统治：庇护部门膨胀、公共部门萎缩。肯尼亚总统办公室雇员20年从1.8万涨到4.3万。","src":"Fukuyama, 2004.pdf"},{"front":"三大失效假说","back":"地理（气候土壤）、文化（宗教价值观）、无知（不懂良策）都解释不了贫富差异——诺加利斯、朝韩、布西亚逐一证伪。","src":"Acemoglu & Robinson, 2012.pdf"},{"front":"包容性制度 vs 汲取性制度","back":"包容性：多数人有产权、能创业、规则公平→持续繁荣；汲取性：精英吸多数人血→增长因无创造性破坏而难持续。","src":"Acemoglu & Robinson, 2012.pdf"},{"front":"民族国家构建（nation building）","back":"让各族群融入同一政治共同体的过程：政治整合（跨族群联盟）与国家认同是一体两面。","src":"Wimmer, 2018.pdf"},{"front":"民族构建的板块构造理论","back":"维默：整合靠跨代际慢变量——集权遗产、公共物品供给、志愿组织网络；以代际而非年份计，难以外部强加。","src":"Wimmer, 2018.pdf"}]},{"id":"ch03","folder":"5. Political Regimes","title":"政治体制：民主的概念、模式与历史道路","subtitle":"Political Regimes","overview":{"theme":"环顾世界：为什么有的国家人民能投票把政府赶下台，有的国家却几十年由一个党、一个家族统治？为什么有些穷国搞民主屡屡失败，有些威权国家又在一夜之间转向选举？本章围绕'民主'这一政治体制的核心类型，用四篇经典文献层层递进地回答'什么是民主、民主从何而来、向何处去'三个问题：海伍德教材先清扫概念战场，界定民主并梳理四种理论模式；达尔给出民主过程的五项规范性标准；摩尔从阶级关系史解释民主与独裁的社会起源；亨廷顿分析20世纪末第三波民主化浪潮的成因与前景。","coreQuestions":["既然几乎所有政权——包括一些明显专制的——都自称'民主'，这个词还能告诉我们什么？界定民主必须回答哪几个核心问题？","古典民主、保护型民主、发展型民主与人民民主各自依据什么理由为人民统治辩护？","一个治理过程要满足哪些标准，才称得上把成员当作政治平等者来对待（达尔的五标准）？","同样是现代化，为什么英法美走向议会民主，德日走向法西斯主义，俄中走向共产主义（摩尔的'三条道路'）？","1974—1990年为什么有30来个国家接连转向民主？文化、经济与政治领导各自扮演什么角色，会不会出现第三次'回波'？"],"thread":"本章四篇文献构成'概念—标准—起源—浪潮'的递进链条。海伍德教材章先清扫概念战场：民主是'叫好之词'，必须通过'谁是人民、人民如何统治、统治范围多大'三问来界定，并给出四种民主模式与五种实践解释（多元主义、精英主义、统合主义、新右派、马克思主义）。达尔接着把问题收束为规范性标准：以'政治平等'为前提，推导出有效参与、投票平等、开明理解、议程控制、包容成年公民五项民主过程标准。摩尔把视角从应然转向实然：民主不是设计出来的，而是英、法、美经由资产阶级革命、德日经由自上而下的反动革命、俄中经由农民革命等不同历史道路的产物，'无资产阶级，即无民主'。亨廷顿最后把镜头拉到1974—1990年的第三波，分析其五大成因与潜在回波，并断言'经济发展使民主成为可能，政治领导使之成为现实'。","path":["第一步：带着'为什么人人都自称民主'的疑问读海伍德教材章，掌握民主的界定三问与四种民主模式，建立概念地图；","第二步：读达尔《什么是民主？》，把自己代入'受托为社团起草宪法'的情境，理解民主过程五标准及其与政治平等的关系；","第三步：读摩尔《走向现代社会的民主道路》，带着'为什么现代化结局如此不同'的问题，理解民主、法西斯主义、共产主义三条历史道路的结构条件；","第四步：读亨廷顿《民主的第三波》，把摩尔的结构性分析与民主化的短期动因（合法性危机、经济发展、教会、外部力量、滚雪球）对接；","第五步：回到教材4.3节，用多元主义/精英主义/马克思主义的争论审视：我们身边的自由民主在多大程度上实现了达尔的标准？"],"dialogue":"四篇文献之间存在多重对话与张力。其一，达尔与海伍德同处规范民主理论阵营，但海伍德展示的'模式之争'提示达尔的五标准只是自由民主内部的一种答案：卢梭的公意论、马克思的人民民主会拒绝把民主限定为程序标准。其二，摩尔与达尔形成'实然—应然'互补：达尔从政治平等原则推导民主标准，摩尔则证明这些标准所依附的制度是阶级关系与暴力革命的历史产物——民主的条件是'无资产阶级'，而非普适原则。其三，亨廷顿与摩尔在解释层次上对话：摩尔强调长时段结构（土地贵族、农民问题、阶级联盟），亨廷顿虽承认'贫困是民主化的主要障碍'这一结构性约束，却坚持把政治领导与短期因素（合法性危机、滚雪球）作为第三波的直接动因。其四，海伍德笔下的'新右派民主超载论'与亨廷顿对民主巩固的忧虑遥相呼应，共同提示：民主既可能因太少而专制，也可能因太多而瘫痪。"},"readings":[{"file":"政治学 4.pdf","title":"《政治学》（第三版）第4章：民主","authors":"安德鲁·海伍德（Andrew Heywood）","year":"2013（中译本）","venue":"海伍德著、张立鹏译《政治学》（第三版），中国人民大学出版社，公共行政与公共管理经典译丛","thesis":"'民主'因人人称颂而沦为'叫好之词'，要恢复其分析价值，必须回答三问：谁是人民、人民应如何统治、人民统治的范围应有多大。围绕'凭什么为人民统治辩护'形成四种对立模式：古典民主、保护型民主、发展型民主、人民民主；对自由民主的实际运作则有五种竞争性解释：多元主义、精英主义、统合主义、新右派与马克思主义。","framework":"①界定民主的三问：谁是人民（政治权力在多大范围分配）；人民如何统治（直接民主还是代议民主）；统治范围多大（仅限狭义政治领域还是全部社会生活）。②四种民主模式：古典民主——雅典式公民大会直接统治，人民自治本身即保障民治政府；保护型民主——洛克、边沁为代表，视民主为公民免受政府侵害的工具，本质是宪政的有限间接民主；发展型民主——卢梭激进版（服从公意、直接参与）与密尔温和版（参与的教育功能），视民主为个人发展途径；人民民主——马克思主义传统，无经济解放则形式政治平等只是'资产阶级民主'假象。③实践的五种解释：多元主义（权力散布于竞争性团体）、精英主义（少数精英恒掌权力）、统合主义（国家—雇主—工会三边政府）、新右派（警惕'民主超载'）、马克思主义（民主与资本主义的内在矛盾）。","method":"教科书式概念分析与政治思想史梳理：词源学考察（demos/kratos）、思想家个案（洛克、边沁、卢梭、密尔、熊彼特、达尔、帕累托、米尔斯等）与概念辨析（直接/代议民主、公意、多数暴政等）。","evidence":"雅典公民大会每年至少召开40次，公职抽签轮换、任期极短，五百人议事会为其行政委员会；普选到来之晚：英国1928年、美国1960年代早期、瑞士1971年才实现；麦迪逊《联邦党人文集》以分权—两院制—联邦制应对'派别问题'；达尔1961年纽黑文研究断言'瑕瑜互见，纽黑文是民主制度的实例'；米尔斯《权力精英》描绘由大企业（尤其国防产业）、军队与总统身边政治小集团组成的权力精英；统合主义1945年后盛行于瑞典、挪威、荷兰、奥地利，1979年后英国转向自由市场使其衰落；布里顿论'民主的经济后果'，马昆德喻'民主对成人就如巧克力对儿童'。","limits":"作为教材综述，各模式被压缩为理想类型，牺牲了理论内部的复杂性；以西方经验为中心，'人民民主'一节主要转述马克思主义立场而非平等对待；对协商民主、世界民主等新议题仅一笔带过。","quotes":[{"en":"“民主是最坏的政府形式，只不过要除掉所有其他已经不断试验过的政府形式。”——丘吉尔在英国下议院的演讲（1947）","zh":"—"},{"en":"英国人相信他们自己是自由的，这可是大错特错了；他们只有在选举议员时才是自由的；选举过后，人民不过是奴隶，等于零。（卢梭《社会契约论》）","zh":"—"},{"en":"民主的方法是为作出决定的一种制度安排，在这种制度安排中，个人通过竞取人民手中的选票获得作出决定的权力。（熊彼特）","zh":"—"}]},{"file":"Dahl & Shapiro, 1998.pdf","title":"What Is Democracy?（什么是民主？）","authors":"Robert A. Dahl（罗伯特·达尔）","year":"1998","venue":"Robert A. Dahl, On Democracy（《论民主》）第4章, Yale University Press","thesis":"民主的出发点是一个简单假设：所有成员在参与社团决策方面具有同等资格（政治平等）。由此可推出民主治理过程必须满足的五项标准：①有效参与——政策通过前，所有成员有平等而有效的机会表达其政策主张；②投票平等——最终决策时每人有平等有效的投票机会且票票等值；③开明理解——在合理时限内，每人有平等有效的机会了解备选政策及其可能后果；④对议程的最终控制——成员拥有排他性机会决定何事列入议程，民主过程永不封闭；⑤包容成年公民——所有或至少大多数成年常住居民享有前四项标准蕴含的全部公民权利。任何一项被违反，成员即不再是政治平等的；这些标准是衡量一切自称民主的制度的理想尺度。","framework":"规范民主理论：以'邀请你为一个社团起草宪法'的思想实验，从政治平等这一元原则出发，通过连续的反例推演（表决机会不等、按财产加权投票、执行委员会垄断议程）逐步证成五项标准的必要性；原文图4将民主定义为提供五种机会的过程。","method":"思想实验与逻辑推演：构造'社团立宪'情境，逐一提出貌似民主实则违反政治平等的宪法安排，以此展示每条标准为何不可或缺；并讨论标准适用于国家、可及性与制度设计等问题。","evidence":"引公元前431年伯里克利葬礼演说（'我们的普通公民……是公共事务的公正裁判者'）支持'开明理解'标准；以'按财产多少加权计票'的反例证成投票平等；以'大财产所有者控制的执行委员会垄断议程、大会只能讨论其列入的事项'的反例证成议程控制标准；以美国宪法（强总统+强国会）与欧洲议会制的差异说明'并不存在单一的民主宪法'。","limits":"五标准是理想化的程序标准，达尔本人承认没有任何国家能完全达到；该框架以自由民主的经验为底色，对实质平等（经济资源、社会条件）与民主的关系在本章悬置；'成年居民包容'标准的证成被推迟到他章。","quotes":[{"en":"all the members are to be treated (under the constitution) as if they were equally qualified to participate in the process of making decisions about the policies the association will pursue.","zh":"所有成员都应被（在宪法之下）视为具有同等资格，去参与决定社团将采取何种政策的过程。"},{"en":"The members must have the exclusive opportunity to decide how and, if they choose, what matters are to be placed on the agenda.","zh":"成员必须拥有排他性的机会，去决定如何以及（如果他们愿意）把哪些事项列入议程。"},{"en":"as with other associations no state has ever possessed a government that fully measured up to the criteria of a democratic process. None is likely to.","zh":"与其他社团一样，没有任何国家曾拥有完全符合民主过程诸标准的政府，将来也不可能有。"}]},{"file":"Moore, 1966.pdf","title":"The Democratic Route to Modern Society（走向现代社会的民主道路）","authors":"Barrington Moore, Jr.（巴林顿·摩尔）","year":"1966","venue":"Barrington Moore, Social Origins of Dictatorship and Democracy（《专制与民主的社会起源》）第7章, Beacon Press","thesis":"通向现代世界有三条历史道路：①资产阶级革命道路——清教徒革命、法国大革命、美国内战把资本主义与议会民主结合起来（英、法、美）；②自上而下的反动革命道路——在缺乏强大革命冲击的情况下，资本主义经反动政治形式终于法西斯主义（德、日）；③农民革命道路——主要源于农民的革命造就共产主义变体（俄、中）。民主的发展是一场漫长而未完成的斗争：制约专断统治者、以公正理性规则取代专断规则、使底层民众分享规则制定权。著名命题'无资产阶级，即无民主'：充满活力的独立城市市民阶层是议会民主成长的不可或缺要素。","framework":"历史社会学与比较阶级分析：以王权、土地贵族、资产阶级、农民的关系与联盟结构为核心变量，解释政体道路的分歧。章末归纳民主发展的五项条件：①王权与土地贵族大致均衡（避免王权过强或贵族过分独立）；②土地贵族或农民转向适当形式的商品化农业；③削弱土地贵族的政治支配；④防止土地贵族与资产阶级结成反对农民和工人的联盟；⑤与过去决裂的革命性突破。并以印度经验作为这些条件的'粗略检验'。","method":"宏观历史比较分析：对英、法、美、德、日、俄、中、印八国的农业社会关系与革命经验做比较，并以印度的民主困境作为从西方经验归纳出的五项条件的'粗略检验'。","evidence":"英国玫瑰战争削弱贵族，土地贵族早早转向商品化农业（圈地养羊、羊毛出口），与城镇出口贸易结盟反对王权，内战击败绝对主义，圈地运动最终消除了'农民问题'；易北河以东容克把自由农民降为农奴以出口谷物（庄园反动），通往反动道路；法国大革命摧毁前商品化的土地精英；美国内战打破种植园奴隶制这一'资本主义内部生长的反民主障碍'；印度则因莫卧儿王权压倒贵族、寄生地主与高利贷者抑制商品化农业、又缺乏革命性突破，形式民主虽存续而困难重重。","limits":"以国家为单位的宏大叙事牺牲了内部差异，'资产阶级革命'概念被批评混淆了革命的参与者、受益者与制度后果（摩尔本人承认并'坦率地不一致'）；结构决定论色彩浓厚，低估了观念、领导与偶然性；印度检验是说明性而非严格证伪。","quotes":[{"en":"No bourgeois, no democracy.","zh":"无资产阶级，即无民主。"},{"en":"The author sees the development of a democracy as a long and certainly incomplete struggle to do three closely related things: 1) to check arbitrary rulers, 2) to replace arbitrary rules with just and rational ones, and 3) to obtain a share for the underlying population in the making of rules.","zh":"作者把民主的发展视为一场漫长且肯定未完成的斗争，要做三件密切相关的事：1）制约专断的统治者；2）以公正而理性的规则取代专断的规则；3）使底层民众分享规则的制定。"},{"en":"In a word, the landed upper classes either helped to make the bourgeois revolution or were destroyed by it.","zh":"一言以蔽之，土地上层阶级要么帮助造就资产阶级革命，要么被资产阶级革命所摧毁。"}]},{"file":"Huntington, 1991.pdf","title":"Democracy's Third Wave（民主的第三波）","authors":"Samuel P. Huntington（塞缪尔·亨廷顿）","year":"1991","venue":"Journal of Democracy, Vol.2, No.2 (Spring 1991)","thesis":"1974—1990年间至少30个国家转向民主，构成现代史上第三波民主化浪潮（前有1820年代—1926年的长波与二战后的短波，以及1922—1942、1960—1975两次回波）。第三波由五大因素促成：①威权政权的合法性危机——民主价值普及使其依赖'绩效合法性'，经济（或军事）失败即无法维持；②1960年代空前的全球经济增长——提高生活水平与教育、扩大城市中产阶层；③天主教会转向——1963—65年梵二会议后各国教会从现状维护者变为威权反对者；④外部行为体政策变化——欧共体、美国与苏联；⑤滚雪球效应——先行转型的示范。到1990年这些动因多已衰竭，民主化在儒教与伊斯兰文化区遭遇文化障碍、在非洲遭遇经济障碍，第三次回波并非不可能。","framework":"民主化的波浪模型（wave/reverse wave）+ 多因素解释框架（合法性、经济、宗教、外部力量、示范效应），并以'文化论'（严苛版：凯南的西方文化本位论；宽松版：儒教/伊斯兰特殊障碍论）与'经济论'（中等收入国家的'政治过渡带'最易转型）两大对立假说评估民主化的前景。","method":"历史分期归纳与区域性比较案例分析：以民主国家数量的消长划分三次浪潮与两次回波，分区域（南欧、拉美、东欧、东亚、非洲、中东）剖析动因与障碍，并辅以世界银行收入分组数据界定'政治过渡带'。","evidence":"1974—1989年转向民主的国家约四分之三以天主教为主；希腊1981年、西班牙和葡萄牙1986年加入欧共体以巩固民主；东欧剧变的滚雪球冲击扎伊尔（蒙博托宣布允许多党竞争）、尼泊尔（国王解除党禁）、坦桑尼亚（尼雷尔称可'学一两课'）；新加坡是1990年唯一非石油输出的'高收入'非民主国家（儒教异常案例）；1988年中高收入非民主国家集中于中东（表1，世界银行数据）；苏丹、尼日利亚1990年前已退回威权统治；1950年代被描述为'传统、威权、等级'的西班牙文化在一代人内转向现代价值观。","limits":"'浪潮'隐喻以选举民主的数量消长为度量，忽略民主质量与巩固深度；文化障碍论（儒教、伊斯兰）后被东亚民主化部分证伪，作者自己也警告对'文化是永久障碍'应保持怀疑；对内在结构性因素（阶级、土地关系）着墨少，与摩尔式分析形成互补而非替代。","quotes":[{"en":"Economic development makes democracy possible; political leadership makes it real.","zh":"经济发展使民主成为可能；政治领导使民主成为现实。"},{"en":"Poverty is a principal--probably the principal--obstacle to democratic development.","zh":"贫困是民主发展的一个主要——很可能是最主要的——障碍。"},{"en":"the people cannot decide until somebody decides who are the people.（引Ivor Jennings）","zh":"在有人决定谁是人民之前，人民无法作出决定。"}]}],"glossary":[{"en":"democracy","zh":"民主","def":"源于希腊语demos（人民）与kratos（统治），即'人民统治'；因人人称颂而有沦为空洞'叫好之词'的危险。","src":"政治学 4.pdf"},{"en":"political equality","zh":"政治平等","def":"民主的核心原则：政治权力与影响应尽可能广泛而平均地分配。自由民主派把它概括为'一人一票，票票等值'。","src":"政治学 4.pdf"},{"en":"direct democracy","zh":"直接民主","def":"人民不通过代表，而是用公民投票、公众会议等方式直接、连续地参与决策；原型是古雅典。","src":"政治学 4.pdf"},{"en":"representative democracy","zh":"代议民主","def":"公民选举代表替自己决策；其民主性在于人民握有'将坏蛋踢出去'的问责权力。","src":"政治学 4.pdf"},{"en"
