:"protective democracy","zh":"保护型民主","def":"17—18世纪兴起的民主模式：视民主为公民保护自己免受政府侵害的工具（洛克、边沁为代表），本质是宪政的有限间接民主。","src":"政治学 4.pdf"},{"en":"developmental democracy","zh":"发展型民主","def":"以'民主促进个人与共同体发展'为辩护理由的模式：卢梭的激进版主张服从公意的直接参与，密尔的温和版强调参与的教育功能。","src":"政治学 4.pdf"},{"en":"people's democracy","zh":"人民民主","def":"马克思主义传统的民主模式：没有经济解放，形式上的政治平等只是'资产阶级民主'的假象。","src":"政治学 4.pdf"},{"en":"plebiscitary democracy","zh":"公民投票式民主","def":"统治者与被统治者之间不设中介、靠公民投票确立的统治形态；容易给煽动政治与民粹专制留下空间。","src":"政治学 4.pdf"},{"en":"totalitarian democracy","zh":"极权民主","def":"假扮民主的绝对专制：领袖宣称独占'人民真正利益'的解释权，民众参与沦为仪式化服从。","src":"政治学 4.pdf"},{"en":"general will","zh":"公意","def":"卢梭概念：集体的真实利益，区别于每个人的私人意志；但若'公意'可由他人代为宣布，就有被专制者冒名规定之险。","src":"政治学 4.pdf"},{"en":"tyranny of the majority","zh":"多数暴政","def":"托克维尔提出、密尔深以为忧的民主内在威胁：有人打着人民旗号压制个人自由与少数权利，损害辩论与精神生活。","src":"政治学 4.pdf"},{"en":"pluralism","zh":"多元主义","def":"一种权力分配理论：权力广泛散布于竞争性团体之间，不存在固定支配的精英；达尔是当代最有影响的倡导者。","src":"政治学 4.pdf"},{"en":"elitism","zh":"精英主义","def":"认为政治权力总由少数精英掌握的理论：古典派（帕累托等）据此断言民主是神话；竞争派（熊彼特）把民主改写为精英竞取选票的程序。","src":"政治学 4.pdf"},{"en":"corporatism","zh":"统合主义（法团主义）","def":"把经济利益团体整合进政府过程的安排，形成国家官员、雇主团体、工会的'三边政府'；批评者认为它威胁议会民主与问责。","src":"政治学 4.pdf"},{"en":"effective participation","zh":"有效参与","def":"达尔民主过程第一标准：政策通过前，所有成员必须有平等而有效的机会向其他成员表达自己的政策主张。","src":"Dahl & Shapiro, 1998.pdf"},{"en":"control of the agenda","zh":"议程控制","def":"达尔民主过程第四标准：成员必须排他性地决定何事列入议程；民主过程永不封闭，最终控制权在成员整体手中。","src":"Dahl & Shapiro, 1998.pdf"},{"en":"bourgeois revolution","zh":"资产阶级革命","def":"摩尔概念：清教徒革命、法国大革命、美国内战等暴力动荡，通过摧毁旧土地精英为资本主义议会民主开路。","src":"Moore, 1966.pdf"},{"en":"third wave of democratization","zh":"第三波民主化","def":"亨廷顿概念：1974年葡萄牙革命起到1990年约30国转向民主；此前有1820年代—1926年长波与二战后短波及两次回波。","src":"Huntington, 1991.pdf"},{"en":"snowballing","zh":"滚雪球效应","def":"先行民主化国家对后发国家的示范效应；但亨廷顿强调：缺乏有利内部条件时，滚雪球单独不能带来民主化。","src":"Huntington, 1991.pdf"},{"en":"performance legitimacy","zh":"绩效合法性","def":"威权政权在意识形态合法性丧失后，转而依赖经济与军事成功维系统治；一旦失败即陷入合法性危机。","src":"Huntington, 1991.pdf"}],"socratic":[{"q":"打开世界地图你会发现一个奇怪现象：几乎所有国家——包括一些一党长期执政的国家——都自称'民主'，朝鲜的国号里就写着'民主主义人民共和国'。既然人人都用这个词赞美自己，它还能告诉我们什么有意义的信息？海伍德教材是怎么看这个问题的？","level":1,"hint":"想想'叫好之词'（hurrah word）这个说法：如果一个词对任何人可以有任何含义，它在分析上还有用吗？教材还引了伯纳德·克里克对民主一词的一句著名评价，可以先从那里想。","ref":"海伍德认为，'民主'的问题恰恰在于它太受欢迎：世人几乎齐声称颂，只把它当作暗示支持某种统治制度的'叫好之词'。克里克称之为公共事务世界里'最为混杂、最让人困惑的词汇'。教材列举了人们赋予它的多种含义：穷人和弱势者的统治、人民直接不间断的自我统治、以机会平等为基础的社会、福利再分配制度、多数统治、制约多数以保护少数、竞取选票产生公职的手段、服务于人民利益的政府——这些含义彼此矛盾（如多数统治与保护少数）。一个对任何人有任何含义的术语有陷入毫无意义之境地的危险，因此必须重新严格界定。","wrong":"典型错误是答'因为有些国家歪曲民主'——这把问题当成'谁真谁假'的裁判。导师应追问：教材说的是词义层面而非真伪层面；为什么'人人都赞美'本身就会掏空一个概念？请学生再举一个被用滥而失去含义的政治词汇（如'自由''改革'）来体会。","followup":"既然词义如此混乱，海伍德建议从林肯的哪句话出发重建民主的含义？","src":"政治学 4.pdf","kw":["政府","民主","制度","海伍德","人民","统治","必须","平等"]},{"q":"假设你们全年级同学要成立一个自治社团，章程起草会上吵成一团：'只有缴费会员才有表决权吗？''大事是全体投票还是选出代表决定？''社团能不能管成员的私人生活？'这三场争论，其实正好对应海伍德所说的界定民主必须回答的哪三个问题？","level":1,"hint":"把三场争论逐一对号入座：成员资格→统治方式→管辖范围。注意教材认为每个问题都有多种对立答案，并不存在唯一的'标准答案'。","ref":"三问是：①谁是人民——政治权力应在多大范围内分配，'人民'可以指全体成年公民，也可被理解为'多数'或'不可分割的整体'；②人民应如何统治——直接民主（公民投票、公众会议，人民直接连续地进入决策）还是代议民主（选举替人民决策的人，投票的民主性在于'将坏蛋踢出去'的问责权力）；③人民统治的范围应有多大——自由个人主义把民主限定于狭义政治领域，社会主义者、激进民主派和女性主义者则主张民主适用于经济、家庭等所有社会领域。三个问题的不同答案组合出不同的民主模式。","wrong":"学生常把三问答成'民主的定义、历史、优缺点'这类笼统表述。导师应追问：教材为什么用'问题'而不是'定义'来组织本节？请以'谁是人民'为例，说明为什么雅典的'人民'和今天瑞士的'人民'指的不是同一范围（雅典仅限20岁以上男性公民；瑞士1971年妇女才获得公民权）。","followup":"三问中哪一问最能区分自由主义者与社会主义者的民主观？为什么？","src":"政治学 4.pdf","kw":["代议民主","公民投票","直接民主","权力","人民","统治","模式","范围"]},{"q":"达尔请你做一个思想实验：你和几百人组成一个社团，大家委托你起草宪法。有人提议'让最聪明、消息最灵通的少数人替我们做所有重要决定，既明智又省大家时间'，却被成员们否决了。成员们认为，宪法必须满足哪些标准，才算把每个人当作平等的决策者？","level":1,"hint":"按决策过程的时间顺序想：先表达意见→再投票→还要先弄明白投的是什么→谁决定讨论哪些事→最后，哪些人有资格参与。这五步各对应一条标准。","ref":"成员们接受的前提是政治平等：所有人具有同等资格参与决定社团政策。由此推出五项标准：①有效参与——政策通过前，人人有平等有效的机会表达主张；②投票平等——最终决策时票票等值；③开明理解——在合理时限内，人人有平等机会了解备选政策及其后果；④对议程的最终控制——成员排他性地决定何事列入议程，民主过程永不封闭；⑤包容成年公民——所有或至少大多数成年常住居民享有全部公民权利。达尔强调：任何一条被违反，成员就不再是政治平等的。","wrong":"常见错误是只答'一人一票'。导师应追问：如果社团只能讨论和执行委员会列入议程的事项，'一人一票'还能决定什么？引导学生意识到投票只是决策链条的一环，表达、知情、议程前后环节同样需要平等保障。","followup":"达尔承认没有任何国家能完全符合这些标准——那立这些'达不到'的标准还有什么用？","src":"Dahl & Shapiro, 1998.pdf","kw":["有效参与","政治平等","民主","投票平等","开明理解","达尔","五项","标准"]},{"q":"某班实行'充分讨论、一人一票、投票前资料公开'，但班会只能讨论班长列入议程的议题，而班长职位只向缴费最多的几位同学开放。达尔的五标准里前三条都满足了，这个班级算政治平等吗？为什么？","level":2,"hint":"达尔在书里构造了几乎一模一样的反例：大财产所有者设计一部'满足前三条标准'的宪法，但规定大会只能讨论执行委员会列入议程的事项。想想这个小集团需要作弊才能赢吗？","ref":"不算。这正是达尔用来证成第四标准（对议程的最终控制）的反例：控制议程的小集团根本无须操纵讨论或投票，只要把不利提案永远挡在议程之外，就能确信社团永远不会通过违背其利益的提案。因此达尔要求：成员必须拥有排他性机会决定何事列入议程，民主过程永不封闭，政策始终可由成员改变。这个反例揭示：议程设置是一种隐蔽却决定性的权力——'不战而胜'比公开操纵选票更难被察觉。只有把最终控制权交还成员整体，政治平等才算完整。","wrong":"典型错误是把议程控制看成'会议程序的技术细节'，认为只要投票公平就行。导师应追问：如果一个团体能永远阻止某些议题进入讨论，它还需要在表决中作弊吗？请学生对比'不战而胜'与'公开操纵选票'，哪种更难被普通成员发现和抵制？","followup":"用这个标准观察现实：议会提案权、媒体议题设置、公司董事会议程——谁在控制议程？","src":"Dahl & Shapiro, 1998.pdf","kw":["政治平等","民主","权力","投票","达尔","标准","必须","议程"]},{"q":"同样是搞工业化、现代化，英法美走出了议会民主，德日却在20世纪滑向法西斯主义，俄中则爆发了共产主义革命。摩尔问：为什么相似的现代化进程通向三种截然不同的政体？他概括了哪三条道路？","level":2,"hint":"按革命的主体和方向来记：谁在推动变革（城市工商阶层？贵族自上而下？农民？）→各通向什么政体。注意摩尔强调这三条道路'更是相继的历史阶段'，而非摆在所有国家面前的可选菜单。","ref":"三条道路：①资产阶级革命道路——清教徒革命、法国大革命、美国内战把资本主义与议会民主结合起来（英、法、美）；②自上而下的反动革命道路——在缺乏强大革命冲击的情况下，资本主义经反动政治形式终于法西斯主义，德日通过'自上而下的革命'实现工业增长；③共产主义道路——俄中以主要源于农民的革命造就共产主义变体。印度到1960年代中期仍未完整踏上任一道路。摩尔强调它们是相继的历史阶段：先行者的选择改变了后发者面对的问题（'后发优势'），英国那样的道路在人类历史上'也许只能出现一次'。","wrong":"常见错误是把三条道路当成所有国家必经的'发展阶段'或自由选择的'菜单'。导师应追问：摩尔为什么要提'后发优势'？后发国家面对的问题与先行国家一样吗？印度为什么哪条路都没走通？","followup":"摩尔说民主的发展是'三件事的斗争'——这三件事分别是什么？","src":"Moore, 1966.pdf","kw":["资产阶级革命","民主","资本主义","革命道路","摩尔","反动","农民","历史"]},{"q":"观察历史你会发现：有些产油国很富却不民主，而近代早期欧洲城市商人阶层壮大的地方，王权往往受到议会的制衡。摩尔的名言'无资产阶级，即无民主'说的正是这种现象。他用哪些比较证据支持这个命题？","level":2,"hint":"对比两组案例：18世纪俄国贵族摆脱了对沙皇的义务、德国贵族与选帝侯斗争——但都缺少强大的城市市民阶层，结局分别如何？再看英国土地贵族转向商品化农业之后，与城镇形成了什么关系。","ref":"摩尔的证据：18世纪俄国服役贵族摆脱了对沙皇的义务，却保留并扩大了对农奴的权力，整个发展'对民主极为不利'；德国贵族与选帝侯的斗争大多与城镇分离进行，结果不是议会民主。反面的英国：土地贵族早早转向商品化农业（圈地养羊、羊毛出口），与城镇形成利益共同体，二者联手反对王权，构成内战与议会事业胜利的重要原因。机制在于：没有独立而有活力的城市市民阶层，贵族争'自由'只是争特权，且缺乏制衡王权的社会力量。故摩尔'坚决同意马克思主义论题'：充满活力的独立市民阶层是议会民主成长的不可或缺要素。","wrong":"学生易把该命题误读为'经济越富越民主'的现代化理论。导师应追问：摩尔强调的是财富总量还是阶级关系与联盟结构？为什么商品化冲动微弱的法国仍能走通民主道路——关键是'资产阶级'本身，还是摧毁旧土地精英的革命性突破？","followup":"亨廷顿笔下的新加坡（高收入却非民主）对摩尔这一命题构成挑战吗？","src":"Moore, 1966.pdf","kw":["民主","权力","马克思主义","土地贵族","商品化农业","摩尔","发展","自由"]},{"q":"1974年葡萄牙一场军事政变之后，短短十几年里，西班牙、拉美多国、菲律宾、韩国、东欧各国接连转向选举民主，到1990年至少30个国家完成转型，亨廷顿称之为'第三波'。他归纳了哪五大因素推动这波浪潮？","level":2,"hint":"按'政权内部—经济—宗教—外部大国—国家之间'五个层次记忆。特别注意一个数据：1974—1989年转型国家约四分之三以天主教为主，这与哪个因素直接相关？","ref":"五因素：①合法性危机——民主价值普及使威权政权丧失意识形态合法性，转而依赖'绩效合法性'，经济（或军事）失败即无法维持；②1960年代空前的全球经济增长——提高生活水平与教育、扩大城市中产阶层；③天主教会转向——1963—65年梵二会议后，各国教会从现状维护者变为威权反对者；④外部行为体政策变化——欧共体以成员资格激励南欧，美国推动民主化，苏联放弃对东欧的控制；⑤滚雪球效应——先行转型国家提供示范与模型，如东欧剧变冲击扎伊尔、尼泊尔、坦桑尼亚。亨廷顿同时提醒：到1990年这些动因多已衰竭。","wrong":"典型错误是只背出五个名词却说不清机制。导师应追问：'经济增长'为什么能促进民主（中产阶层、教育）？天主教会为什么会从现状维护者变成反对者（梵二会议）？要求学生对每个因素都讲出'通过什么起作用'。","followup":"亨廷顿为什么说到1990年这些动因'多已衰竭'？是因素本身消失了，还是其作用对象耗尽了？","src":"Huntington, 1991.pdf","kw":["滚雪球效应","绩效合法性","意识形态","民主","亨廷顿","天主教","威权","控制"]},{"q":"1989年东欧剧变后，扎伊尔的蒙博托在电视上看到齐奥塞斯库被处决的画面，惊骇之余宣布允许多党竞争；尼泊尔国王解除了党禁；坦桑尼亚的尼雷尔说一党制国家可以从东欧'学一两课'。这种'邻国的变革传染到本国'的现象，亨廷顿叫'滚雪球'。但他为什么又说滚雪球'单独不可能带来民主化'？","level":2,"hint":"想想：A国和B国转向民主，是C国必须转向民主的理由吗？亨廷顿的回答里有一个'除非'。另外注意：从蒙博托、尼雷尔的反应看，滚雪球主要影响的是民众还是统治者？","ref":"滚雪球指先行转型国家的示范效应。亨廷顿指出它主要作用于威权统治者而非民众：蒙博托因齐奥塞斯库之死'惊骇'而让步，尼雷尔称可向东欧'学一两课'。但他明确限定：'如果一国缺乏有利的内部条件，滚雪球单独不可能带来民主化'——A、B国的民主化不是C国民主化的理由，除非有利于前者的条件在后者同样存在。'世界性民主革命'可以创造有利的外部环境，却不能在一国内部生产出民主化所需的条件。东欧的特殊性在于障碍是外部的（苏联控制）；中东、非洲、亚洲的统治者若此前选择威权，此后仍可继续选择。","wrong":"常见错误是把滚雪球当成民主化的充分条件，以为'传染'自动生效。导师应追问：示范效应改变的主要是统治者的'意愿'，那内部条件（经济水平、中产阶层、反对力量）呢？为什么伊斯兰世界的自由化开放最初的主要受益者反而是原教旨主义团体？","followup":"滚雪球主要影响统治者而非民众——这个观察对'民主可以输出吗'的争论意味着什么？","src":"Huntington, 1991.pdf","kw":["民主","内部","亨廷顿","滚雪球","统治","威权","控制","革命"]},{"q":"熊彼特说：民主就是'个人通过竞取人民手中的选票获得作出决定的权力'——选民只能在精英之间挑一个，无法改变权力永远由精英掌控的事实。请用达尔的五标准衡量：熊彼特笔下的这种民主，在达尔的意义上合格吗？","level":3,"hint":"逐条对照五标准：投票平等大体满足；但选民'隔几年决定一次由哪个精英统治'，在有效参与、开明理解、议程控制这三条上够吗？再想想精英替选民设定议程意味着什么。","ref":"在达尔意义上只能算很弱的民主。熊彼特模式保障了投票平等（定期竞争性选举、票票等值），但选民的角色被压缩为'隔几年决定一次由哪个精英代表他们统治'：有效参与限于投票瞬间，开明理解受制于精英提供的信息，议程实际由竞争的精英设定——达尔的第四标准（成员排他性地控制议程）恰恰落空。教材也指出，竞争性精英主义最多是一种薄弱的民主形态，还可能造成公众的冷漠与政治疏远。熊彼特的回答会是：现实民主本来就只能如此，'民主乃政客的统治'。两种定义的分歧实质是：民主是'人民统治'的理想标准，还是'精英竞争'的现实描述。","wrong":"常见错误是简单宣判'熊彼特错、达尔对'或反之。导师应追问：两人概念的功能不同——达尔给的是衡量现实的'理想尺度'（他本人承认无国完全达标），熊彼特给的是'现实主义'描述。请学生说明：用理想标准衡量现实描述，批评的着力点应放在哪里？","followup":"海伍德说竞争性精英主义'能够密切配合自由民主政治制度的运转'——这是它的优点还是它的问题？","src":"政治学 4.pdf","kw":["有效参与","精英主义","代表","民主","投票平等","开明理解","人民","统治"]},{"q":"有一种流传很广的说法：'民主是西方文化的产物，儒教和伊斯兰社会不适合民主'——凯南就曾说，民主'证据尚待证明'是西北欧以外各民族的自然统治形式。亨廷顿认真对待这一论断，却也提出三条保留。他的评估是什么？","level":3,"hint":"回忆三点怀疑：①历史上类似的文化论断（天主教曾被视为民主障碍、儒教曾被视为资本主义障碍）后来应验了吗？②大文化传统内部是否只有反民主的成分？③文化是静止不变的吗——西班牙的例子说明什么？","ref":"亨廷顿承认传统儒教强调群体高于个人、权威高于自由、责任高于权利，缺乏权利对抗国家的传统；但他提出三点保留：第一，类似文化论断过去没有站住脚——天主教曾被指为民主障碍、儒教曾被指为资本主义障碍，后来均被推翻；第二，大文化传统极其复杂，任何主要文化都有与民主相容的成分，'儒教民主或许是矛盾修辞，但儒教社会中的民主未必是'；第三，文化是动态而非停滞的——1950年代被描述为'传统、威权、等级'的西班牙文化，到1970—80年代已完全不同，而促成文化变迁的最重要力量往往就是经济发展本身。他警告：对'文化是永久障碍'的论断应保持怀疑。","wrong":"学生容易把亨廷顿简化为'文化决定论者'（受他后来《文明的冲突》影响）。导师应追问：本文中他说'在中国，障碍是政治、经济、文化的；在非洲主要是经济的'——这与文化决定论相容吗？台湾和韩国1980年代末转向民主，他用'经济压过文化'来解释，又说明什么？","followup":"'儒教民主或许是矛盾修辞，但儒教社会中的民主未必是'——这句话的关键区分在哪里？","src":"Huntington, 1991.pdf","kw":["民主","文化","资本主义","亨廷顿","天主教","威权","经济","发展"]},{"q":"摩尔说民主是几百年阶级关系变迁的产物，亨廷顿却说'经济发展使民主成为可能；政治领导使之成为现实'——仿佛领导人想转就能转。把两人放在一起看：结构条件与政治领导各自决定什么？","level":3,"hint":"先确认两人共同的结构性前提（摩尔：土地贵族—资产阶级—农民的关系；亨廷顿：贫困是民主化的主要障碍、转型集中于'政治过渡带'、滚雪球不能生产内部条件）。再看分歧：摩尔解释长时段的道路分歧，亨廷顿面对的是结构条件相似却结局各异的短期转型。","ref":"可以认为：结构划定可能性空间，领导在空间内作选择。摩尔解释英法美德日俄中的道路分歧——长时段、不可逆的阶级结构变迁，领导几乎没有独立地位。亨廷顿面对的是第三波的短期转型：他承认'贫困是民主化的主要障碍'、转型集中于中等收入的'政治过渡带'，但坚持未来精英至少须相信民主是'最不坏的政府形式'，并具备在激进反对派与威权强硬派之间完成转型的技能。两人未必矛盾：摩尔解释'为什么某些国家具备民主的结构条件'，亨廷顿解释'具备条件后是什么把可能变成现实'。不过摩尔会追问：亨廷顿所说的'领导技能'本身，是否也是阶级结构与联盟格局的产物？","wrong":"典型错误是把两人摆成'结构vs意志'的对立两边并简单站队。导师应追问：亨廷顿自己承认哪些结构性约束（贫困障碍、过渡带、滚雪球的限度）？摩尔谈印度时又给了'西方教育精英对民主的忠诚'多大权重？这说明两人都处在光谱的中间。","followup":"如果结构只划定'可能'而领导决定'现实'，那么如何解释领导意愿相似而转型结果迥异的国家？","src":"Huntington, 1991.pdf","kw":["政府","民主","亨廷顿","第三波","威权","摩尔","解释","精英"]},{"q":"综合本章：请分别戴上多元主义者、精英主义者、马克思主义者的'三副眼镜'，检验现实中的自由民主在多大程度上实现了达尔的五标准。三派各自会指出哪条标准被侵蚀？","level":4,"hint":"多元主义（达尔的纽黑文研究）：权力散布于竞争团体，无固定精英；精英主义（米尔斯《权力精英》）：大企业（尤其国防产业）、军队与总统身边政治小集团控制'创造历史'的关键决策；马克思主义：生产资料所有权决定政治权力，形式平等是假象。逐条对应到达尔的哪条标准。","ref":"多元主义者判定大体通过：竞争性团体广泛散布权力，达尔在纽黑文研究中发现没有固定精英能控制政治过程，有效参与与议程控制经团体政治保持开放。精英主义者判定不合格：米尔斯的权力精英（大企业尤其国防产业、军队与总统身边政治小集团的三结合）影响'创造历史'的关键决策，普通团体只能在政策边缘施加影响——议程控制与有效参与被侵蚀。马克思主义者判定形式标准空洞：只要阶级权力不平等，政治平等就是'资产阶级民主'的假象，经济资源的不平等使投票平等与开明理解流于形式。共同启示：达尔的程序标准本身不讨论资源分配，而资源不平等会以隐蔽方式侵蚀每一条程序标准——这正是海伍德所谓'政治平等能够与经济不平等共存吗'的问题。","wrong":"学生常把三派罗列成'乐观、悲观、激进'三种态度而不触及检验逻辑。导师应追问：请指出每种批评具体瓦解了五标准中的哪一条？米尔斯与马克思都谈'少数统治'，教材指出二者的关键差异在哪（权力资源多元vs经济因素决定）？","followup":"新右派的'民主超载'论批评方向正好相反——它抱怨民主对政府要求太多；这能否也翻译成对达尔某条标准的批评？","src":"政治学 4.pdf","kw":["有效参与","政治平等","精英主义","议程控制","多元主义","民主","权力精英","马克思主义"]}],"quiz":[{"type":"mc","q":"海伍德认为，要界定'民主'这一概念，必须回答哪三个问题？","options":["谁是人民；人民应如何统治；人民统治的范围应有多大","民主的定义、历史演变与未来前景","民主的优点、缺点与适用条件","什么是自由；什么是平等；什么是正义"],"answer":0,"explain":"教材4.1节以三问组织民主之争：谁是人民（政治权力应在多大范围内分配）、人民应如何统治（直接民主还是代议民主）、人民统治的范围应有多大（仅限狭义政治领域还是全部社会生活）。三个问题的不同答案组合出不同的民主模式。","src":"政治学 4.pdf"},{"type":"mc","q":"在达尔的民主过程五标准中，'成员必须拥有排他性机会，决定如何以及把哪些事项列入议程'指的是哪一条？","options":["有效参与","投票平等","对议程的最终控制","包容成年公民"],"answer":2,"explain":"这是第四条标准：对议程的最终控制。达尔用'大财产所有者垄断执行委员会提案权'的反例说明：即使有效参与、投票平等、开明理解三条都满足，只要议程被少数人操纵，成员仍不是政治平等的。","src":"Dahl & Shapiro, 1998.pdf"},{"type":"tf","q":"古雅典的古典民主中，奴隶、妇女和外邦人也可以参加公民大会投票。","answer":false,"explain":"雅典政治参与仅限于雅典出生的20岁以上男性公民；奴隶（占人口多数）、妇女和外邦人没有任何政治权利。公民大会每年至少召开40次、公职抽签轮换，但这一制度恰恰靠排除大部分人口才能运转。","src":"政治学 4.pdf"},{"type":"mc","q":"海伍德归纳的四种民主模式中，以洛克、边沁为代表、视民主为'公民保护自己免受政府侵害的工具'的是：","options":["古典民主","保护型民主","发展型民主","人民民主"],"answer":1,"explain":"保护型民主兴起于17—18世纪，以洛克（政府经由同意、代议机关保护财产权）和边沁（普选权实现最大多数人的最大幸福）为代表，本质是宪政的有限间接民主。卢梭与密尔属发展型民主；人民民主属马克思主义传统。","src":"政治学 4.pdf"},{"type":"mc","q":"摩尔概括的通向现代社会的三条道路，正确的对应是：","options":["英法美—共产主义；德日—法西斯主义；俄中—议会民主","英法美—议会民主；德日—法西斯主义；俄中—共产主义","英法美—法西斯主义；德日—议会民主；俄中—共产主义","英法美—议会民主；德日—共产主义；俄中—法西斯主义"],"answer":1,"explain":"摩尔《专制与民主的社会起源》第7章：资产阶级革命道路（清教徒革命、法国大革命、美国内战）通向资本主义议会民主；自上而下的反动革命（德日）通向法西斯主义；农民革命（俄中）通向共产主义。","src":"Moore, 1966.pdf"},{"type":"tf","q":"达尔认为，美国宪法（强总统+强国会）与欧洲议会制的差异表明，存在一种唯一正当的'民主宪法'。","answer":false,"explain":"达尔明确写道：各民主国家的宪法存在重要差异，'看来并不存在单一的民主宪法'（There is, it appears, no single 'democratic' constitution）。五标准是衡量一切制度的尺度，而非唯一的制度蓝图。","src":"Dahl & Shapiro, 1998.pdf"},{"type":"tf","q":"亨廷顿认为，'滚雪球'示范效应即使在一国缺乏有利的内部条件时，也足以单独带来民主化。","answer":false,"explain":"亨廷顿明确写道：'如果一国缺乏有利的内部条件，滚雪球单独不可能带来民主化'；A国与B国的民主化不是C国民主化的理由，除非有利于前者的条件在后者同样存在。示范效应能创造外部环境，却不能生产内部条件。","src":"Huntington, 1991.pdf"},{"type":"mc","q":"下列哪一项不是亨廷顿归纳的第三波民主化成因？","options":["威权政权的绩效合法性危机","1960年代全球经济增长与中产阶层扩张","互联网与社交媒体的普及","梵二会议后天主教会的转向"],"answer":2,"explain":"亨廷顿归纳的五大成因是：合法性危机、1960年代全球经济增长、天主教会转向、外部行为体（欧共体/美国/苏联）政策变化、滚雪球效应。互联网普及是1990年代之后的现象，与1974—1990年的第三波无关，用时代常识即可排除。","src":"Huntington, 1991.pdf"},{"type":"sa","q":"请用自己的话解释'政治平等'，并举一个现实或历史上的例子，说明它如何被实现或被限制。","ref":"政治平等指政治权力与政治影响尽可能广泛而平均地分配，保证每个成员同等重要、享有同样的发言权。自由民主传统把它理解为平等分配政治权利，即'一人一票，票票等值'；社会主义者则主张它还包括相当程度的社会平等（控制经济资源与大众传媒也与政治平等相关）。例子可举：英国1928年妇女才获得完全投票权、美国南方非洲裔到1960年代才真正投票、瑞士1971年才实现普选——说明政治平等的实现相当晚近；也可举按财产加权投票、巨额竞选经费稀释普通选民影响等，说明它如何被侵蚀。","explain":"评分要点：①说出'权力与影响广泛平均分配'或'一人一票，票票等值'的核心含义；②所举例子须与概念真实对应（历史上的选举权限制或现实中的资源不平等均可）；③能区分自由主义与社会主义两种理解者可加分。","src":"政治学 4.pdf"},{"type":"sa","q":"请用自己的话解释亨廷顿所说的'绩效合法性'，并说明为什么依赖绩效合法性的威权政权在经济失败时会陷入危机。","ref":"绩效合法性指威权政权在民主价值普及、意识形态合法性丧失之后，转而依靠经济（有时是军事）上的成功表现来证明其统治的正当性——'我们让国家富强，所以应由我们统治'。其危险在于：民主政体下失败归罪于当政者而非制度，换掉政府即可；而威权政权把统治正当性全部押在'表现'上，一旦经济停滞或军事失败，丧失的就不只是政府声望，而是政权本身的合法性——统治的理由不复存在，危机随之而来。亨廷顿正是用这一机制解释第三波中威权政权为何如此脆弱。","explain":"评分要点：①说清'靠政绩换服从'的含义；②指出与民主政体的关键差别（失败归罪于制度而非当政者）；③'经济失败→合法性危机'的因果链条完整。","src":"Huntington, 1991.pdf"}],"flashcards":[{"front":"民主（democracy）","back":"希腊语demos（人民）+kratos（统治）='人民统治'。因人人称颂而有沦为空洞'叫好之词'的危险——连专制政权也自称民主。","src":"政治学 4.pdf"},{"front":"界定民主的三问","back":"海伍德：①谁是人民（权力在多大范围分配）；②人民如何统治（直接参与还是选代表）；③统治范围多大（只管政治，还是也管经济、家庭）。","src":"政治学 4.pdf"},{"front":"政治平等","back":"民主的核心原则：政治权力与影响尽量广泛平均分配。自由派理解为'一人一票，票票等值'；社会主义者认为还应包括相当程度的社会平等。","src":"政治学 4.pdf"},{"front":"古典民主","back":"古雅典式直接民主：公民大会每年至少开40次，公职抽签轮换；但仅限20岁以上男性公民——奴隶、妇女、外邦人全被排除。","src":"政治学 4.pdf"},{"front":"保护型民主","back":"把民主当作'防侵害的工具'：人民投票是为了保护自己免受政府侵害。代表：洛克、边沁；本质是宪政下的有限间接民主。","src":"政治学 4.pdf"},{"front":"发展型民主","back":"把民主当作'成长的学校'：参与政治能发展个人能力。卢梭激进版要求直接参与、服从公意；密尔温和版强调参与的教育功能。","src":"政治学 4.pdf"},{"front":"人民民主","back":"马克思主义传统：没有经济解放，一人一票只是'资产阶级民主'的假象；目标是经济解放，而不只是扩大政治权利。","src":"政治学 4.pdf"},{"front":"极权民主","back":"假扮民主的绝对专制：领袖宣称只有自己能表达'人民真正利益'，群众集会游行只是仪式化服从。如墨索里尼、希特勒政权。","src":"政治学 4.pdf"},{"front":"公意（general will）","back":"卢梭概念：集体的真实利益，区别于每个人的私人意志。危险在于：若'真实'意志可由别人替你宣布，专制者就能冒名'自上而下规定公意'。","src":"政治学 4.pdf"},{"front":"多数暴政","back":"托克维尔提出、密尔深以为忧：打着人民旗号压制个人自由与少数权利。多数也可能犯错——明智决定不是靠举手就能作出的。","src":"政治学 4.pdf"},{"front":"多元主义","back":"权力像散布在许多球队之间：竞争性团体众多，没有固定霸主。达尔的纽黑文研究是当代代表：'没有固定精英能控制政治过程'。","src":"政治学 4.pdf"},{"front":"竞争性精英主义","back":"熊彼特：民主就是精英'竞聘上岗'——选民只能在精英之间挑一个，权力永远由精英掌控。两党候选人无论谁赢都出自政坛精英。","src":"政治学 4.pdf"},{"front":"民主超载（新右派）","back":"新右派批评：团体和选民不断向政府提要求，政客竞相许诺开支，结果通胀、税负与瘫痪——'民主对成人就像巧克力对儿童：过多则致病'。","src":"政治学 4.pdf"},{"front":"达尔民主过程五标准","back":"①有效参与②投票平等③开明理解④对议程的最终控制⑤包容成年公民。任何一条被违反，成员就不再是政治平等的。","src":"Dahl & Shapiro, 1998.pdf"},{"front":"议程控制（达尔）","back":"谁能决定'讨论什么'，谁就握有不战而胜的权力。达尔反例：大财产者垄断执行委员会提案权，前三条标准便形同虚设。","src":"Dahl & Shapiro, 1998.pdf"},{"front":"'无资产阶级，即无民主'","back":"摩尔命题：没有独立有活力的城市市民阶层，就没有议会民主。反例：俄、德贵族挣脱王权时缺少强大市民阶层，结局对民主极为不利。","src":"Moore, 1966.pdf"},{"front":"摩尔的三条道路","back":"资产阶级革命→议会民主（英法美）；自上而下的反动革命→法西斯主义（德日）；农民革命→共产主义（俄中）。三者也是相继的历史阶段。","src":"Moore, 1966.pdf"},{"front":"第三波民主化","back":"1974年葡萄牙革命到1990年，至少30国转向民主；此前有1820年代—1926年长波、二战后短波和两次回波。像海浪：进两步、退一步。","src":"Huntington, 1991.pdf"},{"front":"政治过渡带","back":"亨廷顿：中等收入国家最可能转向民主——穷国民主化不太可能，富国多已完成；'贫困可能是民主发展的最主要障碍'。","src":"Huntington, 1991.pdf"},{"front":"绩效合法性","back":"威权政权靠'干得好'（经济增长、军事胜利）换取服从。风险：一旦失败，垮掉的不只是政绩，而是政权本身的统治理由。","src":"Huntington, 1991.pdf"},{"front":"经济发展与政治领导","back":"亨廷顿结语：'经济发展使民主成为可能；政治领导使之成为现实。'——结构提供机会，临门一脚靠人。","src":"Huntington, 1991.pdf"}]},{"id":"ch04","folder":"6. Parties, Elections, and Public Opinion","title":"政党、选举与公众舆论","subtitle":"Parties, Elections, and Public Opinion","overview":{"theme":"为什么有的国家一党执政几十年、有的国家政府年年倒台？为什么民调有时会在大选前'翻车'？本章围绕代议民主的三大支柱——政党、选举与公众舆论——展开：政党如何组织社会诉求并连接国家与社会，选举制度如何分配权力并塑造政府形态，选民的投票选择与公众舆论又是如何形成、被动员乃至被精英引导的。五篇文献从教科书式的概念图谱，一直推进到发达民主国家的政党衰落、新兴民主国家的政党-选民纽带脆弱性，以及舆论形成的微观心理机制。","coreQuestions":["什么是代表？全权受托、受命代表、授权与摹本四种代表模式各自的民主意涵是什么？","多数当选制与比例代表制在代表性与政府效能之间如何权衡？存在'最佳选举制度'吗？","政党有哪些功能？政党为何会走向寡头化？政党制度有哪些类型、如何影响政治过程？","发达民主国家正在经历政党重组还是解盟？新兴民主国家政党-选民纽带为何脆弱？","公众舆论是选民自主判断的产物，还是精英话语的回声？信息、政治觉知与倾向如何共同塑造民意？"],"thread":"本章按'组织—机制—行为—舆论'递进组织。首先以海伍德教材第8章建立政党的概念、功能、组织与政党制度类型学的基座；再以第7章转向选举这一政党的竞技场，理解代表模式、选举制度的权衡与投票行为的四种解释模式；随后用Wren与McElwain把镜头对准发达工业民主国家，考察'冻结分裂'瓦解后政党-选民关系的重组与解盟之争；Hagopian则把同一问题带到新兴民主国家，追问在党派认同薄弱处，政党究竟以纲领、个人魅力还是庇护来动员选民；最后以Zaller收束到个体心智层面，揭示舆论是信息与倾向的'联姻'，人民的声音在多大程度上只是精英话语的回声。","path":["第一步：读《政治学》第8章——从'绿党和绿色和平都环保，为何只有一个是政党'这样的问题出发，掌握政党定义、六项功能与政党制度四分法，建立概念地图。","第二步：读《政治学》第7章——从'41%选票为何能换63%议席'的英国案例出发，理解四种代表模式、两类选举制度的权衡与四种投票行为理论。","第三步：读Wren与McElwain，用'重组还是解盟'之争把教科书概念放到发达民主国家的经验变迁中检验。","第四步：读Hagopian，从'候选人送米送油换选票'的现象出发，比较纲领、个人化与庇护三种动员策略。","第五步：读Zaller两章，从'民调为何翻车'下沉到舆论形成的微观机制，批判性反思精英支配与'人民的声音'。"],"dialogue":"五篇文献构成多声部对话。海伍德教材提供概念骨架，但保持规范层面的开放：'最佳选举制度'不存在，投票理论无一完备。Wren与McElwain用跨国数据向教材的'政党衰落'叙事提出细化——是选民偏好漂移（重组）还是双方能力变化（解盟）？他们倾向后者。Hagopian则质疑从发达民主国家移植来的范式：庇护型政党未必是病态，分裂也不是自然给定的，政党可以主动'创造'分裂，这与Lipset-Rokkan的'冻结'图景和Sartori的政党建构论形成三方争论。Zaller在最微观层面釜底抽薪：如果选民的意见只是'头脑顶层'即时可得考量的产物，那么教材中理性选择模式的'议题投票'、乃至选举'表达了民意'的整个授权叙事，都需要重新审视——人民的声音或许只是精英提供的菜单上的回声。"},"readings":[{"file":"政治学 8.pdf","title":"政党与政党制度（《政治学》第三版第8章）","authors":"安德鲁·海伍德（Andrew Heywood）","year":"2007（英文第三版；中译本）","venue":"《政治学》（第三版），中国人民大学出版社'公共行政与公共管理经典译丛'","thesis":"政党是为赢得执政权力而组织起来的团体，是国家与社会之间的纽带。本章提出政党的六项核心功能：①代表——回应和表达党员与选民意见，是政府感知社会期求的'输入'机制；②培养和录用精英——向国家输送政治领导人并提供训练与仕途阶梯；③制定目标——拟订施政纲领，为选民提供条理清晰的政策选项；④利益表达和聚合——把企业、劳工、宗教等分散诉求整合为协调的政策整体；⑤社会化和动员——通过竞选与辩论进行政治教育、设定议程；⑥组建政府——多数党组阁并促进行政与立法合作。进而剖析党内权力分布，并以党员流失与'反政治'兴起讨论政党衰落。","framework":"①政党四种分类：干部型/群众型（精英小团体 vs 重视扩充党员，后演变为基西海默'兼容型政党'）；代表型/整合型（纽曼：反映民意 vs 动员教育民意）；宪政型/革命型（是否承认竞争规则）；左翼/右翼。②政党制度四分法（迪维尔热以政党数目为基础，萨托利补以'相关性'标准并区分温和/极化多元主义）：一党制、两党制、一党独大制、多党制。③米歇尔斯'寡头统治铁律'三论据：领袖掌握专业知识与组织技能；领袖结成内聚团体以增掌权机会；基层冷漠消极、安于从属。","method":"比较政治学的概念分析与类型学建构，辅以英、美、日、意、瑞典、苏联、加纳等国别案例说明。","evidence":"日本自民党连续执政38年、意大利基督教民主党主导战后前52届政府（一党独大制案例）；英国两大党总支持率从1950年代初95%降至1974年后的75%以下；苏联约9%人口为苏共党员；英国2001年大选投票率降至59%、保守党党员平均年龄1998年达63岁、工党党员减少约2/3；1993年法国社会党议席从283个猛降至70个；佩罗1992年独立参选获19%选票、贝卢斯科尼1994年意大利力量党戏剧性胜选，作为'反政治'兴起的证据。","limits":"类型学取向偏重描述与分类，对因果机制的开掘有限；'政党衰落'的判断主要依据西欧与英语国家证据，对新兴民主国家的适用性存疑；对数字时代政党组织新形态未及讨论。","quotes":[{"en":"政党是为赢得执政权力（通过选举或其他手段）的人们组织而成的团体。","zh":"—"},{"en":"谁要求组织，就是要求寡头统治。（罗伯特·米歇尔斯）","zh":"—"},{"en":"政党乃大众政治结构的一部分，是因代议制政府和19世纪选举权的逐步普及而产生的。","zh":"—"}]},{"file":"政治学 7.pdf","title":"代表、选举与投票（《政治学》第三版第7章）","authors":"安德鲁·海伍德（Andrew Heywood）","year":"2007（英文第三版；中译本）","venue":"《政治学》（第三版），中国人民大学出版社'公共行政与公共管理经典译丛'","thesis":"选举被看作实践中的民主，其核心是代表原则。本章提出四种代表模式：①全权受托模式（柏克：代表者凭'成熟的判断'与'开明的良知'独立行事，为选民利益而非选民意见服务）；②受命代表模式（潘恩：代表者只是选民意见的传声筒与代理人，须按训令行事）；③授权模式（政党赢得选举即获人民授权，有义务施行竞选纲领）；④摹本模式（议会应在构成上'像乎'人民，是社会的缩影）。进而比较两类六种选举制度的优劣，并以四种模式解释投票行为，指出不存在'最佳选举制度'，也不存在被普遍接受的投票理论。","framework":"①选举的七项功能：录用政治人物、组建政府、提供代表性、影响政策、教育选民（自下而上），确立合法性、巩固精英地位（自上而下）。②六种选举制度：单一名额相对多数制（'第一名过关'，英、美、加、印）、两轮投票制（法国）、选择性/增补性投票制（澳大利亚、伦敦市长）、附带名额制（德国、新西兰）、单记可转移投票制（爱尔兰、北爱尔兰）、政党名单制（以色列及多数欧陆国家）；评价标准为代表性与政府效能两大类。③投票行为四模式：政党认同、社会学、理性选择、支配型意识形态；阿罗不可能定理揭示偏好加总的'循环多数'困境。","method":"规范政治理论与比较制度分析结合，辅以英国、法国、意大利、德国、澳大利亚等国的选举数据与制度案例。","evidence":"2001年英国大选工党以41%得票获63%议席、自民党18%得票仅换8%议席，显示多数当选制的扭曲；1974年10月工党以39.2%得票率赢得下院多数；1945年后意大利至2001年至少出现59届政府，作为联合政府不稳的典型（德国、瑞典联合政府却稳定高效）；英国'非常强烈'政党认同者从1966年的43%降至2005年的15%；绝对阶级投票从1966年的66%降至1983年的47%。","limits":"各投票行为理论均被作者认定为'不完备'；对选举制度效果的讨论承认受政治文化等环境因素制约，难以得出确定性结论；对非西方选举实践着墨较少。","quotes":[{"en":"你们的代表者不仅为你们进行勤勉的工作，还要作出判断；如果他为你们的意见而牺牲自己的判断，那不是为你们效力，而是背叛。（柏克）","zh":"—"},{"en":"阶级是英国政党政治的基础。（普尔泽）","zh":"—"},{"en":"问题在于根本不存在所谓的'最佳选举制度'。","zh":"—"}]},{"file":"Wren and McElwain, 2007.pdf","title":"Voters and Parties（选民与政党）","authors":"Anne Wren; Kenneth M. McElwain","year":"2009（牛津手册印刷版；文件名标注2007）","venue":"The Oxford Handbook of Comparative Politics (eds. Carles Boix & Susan C. Stokes), Oxford University Press","thesis":"发达工业民主国家的政党-选民纽带出现两大平行趋势：一是选民党派认同减弱、选民政策偏好与政党竞选纲领间的差距拉大；二是教育普及与媒体技术革新同时增强了政党与选民的政治能力，使双方不再需要在群众型政党结构中相互锁定。作者据此判断当前选举不稳定更可能是长期解盟而非暂时重组的前兆。","framework":"以Lipset-Rokkan'冻结分裂'假说（西欧政党制度1920—1960年代高度延续）为起点，对比两种解释：①重组（realignment）——选民偏好漂移（后物质主义兴起、老党向中间靠拢留下政策空间），新党乘虚而入，政党调适完成后波动回落；②解盟（dealignment）——教育普及与媒体技术革新改变政党与选民双方的能力：选民不再依赖政党获取信息，政党也能绕过基层组织直达受众，群众型政党的组织纽带永久性松动。辅以唐斯空间模型、英格尔哈特后物质主义、基西海默兼容型政党与Mair'政党变化/政党制度变化'的区分。","method":"跨国量化分析：1960年以来老党总得票率的时间趋势、新党进入选举的比例、内阁意识形态与投票率的跨国比较，辅以欧洲晴雨表等调查数据。","evidence":"1960年前成立的政党得票率自1960年代起加速下滑；有新党参选的选举比例从1950年代的27.5%升至1990年代的47.3%；投票率从1950年代平均84.6%降至2000年后的77.3%；Caul与Gray发现15个发达民主国家中10国主要政党的左右距离缩小；选举波动率本身未见回落趋势，成为作者倾向解盟判定的关键。","limits":"以选举波动率操作化'政党衰落'可能掩盖政府组成的稳定性（Mair的批评）；对政党内部组织数据掌握不足，作者自承需要'政党生命周期模型'与更多新党组织数据才能定论。","quotes":[{"en":"Political parties created modern democracy and modern democracy is unthinkable save in terms of parties","zh":"政党创造了现代民主，而现代民主离开政党是不可想象的。（沙特施耐德）"},{"en":"the structure of electoral cleavages had become \"frozen\" so as to reflect the structure of ideological conflict in these countries at the time of the mass parties' foundation.","zh":"选举分裂结构已被'冻结'，反映的是群众型政党奠基之时这些国家的意识形态冲突格局。"},{"en":"the preponderance of evidence seems to point to long-term dealignment rather than temporary realignment.","zh":"证据的总体指向似乎是长期解盟，而非暂时的重组。"}]},{"file":"Hagopian, 2007.pdf","title":"Parties and Voters in Emerging Democracies（新兴民主国家的政党与选民）","authors":"Frances Hagopian","year":"2009（牛津手册印刷版；文件名标注2007）","venue":"The Oxford Handbook of Comparative Politics (eds. Carles Boix & Susan C. Stokes), Oxford University Press","thesis":"新兴民主国家政党-选民纽带普遍脆弱且不稳定，但既有解释——民主化时间太短、媒体效应、经济绩效的回顾性投票、庇护政治的盛行——均不充分。政党动员策略（纲领、个人化还是庇护）并非由制度或结构机械决定，而是在政党间战略竞争、选民需求与代表策略的互动中被选择；政党甚至可以主动建构原本不存在的社会分裂。","framework":"对比三种政党-选民联系类型：①纲领型——选民按政策与议题立场选党；②个人化型——选民追随候选人的个人品质与魅力；③庇护型——政党以现金、职位、社区项目等特殊化利益交换选票。梳理Lipset-Rokkan的社会分裂根源论与Sartori的政党建构论之争，批判选举规则决定论（Carey & Shugart），提出连接政党竞争、结构变迁与代表策略的替代性战略框架。","method":"跨国比较文献综述与理论建构：选举波动率与党派认同的跨国数据（CSES、Freedom House），佐以智利、阿根廷、俄罗斯、韩国、赞比亚/马拉维等国别研究证据。","evidence":"新兴民主国家平均选举波动率30.6，为发达民主国家的2.5倍，东欧高达44.0；19个新民主国家四个选举周期内波动率无显著下降（Mainwaring & Torcal）；亚洲选民党派认同不足四分之一；韩国选民最看重候选人个人品质，而俄罗斯1995年国家杜马选举中'过渡性党派认同'比候选人个人品质更能预测投票、1996年总统选举中议题意见最重要；Posner对赞比亚与马拉维Chewa、Tumbuka两族的研究显示，群体规模与最小获胜联盟逻辑决定哪条族群分裂被政治化。","limits":"纲领型与非纲领型政党在实践中难以截然区分，同一政党可能混合使用多种策略；作者自承对选民'需求侧'所知太少，缺乏把政党议题立场与选民立场匹配的国别选举调查数据。","quotes":[{"en":"At present, we lack a general theory of how parties mobilize voters in the context of the extreme electoral fluidity of many emerging democracies.","zh":"目前我们缺乏一个一般性理论，来解释在众多新兴民主国家极端选举流动性的情境下政党如何动员选民。"},{"en":"In few emerging democracies today is the relationship between parties and voters strong and stable.","zh":"在当今的新兴民主国家中，政党与选民之间鲜有强固而稳定的关系。"},{"en":"cleavages are not given in nature, and where they do not exist, parties can and do structure programmatic differences around cleavages of their own creation.","zh":"分裂并非自然给定；在分裂不存在之处，政党能够、也确实在围绕自己创造的分裂来构建纲领性差异。"}]},{"file":"Zaller, 1992 (Chapter 2 & 12).pdf","title":"The Nature and Origins of Mass Opinion（第2章'信息、倾向与舆论'与第12章'结语：精英支配公众舆论的问题'）","authors":"John R. Zaller（约翰·扎勒）","year":"1992","venue":"The Nature and Origins of Mass Opinion, Cambridge University Press","thesis":"每一个意见都是信息与倾向的'联姻'：精英话语中的信息流、个体对信息的注意程度（政治觉知）与个体的政治价值倾向共同决定公众舆论的轮廓。人们并非持有单一固定态度，而是依据'头脑顶层'即时可得的考量作出回答。由此，精英对民意的支配程度取决于精英竞争的结构——只要党派精英间存在有力竞争，公众仍能借助与自身倾向一致的精英线索形成独立判断。","framework":"①'信息-觉知-倾向'三变量：精英话语提供高度选择性的信息流与'考量'；政治觉知决定个体接触并接收信息的程度；政治倾向调节个体对传播内容的接受或抵制。②个体不持单一固定态度，而以'头脑顶层'即时可得考量的抽样平均作答，故问卷措辞变化会引起回答波动。③第12章'紫色国寓言'提出判别精英支配的五项条件：专家倾向分布与公众平行；存在激励专家求真的制度；媒体充分报道各派专家观点；政治人物不越出专家意见的参数；精英分歧时公民能与分享自身倾向的精英派系对齐。","method":"理论建构与二手证据综合：整合李普曼的刻板印象论、认知心理学（Taylor & Fiske、Wyer & Srull）与政治学调查研究的证据，辅以思想实验（紫色国寓言）进行规范推演。","evidence":"Graber的新闻使用研究显示公众不愿深读详尽报道；李普曼以'戈弗普雷里的舍温小姐'说明公众只能依靠文化提供的刻板印象理解遥远事件；书中援引Tesser关于态度是'建构过程'的论述，以及Kelley（1983）关于选民以'喜欢/不喜欢'加总评估候选人与Anderson的信息平均模型证据，支撑'非随机但随机性的考量抽样'模型；第12章以'紫色国寓言'中红蓝两色公民的思想实验推演精英支配的判别条件。","limits":"模型侧重短期舆论形成，对倾向本身的长期来源存而不论；对精英支配的判断依赖美国两党竞争语境，对媒体体系高度集中或政党极化失灵的情形适用性有限；'考量'的测量在经验操作上存在困难。","quotes":[{"en":"Every opinion is a marriage of information and predisposition: information to form a mental picture of the given issue, and predisposition to motivate some conclusion about it.","zh":"每一个意见都是信息与倾向的联姻：信息用以形成对给定议题的心智图像，倾向则用以促成关于它的某种结论。"},{"en":"Rather, they appear to make decisions \"off the top of the head\" on the basis of whatever ideas are immediately accessible in memory.","zh":"相反，人们似乎是'凭头脑顶层'作决定——依据的是记忆中即时可得的任何想法。"},{"en":"It is the collective ability of citizens in a democracy to pressure leaders in useful directions and, when necessary, to remove the leaders, more than the collective wisdom of the people, that seems to me critical.","zh":"在我看来，关键不在于人民的集体智慧，而在于民主中公民向领袖施加有益方向的压力、并在必要时将其罢免的集体能力。"}]}],"glossary":[{"en":"representation","zh":"代表","def":"个人或团体替更大群体说话、办事的关系；与古希腊式人人直接参政不同，代表承认政府与被统治者的区别。","src":"政治学 7.pdf"},{"en":"trustee model","zh":"全权受托模式","def":"柏克式代表观：议员当选后凭成熟判断与开明良知独立行事，为选民利益着想而不盲从选民意见，类似'受人之托、忠人之事'。","src":"政治学 7.pdf"},{"en":"mandate model","zh":"授权模式","def":"政党赢得选举即拿到人民的'授权书'，有义务也有权利施行竞选纲领，为选举结果赋予政策意义。","src":"政治学 7.pdf"},{"en":"referendum","zh":"公民投票（全民公决）","def":"选民就某个具体政策议题直接投票表态（如脱欧公投），是直接民主手段，通常只是议会的补充而非替代。","src":"政治学 7.pdf"},{"en":"single-member plurality system","zh":"单一名额相对多数制","def":"又称'第一名过关制'：全国划为单名选区，谁得票相对最多谁当选；用于英、美、加、印，大党常因此多得席位。","src":"政治学 7.pdf"},{"en":"proportional representation","zh":"比例代表制","def":"按各党得票比例分配议席的制度族；席位公平、代表性高，但更难一党单独组阁，易产生联合政府。","src":"政治学 7.pdf"},{"en":"impossibility theorem","zh":"不可能定理","def":"阿罗证明：当选民要排出一整组偏好时，可能没有可靠办法把个人偏好加总为集体决定，会出现'循环多数'。","src":"政治学 7.pdf"},{"en":"issue voting","zh":"议题投票","def":"选民像购物一样比较各党政策、计算自身利益后再投票，是理性选择模式的核心命题。","src":"政治学 7.pdf"},{"en":"partisan dealignment","zh":"党徒解盟","def":"选民对政党的认同和忠诚下降，'铁票'变少、'游动票'变多；源于教育普及、社会流动与电视成为主要信息来源。","src":"政治学 7.pdf"},{"en":"class dealignment","zh":"阶级解盟","def":"阶级与政党支持之间联系的减弱（如工人不再固定投左翼党），削弱传统阶级政党，常引发政党制度重组。","src":"政治学 7.pdf"},{"en":"catch-all party","zh":"兼容型政党","def":"基西海默提出：政党大幅卸下意识形态包袱、什么选民都想争取，重领导轻党员；以美国两党为典型。","src":"政治学 8.pdf"},{"en":"iron law of oligarchy","zh":"寡头统治铁律","def":"米歇尔斯命题：'谁要求组织，就是要求寡头统治'——任何组织（包括政党）都有权力向少数领袖集中的趋势。","src":"政治学 8.pdf"},{"en":"party system","zh":"政党制度","def":"政党之间稳定而有规则的互动关系网；按竞取权力的政党数目与相对规模分为一党、两党、一党独大与多党制。","src":"政治学 8.pdf"},{"en":"dominant-party system","zh":"一党独大制","def":"选举照常竞争，但总是一党长期执政（如日本自民党38年）；政治焦点转入执政党内部的派系斗争。","src":"政治学 8.pdf"},{"en":"frozen cleavage hypothesis","zh":"冻结分裂假说","def":"Lipset与Rokkan提出：西欧政党格局长期'冻结'在群众型政党诞生时的社会冲突结构上，1920—1960年代高度延续。","src":"Wren and McElwain, 2007.pdf"},{"en":"postmaterialism","zh":"后物质主义","def":"英格尔哈特命题：温饱无忧的战后世代更关心环境、个人自由等'生活质量'议题，给选举政治带来新的分裂。","src":"Wren and McElwain, 2007.pdf"},{"en":"clientelism","zh":"庇护主义（恩庇-侍从关系）","def":"政党或候选人用现金、公职、社区工程等具体好处'换'选票的交易式联系，被认为在新兴民主国家盛行。","src":"Hagopian, 2007.pdf"},{"en":"electoral volatility","zh":"选举波动率","def":"两次选举之间各党得票的净变化幅度；新兴民主国家平均30.6，约为发达民主国家的2.5倍。","src":"Hagopian, 2007.pdf"},{"en":"elite discourse","zh":"精英话语","def":"Zaller概念：政治家、官员、记者、专家等精英生产、经媒体传播的高度选择性的政治信息流。","src":"Zaller, 1992 (Chapter 2 & 12).pdf"},{"en":"considerations","zh":"考量（头脑顶层考量）","def":"Zaller模型中进入脑中的想法片段；被问到民调问题时，人凭'头脑顶层'即时想得起来的考量作答。","src":"Zaller, 1992 (Chapter 2 & 12).pdf"}],"socratic":[{"q":"一栋楼有500户业主，电梯换不换、物业费涨不涨，不可能事事开全体大会投票，于是大家选出业委会代为决定。这个生活场景里，'业委会代表业主'与'业主自己直接投票'的区别，在政治学上对应哪两个概念？","level":1,"hint":"想想古希腊城邦的公民大会与现代国家的议会——前者人人都能上场，后者只能靠选出来的人。教材在'代表'的概念框里点明了这一区分。","ref":"这对应'（直接）民主'与'代表'的区别。古典民主追求人民自治，力图消除政府与被统治者的界限；代表则是个人或团体代理更大群体、为之代言的关系，它承认政府与被统治者的区别。当直接、连续参与被认为不切实际时，代议民主成了间接实现民治的手段。业委会的例子说明：代表不是民主的对立面，而是大规模社会里民主的可行形式——但'代表是否真正表达了业主的意愿与利益'永远是个开放问题。","wrong":"学生常答'代表就是替别人投票的人'，忽略代言与利益保障的维度。导师可追问：如果业委会只会举手、从不反映业主意见，还算代表吗？由此引出'代表的是什么——利益、群体还是观点'的深层问题。","followup":"你能想到生活中哪些'代表'其实并不像被代表者的例子吗？","src":"政治学 7.pdf","kw":["代议民主","代表","政府","个人","人民","表达","团体","利益"]},{"q":"一位市议员收到大量选民留言，要求她支持一项提案；她深入研究后却认为该提案弊大于利。她该照选民说的办，还是按自己的判断投反对票？1774年柏克面对同样处境给出了著名回答。教材提出的四种代表模式，分别会建议她怎么做？","level":1,"hint":"四种模式的分歧在于：代表者该凭自己的判断、听选民指令、兑现竞选纲领，还是'长得像'选民？柏克的原话就在本章引文中。","ref":"柏克主张她按自己的判断投票——这是全权受托模式：代表者凭'成熟的判断'与'开明的良知'为选民利益服务；他说代表若为选民意见牺牲判断，'不是为你们效力，而是背叛'。其余三种模式：受命代表模式（潘恩）要求她做选民意见的传声筒与代理人；授权模式要求她效忠所在政党的竞选纲领；摹本模式则不问怎么做，而问她是否'像'她所代表的群体。四种模式对'什么才是好代表'给出了截然不同的答案。","wrong":"最常见的错误是只答出柏克一种，或把'授权'理解成选民给议员个人的空白支票。导师应追问：授权模式里真正获得授权的是谁——单个议员还是政党？以此点出授权模式以政党为中介这一关键。","followup":"如果她明知选民会因此在下次选举中惩罚她，哪种模式仍能为她的反对票辩护？","src":"政治学 7.pdf","kw":["全权受托模式","授权模式","代表","选民意见","政党","投票","四种","纲领"]},{"q":"绿色和平组织和德国绿党都关心环保，也都有正式会员。为什么政治学只把绿党叫作'政党'？请给出教材的政党定义，并说出区分政党与其他团体的四个维度。","level":1,"hint":"从四个角度逐一对比绿党与绿色和平：目标是什么、成员形态如何、议题范围宽窄、靠什么团结起来。","ref":"教材定义：政党是为赢得执政权力（通过选举或其他手段）而组织起来的团体。四个区分维度：①目标——政党要赢得政治职位并掌握执政权（小党更多借选举作宣扬理念的平台）；②成员——政党是由正式成员组成的组织化团体，不同于分散的社会运动；③议题——政党关注政府政策的各个主要领域，而非单一议题；④纽带——政党基于共同政治偏好和一般意识形态认同而团结。绿色和平符合后两条的一部分，却不竞取公职，所以是利益集团（社会运动）而非政党。","wrong":"学生常答'关心政治的团体就是政党'。导师应追问：按这个标准，环保游说集团和工会是不是都成了政党？以此逼出'竞取执政权力'这一判据性特征。","followup":"明知永远选不上的小党仍坚持参选，是否动摇'赢得执政权'这一定义要素？","src":"政治学 8.pdf","kw":["社会运动","意识形态","政府","权力","执政","政党","选举","组织"]},{"q":"设想一个国家突然取消所有政党：没有人提名候选人，没有人写竞选纲领，议会里几百名议员各自为政。政治生活会缺掉哪些环节？请对照教材列出政党的六项功能，并各说一条缺失的后果。","level":1,"hint":"按'选前—选中—选后'的时间线想：谁筛选和培养政治人才？谁把分散的社会诉求'打包'成政策？谁来组建政府？","ref":"教材列出六项功能：①代表——回应和表达民意，是政府感知社会期求的'输入'机制；②培养和录用精英——向国家输送并训练政治领导人；③制定目标——拟订纲领，为选民提供清晰的政策选项；④利益表达和聚合——把企业、劳工、宗教等分散诉求整合为协调的政策整体；⑤社会化和动员——通过竞选与辩论进行政治教育、设定议程；⑥组建政府——多数党组阁并促进行政与立法合作。没有政党，这些环节即使不消失，也会失去稳定的组织者，教材因此说'如果没有政党，复杂的现代社会将无法治理'。","wrong":"学生常把'代表'与'利益聚合'混为一谈。导师应追问：表达利益，和把互相冲突的利益整合成一个能执政的纲领，哪一个更难？说明'聚合'是在'表达'之后的再加工。","followup":"六项功能里，哪些在一党制下也能实现？这说明了什么？","src":"政治学 8.pdf","kw":["代表","政府","治理","政党","组织","选民","动员","精英"]},{"q":"一个大学社团刚成立时人人平等、事事表决；三年后，办活动、拉赞助、管账目全落在几位'元老'手里，普通成员只负责点赞。米歇尔斯一百年前就说这是必然的：'谁要求组织，就是要求寡头统治。'他给出了哪几条理由？社团经验在多大程度上印证了他的'铁律'？","level":2,"hint":"从领袖和基层两端想：领袖比别人多掌握了什么技能和资源？普通成员为什么'懒得管'？注意米歇尔斯考察的恰是以民主自居的德国社会民主党。","ref":"米歇尔斯考察德国社会民主党后提出'寡头统治铁律'：政治组织必然走向少数人支配。论据有三：①领袖因专业化需要而掌握更多专业知识和组织技能；②领袖来自内聚性团体，深知团结能增加掌权机会；③基层成员往往冷漠消极，安于从属并尊重领袖。这意味着即便宣称民主的群众性政党，权力也会向高层集中。社团经验大体印证此律；但教材也记录了批评：政党精英常为派别冲突所累，党员也未必恭顺沉默——'铁律'是趋势而非宿命。","wrong":"学生易把它读成'当官的都会变坏'的道德批判。导师应追问：即使换上一批无私的领袖，信息不对称与技能差距会消失吗？引导学生看到这是组织结构问题，而非人品问题。","followup":"教材提到寡头倾向也可能源于'政党团结与选举公信力的需要'——这与'组织化本身'的解释有何不同？","src":"政治学 8.pdf","kw":["寡头统治铁律","民主","权力","政党","组织","精英","提出","团体"]},{"q":"2001年英国大选，工党只拿到41%的选票，却拿下63%的议席；自由民主党拿到18%的选票，只换回8%的议席。如果你是自民党支持者，你会觉得公平吗？多数当选制与比例代表制各自牺牲了什么、又换来了什么？","level":2,"hint":"教材用两类标准评估选举制度：一类关乎代表性（席位与选票是否对等），一类关乎政府效能（能否强势稳定执政）。这两类标准会打架。","ref":"这组数字显示多数当选制系统性地扭曲民意：大党和选票地理集中的党'过于公平'地受益，小党和选票分散的党被惩罚。从代表性标准看，比例代表制席票对等、显然更'公平'；但从政府效能标准看，多数当选制能'制造'一党多数，带来强势稳定、授权明确的政府，比例代表制则更易产生须经选后交易的联合政府。两类标准相互冲突，制度效果又受政治文化制约（意大利联合政府短命，德国、瑞典却稳定高效），所以教材说'根本不存在所谓的最佳选举制度'。","wrong":"学生常断言'比例代表制更民主，所以更好'。导师应追问：联合政府的政策是谁授权的？德国自民党'尾巴摇动狗身'符合民主原则吗？促其看到比例性之外还有授权与问责问题。","followup":"如果选举制度只是塑造政治过程的诸多因素之一，改革选举制度能在多大程度上改善一国治理？","src":"政治学 7.pdf","kw":["比例代表制","政治文化","政府","制度","意大利","一党","选举","民意"]},{"q":"日本自民党从1955年到1993年连续执政38年，期间选举照常举行、反对党照常参选，可就是赢不了。这算'一党制'吗？教材把政党制度分为哪四种类型？各自的典型国家案例是什么？","level":2,"hint":"关键判据：其他政党是被法律禁止了，还是存在却赢不了？再按'竞取权力的政党数目与相对规模'给四种类型排队。","ref":"这不是一党制，而是一党独大制：多党竞争依然存在，只是某党长期掌权。教材的政党制度四分：①一党制——一党以政治或宪法手段排除他党，作为永久性政府运作（苏联、独立初期的加纳）；②两党制——两大党轮流执政、互为'准备中的政府'（英国、美国）；③一党独大制——竞争存在但一党长期掌权（日本自民党、瑞典社民党、意大利基督教民主党）；④多党制——无一党强大到单独执政，常产生联合政府（德国、意大利、以色列）。独大制的代价是政治焦点转入党内派系、反对党萎缩、选民把独大党当成'自然的'执政党。","wrong":"学生常把一党独大制直接等同于一党制。导师应追问：1993年自民党真的下台了——一党制下可能发生这种事吗？让'是否存在使执政党下台的常规机制'成为分水岭。","followup":"一党独大制中，派系斗争能否替代政党间竞争的问责功能？","src":"政治学 8.pdf","kw":["一党独大制","政党制度","政府","民主","意大利","执政","选民","德国"]},{"q":"同一位受访者，一月民调说支持削减福利开支，三月民调又说反对——是民调造假，还是他'变心'了？大选前民调'翻车'的新闻也与这个谜团有关。Zaller的'头脑顶层'模型如何解释民调回答的不稳定？","level":2,"hint":"Zaller问的是：人们脑子里是否存着一个现成的'态度文件'等着调取？还是说，回答是临时'组装'出来的？想想问卷措辞和近期新闻会让哪些想法浮上'头脑顶层'。","ref":"Zaller认为，人们并不持有单一、固定、存储好的态度，而是携带着许多潜在'考量'；面对调查问题时，依据'头脑顶层'即时可得的考量作答。一月访谈时经济新闻让'财政负担'的考量凸显，三月一则民生报道又让'公平'的考量占上风——同一个人给出相反回答，不必假定其态度真的改变，只是被抽样的考量不同。问卷措辞、提问顺序、近期新闻都会改变哪些考量'可得'，这正是民调不稳定乃至'翻车'的微观机制。","wrong":"学生易推出'民调毫无意义、民众没有真态度'的虚无结论。导师应追问：如果回答纯属随机，为什么同一群体的平均立场长期相当稳定？提示'考量'的分布本身被信息与倾向系统性地塑造。","followup":"如果回答取决于'头脑顶层'的考量，谁控制了考量的供给，谁就控制了民意吗？","src":"Zaller, 1992 (Chapter 2 & 12).pdf","kw":["考量","头脑顶层","机制","个人","单一","稳定","态度","改变"]},{"q":"请用四种投票行为理论'翻译'四个投票故事：①'我全家三代都投工党'；②'我们厂区的工人都投左翼党'；③'我算了算哪个党的减税方案对我划算'；④'媒体天天说只有这一条路，大家也就这么投'。英国'非常强烈'认同某党者从1966年43%降到2005年15%、绝对阶级投票从66%降到47%——这两组数字分别动摇了哪两种模式的前提？","level":3,"hint":"四种模式各抓住一种机制：心理归附、团体身份、个人计算、意识形态操纵。解盟数据里的'认同'和'阶级'两个词分别对应谁？","ref":"四个故事依次对应：政党认同模式（投票是长期党派忠诚的表达，源于家庭政治社会化）、社会学模式（投票反映阶级等团体成员身份）、理性选择模式（投票是基于自我利益计算的工具行为，即议题投票）、支配型意识形态模式（媒体与教育设定议程、操纵选择）。认同率下降动摇政党认同模式的前提——习惯性忠诚正在瓦解；阶级投票下降动摇社会学模式的前提——团体纽带正在松绑。两股'解盟'合力被认为推动了议题投票的普遍化，但教材提醒：所有投票理论都是不完备的。","wrong":"学生常急于宣布某模式'胜出'。导师应追问：一个儿时认同工党、后来因收入变化而算计议题的选民，他的一次投票能用单一模式解释吗？让'不完备'成为方法自觉，而非和稀泥。","followup":"当短期因素（经济、领袖形象、媒体）越来越主导投票时，选举的授权功能还能成立吗？","src":"政治学 7.pdf","kw":["政治社会化","议题投票","意识形态","政党","选择","纽带","模式","解盟"]},{"q":"欧美国家近年新党层出不穷（绿党、民粹党），老党得票一路下滑，投票率也在降。有人说这只是'重组'——选民换了口味，政党调整到位后就会稳定下来；Wren与McElwain却判定是'解盟'。两种解释的机制差在哪里？作者凭什么说证据更支持解盟？","level":3,"hint":"区分两条因果链：是选民偏好在漂移（政党还能追回来），还是政党与选民双方的能力变了（群众型政党再也绑不住人）？再看老党得票率、新党进入率、投票率三组数据指向哪一边。","ref":"重组说认为选民偏好在变：后物质主义兴起、老党向中间靠拢留下政策空间，新党乘虚而入；一旦政党完成调适，波动就会回落。解盟说则认为教育普及与媒体技术革新改变了双方的能力：选民不再依赖政党获取信息，政党也能绕过基层组织直达受众，群众型政党的纽带永久性松动。作者的证据：有新党竞争的选举比例从1950年代27.5%升至1990年代47.3%；投票率从84.6%降至77.3%；老党得票持续下滑而选举波动率无回落趋势——更像长期解盟而非暂时重组。","wrong":"学生易把'新党崛起'直接当作重组的证据。导师应追问：如果选民主要是'变成独立人士'而非'改投新党'，这支持哪种解释？投票率下降所流失的人又去了哪里？","followup":"Mair提醒区分'政党变化'与'政党制度变化'——波动动摇的是个别政党，还是竞争结构本身？","src":"Wren and McElwain, 2007.pdf","kw":["后物质主义","选举波动率","型政党","组织","选民","投票","纽带","重组"]},{"q":"某新兴民主国家，候选人挨家挨户送米送油、承诺给村里修路来换选票。流行的解释是'民主太年轻，成熟就好了''选民太穷，容易被收买'。Hagopian为什么认为这些解释不充分？她的替代解释是什么？","level":3,"hint":"先看证据：19个新民主国家经历四个选举周期后，波动率下降了吗？再想Posner的研究：同一对族群在赞比亚是盟友、在马拉维是对手——'自然'的分裂怎么会因国境线而改变？","ref":"Hagopian指出，'民主太年轻'说不通：19个新民主国家在四个选举周期内波动率无显著下降，时间并未治愈脆弱；'选民太穷'也太简化。她的替代框架把动员策略放到政党间战略竞争中理解：政党选择纲领、个人化还是庇护，取决于竞争强度、选民需求与代表策略的互动。更关键的是，分裂并非自然给定——Posner发现Chewa与Tumbuka两族在赞比亚都是小少数、不值得动员，在马拉维则因群体规模符合最小获胜联盟的逻辑而被政治化为对手。政党可以主动'创造'分裂。","wrong":"学生常复述'贫困导致庇护'的刻板因果。导师应追问：韩国选民最看重候选人个人品质，而俄罗斯1996年总统选举中议题意见最重要——同属新兴民主国家为何迥异？这说明结构不决定策略，竞争才选择策略。","followup":"如果政党能'创造'分裂，Lipset-Rokkan式的社会结构决定论还剩下多少解释力？","src":"Hagopian, 2007.pdf","kw":["代表","民主","强度","波动率","政党","选举","选民","选择"]},{"q":"大选之夜，胜选者照例宣布'人民已经发声'。综合本章的精读材料——阿罗不可能定理、Hagopian的动员策略分析、Zaller的舆论模型——这一宣示在三个层面上分别会受到什么质疑？选举还剩下什么不可替代的功能？","level":4,"hint":"三层追问：个人偏好能否被可靠加总？选民面对的'菜单'由谁供给？选民的'答案'由什么心智过程产生？最后回到教材结尾：政治人物知道自己下次还要接受评判。","ref":"加总层面：阿罗不可能定理显示个人偏好与集体选择之间可能没有可靠联系，'循环多数'使任何单一解读都带武断性。供给层面：Hagopian表明选民面对的是政党策略性供给的选项组合，分裂本身可以被政党创造。心智层面：Zaller揭示选民的'答案'是精英供给的考量与自身倾向的临时合成。'人民的声音'至多是精英菜单上的选择性回声。但选举最实在的功能仍在：让自称代言人的政治人物最终接受公众评判，从而限制专制——Zaller也说，关键不在人民的集体智慧，而在公民施压与罢免领袖的集体能力。","wrong":"学生常抓住阿罗定理就宣布'民主不可能'。导师应追问：加总困境否定的是对结果的某种诠释，还是选举本身？教材为何仍说选举能'限制专制政府的出现'？引导区分'授权神话'与'问责机制'。","followup":"如果选举的意义主要在问责而非授权，公民投票、协商民主等机制能更好地表达民意吗？","src":"政治学 7.pdf","kw":["不可能定理","考量","政党","选举","公众","选民","选择","精英"]}],"quiz":[{"type":"mc","q":"下列哪一项是教材判断一个团体是否为'政党'的判据性标准？","options":["拥有明确的意识形态纲领","以赢得政治职位、掌握执政权为目标","拥有正式注册的成员","就单一议题游说政府"],"answer":1,"explain":"政党的判据是竞取公职与执政。利益集团也可以有纲领、有正式成员、搞游说，但它不寻求执政；这是绿党（政党）与绿色和平（利益集团）的分水岭。","src":"政治学 8.pdf"},{"type":"mc","q":"柏克主张代表者当选后应凭'成熟的判断'独立行事，不应为选民意见牺牲自己的判断。这种代表观属于：","options":["受命代表模式","全权受托模式","授权模式","摹本模式"],"answer":1,"explain":"柏克1774年布利斯托尔演讲是全权受托模式的经典表述：代表者凭'成熟的判断'与'开明的良知'服务选区。受命代表模式（潘恩）恰为其对立面——代表者只是选民意见的传声筒。","src":"政治学 7.pdf"},{"type":"tf","q":"一党独大制与一党制的区别在于：一党独大制下仍存在多个政党在定期选举中竞争权力，执政党存在被选下台的可能。","answer":true,"explain":"对。一党制用政治或宪法手段排除其他政党，不存在使其下台的常规机制；一党独大制保留竞争性选举，只是某党长期掌权——日本自民党连续执政38年后仍在1993年下台，即是明证。","src":"政治学 8.pdf"},{"type":"mc","q":"2001年英国大选中，工党以41%的选票获得63%的议席，自由民主党以18%的选票只换得8%的议席。这组数字说明：","options":["比例代表制扭曲了民意","多数当选制使大党席次率高于得票率，扭曲了选民偏好","英国实行两轮投票制","联合政府必然不稳定"],"answer":1,"explain":"多数当选制对大党和选票地理集中的党'过于公平'，对小党和选票分散的党不'公平'——自民党正是选票分散的'第三党'。教材以此说明多数当选制在代表性上的弱点。","src":"政治学 7.pdf"},{"type":"tf","q":"比例代表制必然导致软弱而不稳定的联合政府。","answer":false,"explain":"错。教材给出明确反例：意大利的联合政府短命，但德国和瑞典的联合政府稳定且高效。选举制度的效果受政治文化、政党制度性质等环境因素制约，不能一概而论。","src":"政治学 7.pdf"},{"type":"mc","q":"一位选民从小受家庭影响，把某党当作'我们的党'，几十年习惯性地投票给它，很少比较政策。这最符合哪种投票行为模式？","options":["理性选择模式","社会学模式","政党认同模式","支配型意识形态模式"],"answer":2,"explain":"政党认同模式视投票为长期党派忠诚的表达，强调家庭政治社会化——投票是党派意识而非算计的产物。'比较政策'属于理性选择模式，'厂区工人都投左翼'才属于社会学模式。","src":"政治学 7.pdf"},{"type":"tf","q":"Zaller认为，公民对每个议题都持有一个单一、固定、存储在记忆中的态度，调查回答只是把它读取出来。","answer":false,"explain":"恰恰相反。Zaller认为人们携带着多个潜在'考量'，面对问题时凭'头脑顶层'即时可得的考量作答；问卷措辞使不同考量凸显，回答随之波动——回答不稳定不等于民调造假或'变心'。","src":"Zaller, 1992 (Chapter 2 & 12).pdf"},{"type":"mc","q":"Posner发现Chewa与Tumbuka两族在赞比亚是盟友、在马拉维却是对手。Hagopian引用此例是为说明：","options":["族群仇恨天然决定政治分裂","宗教差异是族群政治化的前提","政党依据最小获胜联盟的逻辑选择政治化哪条分裂，分裂并非自然给定","一国族群越多，政党制度越稳定"],"answer":2,"explain":"两族在赞比亚都是小少数、不值得动员；在马拉维则数量可观、可用作联盟基础。客观文化差异几乎相同，政治命运却相反——说明政党策略性地'创造'政治分裂，而非被动反映社会结构。","src":"Hagopian, 2007.pdf"},{"type":"tf","q":"新兴民主国家的平均选举波动率约为发达工业民主国家的2.5倍，且没有随选举周期推进而显著下降。","answer":true,"explain":"对。Hagopian报告新兴民主国家平均波动率30.6，约为发达民主国家的2.5倍（东欧达44.0）；Mainwaring与Torcal发现19个新民主国家在四个选举周期内波动率无显著下降，动摇了'时间会治愈一切'的假设。","src":"Hagopian, 2007.pdf"},{"type":"sa","q":"请用自己的话解释Zaller所说的'考量'与'头脑顶层'，并举一个现实例子，说明为什么同一个人对同一问题的两次民调回答可能不同。","ref":"考量是进入人们头脑、关于议题的想法片段；人不持有单一固定的态度，被问到时凭'头脑顶层'即时可得的考量抽样平均作答。例子：同一位选民在医保新闻热播时被问医疗改革，答'支持加大投入'；在税收新闻热播时再被问，答'反对加税'——并非态度改变，而是不同考量被凸显。","explain":"评分要点：准确界定'考量'；说明回答由即时可得的考量临时'组装'而非调取固定态度；所举例子能体现'情境/措辞改变可得考量'这一机制。","src":"Zaller, 1992 (Chapter 2 & 12).pdf"},{"type":"sa","q":"请用自己的话解释'重组'与'解盟'的区别，并各举一项本章提到的经验现象作为检验线索。","ref":"重组：选民偏好漂移（如后物质主义兴起），新党乘虚而入，政党调适完成后波动回落——检验线索是波动率若回落则支持重组。解盟：教育普及与媒体技术革新改变了政党与选民双方的能力，群众型政党的纽带永久性松动——检验线索是投票率持续下降（84.6%→77.3%）、老党得票持续下滑且波动率无回落。Wren与McElwain据此判定证据更支持长期解盟。","explain":"评分要点：两种机制区分清楚（偏好漂移 vs 能力变化）；各举至少一项本章数据作线索；能说出作者倾向解盟的判定。","src":"Wren and McElwain, 2007.pdf"}],"flashcards":[{"front":"代表（representation）","back":"个人或团体替更大群体说话、办事的关系。代表承认政府与被统治者的区别，是大规模社会间接实现民治的手段；怎样才算'代表得好'，历来有争议。","src":"政治学 7.pdf"},{"front":"全权受托模式（trustee model）","back":"柏克：议员当选后凭成熟判断与开明良知独立行事，为选民利益而非选民意见服务——类似'受人之托，忠人之事'。","src":"政治学 7.pdf"},{"front":"受命代表模式（delegate model）","back":"潘恩：议员只是选民意见的传声筒与代理人，须按选民指示行事，靠频繁选举、短暂任期和罢免加以控制。","src":"政治学 7.pdf"},{"front":"授权模式（mandate model）","back":"政党赢选举即拿到人民的'授权书'，须兑现竞选纲领；但它依赖'选民按议题理性投票'这一存疑假定。","src":"政治学 7.pdf"},{"front":"摹本模式（resemblance model）","back":"好议会应是社会的'缩影'：工人、女性、少数群体在议会中的比例与其人口相称，才算'像乎'人民。","src":"政治学 7.pdf"},{"front":"多数当选制 vs 比例代表制","back":"多数制：41%选票可换63%议席，政府强势稳定但扭曲民意；比例制：席票对等、更公平，但更易产生联合政府。","src":"政治学 7.pdf"},{"front":"附带名额制（AMS）","back":"混合制：选民投两票，一票选本区候选人、一票选政党；部分席位按选区、部分按政党比例分配。用于德国、新西兰、苏格兰。","src":"政治学 7.pdf"},{"front":"单记可转移投票制（STV）","back":"多名额选区中选民按偏好排序投票，候选人达当选基数即当选、余票按次偏好转移；比例性高，用于爱尔兰与北爱尔兰。","src":"政治学 7.pdf"},{"front":"阿罗不可能定理","back":"把每个人的偏好加总成集体决定时可能出现'循环多数'（A胜B、B胜C、C又胜A），所以选举结果不会不言自明。","src":"政治学 7.pdf"},{"front":"政党认同模式","back":"最早的投票理论：选民把某党当'我们的党'，投票是长期忠诚的表达而非算计的产物，主要从家庭习得。","src":"政治学 7.pdf"},{"front":"党徒解盟（partisan dealignment）","back":"选民对政党的认同与忠诚下降，'铁票'变少、'游动票'变多；源于教育普及、社会流动与电视成为主要信息来源。","src":"政治学 7.pdf"},{"front":"阶级解盟（class dealignment）","back":"阶级与投票的联系减弱：英国绝对阶级投票从1966年66%降到1983年47%，工人不再固定投左翼政党。","src":"政治学 7.pdf"},{"front":"议题投票（issue voting）","back":"选民像购物一样比较各党政策、计算自身利益再投票；党徒解盟与阶级解盟使它越来越普遍。","src":"政治学 7.pdf"},{"front":"干部型政党与群众型政党","back":"干部型靠少数显要精英运作、不重党员数量；群众型重视扩充党员与选民基础，以欧洲社会主义政党为鼻祖。","src":"政治学 8.pdf"},{"front":"兼容型政党（catch-all party）","back":"基西海默提出：政党大幅卸下意识形态包袱、什么选民都想争取，重领导与团结、贬低个体党员；以美国两党为典型。","src":"政治学 8.pdf"},{"front":"寡头统治铁律","back":"米歇尔斯：'谁要求组织，就是要求寡头统治。'领袖掌握技能与资源、基层冷漠消极，政党权力必然向高层集中。","src":"政治学 8.pdf"},{"front":"一党独大制","back":"选举照常竞争，但总是一党长期执政（日本自民党38年）；政治焦点转入党内派系，易致自满、腐败与民主精神侵蚀。","src":"政治学 8.pdf"},{"front":"冻结分裂假说（frozen cleavages）","back":"Lipset与Rokkan：西欧政党格局长期'冻结'在群众型政党诞生时的社会冲突上，1920—1960年代很少变化。","src":"Wren and McElwain, 2007.pdf"},{"front":"庇护主义（clientelism）","back":"用现金、公职、社区工程等具体好处'换'选票的交易式政党-选民联系，被认为在新兴民主国家盛行。","src":"Hagopian, 2007.pdf"},{"front":"精英话语与'头脑顶层'（Zaller）","back":"公众依赖精英供给的选择性信息流；被问到时凭'头脑顶层'即时可得的想法作答，所以民调回答会波动。","src":"Zaller, 1992 (Chapter 2 & 12).pdf"}]},{"id":"ch05","folder":"7. Political Culture","title":"政治文化","subtitle":"Political Culture","overview":{"theme":"为什么有的国家把别国的宪法、选举和政党制度整套'抄'过去，民主却依然运转不良？为什么温饱解决之后，年轻一代开始热衷环保、性别平等这些'不顶饱'的议题？为什么美国人还在打保龄球、却不再'组队'打联赛？本章探讨政治文化的概念、类型及其与民主制度的关系：一国公民对政治体系的信念、价值与情感取向如何塑造政治制度的稳定性，以及经济发展、现代化进程如何反过来推动政治文化的可预测变迁。","coreQuestions":["什么是政治文化？它与公共舆论、意识形态有何区别？","民主制度是否需要一种特定的'公民文化'来支撑？这种文化由哪些成分混合而成？","经济发展与现代化是否会带来可预测的文化变迁？后物质主义价值从何而来？","当代民主国家的社会资本与公民参与是在衰落，还是仅仅改变了形式？","政治文化是民主的原因还是结果？文化研究能否摆脱'民族性格'式同质性假定？"],"thread":"本章以'文化如何支撑民主'为主线组织学习。第一步用海伍德教材第6章建立概念地图：政治文化的定义、三种类型学、马克思主义与支配性意识形态的批判视角。第二步回到源头文献《公民文化》第一章，看阿尔蒙德与维巴如何用五国调查把'民主的文化前提'操作化为可测量的态度类型。第三步读英格尔哈特，看他如何把静态的文化类型学动态化：经济发展经由代际更替驱动从物质主义到后物质主义的可预测变迁。第四步读普特南，看他如何把'文化'落到社会网络与互惠规范（社会资本）上，并用多源证据诊断美国公民参与的衰落。最终回到教材中的争论：因果方向、同质性假定与'衰落还是转型'之争。","path":["先读海伍德教材第6章6.1节，掌握政治文化的定义、三种类型与主要批评。","精读阿尔蒙德与维巴第一章，理解公民文化的'混合'逻辑与跨国调查方法。","读英格尔哈特第11章，把握现代化—后现代化轨迹与代际价值更替的证据。","读普特南第一章，理解社会资本的内涵、桥接/黏合之分与'衰落'命题。","对照四篇文献，围绕'文化是民主之因还是之果''参与在衰落还是转型'做批判性综合。"],"dialogue":"四篇文献构成一场跨越四十年的对话。阿尔蒙德与维巴提出民主需要'公民文化'这一静态命题，并假定文化与结构的'契合'带来稳定；英格尔哈特反驳了文化凝固不变的隐含假定，证明文化随经济发展沿可预测轨迹变迁，公民参与不是消失而是转向议题化、精英挑战性的新形式——这直接回应了普特南的'衰落'叙事。普特南则用社会资本概念把托克维尔式结社传统量化，诊断美国公民纽带的退潮，但其因果方向（社会资本是民主之因还是之果）恰好落入教材所总结的批评射程。教材则提供元视角：马克思主义与葛兰西的霸权理论提醒读者，'公民文化'本身也可能是支配性意识形态，从而把四篇文献拉回权力分析的场域。"},"readings":[{"file":"政治学 6.pdf","title":"政治学（第三版）第6章：政治文化、认同与合法性（Politics, 3rd ed., Ch.6）","authors":"安德鲁·海伍德（Andrew Heywood）","year":"2007（英文第3版）；2013（中译本）","venue":"《政治学》（第三版），张立鹏译，中国人民大学出版社（公共行政与公共管理经典译丛）","thesis":"政治多发生于人们的头脑之中：信念、符号和价值塑造政治本身，合法性是政治稳定的关键。本章系统梳理政治文化研究的两大传统——阿尔蒙德与维巴的公民文化路径与马克思主义的意识形态霸权路径，并考察社会资本衰落、后物质主义兴起等当代争论，进而延伸至认同政治与合法性问题。","framework":"两条理论线索对照展开：①行为主义的公民文化研究——阿尔蒙德与维巴提出参与型、臣民型、地域型三种文化类型，普特南的社会资本与英格尔哈特的后物质主义构成后续发展；②马克思主义—葛兰西的支配性意识形态模式——把文化理解为权力形态；另有保守主义传统价值论（奥克肖特）作为补充视角。核心概念框：政治文化、社会资本、后物质主义、霸权。","method":"教材式概念梳理与理论综述，穿插'概念'框（政治文化、社会资本、后物质主义）与人物介绍（葛兰西、奥克肖特、普特南），并对各理论列示批评意见。","evidence":"①转述阿尔蒙德和维巴五国研究结论：英国最接近公民文化（参与型与臣民型特点兼备）；美国得分也高，但参与态度超过臣民态度；联邦德国以臣民型文化为主；意大利地域态度根深蒂固。②综述普特南：1965年以来美国志愿性俱乐部和社团的数量减少25%~50%，公共、城镇和学校会议出席率降低，政党成员大幅减少。③综述英格尔哈特：1960年代以来后物质主义价值在年轻一代中成长，政党成员与选举票数减少，但单一议题抗议政治与运动团体兴起。④保守主义案例：撒切尔呼吁恢复'维多利亚价值'，梅杰提出'回到基本点'，里根缅怀'拓荒者精神'。","limits":"教材本身列示了对公民文化路径的三大批评：①'睡狗'理论——它把低度参与当作对政府的普遍满意，实则可能反映疏离与不信任；②未经证明的假定——认定政治态度决定行为而非相反，公民文化可能更多是民主的结果而非原因；③同质性倾向——把政治文化视为民族文化密码，忽视次级文化与社会冲突。同时指出支配型意识形态模式可能高估价值体系的一致性（阿伯克龙比等认为从属阶级未必被成功整合）。作为综述，原始论证需回到经典文献本身。","quotes":[{"en":"政治文化就是针对政党、政府和宪法等政治客体的“倾向模式”（pattern of orientations），并表现为信仰、符号和价值。政治文化不同于公共舆论，它由长期的价值而非对具体政策、问题或人物的反应塑造而成。","zh":"—"},{"en":"统治阶级的思想在每一时代都是占统治地位的思想。这就是说，一个阶级是社会上占统治地位的物质力量，同时也是社会上占统治地位的精神力量。","zh":"—（引自马克思、恩格斯《德意志意识形态》）"},{"en":"“社会资本”的概念在1970年代提出，用来强调支撑财富创造的社会和文化因素，此后该术语就用来指促进公民参与的网络、规范和信任所代表的社会联系。","zh":"—"}]},{"file":"Almond and Verba, 1963.pdf","title":"An Approach to Political Culture（《公民文化》第1章）","authors":"加布里埃尔·阿尔蒙德、西德尼·维巴（Gabriel A. Almond & Sidney Verba）","year":"1963","venue":"The Civic Culture: Political Attitudes and Democracy in Five Nations, Princeton University Press","thesis":"民主的稳定不仅依赖形式制度（普选、政党、民选议会）——这些连极权政体也具备形式上的对应物——更需要与之契合的政治文化。作者提出政治文化的三种纯粹类型，并论证最有利于民主的'公民文化'不是纯参与型文化，而是参与、臣民与地域取向的特定混合：臣民与地域取向'管理着'参与取向，在公民的主动性与政府的权威之间保持平衡。","framework":"以3×4取向矩阵把'政治文化'操作化：认知、情感、评价三种取向，乘以体系一般对象、输入对象、输出对象、自我角色四类政治对象。据此区分三种纯粹类型：①地域型——对专门化政治对象的取向频率趋近于零，'对政治体系一无所求'；②臣民型——对体系与输出有取向，但输入与自我能动取向趋近于零；③参与型——同时取向输入、输出与积极的自我角色。再加三种系统混合型文化：地域—臣民型、臣民—参与型、地域—参与型，以及忠诚—冷漠—疏离的文化—结构契合量表。","method":"跨国比较问卷调查：在美、英、联邦德国、意大利、墨西哥五国抽取有效样本，用认知、情感、评价三维取向来'填充矩阵'；同时以五国政治史分析形成关于文化差异的假设，把历史推断转化为可检验的数量关系——'历史方法与行为科学方法互相补充、彼此支撑'。","evidence":"五国历史假设先导：①英国——专制时期的政府控制从未彻底，臣民时代仍保留结社自由与有限自治，公民态度与臣民态度经数百年逐步融合，为公民文化典范；②德国——普鲁士官僚威权把地域结构驱入私人领域或吸收进国家，民主化始于公私领域间的巨大鸿沟，魏玛的参与实验未能长成参与型文化；③意大利——教会以non expedit拒认新国家合法性，从未发展出整合的民族政治文化，南部以班菲尔德'非道德家庭主义'为特征；④墨西哥——革命激发了民主与现代化期望，但组织自由流于形式、腐败普遍，参与期望与政治疏离并存；⑤美国——共和传统与平民主义使其臣民取向弱于英国。","limits":"第一章仅为理论与方法设计，实证发现在后文；其'契合'逻辑预设态度支撑结构，未处理文化可能是民主结果的反向因果；以民族为单位的文化分类易被批评为忽视次级文化与社会冲突，且作者自承墨西哥难以代表亚非新兴国家的多样性。","quotes":[{"en":"If there is a political revolution going on throughout the world, it is what might be called the participation explosion.","zh":"如果说当今世界正在发生一场政治革命，那就是可以称之为'参与爆炸'的革命。"},{"en":"The term political culture thus refers to the specifically political orientations--attitudes toward the political system and its various parts, and attitudes toward the role of the self in the system.","zh":"因此，'政治文化'一词指的是特定的政治取向——对政治体系及其各个部分的态度，以及对自我在体系中角色的态度。"},{"en":"The parochial expects nothing from the political system.","zh":"地域型取向者对政治体系一无所求。"}]},{"file":"Inglehart, 1997.pdf","title":"Trajectories of Social Change（《现代化与后现代化》第11章）","authors":"罗纳德·英格尔哈特（Ronald Inglehart）","year":"1997","venue":"Modernization and Postmodernization: Cultural, Economic, and Political Change in 43 Societies, Princeton University Press","thesis":"经济发展、文化变迁与政治变迁以连贯且大致可预测的模式同步演进：现代化带来从传统权威到理性—法理权威的转变；进入发达工业社会后，经济增长的边际效用递减使轨迹转向'后现代化'——从生存价值转向幸福与自我表达价值。这一转变由成长期的安全经历塑造，通过代际人口更替缓慢实现。","framework":"修正的现代化理论，三个要点：①双重轨迹——现代化（传统权威→理性—法理权威）与后现代化（生存价值→幸福/自我表达价值），动力是经济进步的边际效用递减；②作用机制——基本价值观由成长期（成年之前）的安全或不安全经历塑造且终身大体定型，社会整体变迁经由代际人口更替实现；③可预测性有三方面——综合征式共变（知其一可推其余）、由已知经济变化预测文化走向、用Abramson技术计算代际更替应产生的变迁方向与数量（1970年以来观察值与预测值非常接近）。","method":"跨国长期追踪调查：依托1981与1990年世界价值观调查（WVS），对21个有两时点数据的社会、约40个与物质主义/后物质主义相关的价值变量进行800余项变迁检验；并以44个社会65项调查绘制'现代化×后现代化'文化地图，展示各社会1981与1990两个时点的位置移动。","evidence":"①18/21社会的大多数价值在1981—1990年间朝预测方向移动；②偏离案例反向佐证机制：经历严重经济衰退与政治动荡的阿根廷、南非有78%的项目逆向移动（转向生存价值），匈牙利仅一半项目符合预测；③系统性例外：亲子纽带4个项目普遍'回摆'，公众重新强调双亲家庭价值；④1995年欧洲科学基金会五卷本（50余位学者，含其昔日最著名批评者）确认后物质主义的代际转变确在发生，Scarbrough与Duch等批评者亦认可证据；⑤文化地图显示各社会按发展水平与宗教传统聚类（北欧新教、天主教欧洲、东亚儒教、前共产主义、英语圈等）。","limits":"可获纵向数据的社会偏向繁荣稳定国家，动荡社会代表性不足；亲子纽带等少数变量未按预测方向移动；'预测'是概率性的，单一因素无法决定具体社会的轨迹（英国1981—1990年净变化反而略向生存价值移动）；后现代化是否是历史终点，作者自己亦存疑。","quotes":[{"en":"Economic development, cultural change, and political change go together in coherent and roughly predictable patterns: some trajectories of socioeconomic change are far more likely than others.","zh":"经济发展、文化变迁与政治变迁以连贯且大致可预测的模式同步演进：某些社会经济变迁轨迹远比其他轨迹更可能出现。"},{"en":"The debate has changed; the question no longer is, \"Is an intergenerational shift to Postmaterialist values taking place?\" but rather \"Why is this intergenerational value shift taking place?\"","zh":"争论已经改变：问题不再是'是否正在发生向后物质主义价值的代际转变'，而是'这一转变为何发生'。"}]},{"file":"Putnam, 2000.pdf","title":"Thinking about Social Change in America（《独自打保龄》第1章）","authors":"罗伯特·普特南（Robert D. Putnam）","year":"2000","venue":"Bowling Alone: The Collapse and Revival of American Community, Simon & Schuster","thesis":"20世纪前三分之二的时间里，美国公民参与如涨潮般不断深化，但过去数十年间这股潮流悄然逆转：从俱乐部、教会到保龄球联盟，公民纽带普遍松弛，社会资本正在衰落。社会资本——社会网络及由此产生的互惠与信任规范——兼具私人物品与公共物品属性，其存量关乎学校、经济、民主乃至健康。","framework":"社会资本理论：①与物质资本（物体）、人力资本（个人属性）类比，社会资本指个体之间的联结——社会网络及由此产生的互惠与可信赖规范；②兼具'私人面孔'与'公共面孔'——收益部分归投资人，部分外溢给旁观者；③区分具体互惠与普遍互惠（'我现在帮你而不求即时回报，相信日后自有人帮我'，犹如货币优于物物交换）；④关键区分桥接型（向外联结、跨越社会裂隙，如民权运动，是'进取'的关键）与黏合型（向内凝聚、强化排他认同，如族群兄弟会，是'守成'的依靠）——二者是'或多或少'的维度而非非此即彼的类别。","method":"历史社会学诊断与'三角互证'：类比古气象学家用极地冰芯花粉、树木年轮、海军温度记录重建气候，以多源独立证据（社团名册、调查数据、时间利用研究等）相互印证公民参与趋势，遵循新闻的'两来源规则'；'遏制怀旧的办法是计数'，并如实呈示正反两方面证据；承认小团体、社会运动与互联网是三个'明显的反例'，留待后文考察。","evidence":"①开篇案例群：宾州格伦谷桥牌俱乐部半世纪后解散；小石城Sertoma俱乐部周会从80年代中期的近50人降至十年后的7人；罗阿诺克NAACP会员从约2500人萎缩到数百人（1998年主席改选仅57人投票）；达拉斯慈善联盟活动57年后于1999年终止；波士顿近郊一所高中军乐队从80余人减到仅4人报名。②潮流逆转前的'涨潮'：认同'多数人可信'者从二战后的66%升至1964年77%的峰值；1920—1960年总统选举投票率每四年上升1.6%。③公众感受：1987年53%的婴儿潮一代认为父辈更关心社区；1992年四分之三的劳动者视'社区瓦解'为严重问题。④结尾保龄球友捐肾故事（兰伯特与博施马）点题：'一起打保龄使一切不同'。","limits":"作者自承属'衰落叙事'传统，需警惕怀旧偏差；缺乏能干净区分桥接/黏合资本的全国性长期测量；本章为问题提出与方法论声明，衰落的原因（电视、郊区化、代际更替等）与后果证据在后续章节展开，且'参与形式转型'的替代解释（如英格尔哈特）尚待回应。","quotes":[{"en":"Whereas physical capital refers to physical objects and human capital refers to properties of individuals, social capital refers to connections among individuals--social networks and the norms of reciprocity and trustworthiness that arise from them.","zh":"物质资本指物质对象，人力资本指个人的属性，而社会资本指个体之间的联结——社会网络以及由此产生的互惠与可信赖的规范。"},{"en":"Bonding social capital constitutes a kind of sociological superglue, whereas bridging social capital provides a sociological WD-40.","zh":"黏合型社会资本犹如社会学意义上的强力胶，而桥接型社会资本则提供了社会学意义上的WD-40润滑剂。"},{"en":"A society of many virtuous but isolated individuals is not necessarily rich in social capital.","zh":"一个由众多有德行却彼此孤立的个体组成的社会，未必富有社会资本。"}]}],"glossary":[{"en":"political culture","zh":"政治文化","def":"人们针对政党、政府、宪法等政治客体的深层'倾向模式'，表现为信仰、符号和价值；由长期价值塑造，不同于对一时一事的舆论反应。","src":"政治学 6.pdf"},{"en":"civic culture","zh":"公民文化","def":"阿尔蒙德与维巴提出的混合型政治文化：把公民参与取向与臣民式服从、地域取向按特定比例融合，被视为稳定民主的文化基础。","src":"Almond and Verba, 1963.pdf"},{"en":"parochial political culture","zh":"地域型（村民型）政治文化","def":"对'国家政治'几乎没有取向的类型：成员只认同部落、村庄等狭小共同体，'对政治体系一无所求'。","src":"Almond and Verba, 1963.pdf"},{"en":"subject political culture","zh":"臣民型政治文化","def":"成员知道政府、在乎政策输出，但自认无力影响决策，消极服从权威——是'接受管理的人'而非参与者。","src":"政治学 6.pdf"},{"en":"participant political culture","zh":"参与型政治文化","def":"成员同时关心政治的输入与输出，认为自己能够也应当参与决策的文化类型，最接近民主理想。","src":"政治学 6.pdf"},{"en":"participation explosion","zh":"参与爆炸","def":"阿尔蒙德与维巴对二战后世界趋势的概括：新独立国家民众普遍相信'普通人在政治上是相关的'，大批原在政治之外的人要求进入政治体系。","src":"Almond and Verba, 1963.pdf"},{"en":"political socialization","zh":"政治社会化","def":"个人与群体习得政治态度与价值的过程；家庭、学校、工作场所中的参与经验对政治态度有持续影响。","src":"Almond and Verba, 1963.pdf"},{"en":"sleeping dogs theory","zh":"'睡狗'理论","def":"对公民文化论的批评性概括：它把低度参与解释为'人民对政府满意'，恰好是政客希望维持的状态；批评者认为低投票率其实反映疏离与不信任。","src":"政治学 6.pdf"},{"en":"dominant-ideology model","zh":"支配型意识形态模式","def":"马克思主义政治文化观：统治阶级的思想渗透全社会成为'统治思想'，连'公民文化'也被看作资产阶级意识形态，文化是一种权力形态。","src":"政治学 6.pdf"},{"en":"hegemony (Gramsci)","zh":"意识形态霸权（葛兰西）","def":"葛兰西强调：统治不只靠强制，更靠思想与文化上的领导权——把支配阶级的价值变成全社会不加怀疑的'常识'，文化由此成为一种权力。","src":"政治学 6.pdf"},{"en":"social capital","zh":"社会资本","def":"个体之间的联结——社会网络及由此产生的互惠与信任规范；像'人情存折'，自己受用，旁人也沾光（兼具私人与公共物品属性）。","src":"Putnam, 2000.pdf"},{"en":"bridging social capital","zh":"桥接型社会资本","def":"向外联结、跨越圈层的网络（如民权运动、跨教派组织），带来外部资源与新信息，是'进取'（getting ahead）的关键。","src":"Putnam, 2000.pdf"},{"en":"bonding social capital","zh":"黏合型社会资本","def":"向内抱团、强化'自己人'认同的网络（如族群兄弟会、高档乡村俱乐部），利于互助守成，但可能排斥外人、加剧群体对立。","src":"Putnam, 2000.pdf"},{"en":"generalized reciprocity","zh":"普遍互惠","def":"'我现在帮你而不求即时回报，相信日后自有人帮我'的规范；有这种规范的社会比处处提防的社会更有效率，犹如货币优于以物易物。","src":"Putnam, 2000.pdf"},{"en":"postmaterialism","zh":"后物质主义","def":"从经济发展水平解释政治价值的理论：匮乏使人优先关心经济与治安，普遍富足则使人转向环保、女权、和平、自我表达等'生活质量'议题；基于马斯洛需要层次。","src":"政治学 6.pdf"},{"en":"intergenerational value change","zh":"代际价值变迁","def":"英格尔哈特的核心机制：价值观在成长期定型、终身难改，社会整体价值靠年轻队列'换水'般替代年老队列而缓慢位移，故方向可预测。","src":"Inglehart, 1997.pdf"},{"en":"survival vs. well-being values","zh":"生存价值与幸福（自我表达）价值","def":"英格尔哈特的后现代化维度：从强调经济与人身安全，转向强调主观幸福、自我表达与生活质量。","src":"Inglehart, 1997.pdf"},{"en":"postmodernization","zh":"后现代化","def":"发达工业社会的发展新轨迹：对工具理性与等级制官僚组织的强调下降，对自主、生活质量与自我表达的强调上升。","src":"Inglehart, 1997.pdf"}],"socratic":[{"q":"世界上有些国家把别国的宪法、选举制度、政党制度整套'抄'了过去，民主却还是运转不良、动辄垮台。阿尔蒙德和维巴在《公民文化》开篇就说，这些国家缺了某样东西。缺的是什么？","level":1,"hint":"先想一个反直觉的事实：阿尔蒙德指出，普选、政党、民选议会这些制度，连极权政体也具备形式上的对应物。既然形式制度两边都有，差别会在哪里？","ref":"缺的是与民主制度相契合的政治文化。阿尔蒙德和维巴指出，普选、政党、民选议会这些形式制度并非民主专利，极权政体同样有形式上的对应物；民主还需要'更微妙的文化成分'——政治精英决策的规范与态度，以及普通公民对政府、对同胞的态度和情感。这类成分属于信念体系与人际准则，传播缓慢且容易走样。所以制度可以一夜移植，文化却难以照搬，这正是新兴国家民主化受挫的深层原因。","wrong":"常见答法是'缺经济发展'或'缺高素质选民'。导师可追问：'书里的德国经济发展水平很高，为什么仍被列为民主重建的困难案例？'引导学生回到'态度与制度是否契合'这一变量，而不是发展水平。","followup":"如果文化难以移植，新兴国家还能做什么？先记下这个问题，读完英格尔哈特和普特南再回头回答。","src":"Almond and Verba, 1963.pdf","kw":["政治文化","政府","民主","制度","阿尔蒙德","政党","公民","体系"]},{"q":"想象一个小区：有人积极张罗业委会，觉得'我能改变社区'；有人只接受物业管理，偶尔抱怨但从不行动；还有人根本不关心任何公共事务。阿尔蒙德和维巴的三种政治文化'纯粹类型'，分别对应哪类人？各自的核心特征是什么？","level":1,"hint":"对照精读卡的3×4矩阵：三种类型的差别，在于人们对'输入'（表达要求）、'输出'（政策执行）和'自我角色'有没有取向、取向频率是高还是趋近于零。","ref":"分别对应参与型、臣民型与地域型。参与型文化中，成员同时取向体系的输入与输出，把自己看作能影响决策的积极行动者；臣民型文化中，成员对体系及其输出有认知和情感——甚至可能为政府自豪——但缺乏主动输入的取向，自认影响政府的能力非常有限，处于消极服从地位；地域型文化中，对专门化政治对象的取向频率趋近于零，人们只认同部落、村庄等狭小共同体，'对政治体系一无所求'。","wrong":"学生常把'臣民'理解成'被压迫的奴隶'。导师应追问：'臣民对政府有没有认知和情感？他可能以政府为荣吗？'原文明确说臣民对专门化政府权威有取向、甚至可能感到骄傲，只是这种关系本质上是被动的。","followup":"现实中的国家会是纯粹的某一型吗？三种取向能不能同时存在于一个人身上？","src":"Almond and Verba, 1963.pdf","kw":["政府","文化","参与型","臣民型","体系","地域","成员","输入"]},{"q":"人们常说'找工作靠人脉''多个朋友多条路'。普特南为什么把这种'人脉'也称作一种'资本'？它和钱（物质资本）、学历（人力资本）有什么相同和不同？","level":1,"hint":"先想螺丝刀和大学教育为什么叫资本——它们都能提高生产率。再问：'人脉'提高的是谁的生产率？它附着在单个的人身上，还是附着在人'之间'？","ref":"普特南写道：物质资本指物质对象，人力资本指个人的属性，而社会资本指个体之间的联结——社会网络以及由此产生的互惠与可信赖规范。相同点：三者都能提高个人和群体的生产率，例如多数人是靠'认识谁'而非仅凭'会什么'找到工作。不同点：社会资本依附于个体'之间'而非个体或物体本身；而且它有'公共面孔'——收益会外溢给旁观者，比如邻里互相照看使整条街犯罪率下降，连从不社交的居民也受益。","wrong":"学生常把社会资本说成'个人魅力'或'好人缘'。导师应追问：'一个由众多有德行却彼此孤立的个体组成的社会，富有社会资本吗？'用普特南的原句，把概念从'个人品德'拉回到'网络与规范'。","followup":"人脉能用来募捐助学，也能用来团伙作案（普特南举了麦克维爆炸案）——这种'双面性'给概念带来了什么麻烦？","src":"Putnam, 2000.pdf","kw":["社会资本","普特南","公共","社会网络","及由此产生","此产生的互","产生的互惠","规范"]},{"q":"观察身边：温饱还没解决时，人们最关心收入、物价和治安；富裕起来之后，年轻人开始热衷环保、动物权利、性别平等这些'不顶饱'的议题。教材用哪个概念概括这种转变？它的心理学依据是什么？","level":1,"hint":"想想马斯洛需要层次理论：尊重和自我实现被放在物质、经济需要之上。饿着肚子的人和衣食无忧的人，优先级自然不同。","ref":"这个概念是后物质主义。教材的概念框指出：后物质主义是一种从经济发展水平解释政治关怀与价值的理论，基本以马斯洛需要层次为基础——物质匮乏会滋生自私和贪婪的价值，政治被经济议题支配；而在普遍富足的条件下，个人会对'生活质量'议题（女性主义、世界和平、种族和谐、生态与动物权利）表现出更大兴趣。教材还指出，1960年代以来这种转变集中出现在发达工业国家的年轻一代身上。","wrong":"常见答法是'教育水平高了所以关心环保'。导师可追问：'同样的教育水平下，富足社会与困顿社会的年轻人为何差异巨大？'引导学生看到'成长期的安全经历'而非教育本身才是关键变量。","followup":"这种价值转变会让政治更平静还是更吵闹？想想'单一议题抗议政治'的兴起。","src":"政治学 6.pdf","kw":["后物质主义","经济发展","议题","概念","价值","理论","普遍","年轻一代"]},{"q":"某国大选前民调'翻车'，领导人支持率一年内暴跌20%，评论员断言：'这个国家的政治文化变了！'用教材对政治文化与公共舆论的区分来看，这个断言错在哪里？","level":2,"hint":"问自己两个问题：政治文化由什么塑造？公共舆论由什么塑造？要证明'文化'变了，需要什么样时间跨度的证据？","ref":"错在把短期舆情当成了深层文化。教材明确区分：政治文化是针对政党、政府、宪法等政治客体的'倾向模式'，由长期的价值塑造；公共舆论则是对具体政策、问题或人物的即时反应。支持率的年度波动属于后者，不能直接证明文化变迁。要捕捉政治文化变化，需要长时序数据和代际比较——这正是阿尔蒙德与维巴设计3×4矩阵问卷、英格尔哈特用1981与1990两轮世界价值观调查做800余项检验的原因。","wrong":"学生可能走向另一极端：'那民意调查完全没用。'导师应追问：'阿尔蒙德和维巴的五国研究用的是什么方法？'——恰恰是问卷调查；区别在于他们测量的是深层取向，而非对时事的反应。","followup":"如果文化变化如此缓慢，什么力量能让它'可预测地'改变？","src":"政治学 6.pdf","kw":["政治文化","政府","倾向模式","英格尔哈特","阿尔蒙德","尔蒙德与维","蒙德与维巴","政党"]},{"q":"'人人都积极参与所有公共决策'听起来是最理想的民主。阿尔蒙德和维巴却认为，最有利于民主稳定的'公民文化'是三种取向的混合而不是纯参与型文化。他们的理由是什么？","level":2,"hint":"设想一个所有公民对所有议题都高度投入的政府，每天要面对多大的要求压力？再想想英国：为什么保留了对权威的尊重，民主反而更容易扎根？","ref":"理由是民主政体必须在公民的主动性与政府的权威之间保持平衡。参与取向使公民保有影响政府的能力与意愿；臣民取向使政府权威与政策执行获得服从；地域取向的残余则为家庭、社区等非政治生活保留空间。在公民文化中，臣民与地域取向'管理着'参与取向，政治积极性被消极性、传统性和对地域价值的忠诚所平衡。若人人对所有议题都高强度投入，政府将被持续的要求压力淹没，反而无法有效统治。公民文化因此是'理性—积极模式再加一些东西'。","wrong":"学生常直觉回答'参与越多越民主'。导师应追问：'原文说公民文化是civics教科书里的理性—积极模式‘再加’什么？'再追问英国经验：'地方自治传统在民主化来临时起了什么作用？'引导理解混合与平衡的逻辑。","followup":"教材提到的'睡狗'批评恰好质疑这种对消极性的正面评价——你能替双方各说一句话吗？","src":"Almond and Verba, 1963.pdf","kw":["公民文化","政府","民主","强度","议题","价值","传统","臣民"]},{"q":"生活中常见：老人的价值观极难被劝说改变，但整个社会的'主流观念'几十年间确实变了。英格尔哈特如何用'代际更替'解释这个看似矛盾的现象？为什么这种变迁缓慢却可以预测？","level":2,"hint":"关键一问：基本价值观在什么年龄段大致定型？如果老队列不改变、新队列本来就不同，社会平均值会怎么变？再想想人口学数据为什么能帮忙'算'出变迁量。","ref":"机制是：价值差异源于不同出生队列在成长期（成年之前）经历的安全或不安全，基本价值观一旦在成长期定型，便终身大体保持。老一代在匮乏中成长，持物质主义/生存价值；年轻一代在富足中成长，持后物质主义/自我表达价值。社会整体变迁不靠说服老年人，而靠人口学过程——年轻队列逐步替代年老队列，如同'换水'而非'搅水'。由于队列更替速度可由人口结构算出（Abramson技术），变迁的方向乃至数量都可以预测：英格尔哈特报告1970年以来的观察值与预测值非常接近。","wrong":"学生常只答'经济好了价值就变了'，忽略时间机制。导师应追问：'经济繁荣的当年，70岁老人的价值观会立刻跟着变吗？如果不会，变化以什么节奏、通过什么人口过程发生？'迫使学生说出'队列更替'这一关键环节。","followup":"如果成长期经历决定价值，一场严重的经济危机（如阿根廷1980年代）会在数据上留下什么样的'时期效应'？","src":"Inglehart, 1997.pdf","kw":["后物质主义","英格尔哈特","生存价值","预测","变迁","更替","结构","长期"]},{"q":"同样经历过长期专制统治，为什么阿尔蒙德和维巴认为英国的民主能顺利扎根，德国和意大利的民主重建却困难重重？请用'文化混合的历史'给出机制性解释，而不是'英国民主传统悠久'一句带过。","level":3,"hint":"关键不是'有没有专制'，而是专制时期地方自治与结社空间是否被摧毁：英国的控制'不彻底'，普鲁士官僚的控制'彻底'，意大利则从未建成整合的民族国家。","ref":"机制在于前民主时期留下了什么文化遗产。英国的政府控制从未像德国那样彻底：即使在臣民时代也保留着结社自由与有限自治，臣民取向中始终含有有限的参与成分；因此议会与选举改革不是落在'坚硬不化的臣民文化'上，而是扎根于悠久的多元与主动传统，两种态度经数百年逐步融合。普鲁士式官僚威权把地域结构驱入私人领域或吸收进国家，德国的民主化始于公私领域间的巨大鸿沟，魏玛的参与实验始终未能长成支撑民主的参与型文化。意大利更特殊：教会以non expedit拒认新国家合法性，从未形成整合的民族政治文化，南部以班菲尔德所谓'非道德家庭主义'为特征，地域与疏离成分异常强大。","wrong":"常见笼统答法是'英国民主传统悠久'，说不出机制。导师应追问：'传统通过什么载体保存下来？地方自治结构在民主化时起了什么具体作用？'引导学生讲出'文化混合的历史时点'与'基础设施可用性'的分析逻辑。","followup":"用历史给调查'出题'、再用调查数据检验历史推断——这种设计与纯历史研究相比强在哪里？","src":"Almond and Verba, 1963.pdf","kw":["政治文化","政府","民主","民族","实验","参与型","型文化","意大利"]},{"q":"'年轻人更理想主义'有两种解释：生命周期效应（人老了自然会'退烧'）与代际更替效应（队列差异源于成长期经历、终身保持）。两种解释的社会预测截然不同，如何凭经验证据区分？英格尔哈特的检验结果如何？","level":3,"hint":"先问：同一年截面上的年龄差，能区分这两种解释吗？需要什么设计？再想想阿根廷、南非、匈牙利三个'偏离案例'的证伪价值。","ref":"生命周期解释预言年轻人年长后会'退烧'，社会整体不发生持久变迁；代际更替解释预言队列差异终身保持，随人口更替社会整体持续位移。区分二者需要长期时序与队列分析：追踪同一出生队列多年，看年龄差是否随年龄消失。英格尔哈特报告：1971年首次提出后屡遭攻击，但1995年欧洲科学基金会五卷本（50余位学者，包括其昔日最著名的批评者）确认后物质主义转变确为持久的代际变迁。偏离案例进一步锁定机制：1981—1990年间经历严重衰退与动荡的阿根廷、南非（78%的项目逆向移动）与匈牙利，价值系统性地转向生存价值——变迁由'安全经历'驱动，而非自动发生。","wrong":"学生常误以为'年轻样本与老样本有差异'本身就证明了代际更替。导师应追问：'同一时点的年龄差与两种解释都相容吗？缺的是什么数据？'引导学生说出队列追踪设计与反例检验的逻辑。","followup":"这种'可预测的文化变迁'，与阿尔蒙德把政治文化当作相对稳定前提的图景，能否共存？","src":"Inglehart, 1997.pdf","kw":["后物质主义","英格尔哈特","生存价值","变迁","代际","更替","批评","区分"]},{"q":"普特南说美国公民参与在'衰落'，英格尔哈特说参与在'转型'——投票率停滞的同时，公众以更主动、议题化的方式挑战精英。两种诊断矛盾吗？你会用什么证据来裁决？","level":3,"hint":"先问两人'数'的是不是同一种东西：普特南追踪的是哪些指标？他自己承认的三个'明显的反例'是什么？转型论者又如何解释政党党员减少与单一议题团体兴起的并存？","ref":"两种诊断部分源于测量口径不同。普特南追踪的是有组织的成员制结社、投票率、社会信任等存量指标，发现普遍退潮；但他在第一章就承认小团体、社会运动与互联网是三个'明显的反例'，留待考察。英格尔哈特则发现：投票率停滞或下降的同时，公众不再做政党的'守纪律的部队'，而是以越来越主动、议题具体的方式参与，政党忠诚瓦解是精英挑战性公众崛起的症状而非冷漠。裁决路径：统一指标与时段，对比成员制参与与非成员制参与（抗议、请愿、网络行动）的长期趋势；区分参与的'量'与'质'；检验态度指标与行为指标是否同向。教材的概括与此呼应：公民交往未必减少，而是交往联系的形式发生了变化。","wrong":"学生常急于选边站队'我同意普特南/英格尔哈特'而不处理证据。导师应追问：'两位作者各自最不可能被对方的哪条证据说服？有没有一条想象的数据能同时检验两个命题？'引导从立场之争转向可检验的预测差异。","followup":"把这场争论放到你熟悉的社会：你会优先收集哪些证据来判断参与是衰落还是转型？","src":"Inglehart, 1997.pdf","kw":["社会运动","英格尔哈特","普特南","政党","议题","公民","态度","形式"]},{"q":"教材提出一个釜底抽薪的质疑：公民文化可能是民主的'结果'而非'原因'。如果这个质疑成立，政治文化研究的整个政策含义会发生什么变化？你能设计检验思路吗？","level":4,"hint":"教材第二条批评指出：公民文化取向'依据的是未经证明的假定，即政治态度和价值决定行为而不是相反'。顺着想：如果因果颠倒，'移植文化'的思路还成立吗？英格尔哈特的历时设计与普特南对意大利南北的比较各能提供什么线索？","ref":"公民文化研究预设'契合的文化支撑民主制度'，但若因果方向相反——人们在运作良好的民主中才学会信任与参与——政治文化就只是健全民主的'指标'而非'手段'，向新兴国家输出文化的政策思路便告落空；正确的做法也许是先建好制度、让文化随后跟进。教材同样转述了对普特南的批评：社会资本可能是民主政府的结果而非原因。检验思路有三：历时设计（制度变革前后追踪态度时序，如英格尔哈特对前共产主义社会的预测与随访）；自然实验（制度相同而文化不同的地区比较，如普特南本人对意大利南北地方政府的经典研究）；对同期相关做因果建模。没有单一设计能一锤定音，这正是争论持续四十年的原因。","wrong":"学生常以'两者互为因果，所以问题没意义'敷衍。导师应追问：'互为因果在政策上意味着什么？如果你想在十年内巩固一个新民主国家，资源应优先投向制度还是文化？为什么？'迫使学生在双向因果下仍作出有论据的优先级判断。","followup":"如果文化是结果，阿尔蒙德所忧虑的'参与爆炸'时代的新兴国家，其民主前景应由什么决定？","src":"政治学 6.pdf","kw":["政治文化","社会资本","公民文化","政府","民主","实验","制度","英格尔哈特"]},{"q":"马克思主义者会怎么看待'公民文化'这项研究本身？教材介绍的支配型意识形态模式与葛兰西的霸权概念，如何把'文化'重新定义为权力问题？这与阿尔蒙德—维巴把文化当作可测量态度的视角有何根本分歧？","level":4,"hint":"对照《德意志意识形态》的引文与公民文化的定义：一边问'态度分布如何支撑制度'，另一边问'这些态度本身是谁的利益产物'。","ref":"马克思主义传统把思想文化视为受经济基础影响或决定的'上层建筑'：'统治阶级的思想在每一时代都是占统治地位的思想'。由此产生两种文化理论：①文化本质上是阶级特有的——同一阶级成员因经历、地位、利益相似而观念相似；②支配型意识形态模式——统治阶级思想渗透全社会成为'统治思想'，所谓公民文化不过是资产阶级意识形态。葛兰西的霸权概念进一步指出：统治不仅靠强制，更靠经传媒、教会、青年运动、工会等市民社会力量赢得从属者'同意'的思想领导权，文化因而是一种权力形态。阿尔蒙德—维巴则把政治文化当作可用问卷测量的态度分布，关心其与民主结构的'契合'，不追问文化背后的阶级权力。教材也给出对该模式的两点批评：它可能高估现代社会价值的一致性（阿伯克龙比等：从属阶级未必被成功整合）；且带有屈尊姿态，把普通人的价值当作灌输的产物。","wrong":"学生常把分歧简化为'左派vs右派'的立场对立。导师应追问：'两派拿到同一份态度调查数据，会分别提出什么不同的问题？'引导学生看到认识论差异：一个问态度如何支撑制度，一个问态度是谁的利益产物。","followup":"用霸权视角重读普特南：'社会资本衰落'的呼声本身，会不会也是一种意识形态建构？","src":"政治学 6.pdf","kw":["政治文化","市民社会","意识形态","公民文化","民主","权力","阿尔蒙德","马克思主义"]}],"quiz":[{"type":"mc","q":"根据后物质主义理论，在普遍富足的社会中成长起来的年轻一代，通常会更优先关心下列哪组议题？","options":["工资、物价与就业保障","环保、性别平等与自我表达","国防开支与边境管控","税收减免与储蓄利率"],"answer":1,"explain":"后物质主义基于马斯洛需要层次：物质匮乏时经济与安全议题支配政治；普遍富足条件下，尊重和自我实现的需要浮现，人们转向'生活质量'议题——环保、女性主义、世界和平、自我表达等。其余三组都属于经济或安全优先的'物质主义'关切。","src":"政治学 6.pdf"},{"type":"mc","q":"在阿尔蒙德与维巴的类型学中，'公民对政治体系及其输出有所认知和感受，但自认为影响政府的能力非常有限、处于消极服从地位'描述的是哪种政治文化？","options":["地域型政治文化","臣民型政治文化","参与型政治文化","公民文化"],"answer":1,"explain":"臣民型文化的特点是公民较为消极，认为影响政府的能力有限；地域型文化欠缺公民意识、对政治体系'一无所求'，参与型文化则视自身为积极行动者，而公民文化是三者的混合而非单一取向。","src":"政治学 6.pdf"},{"type":"mc","q":"阿尔蒙德与维巴认为，最有利于民主稳定的'公民文化'是下列哪一种？","options":["纯粹的参与型政治文化","参与、臣民与地域取向的特定混合","纯粹的臣民型政治文化","完全消除了地域取向的现代文化"],"answer":1,"explain":"公民文化不是civics教科书里人人积极理性的'纯粹参与型'文化，而是'理性—积极模式再加一些东西'：参与取向保留公民影响政府的能力，臣民取向使政府权威获得服从，地域取向的残余为非政治生活留空间。三者按特定比例混合，在公民主动性与政府权威之间形成平衡。","src":"Almond and Verba, 1963.pdf"},{"type":"mc","q":"关于普特南对'桥接型'与'黏合型'社会资本的区分，下列说法正确的是：","options":["黏合型资本利于联结外部资源与信息扩散","桥接型资本强化排他性认同与同质群体","桥接型资本向外联结跨越社会裂隙，黏合型资本向内凝聚群体","二者是网络可以整齐划入的'非此即彼'类别"],"answer":2,"explain":"桥接型网络向外联结、跨越社会裂隙（如民权运动），黏合型网络向内凝聚、强化排他认同（如族群兄弟会）；普特南强调二者不是非此即彼的类别，而是'或多或少'的比较维度——很多团体同时在某些维度上黏合、在另一些维度上桥接。","src":"Putnam, 2000.pdf"},{"type":"mc","q":"根据《公民文化》的五国研究设计，下列哪一组国家是该研究的全部调查对象？","options":["美、英、法、德、意","美、英、联邦德国、意大利、墨西哥","美、英、德、日、墨西哥","美、英、瑞典、意大利、印度"],"answer":1,"explain":"阿尔蒙德与维巴选取美国、英国、联邦德国、意大利和墨西哥：美英代表相对成功的民主实验，德意代表民主重建的困难案例，墨西哥代表'非大西洋共同体'的现代化中国家。","src":"Almond and Verba, 1963.pdf"},{"type":"tf","q":"判断：政治文化与公共舆论含义相同，都指公民对当前政治议题和人物的态度。","answer":false,"explain":"错误。教材明确指出政治文化不同于公共舆论：政治文化是针对政治客体的'倾向模式'，由长期的价值塑造，变化缓慢；公共舆论则是对具体政策、问题或人物的即时反应。民调支持率的短期波动不等于政治文化变迁。","src":"政治学 6.pdf"},{"type":"tf","q":"判断：英格尔哈特认为，物质主义向后物质主义的转变主要通过代际人口更替实现，因为基本价值观在成长期即大致定型。","answer":true,"explain":"正确。价值差异源于不同出生队列成长期的安全或不安全经历，价值观一旦定型便终身大体保持；社会整体变迁靠年轻队列'换水'般替代年老队列。时期效应（如经济崩溃）会延缓或逆转，但不改变这一长期机制。","src":"Inglehart, 1997.pdf"},{"type":"tf","q":"判断：普特南认为，美国社区纽带在整个二十世纪持续不断地衰落。","answer":false,"explain":"错误。普特南明确表示他不认为社区纽带在整个历史上持续衰弱：20世纪前三分之二是参与不断加深的'涨潮'，衰落只发生在最后三分之一世纪；美国公民参与史是'崩溃与复兴'交替的故事。","src":"Putnam, 2000.pdf"},{"type":"sa","q":"简答：用自己的话解释什么是'社会资本'，并举一个生活中的例子，说明它如何既给本人带来好处、又让没有投入的人也受益。","ref":"社会资本指个体之间的联结——社会网络以及由此产生的互惠与可信赖规范。它有'私人面孔'：如小区业主群互通信息、轮流照看孩子、靠人脉找到工作，直接惠及投入者；也有'公共面孔'：密集网络培育的普遍互惠与信任会降低整个社区的机会主义与交易成本，例如邻里互相照看使犯罪率下降，从不参与社交的居民同样受益。普特南的例子：扶轮社既给会员带来友谊与人脉，又募捐助学、服务社区。","explain":"评分要点：①说出'社会网络+互惠/信任规范'，而非个人品德或人缘；②区分私人收益与外溢收益（公共物品属性）；③例子具体、能体现两面性。","src":"Putnam, 2000.pdf"},{"type":"sa","q":"简答：阿尔蒙德与维巴为什么把'公民文化'定义为参与型、臣民型与地域型取向的混合？这种混合如何有利于民主稳定？","ref":"公民文化不是纯参与型文化，而是三者的特定混合：参与取向赋予公民影响政府的能力与意愿，臣民取向保证政府权威与政策执行获得服从，地域取向的残余为非政治生活保留空间。这种混合在公民一方的积极与消极、政府一方的责任与绩效之间形成平衡；若所有人对所有议题都高度投入，政府将被要求压力淹没，民主反而难以运转。英国经验（臣民传统中保留有限参与成分、地方自治后来转化为民主基础设施）被视为这一逻辑的典范。","explain":"评分要点：①说出'混合'而非'纯参与'的定义；②说明参与与服从两极平衡的政治功能；③能举英国或其他案例佐证。","src":"Almond and Verba, 1963.pdf"},{"type":"sa","q":"简答：概述政治文化'支配型意识形态模式'的基本主张，并列出教材给出的两项批评。","ref":"该模式源自马克思主义：马克思、恩格斯在《德意志意识形态》中指出'统治阶级的思想在每一时代都是占统治地位的思想'，思想与文化是被经济基础决定的上层建筑；统治阶级的意识形态渗透全社会成为'统治思想'，政治文化乃至公民文化因此被视为资产阶级意识形态，文化由此被理解为一种权力形态（葛兰西霸权论强化了这一观点）。批评：①它高估了现代社会价值与信仰的一致性，从属阶级未必被成功整合进支配价值体系（阿伯克龙比等）；②它带有屈尊姿态，把普通人的价值当作操纵与灌输的产物，而工人接受资本主义价值可能只是基于其对现实的认知。","explain":"评分要点：①引述马克思主义的上层建筑/统治思想命题；②点出'文化即权力'的核心；③列出至少两项教材中的批评。","src":"政治学 6.pdf"}],"flashcards":[{"front":"政治文化","back":"人们对政党、政府、宪法等政治对象的深层'倾向模式'（信仰、符号、价值）。由长期价值塑造、变化缓慢，不同于对一时一事的民调态度。","src":"政治学 6.pdf"},{"front":"公民文化（civic culture）","back":"最利于稳定民主的文化'配方'：参与、臣民、地域三种取向按特定比例混合——公民既积极影响政府，又愿意服从权威。","src":"Almond and Verba, 1963.pdf"},{"front":"地域型政治文化","back":"对'国家政治'几乎没有取向的类型：人们只认同部落、村庄等小共同体，'对政治体系一无所求'。","src":"Almond and Verba, 1963.pdf"},{"front":"臣民型政治文化","back":"知道政府、在乎政策输出，但自认无力影响决策，消极服从权威——是'接受管理的人'而非参与者。","src":"政治学 6.pdf"},{"front":"参与型政治文化","back":"公民密切关注政治、自认能够并应当参与决策的类型——'积极的行动者'，最接近民主理想。","src":"政治学 6.pdf"},{"front":"参与爆炸","back":"阿尔蒙德与维巴对二战后世界趋势的概括：新独立国家民众普遍相信'普通人在政治上是相关的'，大批人要求进入政治体系。","src":"Almond and Verba, 1963.pdf"},{"front":"3×4取向矩阵","back":"阿尔蒙德与维巴测量政治文化的工具：认知、情感、评价3种取向，乘以体系一般对象、输入、输出、自我角色4类对象。","src":"Almond and Verba, 1963.pdf"},{"front":"'睡狗'理论","back":"对公民文化论的批评：它把低参与说成'人民满意'，暗示消极有利民主；批评者认为低投票率其实反映疏离与不信任。","src":"政治学 6.pdf"},{"front":"支配型意识形态模式","back":"马克思主义政治文化观：统治阶级的思想渗透全社会成为'统治思想'，连'公民文化'也被看作资产阶级意识形态——文化是一种权力。","src":"政治学 6.pdf"},{"front":"葛兰西的霸权（hegemony）","back":"统治不只靠强制，更靠思想文化上的'领导权'：经传媒、教会、学校把支配价值变成'常识'，赢得被统治者的同意。","src":"政治学 6.pdf"},{"front":"社会资本","back":"个体之间的联结：社会网络+互惠与信任的规范。像'人情存折'——自己受用，不投入的旁人也沾光。","src":"Putnam, 2000.pdf"},{"front":"桥接型社会资本","back":"向外联结、跨越圈层的网络（如民权运动、跨行业社群），带来新资源与新信息，是'进取'（getting ahead）的关键。","src":"Putnam, 2000.pdf"},{"front":"黏合型社会资本","back":"向内抱团、强化'自己人'认同的网络（如同乡会、族群兄弟会），利于互助'守成'，但可能排斥外人。","src":"Putnam, 2000.pdf"},{"front":"普遍互惠","back":"'我现在帮你，不求即时回报，相信日后自有人帮我'。有这种规范的社会更有效率，犹如货币优于以物易物。","src":"Putnam, 2000.pdf"},{"front":"后物质主义","back":"富足中长大的一代人从'生存议题'转向'生活质量'议题（环保、女权、自我表达）的理论，基于马斯洛需要层次。","src":"政治学 6.pdf"},{"front":"代际价值变迁","back":"英格尔哈特的核心机制：价值观在成长期定型、终身难改；社会变迁靠年轻队列'换水'般替代年老队列，故缓慢而可预测。","src":"Inglehart, 1997.pdf"},{"front":"现代化与后现代化","back":"英格尔哈特的双重轨迹：现代化=传统权威→理性—法理权威；后现代化=生存价值→幸福与自我表达价值。","src":"Inglehart, 1997.pdf"},{"front":"'独自打保龄'","back":"普特南的招牌意象：打保龄的人没少，结成联盟打联赛的锐减——'各玩各的'象征美国社群活动与政治交往的衰落。","src":"Putnam, 2000.pdf"}]},{"id":"ch06","folder":"8. Political Violence","title":"政治暴力","subtitle":"Political Violence","overview":{"theme":"为什么有的街头抗议和平收场、有的却滑向内战？为什么兵戎相见之前，双方明明'有话好说'却谈不拢？本章追问政治暴力的根本来源：从街头抗争到社会革命再到国际战争，集体暴力为何发生、如何升级、能否避免。四篇文献分别代表机制分析（抗争政治）、结构解释（社会革命）与理性主义议价理论（国际战争）三条解释路径。","coreQuestions":["什么是抗争政治与社会运动？它们与革命、内战、政治暴力之间的边界在哪里？","社会革命是'被制造'的还是'到来的'？结构条件与革命者的主观意图各自扮演什么角色？","既然战争代价高昂，理性国家之间为何仍无法通过谈判避免战争？","攻势与守势的相对优势（攻防平衡）如何改变战争爆发的风险？感知与现实哪个更重要？","非暴力抗争在什么条件下会升级为恐怖主义、内战或革命？"],"thread":"本章可组织为'由概念到机制、由国内到国际'的学习单元。第一步用Tarrow与Tilly建立概念地图：抗争政治是上位范畴，社会运动、革命、内战、恐怖主义都是其子集，作者反对按事件类型割裂研究，主张寻找跨类型的共同机制与过程。第二步读Skocpol，看她如何批评既有革命理论的目的论与意志论，提出结构视角、国际背景与国家自主性三原则，并用比较历史分析法解释法、俄、中三大社会革命。第三步进入国际层次：Fearon提出战争的核心谜题——战争代价高昂，理性国家为何找不到双方都能接受的和平协议，并用私人信息、承诺问题与议题不可分割性三大机制作答。第四步读Van Evera，他把攻防平衡这一结构性变量与Fearon式机制（先发制人、预防性战争、窗口）连接起来，并强调感知层面的攻势崇拜的危险。四篇合起来构成从街头到战场的完整暴力谱系解释。","path":["先从'人民力量II'这类街头新闻出发读Tarrow & Tilly，掌握抗争政治、社会运动、剧目、WUNC、政治机会结构等基础概念。","再读Skocpol第一章，理解她对既有革命理论的批判与结构主义、国家中心、国际视角的替代方案。","然后用'分100美元'的算术题进入Fearon，弄清议价谜题与三大理性主义战争机制的逻辑。","接着读Van Evera，把攻防平衡看作改变上述机制作用强度的结构性变量，并特别注意'感知'与'现实'的落差。","最后回到核心问题做综合：比较结构解释、机制解释与理性主义解释各自能回答什么、不能回答什么。"],"dialogue":"四篇文献存在多重对话与张力。Skocpol点名批评了Tilly早期的'集体行动'范畴与Gurr的'政治暴力'范畴过于宽泛、隐含意志论，而三十年后Tarrow与Tilly则把社会革命坦然纳入抗争政治的统一框架，主张跨越革命、内战、社会运动的学科边界寻找共同机制——可视为对Skocpol批评的部分回应。在国际关系一侧，Fearon与Van Evera同属理性主义阵营却存在实质分歧：Fearon明确指出攻势优势、先发制人压力本身不构成战争的理论上自洽的解释，必须落实为承诺问题或信息问题；Van Evera则用三个案例论证攻防平衡（尤其被感知的攻势优势）通过十种机制大幅提高战争风险，等于为Fearon的抽象机制提供了经验载体。方法论上，Skocpol的比较历史分析、Tarrow & Tilly的机制-过程分析与Fearon的形式化博弈论形成三种迥异的因果推论风格，共同提示'政治暴力如何被解释'本身就是争论的焦点。"},"readings":[{"file":"Tarrow and Tilly, 2009.pdf","title":"Contentious Politics and Social Movements（抗争政治与社会运动）","authors":"Sidney Tarrow & Charles Tilly","year":"2009","venue":"The Oxford Handbook of Comparative Politics, eds. Carles Boix & Susan C. Stokes, Oxford University Press","thesis":"社会运动只是抗争政治的一个历史特定的子集。作者反对把革命、内战、罢工、社会运动割裂为互不相干的学科领域，主张统一在'抗争政治'框架下，用机制与过程而非整体模型来分析各类集体诉求行动如何产生、升级与转化，包括非暴力运动在何种条件下滑向政治暴力。","framework":"①抗争政治=诉求者与对象之间间歇、公开、涉及政府的集体互动（投票、例会等例行政治被'间歇性'排除）；②政治机会结构六属性：权力中心多寡、开放或封闭、联盟稳定性、盟友可得性、镇压或便利程度、这些属性的决定性变化；③社会运动=运动战役+结社剧目+WUNC公开展示三要素的合成；④WUNC：价值（举止体面、名流到场）、团结（统一标识口号）、数量（人头签名、挤满街道）、决心（冒雨坚持、抗住镇压）；⑤三类机制：环境、性情、关系；⑥四大过程：动员、政治身份形成、运动联盟形成、极化。","method":"概念建构与理论综述，辅以2001年菲律宾'人民力量II'事件、美国内战起源、1960-70年代意大利、肯尼亚茅茅运动、美国堕胎之争等历史例证说明机制运作。","evidence":"①2001年菲律宾'人民力量II'：参议院11比10拒开证据信封后，短信数分钟内召集数十万人聚集EDSA大道，四天后埃斯特拉达离开总统府——展示制度内政治与街头政治的交织；②美国内战起源被分解为：人口与选民西移（环境机制）+对西部扩张的零和认知（性情机制）+共和党居间联络自由土派与废奴派（关系机制）；③della Porta与Tarrow对1960-70年代意大利的研究：国家镇压、竞争抬价、群众支持衰落三大机制催生红色旅等武装组织；④1850年代国会奴隶制辩论与1950年代肯尼亚茅茅起义被归入同一抗争政治范畴，以此反对学科割裂。","limits":"作者自己承认非暴力运动、国家镇压与政治暴力之间的动态关系'理解得很差'，既有内战研究多为相关性逻辑，尚未揭示升级机制；社会运动概念源于西方历史经验，向非西方社会推广的适用性存疑。","quotes":[{"en":"episodic, public, collective interaction among makers of claims and their objects when (a) at least one government is a claimant, an object of claims, or a party to the claims and (b) the claims would, if realized, affect the interests of at least one of the claimants.","zh":"诉求提出者与其对象之间间歇性的、公开的、集体的互动，其中（a）至少有一方政府是诉求者、诉求对象或诉求的当事方，且（b）诉求一旦实现将影响至少一个诉求者的利益。"},{"en":"a sustained challenge to power holders in the name of a population living under the jurisdiction of those power holders by means of public displays of that population's worthiness, unity, numbers, and commitment.","zh":"（社会运动是）以生活在掌权者管辖之下的某人群的名义，通过公开展示该人群的价值、团结、数量与决心，对掌权者发起的持续性挑战。"},{"en":"what they have not shown are the mechanisms that escalate non-violent contention into terrorism or civil war.","zh":"（既有内战研究）没有揭示的，是把非暴力抗争升级为恐怖主义或内战的那些机制。"}]},{"file":"Skocpol, 1979.pdf","title":"Explaining Social Revolutions: Alternatives to Existing Theories（解释社会革命：既有理论的替代方案，《国家与社会革命》第一章）","authors":"Theda Skocpol","year":"1979","venue":"States and Social Revolutions: A Comparative Analysis of France, Russia, and China, Cambridge University Press（第一章）","thesis":"既有革命理论（马克思主义、聚合心理、系统-价值共识、政治冲突四大学派）共享目的论的革命意象、局限于国家内部的现代化视角和对国家的社会经济还原论，因而不充分。社会革命必须从非意志论的结构视角加以分析，特别关注国际背景以及旧政权国家组织的崩溃与新革命国家组织的重建。","framework":"①社会革命定义：国家结构与阶级结构的快速根本变迁+自下而上的阶级反叛，靠'两种重合'区别于叛乱（无结构变迁）与政治革命（只改国家结构不改社会结构）；②既有理论四学派：马克思主义（马克思：生产方式矛盾催生自觉革命阶级）、聚合心理（Gurr《人们为何反叛》：相对剥夺感引发政治暴力）、系统/价值共识（Johnson《革命变迁》：系统失同步诱发意识形态运动）、政治冲突（Tilly《从动员到革命》：有组织集团争权、革命即'多重主权'）；③三大替代原则：非意志论的结构视角、国际与世界历史背景、潜在自主的国家；④方法：密尔求同法+求异法相结合的比较历史分析。","method":"理论批判与方法论阐述；全书主体为比较历史分析——法国、俄国、中国为正面案例，1905年俄国革命、英德日为负面/对照案例。","evidence":"①法、俄、中三个正面案例：同为未被殖民的富裕农业官僚专制国家，都突然面对经济上更发达的军事竞争对手；革命均呈现'旧政权国家机器瘫痪+下层（尤其农民）广泛反叛+群众性领导层重建国家权力'的汇合，结果都是更集权、官僚化、吸纳大众的国家；②负面案例：1905年俄国革命对照1917年（验证战争摧毁国家镇压能力的关键作用），英、德、日对照验证革命政治危机与农民起义的条件；③南非式公然高压且缺乏国内合法性的政权长期存续，直接驳斥'政权靠大众共识维持'的预设；④历史上没有任何一次成功的社会革命由公开宣称革命目标的大众动员运动'制造'（引Wendell Phillips语）。","limits":"把'成功的社会政治变迁'纳入定义使分析对象限定于极少数案例，被批评为目的论抽样；结构视角相对低估意识形态、领导者与革命组织的作用（后来Skocpol本人在伊朗革命研究中也部分修正）；比较历史分析的因果推论强度受限于案例少、变量多。","quotes":[{"en":"Social revolutions are rapid, basic transformations of a society's state and class structures; and they are accompanied and in part carried through by class-based revolts from below.","zh":"社会革命是一个社会的国家结构与阶级结构的快速而根本的变迁；它们伴随着自下而上的阶级反叛，并部分地通过这种反叛得以完成。"},{"en":"Revolutions are not made; they come.","zh":"革命不是被制造出来的；它们是到来的。（Wendell Phillips语，Skocpol引以论证革命危机的非意志性）"},{"en":"the mode of multivariate analysis to which one resorts when there are too many variables and not enough cases","zh":"（比较历史分析是）当变量太多而案例太少时所诉诸的那种多变量分析方式。"}]},{"file":"Fearon, 1995.pdf","title":"Rationalist Explanations for War（战争的理性主义解释）","authors":"James D. Fearon","year":"1995","venue":"International Organization, Vol. 49, No. 3","thesis":"战争的核心谜题在于其代价高昂：只要战争有成本与风险，就总存在双方都优于开战的谈判解（议价区间）。既有理性主义解释（无政府状态、预期收益大于成本、预防性战争、误判）都未回答'是什么阻止了战前协议'。真正自洽的机制只有两类：关于实力或决心的私人信息加上误报动机，以及特定情境下的承诺问题；议题不可分割性逻辑上成立但说服力较弱。","framework":"①先破：五种常见理性主义论点——无政府状态、预期收益大于成本、预防性战争、信息不足导致的误判、相对实力误判——都没回答'是什么阻止了双方达成战前协议'；②基准：战争=昂贵的彩票（costly lottery），风险中性或风险厌恶下总存在议价区间（p−cA, p+cB）；③后立：三大可辩护机制——私人信息+误报动机；承诺问题（含先发制人优势、权力转移下的预防性战争、战略领土与绥靖难题三个子机制）；议题不可分割性（逻辑成立但说服力弱，其'不可分'多源于国内政治而非议题本性）。","method":"形式化博弈论建模（议价博弈、最后通牒博弈、廉价磋商博弈，附录给出完美贝叶斯均衡证明），辅以历史例证评估各机制的经验合理性。","evidence":"①分100美元例：开战成本20美元、胜率各半，期望收益仅30美元，故31:69至69:31之间的任何和平分法都优于开战；②廉价磋商命题：加入无成本沟通阶段后，均衡要价与事前战争风险与无磋商博弈完全相同；③1914年七月危机：德国把俄国的战争警告当作'虚张声势'，Bethmann Hollweg隐瞒对奥支持以免显得是侵略者；④1904年日俄战争：日方凭情报优势形成与俄方不同的战力估计，却无法透露以免暴露作战计划；⑤1939年苏芬冬季战争：芬兰不信斯大林会信守承诺，拒让芬兰湾小岛；⑥代价高昂信号的五种常见方式：造武器、动员军队、签同盟条约、海外驻军、制造国内观众成本；⑦危机外交记录中找不到一例因对手强硬而下修胜率的'信念更新'。","limits":"单一理性行为体假设排除了国内政治与非理性因素（作者承认这些因素经验上重要但未探讨）；信息问题与无政府状态是常量，本身不能解释战争在特定时点的发生；议题不可分割性根源在国内政治，超出模型范围。","quotes":[{"en":"The central puzzle about war, and also the main reason we study it, is that wars are costly but nonetheless wars recur.","zh":"关于战争的核心谜题——也是我们研究战争的主要原因——在于战争代价高昂，但战争却一再重演。"},{"en":"given the assumptions stated in the last two paragraphs, there always exists a set of negotiated settlements that both sides prefer to fighting.","zh":"在上述假设下，总存在一组双方都优于开战的谈判解决方案。"},{"en":"In effect, the costs and risks of fighting open up a \"wedge\" of bargained solutions that risk-neutral or risk-averse states will prefer to the gamble of conflict.","zh":"实际上，战争的成本与风险撬开了一个由谈判解构成的'楔子'区间，风险中性或风险厌恶的国家都会偏好这些解而非冲突的赌博。"}]},{"file":"Van Evera, 1998.pdf","title":"Offense, Defense, and the Causes of War（进攻、防御与战争的原因）","authors":"Stephen Van Evera","year":"1998","venue":"International Security, Vol. 22, No. 4","thesis":"当征服容易（攻势占优）时战争远更可能发生；攻防平衡的变动对战争风险有巨大影响。攻势占优通过十种机制引发战争（扩张诱惑、防御性扩张、更激烈抵抗、先发制人优势、预防性战争窗口、既成事实策略、谈判失败、保密、军备竞赛、自我强化），且被感知的攻势优势即使脱离现实也会产生同样效果。","framework":"①核心变量：攻防平衡=征服与抵御侵略的相对难易，分'真实'与'感知'两个平行变体——'如果国家认为攻势强大，它们就会照攻势真的强大来行事'；②攻势占优的十种致战效应：A机会主义扩张（征服容易连温和国家也受诱惑）、B防御性扩张（自卫更难逼迫扩张求安全）、C更激烈抵抗他国扩张（小失即大祸）、D先发优势放大→先发制人战争、E机会/脆弱窗口放大→预防性战争、F既成事实外交更常见更危险、G谈判更少、僵局更多、H保密加剧误判与外交失误、I军备竞赛更快更难控制、J攻势优势自我强化；③攻防平衡四成因：军事技术与学说、地理、社会结构、外交安排（防御同盟、集体安全、离岸均势）。","method":"理论建构加三个案例检验：1789年以来的欧洲（单一区域案例，内部按攻防平衡的六阶段振荡做多次案例内比较）、古代中国春秋战国时期（722—221 BCE）、1789年以来的美国；检验首要预测（战争频率与攻防平衡的关联）与解释性预测（十种中介现象是否随攻势占优而增多）。","evidence":"①欧洲：攻势相对较强的1792-1815、1856-71、1930s-45恰为战争高发期；1890-1918是感知攻势崇拜的历史顶点——各国信奉'先动手者胜'（法Plan XVII、俄Plan 20），催生七月危机中的先发制人动员、1912-14年军备竞赛与窗口焦虑，而真实军事平衡其实有利于防御；②1945年后热核武器使防御获得压倒性优势（征服需第一次打击能力，防御只需低成本的第二次打击能力），大国事实上不可征服；③古代中国722-221 BCE攻防平衡由防御转向攻势，独立国家数从约200个降到7个再到1个，秦以九年（230-221 BCE）扫平六国；④美国两百年只对大国开战三次（1812、1917、1941），远少于欧陆强国；⑤1789年以来没有大国被无端侵略者永久灭亡（法国1870-71与1940年两度暂时沦陷旋即复国），而被'被激怒的侵略者'毁灭者达六次（威廉德国、纳粹德国、日本帝国、拿破仑法国、奥匈帝国）。","limits":"攻防平衡难以精确测量（作者承认需要专门的操作化努力）；感知层面与现实层面的因果关系难以分离；'攻势占优危险而罕见却被普遍夸大'的论断倚重少数欧洲大案例，对非国家行为体与国内暴力的适用性有限。","quotes":[{"en":"I argue that war is far more likely when conquest is easy, and that shifts in the offense-defense balance have a large effect on the risk of war.","zh":"我主张：当征服容易时，战争的可能性大得多；攻防平衡的变动对战争风险有巨大影响。"},{"en":"If states think the offense is strong, they will act as if it were.","zh":"如果国家认为攻势强大，它们就会照攻势真的强大来行事。（感知变体与现实变体同样危险）"},{"en":"States are seldom as insecure as they think they are.","zh":"国家很少像它们自以为的那样不安全。"}]}],"glossary":[{"en":"contentious politics","zh":"抗争政治","def":"诉求者与对象之间间歇、公开、涉及政府的集体互动；街头示威、罢工、革命、内战都算，定期投票、协会例会这类例行政治不算。","src":"Tarrow and Tilly, 2009.pdf"},{"en":"social movement","zh":"社会运动","def":"以某人群名义、靠公开展示其价值、团结、数量与决心（WUNC），对掌权者发起的持续性挑战；是18-19世纪西欧北美发明的斗争形式。","src":"Tarrow and Tilly, 2009.pdf"},{"en":"WUNC (worthiness, unity, numbers, commitment)","zh":"WUNC展示","def":"社会运动公开自我展示的四要素：价值、团结、数量、决心，用来向旁观者与当局证明'我们值得被认真对待'。","src":"Tarrow and Tilly, 2009.pdf"},{"en":"repertoire of contention","zh":"抗争剧目","def":"特定时空与行动者关系中'约定俗成'的抗议套路合集，如示威、罢工、请愿；行动者像爵士乐手一样在即兴中调用现成曲目。","src":"Tarrow and Tilly, 2009.pdf"},{"en":"political opportunity structure","zh":"政治机会结构","def":"政体与制度中促进或抑制集体行动的六方面特征：权力中心多寡、开放程度、联盟稳定性、盟友可得性、镇压强度，以及这些特征的决定性变化。","src":"Tarrow and Tilly, 2009.pdf"},{"en":"brokerage","zh":"居间联络（中介机制）","def":"一种关系机制：由中间人把原本互不往来的社会群体牵线联结起来，联盟与动员由此才可能发生。","src":"Tarrow and Tilly, 2009.pdf"},{"en":"outbidding","zh":"抬价（竞争升级）","def":"运动内部竞争者比着更激进的机制：你用和平手段，我就用更激烈手段来争夺支持；可推动非暴力运动走向暴力。","src":"Tarrow and Tilly, 2009.pdf"},{"en":"social revolution","zh":"社会革命","def":"国家结构与阶级结构的快速根本变迁，伴随自下而上的阶级反叛；只换统治者的叛乱、只改国家结构的政治革命都不算。","src":"Skocpol, 1979.pdf"},{"en":"structural perspective","zh":"结构视角","def":"Skocpol主张的非意志论立场：不问参与者'想干什么'，而看群体间、社会间的关系格局如何使革命危机到来。","src":"Skocpol, 1979.pdf"},{"en":"state autonomy","zh":"国家自主性","def":"国家作为行政与强制组织，潜在地自主于支配阶级的直接控制：它有自己的利益（收税、维持秩序、应对国际竞争），处在阶级结构与国际局势的交汇处。","src":"Skocpol, 1979.pdf"},{"en":"comparative historical analysis","zh":"比较历史分析","def":"'变量太多而案例太少'时的多变量分析方式：结合密尔求同法与求异法，对少数宏观历史案例做比较以建立、检验因果假设。","src":"Skocpol, 1979.pdf"},{"en":"Method of Agreement / Method of Difference","zh":"求同法／求异法","def":"密尔的两种比较逻辑：求同法在结果相同的案例中找共同原因；求异法在结果有无的最相似案例间锁定关键差异。","src":"Skocpol, 1979.pdf"},{"en":"bargaining range","zh":"议价区间","def":"因战争有成本与风险，总存在一组双方都优于开战的谈判解（介于双方保留水平p−cA与p+cB之间）；战争之谜正是：双方为何落不进这个区间？","src":"Fearon, 1995.pdf"},{"en":"private information and incentives to misrepresent","zh":"私人信息与误报动机","def":"战争机制一：国家掌握对方不知的实力或决心信息，且为争取更好条件有动机虚报；于是'把话说开'也不可信，沟通无法消除战争风险。","src":"Fearon, 1995.pdf"},{"en":"commitment problem","zh":"承诺问题","def":"战争机制二：没有权威保证履约时，预期对方将来（尤其变强后）会违约，互利协议就签不成；预防性战争的真正根源。","src":"Fearon, 1995.pdf"},{"en":"issue indivisibility","zh":"议题不可分割性","def":"某些议题（如王位归属）看似不容分割妥协，可能使议价区间消失；但Fearon认为'不能分'多源于国内政治机制而非议题本性。","src":"Fearon, 1995.pdf"},{"en":"preventive war","zh":"预防性战争","def":"因担心对手未来变强、自身相对衰落而抢先发动的战争；Fearon论证其本质是承诺问题，而非权力转移本身。","src":"Fearon, 1995.pdf"},{"en":"preemptive war","zh":"先发制人战争","def":"因相信先动手有军事优势、抢在对手攻击之前发动的战争；先发优势越大，危机越容易失控。","src":"Van Evera, 1998.pdf"},{"en":"offense-defense balance","zh":"攻防平衡","def":"征服他国与抵御侵略的相对难易程度，由军事技术与学说、地理、社会结构、外交安排共同决定；分'真实'与'感知'两个变体。","src":"Van Evera, 1998.pdf"},{"en":"window of opportunity / vulnerability","zh":"机会窗口／脆弱性窗口","def":"相对力量短暂有利或不利的时间段；'再不动手窗口就关了'的念头在攻势占优时被放大，驱动国家以战争'关窗'。","src":"Van Evera, 1998.pdf"}],"socratic":[{"q":"2001年1月，菲律宾参议院以11比10拒绝打开一个据称装有总统受贿证据的信封。几分钟后，短信在马尼拉飞速传播：'穿黑衣去EDSA大道，哀悼民主之死。'数十万人涌上街头，四天后总统埃斯特拉达离开了总统府。请想一想：这场'人民力量II'究竟是议会政治还是街头运动？Tarrow与Tilly为什么认为我们需要'抗争政治'这个更大的概念？","level":1,"hint":"别急着二选一。先看精读卡里'抗争政治'定义的几个限定词：间歇的、公开的、集体的互动，政府以诉求者、对象或当事方身份卷入。再想想：国会弹劾投票和街头示威真的是两类互不相干的现象吗？它们共享了什么？","ref":"答案是'两者都是，而且相互交织'。危机始于制度渠道（国会弹劾、参议院审理），却涌入街头；街头动员又离不开精英的配合（军方高层最终抛弃埃斯特拉达）。作者据此提出：抗争政治是诉求提出者与对象之间间歇的、公开的、集体的互动，且政府以诉求者、诉求对象或当事方身份卷入——弹劾、示威、人民力量都属此列。他们要打破'制度政治'与'非制度政治'的僵硬边界：几乎所有大规模运动与革命都生长于制度性抗争之中，而制度内外的政治受相同机制驱动。","wrong":"初学者常在两个答案中二选一：'这是一场成功的民主运动'，或'这只是精英政变的外衣'。导师可追问：作者自己提出的也正是这两个假设——他们为什么一个都不接受？如果承认两股力量同时在场、相互塑造，分析上需要什么样的新概念？","followup":"定义里'间歇的'（episodic）一词把投票、例会这类常规政治排除在外，这种排除在分析上有什么好处？","src":"Tarrow and Tilly, 2009.pdf","kw":["抗争政治","政府","制度","街头","革命","集体","机制","运动"]},{"q":"两个人为100块钱争执：谈不拢就打一架，打架要花20块，且各有一半机会拿走全部100块。请先算算：打架的期望收益是多少？存不存在一种'和平分钱'方案让双方都比打架强？Fearon说这就是战争的核心谜题——谜到底在哪里？","level":1,"hint":"期望收益=0.5×100−20=30块。那么31:69到69:31之间的任何分法，双方拿到的都比打架多。既然'蛋糕'明明够分，为什么现实中争端还会打成一团？把这个问号原样搬到国家间的战争上。","ref":"打架的期望收益各为30元，因此从（31, 69）到（69, 31）之间的任何分配都严格优于开战——这段区间就是'议价区间'。Fearon证明：把战争视为昂贵的彩票，只要国家风险中性或风险厌恶，议价区间（p−cA, p+cB）就必然存在，它来自战争的事后无效率。谜题于是变成：既然总有双方更喜欢的和平方案，理性的国家为什么还会开战？'双方都想赢''无政府状态'这类旧回答没有触及这个问题；真正的解释必须说明是什么阻止双方落入议价区间——即私人信息加误报动机与承诺问题。","wrong":"常见答法：'因为双方都想全拿100块，所以谈不拢。'导师追问：'想全拿'只是愿望——面对'打架期望只有30'的算术，一个理性人为什么会拒绝'分你40'的和平提议？可见'想要更多'本身解释不了开战，缺的正是'为什么不能相信对方会守约'这一环。","followup":"如果其中一方是'风险偏好者'（就是爱赌），议价区间会怎样变化？这提示了该定理依赖哪些假设？","src":"Fearon, 1995.pdf","kw":["无政府状态","议价区间","承诺问题","私人信息","双方","战争","解释","理性"]},{"q":"历史课本常写'某政党领导并发动了革命'。Skocpol却引用Wendell Phillips的话：'Revolutions are not made; they come.'（革命不是被制造的，是到来的。）结合精读卡说说：这句话针对的是什么流行观点？她的理由是什么？","level":1,"hint":"注意因果次序：是先有革命危机、还是先有革命运动？精读卡evidence里'历史上没有任何一次成功的社会革命是由公开宣称革命目标的大众动员运动制造出来的'是关键证据。再想想革命组织实际上起的作用是什么（凝聚先锋、巩固新政权）。","ref":"这句话针对的是所有既有革命理论共享的'意志论意象'——以为革命必由自觉的、动员了大众的革命运动制造出来。Skocpol的反驳是历史性的：革命危机源于旧政权国家与阶级统治的政治-军事危机（如对外战争失败、财政崩溃），革命先锋只是利用了危机，从未制造危机；反叛群众也常常自发行动，并未被革命意识形态组织。她并不否认革命组织的作用——它们凝聚激进先锋、巩固新政权——但'制造危机'与'利用危机'是两回事。因此研究的分析单位应是结构性局势，而非革命者的意图。","wrong":"初学者容易误读为'Skocpol否认革命者有任何作用'。导师追问：原文明确承认革命组织与意识形态'有助于凝聚先锋''极大便利了新政权的巩固'——她否定的究竟是'参与革命过程'，还是'制造革命危机'？","followup":"如果革命危机主要由旧政权的政治-军事崩溃造成，那么观察革命的'前兆'时，研究者最该盯住的是什么？","src":"Skocpol, 1979.pdf","kw":["意识形态","旧政权国家","革命","战争","分析","结构","理论","组织"]},{"q":"同样从和平示威起步，为什么有的运动始终和平，有的却滑向燃烧瓶、爆炸，甚至武装组织（如1960-70年代意大利的红色旅）？Tarrow与Tilly指出，社会运动中的集体暴力主要出现在哪三种情境？","level":2,"hint":"按'谁遇上谁'来记：①运动者遇上警察等公共秩序的职业守卫者；②一派运动者遇上对立派运动者；③运动内部——奉行直接行动的团体利用或脱离和平集会，对昔日同志'抬价'。注意：三者都是互动过程，而不是运动的固有属性。","ref":"三种情境是：①活动者与警察等公共秩序守卫者发生斗争时；②立场对立的活动者正面冲突时；③奉行直接行动的团体利用或脱离示威、集会等非暴力场合，对昔日同志'抬价'时。della Porta与Tarrow对1960-70年代意大利的研究进一步指出：国家镇压、竞争与抬价、群众支持衰落，是把运动推向武装斗争的主要机制。要点在于：暴力不是'坏人煽动'或'运动失控'的简单产物，而是特定互动结构的产物——这与作者对既有内战研究'只有相关性、没有机制'的批评一脉相承。","wrong":"学生常答'暴力是运动里的极端分子搞出来的'。导师追问：按这个答法，为什么同一批人在有的场合暴力、有的场合不暴力？三种情境的共同结构是什么——它们都把暴力放在'关系与互动'里，而不是放在'人'里。","followup":"作者批评Fearon & Laitin等内战研究只证明了山地、资源、贫困与内战'相关'——他们缺的到底是哪一环？","src":"Tarrow and Tilly, 2009.pdf","kw":["抬价","内战","暴力","机制","结构","运动","行动","直接"]},{"q":"求职面试时，人人都自称'能力强、随时有更好的 offer'，雇主为什么不全信？把这个直觉搬到国际谈判：Fearon问，既然误判源于信息不足，国家为什么不坐下来'把话说开'？他证明'廉价磋商'（cheap talk）为什么救不了场？","level":2,"hint":"关键在于说话有没有成本。如果一句声明不影响任何代价，那么无论真心假意，把话说得最硬总是最优——那么听者能从这句话里推断出什么？精读卡evidence里'均衡要价与事前战争风险均不改变'就是形式化结论。","ref":"结论是：光说不练的沟通不能降低战争风险。因为每个国家都有动机把话说得最硬以争取更好条件——无论真实决心如何，宣告'我会打到底'总是最优策略；对手深知这一点，于是从宣告中学不到任何新东西。Fearon的命题证明：在最后通牒博弈中加入廉价磋商阶段后，均衡要价与事前战争风险与无磋商博弈完全相同。要让话可信，必须付出只有高决心者才敢付的代价——造武器、动员军队、签同盟、驻军海外、制造国内观众成本；而这些'代价高昂的信号'本身就可能带来真实的战争风险。","wrong":"学生常答'因为国家之间互不信任'，这是循环论证。导师追问：不信任的具体内容是什么——是'不知道对方想什么'，还是'知道对方有动机撒谎'？前者靠沟通可解，后者才是Fearon说的真正机制。","followup":"1914年7月，德国领导人把俄国的战争警告当作'虚张声势'（blustering）——这正对应了哪个机制？","src":"Fearon, 1995.pdf","kw":["观众成本","真实","战争风险","国内","代价","必须","博弈","动员"]},{"q":"法国革命（1789）、俄国革命（1917）、中国革命（1911-1949），一个常被叫作'资产阶级革命'、两个是'共产主义革命'，教科书通常分开讲。Skocpol为什么偏要把三者归为一类？她用什么方法论证三者背后有共同的因果逻辑？","level":2,"hint":"看精读卡的method与evidence：三个正面案例+负面案例对照。求同法=在都有结果的案例里找共同原因；求异法=在最相似但结果不同的案例之间对比。想想1905年俄国革命对1917年俄国革命扮演了什么角色。","ref":"Skocpol论证三国旧政权足够相似：都是从未被殖民的富裕农业官僚专制国家，都突然面对经济上更发达的军事竞争对手；三国革命都呈现同一汇合——旧政权国家机器瘫痪、下层（尤其农民）广泛反叛、群众性领导层重建国家权力——结果也都是更集权、官僚化、吸纳大众的国家。方法上她把密尔求同法（三案虽差异巨大却呈现相似因果模式）与求异法结合：以最相似的负面案例对照——1905年俄国革命对照1917年（验证战争摧毁国家镇压能力的关键作用），并以英、德、日的非社会革命转型作对照。这正是'变量太多而案例太少'时的多变量分析方式。","wrong":"学生常答'因为它们都是大革命'——这只是同义反复。导师追问：'大'的标准是什么？Skocpol给出的可操作相似性是哪几条（旧政权类型、国际处境、危机汇合、结果形态）？","followup":"把'成功的结构变迁'写进定义，如何决定了她只能这样选案例？","src":"Skocpol, 1979.pdf","kw":["社会革命","求异法","求同法","权力","旧政权国家","年俄国革命","战争","分析"]},{"q":"1914年前，欧洲军界普遍相信'谁先动员谁就赢'。七月危机中各国于是抢着下达动员令——尽管事后证明，机枪、铁丝网、战壕和铁路其实让防守方占尽优势。Van Evera为什么说'被感知的攻势优势'即使脱离现实，也和真实的攻势优势同样危险？","level":2,"hint":"决策者依据什么行动——客观现实，还是脑中的图景？看精读卡framework里'真实'与'感知'两个平行变体，以及那句引文'If states think the
